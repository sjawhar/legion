name: Pull the images tests start
description: >-
  Pulls each image a job's tests start, before the tests run. Testcontainers pulls a missing
  image when a test first asks for it. The Docker daemon reports a registry connection reset as
  an internal error, and testcontainers does not retry it. One such reset failed every test that
  shared that container. The pull itself does not retry either. Every image comes from
  ghcr.io/sjawhar/legion/ci, a registry this repository publishes, so a failed pull is a fault of
  this repository and must be seen. The action reads each image from the Go string constant that
  declares it (testnats.Image and testnats.HubImage, tests3.Image), so the tests and the pull
  never name two images.
inputs:
  consts:
    description: >-
      One per line: a Go file, relative to the repository root, and the name of the string
      constant in it whose value is an image, as `packages/envoy/internal/testnats/nats.go Image`.
    required: true
  images:
    description: More images to pull, one per line, as a job's build reads from a Dockerfile.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Pull the images tests start
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        CONSTS: ${{ inputs.consts }}
        IMAGES: ${{ inputs.images }}
      run: |
        images=()
        while read -r file name; do
          [ -n "$file" ] || continue
          image=$(sed -n "s/^const $name = \"\(.*\)\"\$/\1/p" "$file")
          [ -n "$image" ] || { echo "::error::no const $name in $file"; exit 1; }
          images+=("$image")
        done <<<"$CONSTS"
        while read -r image; do
          [ -z "$image" ] || images+=("$image")
        done <<<"$IMAGES"
        [ "${#images[@]}" -gt 0 ] || { echo "::error::no image to pull"; exit 1; }
        for image in "${images[@]}"; do
          docker pull "$image"
        done
