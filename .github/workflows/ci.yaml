name: CI

# The router: every check a pull request or a push to main runs, in one workflow. Its first job,
# `changes`, reads the paths the change touched and selects, through one dorny/paths-filter filter
# per job, the jobs that read those paths; each job runs only when its filter matches (lint runs on
# every change, and typecheck and test also run when `changes` itself failed). The last job,
# `ci-ok`, condenses every job's result into one check, the one main's ruleset requires beside
# pr-title.
#
# A new job joins the router in four places: a filter in `changes` that names every file the job
# reads, an output of `changes` for that filter, the job's `needs: changes` and an `if:` on that
# output, and an entry in `ci-ok`'s `needs:`. docs/solutions/github/join-a-job-to-the-ci-router.md
# walks through it.
#
# Caches: no pull-request run writes an Actions cache entry. setup-go caches nothing here
# (`cache: false` on every step). The jobs that cache Go restore one of five families with
# actions/cache/restore, by its prefix when the exact key misses: go-daemon (typecheck, test,
# pi-legion), go-docs (docs), go-envoy (envoy-e2e-local), go-envoy-infra (envoy-infra-go) and
# go-notices (lint's notices step). Each saves its family with actions/cache/save as its last step,
# and only on a push to main whose job succeeded and whose restore missed the exact key. setup-bun
# reads and writes its cache only on main (.github/actions/setup-bun).

# No `paths:`: every change starts this workflow, and `changes` selects what runs. No `branches:`
# on pull_request: a pull request on any base is tested. No `edited`: a title or body edit starts
# no run (pr-title.yaml checks those). `ready_for_review` starts the run a draft skipped.
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]

# A newer push to a pull request cancels its older run. A push to main is a group of its own per
# commit and is never cancelled: `changes` selects by that push's own diff, and no later push's
# diff contains the jobs a dropped merge's run would have selected.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Read-only: the token clones, downloads pinned tools, and, in `changes`, reads the pull request's
# file list, which this public repository serves without `pull-requests: read`. The jobs that need
# more declare it in blocks of their own: lint (what check-pr-text.sh reads), docs-deploy (GitHub
# Pages) and worker-image (the image push and its attestation's scopes).
permissions:
  contents: read

jobs:
  # Selects the jobs that read what this change touched. Skipped on a draft pull request, so no
  # test job runs; marking it ready for review starts a run that selects by the same diff.
  changes:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    outputs:
      typecheck: ${{ steps.filter.outputs.typecheck }}
      test: ${{ steps.filter.outputs.test }}
      docs: ${{ steps.filter.outputs.docs }}
      worker_image: ${{ steps.filter.outputs.worker_image }}
      contracts: ${{ steps.filter.outputs.contracts }}
      envoy_plugin: ${{ steps.filter.outputs.envoy_plugin }}
      envoy_client: ${{ steps.filter.outputs.envoy_client }}
      pi_shared: ${{ steps.filter.outputs.pi_shared }}
      pi_envoy: ${{ steps.filter.outputs.pi_envoy }}
      pi_legion: ${{ steps.filter.outputs.pi_legion }}
      dispatch: ${{ steps.filter.outputs.dispatch }}
      claude_envoy: ${{ steps.filter.outputs.claude_envoy }}
      envoy_go: ${{ steps.filter.outputs.envoy_go }}
      envoy_infra_go: ${{ steps.filter.outputs.envoy_infra_go }}
      envoy_go_race: ${{ steps.filter.outputs.envoy_go_race }}
      dispatch_memory: ${{ steps.filter.outputs.dispatch_memory }}
      dispatch_multiprocess: ${{ steps.filter.outputs.dispatch_multiprocess }}
      broker_multiprocess: ${{ steps.filter.outputs.broker_multiprocess }}
      envoy_smoke: ${{ steps.filter.outputs.envoy_smoke }}
      envoy_e2e_local: ${{ steps.filter.outputs.envoy_e2e_local }}
      go_notices: ${{ steps.filter.outputs.go_notices }}
    steps:
      # On pull_request dorny/paths-filter reads the file list from the API and never reads the
      # tree; push and merge_group diff with git and need the clone.
      - if: github.event_name != 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          # Each filter names every file its job reads: the package and what its tests, typecheck
          # and build read outside it; the composite actions the job installs its tools through;
          # for Go, the closure of the packages the job compiles (`go list -deps -test`), the
          # targets of the go commands its tests start, and the module files of the workspace the
          # build runs in, whose go.mod files move the versions it compiles; and this file, since a
          # job reads its own definition. The quantifier is the default, `some` (a change matches a
          # filter when any of its patterns matches), and no pattern is negated:
          # .github/scripts/check-image-trigger-paths.sh reads the filters that gate an image build
          # (worker_image, envoy_smoke) only that way, and only as flat lists of globs, so those two
          # name no anchor.
          #
          # The first keys are no job's gate: each is a group many filters share, written once and
          # named by every filter that needs it through its anchor, which dorny/paths-filter
          # flattens into the list that names it.
          filters: |
            # A frozen Bun install and the Bun it runs: `bun install --frozen-lockfile` reads the
            # root manifest, the lockfile, the patches package.json:45-49 applies, and the manifest
            # of every workspace package.json:19-31 lists; .github/actions/setup-bun installs the
            # Bun .bun-version pins.
            bun_install: &bun_install
              - 'package.json'
              - 'bun.lock'
              - 'patches/**'
              - 'packages/contracts/package.json'
              - 'packages/envoy-client/package.json'
              - 'packages/pi-envoy/package.json'
              - 'packages/pi-legion/package.json'
              - 'packages/pi-shared/package.json'
              - 'packages/envoy-plugin/package.json'
              - 'packages/claude-envoy/package.json'
              - 'packages/proof-editor/package.json'
              - 'packages/dispatch/package.json'
              - 'packages/envoy/internal/dispatch/pmdoc/gen/package.json'
              - 'docs/site/package.json'
              - '.bun-version'
              - '.github/actions/setup-bun/**'
            # `bunx biome check|lint` reads the root biome.json, which has it read the root
            # .gitignore too (biome.json:3-6, vcs.useIgnoreFile).
            biome: &biome
              - 'biome.json'
              - '.gitignore'
            # The root Go workspace: a go command under go.work reads it, go.work.sum, and the
            # go.mod and go.sum of every module it binds, whose requirements move the versions the
            # build compiles.
            go_workspace: &go_workspace
              - 'go.work'
              - 'go.work.sum'
              - 'packages/daemon/go.mod'
              - 'packages/daemon/go.sum'
              - 'packages/envoy/go.mod'
              - 'packages/envoy/go.sum'
            # The envoy packages the daemon module compiles (`go list -deps -test` of
            # packages/daemon's ./..., with and without -tags e2e).
            daemon_envoy_deps: &daemon_envoy_deps
              - 'packages/envoy/brokertest/*'
              - 'packages/envoy/daemonpermissions/*'
              - 'packages/envoy/internal/broker/api/*'
              - 'packages/envoy/internal/broker/brokertest/*'
              - 'packages/envoy/internal/broker/enroll/*'
              - 'packages/envoy/internal/broker/exchange/*'
              - 'packages/envoy/internal/broker/machine/*'
              - 'packages/envoy/internal/broker/oauth/*'
              - 'packages/envoy/internal/broker/oauthstore/*'
              - 'packages/envoy/internal/broker/oauthwire/*'
              - 'packages/envoy/internal/broker/policy/**'
              - 'packages/envoy/internal/broker/proof/*'
              - 'packages/envoy/internal/broker/ratelimit/*'
              - 'packages/envoy/internal/broker/record/*'
              - 'packages/envoy/internal/broker/requests/*'
              - 'packages/envoy/internal/broker/secrets/*'
              - 'packages/envoy/internal/broker/store/**'
              - 'packages/envoy/internal/bus/*'
              - 'packages/envoy/internal/contracts/*'
              - 'packages/envoy/internal/githubappjwt/*'
              - 'packages/envoy/internal/oidc/**'
              - 'packages/envoy/internal/pgmigrate/*'
              - 'packages/envoy/internal/testnats/*'
              - 'packages/envoy/testnatsimages/*'
            # The Dispatch server, `go list -deps ./cmd/dispatch` in packages/envoy (its embedded
            # migrations and pmdoc schema included): what the daemon's outbox test builds
            # (internal/dispatch/outbox_scratch_dispatch_test.go:187), the browser tests' and the
            # docs screenshots' run-server.sh builds (packages/dispatch/e2e/run-server.sh:103), and
            # envoy-infra's permissions live test builds (infra/core/permissions_live_test.go:298).
            dispatch_server: &dispatch_server
              - 'packages/envoy/cmd/dispatch/*'
              - 'packages/envoy/internal/bus/*'
              - 'packages/envoy/internal/contracts/*'
              - 'packages/envoy/internal/dispatch/accesslog/*'
              - 'packages/envoy/internal/dispatch/agentsecrets/*'
              - 'packages/envoy/internal/dispatch/agentstream/*'
              - 'packages/envoy/internal/dispatch/api/*'
              - 'packages/envoy/internal/dispatch/architecture/*'
              - 'packages/envoy/internal/dispatch/asks/*'
              - 'packages/envoy/internal/dispatch/auth/*'
              - 'packages/envoy/internal/dispatch/config/*'
              - 'packages/envoy/internal/dispatch/delivery/**'
              - 'packages/envoy/internal/dispatch/docs/*'
              - 'packages/envoy/internal/dispatch/duty/*'
              - 'packages/envoy/internal/dispatch/embed/*'
              - 'packages/envoy/internal/dispatch/embedqueue/*'
              - 'packages/envoy/internal/dispatch/envoy/*'
              - 'packages/envoy/internal/dispatch/events/*'
              - 'packages/envoy/internal/dispatch/files/*'
              - 'packages/envoy/internal/dispatch/githubapi/*'
              - 'packages/envoy/internal/dispatch/githubapp/*'
              - 'packages/envoy/internal/dispatch/identity/*'
              - 'packages/envoy/internal/dispatch/model/*'
              - 'packages/envoy/internal/dispatch/outbox/*'
              - 'packages/envoy/internal/dispatch/pmdoc/**'
              - 'packages/envoy/internal/dispatch/rank/*'
              - 'packages/envoy/internal/dispatch/redeliver/*'
              - 'packages/envoy/internal/dispatch/refs/*'
              - 'packages/envoy/internal/dispatch/retry/*'
              - 'packages/envoy/internal/dispatch/routes/*'
              - 'packages/envoy/internal/dispatch/startup/*'
              - 'packages/envoy/internal/dispatch/store/*'
              - 'packages/envoy/internal/dispatch/store/migrations/**'
              - 'packages/envoy/internal/dispatch/text/*'
              - 'packages/envoy/internal/githubappjwt/*'
              - 'packages/envoy/internal/id/*'
              - 'packages/envoy/internal/oidc/*'
              - 'packages/envoy/internal/pglisten/*'
              - 'packages/envoy/internal/pgmigrate/*'
              - 'packages/envoy/internal/routing/*'
            # The daemon's `legion` command, `go list -deps ./cmd/legion` in packages/daemon (its
            # embedded probes, turnscope.yml and role prompts included): what
            # docs/site/scripts/build-binaries.sh:17 builds and lint's notices step loads for each
            # target .github/go-release-targets.json lists.
            legion_command: &legion_command
              - 'packages/daemon/cmd/legion/*'
              - 'packages/daemon/internal/admit/*'
              - 'packages/daemon/internal/agentsecrets/*'
              - 'packages/daemon/internal/api/*'
              - 'packages/daemon/internal/appauth/*'
              - 'packages/daemon/internal/backoff/*'
              - 'packages/daemon/internal/blockers/*'
              - 'packages/daemon/internal/bootprobe/*'
              - 'packages/daemon/internal/capabilities/*'
              - 'packages/daemon/internal/claim/*'
              - 'packages/daemon/internal/classify/*'
              - 'packages/daemon/internal/claudebridge/*'
              - 'packages/daemon/internal/config/*'
              - 'packages/daemon/internal/controller/*'
              - 'packages/daemon/internal/credential/*'
              - 'packages/daemon/internal/daemon/**'
              - 'packages/daemon/internal/dispatch/*'
              - 'packages/daemon/internal/ghautomerge/*'
              - 'packages/daemon/internal/ghbranch/*'
              - 'packages/daemon/internal/ghconfig/*'
              - 'packages/daemon/internal/ghrepo/*'
              - 'packages/daemon/internal/githubrest/*'
              - 'packages/daemon/internal/intake/*'
              - 'packages/daemon/internal/launcher/*'
              - 'packages/daemon/internal/lookpath/*'
              - 'packages/daemon/internal/modeltoken/*'
              - 'packages/daemon/internal/natsauth/*'
              - 'packages/daemon/internal/notify/*'
              - 'packages/daemon/internal/ompdirs/*'
              - 'packages/daemon/internal/omplaunch/*'
              - 'packages/daemon/internal/ompsessions/*'
              - 'packages/daemon/internal/phase/*'
              - 'packages/daemon/internal/podsafety/**'
              - 'packages/daemon/internal/procgroup/*'
              - 'packages/daemon/internal/projection/*'
              - 'packages/daemon/internal/promptrefs/*'
              - 'packages/daemon/internal/prompts/**'
              - 'packages/daemon/internal/record/*'
              - 'packages/daemon/internal/registry/*'
              - 'packages/daemon/internal/repocache/*'
              - 'packages/daemon/internal/requiredchecks/*'
              - 'packages/daemon/internal/runtime/*'
              - 'packages/daemon/internal/runtime/sandbox/*'
              - 'packages/daemon/internal/runtime/shellprefix/*'
              - 'packages/daemon/internal/runtime/tmux/*'
              - 'packages/daemon/internal/runtime/workerbin/*'
              - 'packages/daemon/internal/sessionproxy/*'
              - 'packages/daemon/internal/shim/*'
              - 'packages/daemon/internal/shimwire/*'
              - 'packages/daemon/internal/store/**'
              - 'packages/daemon/internal/stream/*'
              - 'packages/daemon/internal/supervise/*'
              - 'packages/daemon/internal/treelifecycle/*'
              - 'packages/daemon/internal/wait/*'
              - 'packages/daemon/internal/workflow/*'
              - 'packages/daemon/internal/workspace/*'
            # The listener's packages, `go list -deps ./cmd/listener` in packages/envoy.
            listener_command: &listener_command
              - 'packages/envoy/cmd/listener/*'
              - 'packages/envoy/internal/bus/*'
              - 'packages/envoy/internal/cistore/*'
              - 'packages/envoy/internal/config/*'
              - 'packages/envoy/internal/contracts/*'
              - 'packages/envoy/internal/dedupe/*'
              - 'packages/envoy/internal/id/*'
              - 'packages/envoy/internal/kvwatch/*'
              - 'packages/envoy/internal/logging/*'
              - 'packages/envoy/internal/metrics/*'
              - 'packages/envoy/internal/oidc/*'
              - 'packages/envoy/internal/routing/*'
              - 'packages/envoy/internal/session/*'
              - 'packages/envoy/internal/store/*'
              - 'packages/envoy/internal/verify/*'
              - 'packages/envoy/internal/webhook/*'
            # What `go test ./cmd/dispatch` reads under both its memory and its multiprocess tag:
            # the packages it compiles, with the whole of cmd/dispatch and internal/dispatch, whose
            # .go files cmd/dispatch/settings_test.go:136 walks, and the pod spec
            # cmd/dispatch/pod_grace_period_test.go:17 reads.
            dispatch_command_tests: &dispatch_command_tests
              - 'packages/envoy/cmd/dispatch/**'
              - 'packages/envoy/internal/dispatch/**'
              - 'packages/envoy/internal/bus/*'
              - 'packages/envoy/internal/cmdtest/*'
              - 'packages/envoy/internal/contracts/**'
              - 'packages/envoy/internal/githubappjwt/*'
              - 'packages/envoy/internal/id/*'
              - 'packages/envoy/internal/oidc/**'
              - 'packages/envoy/internal/pglisten/*'
              - 'packages/envoy/internal/pgmigrate/*'
              - 'packages/envoy/internal/routing/*'
              - 'packages/envoy/internal/testsocks5/*'
              - 'packages/envoy/infra/gcp/testdata/dispatch-pod.golden'
            # Oh My Pi, which .github/actions/install-omp installs at the version .omp-pin names,
            # through the mise .github/actions/install-jj leaves.
            omp_install: &omp_install
              - '.omp-pin'
              - '.github/actions/install-omp/**'
              - '.github/actions/install-jj/**'
              # install-jj reads the mise version and checksum it installs from here.
              - 'packages/daemon/docker/worker.Dockerfile'

            # `go vet -tags e2e ./...` in packages/daemon.
            typecheck:
              - '.github/workflows/ci.yaml'
              - *go_workspace
              - 'packages/daemon/**'
              - *daemon_envoy_deps
            # The daemon's tests (`go test ./...`, the -race subset, and the daemon
            # scripts/e2e/stage1-skeleton.sh builds) and every file the job's other steps read.
            test:
              - '.github/workflows/ci.yaml'
              - *bun_install
              - *biome
              - *go_workspace
              - 'packages/daemon/**'
              - *daemon_envoy_deps
              - *dispatch_server
              - 'packages/envoy/internal/contracts/**'
              # Each .github/scripts/*.test.sh runs its checker, through test-lib.sh (and
              # workflow_paths.py, check-pr-text.sh, release-bump.sh where a checker sources them).
              - '.github/scripts/*'
              - 'scripts/third-party-notices.ts'
              - 'scripts/third-party-notices.test.ts'
              - 'scripts/sessions-import-pods.sh'
              - 'scripts/sessions-import-pods.test.sh'
              # `bun test scripts/e2e/lib` scans scripts/e2e/*.sh (lib/script-functions.test.ts:101-104),
              # and the Stage 1 proof sources lib/rig.sh, free-port.sh and built-from.sh.
              - 'scripts/e2e/**'
              - 'scripts/dispatch/**'
              - 'scripts/github-apps/**'
              # The e2e libraries and the census script import contracts and envoy-client, and the
              # daemon's tests read contracts' fixtures (internal/api/state_golden_test.go:27,
              # internal/intake/intake_test.go:698).
              - 'packages/contracts/**'
              - 'packages/envoy-client/**'
              # internal/daemon/promptreferences_omp_test.go:132 packs both Oh My Pi plugins, whose
              # prepack stages skills/ and writes their notices, and
              # internal/claudebridge/bridge_test.go:813-817 runs pi-legion's src/phase-stall.ts.
              - 'packages/pi-envoy/**'
              - 'packages/pi-legion/**'
              - 'packages/pi-shared/**'
              - 'scripts/pi-plugin-prepack.sh'
              - 'skills/**'
              # Examples and docs the daemon's tests hold to the code: cmd/legion/config_example_test.go:24,
              # internal/config/controller_test.go:179, internal/config/kubernetes_test.go:1322,
              # internal/runtime/sandbox/reclaim_doc_test.go:144.
              - 'deploy/kubernetes/daemon/controller.yaml.example'
              - 'deploy/kubernetes/daemon/legion.yaml.example'
              - 'deploy/kubernetes/operator-route/pod.yml'
              - 'docs/kubernetes.md'
              # The tools the job installs: jj, mise and Oh My Pi, uv, and the NATS images.
              - *omp_install
              - '.github/actions/install-uv/**'
              - '.github/actions/pull-test-images/**'
            # docs/site's lint, typecheck, screenshots and build, with the sources its reference
            # generators and its screenshot harness read.
            docs:
              - '.github/workflows/ci.yaml'
              - *bun_install
              - *biome
              - *go_workspace
              - 'docs/site/**'
              # docs/site/scripts/build-binaries.sh:17-20 builds the daemon's ./cmd/legion and
              # envoy's ./cmd/{dispatch,broker,agent-secrets,agent-secrets-helper,broker-refgen};
              # the screenshots' harness starts the Dispatch server (docs/site/media/harness.ts:190).
              # broker-refgen also parses broker/api, broker/config, broker/helper, cmd/broker and
              # cmd/agent-secrets at run time (generators/broker-reference.sh:13-14).
              - *legion_command
              - *dispatch_server
              - 'packages/envoy/cmd/agent-secrets/*'
              - 'packages/envoy/cmd/agent-secrets-helper/*'
              - 'packages/envoy/cmd/broker/*'
              - 'packages/envoy/cmd/broker-refgen/*'
              - 'packages/envoy/internal/broker/api/*'
              - 'packages/envoy/internal/broker/config/*'
              - 'packages/envoy/internal/broker/enroll/*'
              - 'packages/envoy/internal/broker/exchange/*'
              - 'packages/envoy/internal/broker/helper/*'
              - 'packages/envoy/internal/broker/machine/*'
              - 'packages/envoy/internal/broker/oauth/*'
              - 'packages/envoy/internal/broker/oauthstore/*'
              - 'packages/envoy/internal/broker/oauthwire/*'
              - 'packages/envoy/internal/broker/policy/*'
              - 'packages/envoy/internal/broker/proof/*'
              - 'packages/envoy/internal/broker/ratelimit/*'
              - 'packages/envoy/internal/broker/record/*'
              - 'packages/envoy/internal/broker/requests/*'
              - 'packages/envoy/internal/broker/reread/*'
              - 'packages/envoy/internal/broker/secrets/*'
              - 'packages/envoy/internal/broker/store/*'
              - 'packages/envoy/internal/broker/store/migrations/**'
              - 'packages/envoy/internal/broker/wake/*'
              - 'packages/envoy/internal/buildversion/*'
              # The screenshots build packages/dispatch's web app, which aliases contracts' and the
              # proof editor's sources (web/vite.config.ts:63-81), and boot its e2e harness
              # (docs/site/media/harness.ts:20-24,189-247).
              - 'packages/dispatch/**'
              - 'packages/proof-editor/src/**'
              - 'packages/contracts/src/**'
              # generators/dispatch-tools.ts:12 imports envoy-client's dispatch-command.ts;
              # generators/legion-skills.ts:11-17 reads every skill; generators/legion-config.sh:28-32
              # renders every deploy/kubernetes example.
              - 'packages/envoy-client/src/**'
              - 'skills/**'
              - 'deploy/kubernetes/**'
              # The build writes the site's THIRD_PARTY_NOTICES.txt (docs/site/astro.config.mjs:15).
              - 'scripts/third-party-notices.ts'
              # The built site's private-name check.
              - '.github/scripts/check-private-names.sh'
            contracts:
              - '.github/workflows/ci.yaml'
              - *bun_install
              - *biome
              - 'packages/contracts/**'
              # src/dispatch-tools.test.ts:60-61,1044 reads these skills.
              - 'skills/dispatch/SKILL.md'
              - 'skills/dispatch-writing-specs/SKILL.md'
              # The Go copies its tests hold the TypeScript to: src/dispatch-href.test.ts:49-53 and
              # src/dispatch-text-references.test.ts:10-14 read the Go reader's JSON tables, and
              # scripts/gen-go.test.ts checks both files scripts/gen-go.ts writes are current.
              - 'packages/envoy/internal/dispatch/text/testdata/dispatch-href-references.json'
              - 'packages/envoy/internal/dispatch/text/testdata/dispatch-text-references.json'
              - 'packages/envoy/internal/contracts/generated.go'
              - 'packages/daemon/internal/dispatch/generated.go'
            envoy_plugin:
              - '.github/workflows/ci.yaml'
              - *bun_install
              - *biome
              - 'packages/envoy-plugin/**'
              # Its tsconfig paths and bundle reach contracts' and envoy-client's sources, and its
              # build and prepack (scripts/prepack.sh:14) build envoy-client's dispatch CLI.
              - 'packages/contracts/src/**'
              - 'packages/envoy-client/src/**'
              - 'packages/envoy-client/bin/dispatch.ts'
              - 'packages/envoy-client/scripts/build-dispatch-cli.sh'
              # Its prepack writes dist/THIRD_PARTY_NOTICES (prepack.sh:15) and copies skills/
              # (:17), which src/server.ts:25-28 also reads.
              - 'scripts/third-party-notices.ts'
              - 'skills/**'
            envoy_client:
              - '.github/workflows/ci.yaml'
              - *bun_install
              - *biome
              - 'packages/envoy-client/**'
              - 'packages/contracts/src/**'
              # src/__tests__/delivery.test.ts:16-17 and dispatch-config.test.ts:5.
              - 'packages/contracts/fixtures/dispatch-targeted-delivery.json'
              - 'packages/contracts/fixtures/dispatch-public-url.json'
              # src/__tests__/dispatch-advice.test.ts:683-690 holds every skill section a notice
              # cites to a heading of that skill's SKILL.md.
              - 'skills/**'
            # The private workspace package both Oh My Pi plugins import.
            pi_shared:
              - '.github/workflows/ci.yaml'
              - *bun_install
              - *biome
              - 'packages/pi-shared/**'
              - 'packages/envoy-client/src/**'
