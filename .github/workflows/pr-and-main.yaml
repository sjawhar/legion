name: Tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint daemon
        run: bunx biome check --error-on-warnings src/
        working-directory: packages/daemon


  typecheck:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck daemon
        run: bunx tsc --noEmit
        working-directory: packages/daemon


  test:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup mise
        uses: jdx/mise-action@v3
        with:
          version: "2026.8.12"
          tool_versions: |
            github:jj-vcs/jj 0.44.0

      - name: Verify daemon live-test tools
        run: |
          command -v git
          command -v gh
          command -v tmux
          mise env --json
          jj --version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test daemon
        run: bun test
        working-directory: packages/daemon
        env:
          LEGION_E2E: "1"
          LEGION_TMUX_LIVE: "1"

