name: Tests

# lint, typecheck and test are the checks main's ruleset requires, so they run on every pull request
# with no path filter, and each covers the shipped daemon (packages/daemon, the Go `legion`).
on:
  push:
    branches:
      - main
  merge_group:
    types: [checks_requested]
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  lint:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5

      # This workflow runs on every pull request with no path filter, so the pin check runs on
      # every change rather than only on one that touches a package.
      - name: Check every Bun install reads .bun-version
        run: .github/scripts/check-bun-version.sh

      - name: Check frozen Bun installs copy every workspace manifest
        run: .github/scripts/check-bun-workspace-manifests.sh

      - name: Check every manifest names the one exact zod
        run: .github/scripts/check-zod-version.sh

      - name: Check image triggers cover every image input
        run: .github/scripts/check-image-trigger-paths.sh

      # No Go cache here: gofmt needs none, and this job, which ends first, would save a nearly
      # empty one under the key the typecheck and test jobs share (the daemon's go.sum), where the
      # first save is the one every later run restores.
      - uses: actions/setup-go@v5
        with:
          go-version-file: packages/daemon/go.mod
          cache: false

      # The grant rig's daemon-pane.go belongs to no module (it runs with `go run -overlay` inside
      # packages/daemon), so it is formatted here with the daemon.
      - name: Check the Go daemon's formatting
        run: |
          unformatted=$(gofmt -l packages/daemon packages/pi-envoy/scripts/grant-rig/daemon-pane.go)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt -l lists files that are not gofmt-formatted; run gofmt -w on them:"
            echo "$unformatted"
            exit 1
          fi

      # Every Go archive a release ships carries THIRD_PARTY_NOTICES, written at build time with
      # the build's own GOOS, GOARCH and CGO_ENABLED (release.yaml's legion job and
      # release-envoy-listener.yaml). Writing them here for each of those builds fails the pull
      # request that brings in a module whose license cannot be determined, before a release does.
      - name: Check every Go release archive's third-party notices can be written
        run: |
          notices="$RUNNER_TEMP/notices"
          mkdir -p "$notices"
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            (cd packages/daemon && CGO_ENABLED=0 GOOS="${target%/*}" GOARCH="${target#*/}" \
              ../../scripts/go-third-party-notices.sh "$notices/legion-${target%/*}-${target#*/}" ./cmd/legion)
          done
          for arch in amd64 arm64; do
            (cd packages/envoy && GOOS=linux GOARCH="$arch" \
              ../../scripts/go-third-party-notices.sh "$notices/legion-envoy-$arch" ./cmd/listener)
            (cd packages/envoy && CGO_ENABLED=0 GOOS=linux GOARCH="$arch" \
              ../../scripts/go-third-party-notices.sh "$notices/agent-secrets-$arch" \
              ./cmd/agent-secrets ./cmd/agent-secrets-helper)
          done
          wc -l "$notices"/*


  typecheck:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version-file: packages/daemon/go.mod
          cache-dependency-path: packages/daemon/go.sum

      # With the e2e tag, vet also compiles the live proofs behind it (the Stage 4a harness,
      # sandbox/live*_test.go), which run on the devbox against a real cluster.
      - name: Vet the Go daemon, its e2e-tagged live proofs included
        run: go vet -tags e2e ./...
        working-directory: packages/daemon


  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # One service for both: the Go daemon's unit tests' Postgres and the Stage 1 script's.
      # Setting LEGION_E2E_PG_DSN is what tells the script not to start a container of its own —
      # that path is the devbox's.
      LEGION_TEST_PG_DSN: postgres://postgres:ci@localhost:5432/postgres?sslmode=disable
      LEGION_E2E_PG_DSN: postgres://postgres:ci@localhost:5432/postgres?sslmode=disable

    steps:
      - uses: actions/checkout@v5

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test release scripts
        run: .github/scripts/release-push.test.sh

      - name: Test the Bun pin check
        run: .github/scripts/check-bun-version.test.sh

      - name: Test the frozen Bun workspace manifest check
        run: .github/scripts/check-bun-workspace-manifests.test.sh

      - name: Test the zod version check
        run: .github/scripts/check-zod-version.test.sh

      - name: Test the image trigger path check
        run: .github/scripts/check-image-trigger-paths.test.sh

      - name: Test the live proofs' libraries (the GitHub ingress bridge, the proof human's check, the model gateway key command, the design-gate verdict)
        run: bun test scripts/e2e/lib

      - uses: actions/setup-go@v5
        with:
          go-version-file: packages/daemon/go.mod
          cache-dependency-path: packages/daemon/go.sum

      # The tmux runtime's tests drive a real tmux server and skip without one, and the daemon
      # supervises under tmux and refuses to start without it.
      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tmux

      # The workspace and boundary tests drive a real jj, the one the worker image ships (its
      # working-copy filters are among what they plant), and the daemon resolves jj at boot and
      # refuses to start without it.
      - uses: ./.github/actions/install-jj

      # internal/podsafety's baseline test and the pod agent's argv test run the Oh My Pi the worker
      # image ships, and refuse on GitHub Actions without one. The pin is read from
      # .omp-pin, the repository's one copy of it, installed through the mise above
      # (.github/actions/install-omp).
      - uses: ./.github/actions/install-omp

      # internal/runtime/sandbox's uv link-mode test installs a wheel with the uv the worker image
      # ships (ARG UV_VERSION, checked against ARG UV_SHA256), and refuses on GitHub Actions
      # without one (.github/actions/install-uv).
      - uses: ./.github/actions/install-uv

      - name: Test the Go daemon
        run: go test -count=1 ./...
        working-directory: packages/daemon

      - name: Stage 1 live proof
        run: bash scripts/e2e/stage1-skeleton.sh
