name: Tests

on:
  push:
    branches:
      - main
  merge_group:
    types: [checks_requested]
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  lint:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5

      # This workflow runs on every pull request with no path filter, so the pin check runs on
      # every change rather than only on one that touches a package.
      - name: Check every Bun install reads .bun-version
        run: .github/scripts/check-bun-version.sh

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint daemon
        run: bunx biome check --error-on-warnings src/
        working-directory: packages/daemon

      - name: Lint workspace
        run: bunx biome check --error-on-warnings src/
        working-directory: packages/workspace


  typecheck:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck daemon
        run: bunx tsc --noEmit
        working-directory: packages/daemon

      - name: Typecheck workspace
        run: bunx tsc --noEmit
        working-directory: packages/workspace


  test:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5

      - name: Setup Bun
        uses: ./.github/actions/setup-bun



      - uses: ./.github/actions/install-jj

      # The workspace suite also drives stock jj 0.44 as a second binary (STOCK_JJ in
      # packages/workspace/src/workspace.test.ts, through `mise x`), installed here beside the
      # worker image's jj on PATH so no test downloads it.
      - name: Install the workspace suite's stock jj
        env:
          MISE_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mise install github:jj-vcs/jj@0.44.0

      - name: Verify daemon live-test tools
        run: |
          command -v git
          command -v gh
          command -v tmux

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test release scripts
        run: .github/scripts/release-push.test.sh

      - name: Test the Bun pin check
        run: .github/scripts/check-bun-version.test.sh

      - name: Test the live proofs' GitHub ingress bridge
        run: bun test scripts/e2e/lib

      - name: Pre-pull daemon E2E NATS image
        run: docker pull nats:2.10

      - name: Test daemon
        run: bun test
        working-directory: packages/daemon
        env:
          LEGION_E2E: "1"
          LEGION_TMUX_LIVE: "1"

      - name: Test workspace
        run: bun test
        working-directory: packages/workspace

