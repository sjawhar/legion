name: Tests

on:
  push:
    branches:
      - main
  merge_group:
    types: [checks_requested]
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  lint:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint daemon
        run: bunx biome check --error-on-warnings src/
        working-directory: packages/daemon

      - name: Lint workspace
        run: bunx biome check --error-on-warnings src/
        working-directory: packages/workspace


  typecheck:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck daemon
        run: bunx tsc --noEmit
        working-directory: packages/daemon

      - name: Typecheck workspace
        run: bunx tsc --noEmit
        working-directory: packages/workspace


  test:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5

      - name: Test release scripts
        run: .github/scripts/release-push.test.sh

      - name: Test kind smoke harnesses
        run: |
          bash scripts/kind-smoke/up.test.sh
          bash scripts/kind-smoke/down.test.sh
          bash scripts/kind-smoke/checkpoints.test.sh

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install daemon live-test tools
        env:
          MISE_VERSION: v2026.8.12
          MISE_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl https://mise.run | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/share/mise/shims" >> "$GITHUB_PATH"
          "$HOME/.local/bin/mise" use -g github:jj-vcs/jj@0.44.0

      - name: Verify daemon live-test tools
        run: |
          command -v git
          command -v gh
          command -v tmux
          mise env --json
          jj --version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test kind smoke bridge
        run: bun test scripts/kind-smoke

      - name: Pre-pull daemon E2E NATS image
        run: docker pull nats:2.10

      - name: Test daemon
        run: bun test
        working-directory: packages/daemon
        env:
          LEGION_E2E: "1"
          LEGION_TMUX_LIVE: "1"

      - name: Test workspace
        run: bun test
        working-directory: packages/workspace

