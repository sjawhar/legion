name: Release envoy-infra

# The envoy-infra Pulumi plugin and the envoy-infra command (packages/envoy/infra), released
# together on an envoy-infra-v* tag of the commit the run checked out, as two archives per target
# (the build step says what each holds). The plugin's schema names that release as its download
# URL, so `pulumi package add envoy-infra@<version> --server <that URL>` installs it, and
# packages/envoy/infra/README.md ("Install") gives the commands that verify each archive first.
# Nothing is committed: a Go module carries no version file, so the tag alone records the version,
# which the plugin's schema and `envoy-infra --version` carry.
on:
  push:
    branches: [main]
    # The plugin's and the command's inputs: their module, every package of packages/envoy they
    # compile in, the manifests that set the versions they build with (the module's own go.work
    # binds packages/envoy), the notices script that writes their archives' notices, the list of
    # the targets they build, the list of the paths a version is cut from, and this workflow.
    # .github/scripts/check-envoy-infra-release-paths.sh fails the build when this list misses a
    # package either compiles in or a path .github/envoy-infra-release-paths names.
    paths:
      - "packages/envoy/infra/**"
      - "packages/envoy/internal/bus/**"
      - "packages/envoy/internal/contracts/**"
      - "packages/envoy/go.mod"
      - "packages/envoy/go.sum"
      - "scripts/go-third-party-notices.sh"
      - ".github/envoy-infra-targets.json"
      - ".github/envoy-infra-release-paths"
      - ".github/workflows/release-envoy-infra.yaml"
  workflow_dispatch:

# The release job declares its own permissions; nothing runs under this workflow-level default.
permissions: {}

jobs:
  release:
    # Only main releases them: a workflow_dispatch from another branch skips this job.
    if: github.ref == 'refs/heads/main'
    concurrency:
      # Only one run at a time by design, and a pending run GitHub drops in favor of a newer one
      # loses nothing: the version step bumps from the last tag to HEAD, not this commit alone.
      group: release-envoy-infra
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    # contents: write creates the GitHub release (`release-push.sh release`, below); id-token and
    # attestations: write are for the archives' provenance attestation (id-token is the Sigstore
    # signing certificate's OIDC token). The tag push uses the deploy key, not either scope.
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      # No credential is left in the checkout: the deploy key reaches the "Tag release" step alone,
      # not the build, the Pulumi CLI or the plugin binary the smoke test runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Determine next version
        id: version
        run: |
          # The paths a version is cut from, one pathspec per line: the plugin compiles in the Envoy
          # packages they name and renders grants from their exported subject names, so a commit to
          # one of them, or to any package the command compiles in, releases both, under one tag.
          # .github/scripts/check-envoy-infra-release-paths.sh holds the list to `go list -deps`
          # and to this workflow's push paths.
          mapfile -t paths < .github/envoy-infra-release-paths

          # A re-run after "Tag release" pushed the tag checks out this same commit with that tag at
          # HEAD, where the range below would be empty and skip the release it never finished.
          # Release that tag again instead (release-push.sh, `tagged`, which refuses a tag that is
          # not envoy-infra-vX.Y.Z): "Tag release" accepts its own tag at this commit and "Create
          # GitHub release" reuses a published release and publishes a draft one. The job tags the
          # commit it checked out and commits no bump, so `tagged` takes no package directory.
          TAGGED=$(.github/scripts/release-push.sh tagged envoy-infra-v)
          if [ -n "$TAGGED" ]; then
            {
              echo "version=${TAGGED#envoy-infra-v}"
              echo "release_tag=$TAGGED"
              echo "skip=false"
            } >> "$GITHUB_OUTPUT"
            echo "Releasing $TAGGED, already at HEAD"
            exit 0
          fi

          PREV_TAG=$(git tag -l 'envoy-infra-v*' --sort=-v:refname | head -1)
          if [ -z "$PREV_TAG" ]; then
            # The first release is 0.1.0, as the listener's first was: the history of the paths
            # above predates the plugin, and its breaking commits say nothing about its API.
            VERSION="0.1.0"
            {
              echo "version=$VERSION"
              echo "release_tag=envoy-infra-v${VERSION}"
              echo "skip=false"
            } >> "$GITHUB_OUTPUT"
            echo "First release: envoy-infra-v${VERSION}"
            exit 0
          fi
          # release-bump.sh refuses a previous version that is not X.Y.Z, since the newest tag's name
          # is whatever its pusher chose.
          PREV_VERSION="${PREV_TAG#envoy-infra-v}"
          # The notices script and the target list are runtime inputs of the archives, so any change
          # to one needs a new tag rather than a CI-only rebuild. release-bump.sh reads a
          # --patch-path only when it is also one of the paths after --.
          VERSION=$(.github/scripts/release-bump.sh "$PREV_VERSION" "${PREV_TAG}..HEAD" \
            --patch-path scripts/go-third-party-notices.sh --patch-path .github/envoy-infra-targets.json \
            -- "${paths[@]}")

          if [ "$VERSION" = "empty" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "No commits in the envoy-infra plugin's or command's paths since $PREV_TAG"
            exit 0
          fi
          if [ "$VERSION" = "none" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=No release published::No version-bumping commits since $PREV_TAG"
            echo "**No release published** — No version-bumping commits since $PREV_TAG" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          {
            echo "version=$VERSION"
            echo "release_tag=envoy-infra-v${VERSION}"
            echo "skip=false"
          } >> "$GITHUB_OUTPUT"
          echo "Bumping $PREV_TAG -> envoy-infra-v${VERSION}"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.version.outputs.skip != 'true'
        with:
          go-version-file: packages/envoy/infra/go.mod
          cache-dependency-path: |
            packages/envoy/infra/go.sum
            packages/envoy/go.sum
      # CGO_ENABLED=0: static binaries, so a linux archive runs on any distribution. Two archives per
      # target .github/envoy-infra-targets.json lists (the pull request's notices check reads the
      # same list):
      # - the plugin, under the name Pulumi requests from the schema's download URL,
      #   pulumi-resource-envoy-infra-v<version>-<os>-<arch>.tar.gz, with the binary and
      #   THIRD_PARTY_NOTICES at its root, where Pulumi looks for the binary;
      # - the envoy-infra command, envoy-infra-<os>-<arch>.tar.gz, holding envoy-infra and
      #   THIRD_PARTY_NOTICES in one top-level directory, envoy-infra-<os>-<arch>, as release.yaml's
      #   legion archives do: mise's github backend strips that one directory, leaving the binary.
      # Both binaries carry the version (-X main.version). THIRD_PARTY_NOTICES is the license of
      # every Go module its archive's binary compiles in (scripts/go-third-party-notices.sh, run
      # with the build's own GOOS, GOARCH and CGO_ENABLED), and fails the build when one cannot be
      # determined. SHA256SUMS, beside the archives, holds each one's SHA-256, for a consumer that
      # pins an archive by digest. Every go command here runs in the module's own go.work, which
      # binds it and packages/envoy.
      - name: Build pulumi-resource-envoy-infra and envoy-infra
        if: steps.version.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p out assets
          for target in $(jq -r '.["envoy-infra"][]' .github/envoy-infra-targets.json); do
            os=${target%/*}
            arch=${target#*/}
            dir="out/$os-$arch"
            mkdir -p "$dir"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go -C packages/envoy/infra build -buildvcs=false \
              -ldflags "-X main.version=$VERSION" \
              -o "$GITHUB_WORKSPACE/$dir/pulumi-resource-envoy-infra" ./cmd/pulumi-resource-envoy-infra
            (cd packages/envoy/infra && CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              ../../../scripts/go-third-party-notices.sh "$GITHUB_WORKSPACE/$dir/THIRD_PARTY_NOTICES" \
              ./cmd/pulumi-resource-envoy-infra)
            tar czf "assets/pulumi-resource-envoy-infra-v$VERSION-$os-$arch.tar.gz" -C "$dir" \
              pulumi-resource-envoy-infra THIRD_PARTY_NOTICES
            cli="envoy-infra-$os-$arch"
            mkdir -p "out/$cli"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go -C packages/envoy/infra build -buildvcs=false \
              -ldflags "-X main.version=$VERSION" \
              -o "$GITHUB_WORKSPACE/out/$cli/envoy-infra" ./cmd/envoy-infra
            (cd packages/envoy/infra && CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              ../../../scripts/go-third-party-notices.sh "$GITHUB_WORKSPACE/out/$cli/THIRD_PARTY_NOTICES" \
              ./cmd/envoy-infra)
            tar czf "assets/$cli.tar.gz" -C out "$cli/envoy-infra" "$cli/THIRD_PARTY_NOTICES"
          done
          (cd assets && sha256sum -- * > SHA256SUMS)
      # The Pulumi CLI the envoy-smoke job's live tests run, checked against its SHA-256 before it
      # is unpacked (.github/actions/install-pulumi).
      - name: Install the Pulumi CLI
        if: steps.version.outputs.skip != 'true'
        uses: ./.github/actions/install-pulumi
      # The schema the linux/amd64 plugin serves carries the version it was built with and names
      # the release this job creates as the place Pulumi downloads the plugin from. ${VERSION} in
      # the URL is Pulumi's own placeholder, which it fills in at install, so it is compared
      # literally. The binary's path is absolute: `pulumi package get-schema` reads a path that
      # starts with neither `/` nor `./` as a package name to resolve. The linux/amd64 command
      # prints the same version.
      - name: Smoke test
        if: steps.version.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          schema=$(pulumi package get-schema "$GITHUB_WORKSPACE/out/linux-amd64/pulumi-resource-envoy-infra")
          jq '{name, version, pluginDownloadURL}' <<<"$schema"
          # shellcheck disable=SC2016 # ${VERSION} is Pulumi's placeholder, not a shell expansion
          jq -e --arg v "$VERSION" \
            '.version == $v and .pluginDownloadURL == "https://github.com/sjawhar/legion/releases/download/envoy-infra-v${VERSION}"' \
            <<<"$schema"
          cli_version=$(out/envoy-infra-linux-amd64/envoy-infra --version)
          echo "envoy-infra --version: $cli_version"
          test "$cli_version" = "$VERSION"
      # Build provenance for both kinds of archive: the plugin's, which Pulumi installs, and the
      # command's, which writes seeds under its operator's credentials. The list is one glob per
      # line. The release below uploads these exact files, with SHA256SUMS. A consumer verifies an
      # archive against this workflow's signing identity before installing it, with the commands
      # packages/envoy/infra/README.md ("Install") gives for each.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: steps.version.outputs.skip != 'true'
        with:
          subject-path: |
            assets/pulumi-resource-envoy-infra-v*.tar.gz
            assets/envoy-infra-*.tar.gz
      # The only step that holds the deploy key. release-push.sh push-tag writes it to a directory
      # of its own, pushes the tag over SSH to GitHub's pinned host keys, and removes the key again.
      - name: Tag release
        if: steps.version.outputs.skip != 'true'
        env:
          TAG: ${{ steps.version.outputs.release_tag }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            test "$(git rev-list -n 1 "$TAG")" = "$GITHUB_SHA"
            exit 0
          fi
          git tag "$TAG"
          .github/scripts/release-push.sh push-tag "$TAG"
      - name: Create GitHub release
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.release_tag }}
          VERSION: ${{ steps.version.outputs.version }}
        # release-push.sh `release`: creates the release, reuses a published one, or publishes a
        # draft an earlier attempt left, with this run's assets.
        run: .github/scripts/release-push.sh release "$TAG" "envoy-infra v$VERSION" assets/*
