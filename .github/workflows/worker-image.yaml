name: Worker Image

on:
  workflow_call:
    inputs:
      cli_version:
        description: Version the `cli` job released in this run (empty when it released nothing)
        type: string
        required: false
        default: ""
      release_tag:
        description: The cli-v* release to append the image digest to (empty when cli_version is empty)
        type: string
        required: false
        default: ""
  # Post-merge only: GitHub dispatches a workflow only once it exists on the default branch.
  workflow_dispatch:
    inputs:
      cli_version:
        description: Optional CLI version to also tag the image with (main only)
        type: string
        required: false
        default: ""
      release_tag:
        description: Optional cli-v* release to append the digest to (main only)
        type: string
        required: false
        default: ""
  # Pre-merge iteration: a pull request against main that touches an image input builds its head and
  # publishes :sha-<short> only. `pull_request` (not `push`) because GitHub evaluates these paths against
  # the whole PR diff, so the check attaches to every head of such a PR — a handoff-only commit on top
  # of a Dockerfile change still gets it. A `push` trigger filters on the pushed commits alone and left
  # a PR head with no image check (LEGION-23 tester round 1). The paths are every file worker.Dockerfile
  # builds from: the root manifest, lockfile, patches and every root workspace's package.json (the cli
  # stage's frozen install); the packages it copies whole — the compiled CLI (packages/daemon, with the
  # Dockerfile), the plugin (packages/pi-envoy, packages/envoy-client, packages/contracts), the
  # provisioning code (packages/workspace), the skills; the Go module and its build inputs; the
  # context's .dockerignore; and this workflow. The final `legion probe-image` runs the image's own
  # CLI and plugin, so a PR that breaks either fails here instead of merging and publishing nothing.
  # .github/scripts/check-image-trigger-paths.sh fails the build when this list misses a file the
  # image build reads.
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - package.json
      - bun.lock
      - patches/**
      - packages/envoy-plugin/package.json
      - packages/claude-envoy/package.json
      - packages/proof-editor/package.json
      - packages/dispatch/package.json
      - packages/envoy/internal/dispatch/pmdoc/gen/package.json
      - packages/daemon/**
      - packages/pi-envoy/**
      - packages/envoy-client/**
      - packages/contracts/**
      - packages/workspace/**
      - skills/**
      - packages/daemon-go/**
      - go.work
      - go.work.sum
      - packages/envoy/go.mod
      - packages/envoy/go.sum
      - .dockerignore
      - .github/workflows/worker-image.yaml

# Same-repo `pull_request` runs get these too (a fork PR would get a read-only token, and this repo
# takes no fork PRs).
permissions:
  contents: write # gh release edit
  packages: write # ghcr.io push

jobs:
  build:
    runs-on: ubuntu-24.04
    # Job-level (not workflow-level): this file is also a called workflow, and job-level concurrency/env
    # behave identically for `workflow_call`, `workflow_dispatch`, and `pull_request`.
    # Two pushes to one PR serialize on the PR number; other events serialize on the ref.
    concurrency:
      group: worker-image-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: false
    env:
      IMAGE: ghcr.io/sjawhar/legion-worker
      # The commit that is built and that the sha- tag names: the PR head on `pull_request` (github.sha
      # would be the ephemeral merge commit there); the triggering commit for workflow_call/dispatch.
      BUILT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.BUILT_SHA }}

      - name: Compute tags
        id: meta
        env:
          CLI_VERSION: ${{ inputs.cli_version }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          short="${BUILT_SHA::12}"
          tags="${IMAGE}:sha-${short}"
          tag_release="false"
          version_label="sha-$short"
          if [ "$GITHUB_REF" = "refs/heads/main" ] && [ -n "$CLI_VERSION" ]; then
            tags="${tags}"$'\n'"${IMAGE}:${CLI_VERSION}"
            version_label="$CLI_VERSION"
            [ -n "$RELEASE_TAG" ] && tag_release="true"
          fi
          {
            echo "built_sha=$BUILT_SHA"
            echo "short=$short"
            echo "tag_release=$tag_release"
            echo "version_label=$version_label"
            echo "tags<<EOF"
            echo "$tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/daemon/docker/worker.Dockerfile
          # The OMP fork release ships linux-x64 (and darwin-arm64) only.
          platforms: linux/amd64
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{ steps.meta.outputs.tags }}
          # org.opencontainers.image.source is the Dockerfile's LABEL (the in-repo convention).
          labels: |
            org.opencontainers.image.revision=${{ steps.meta.outputs.built_sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version_label }}
          # The Go `legion` links the built commit (`legion version` names it); the build refuses without it.
          build-args: |
            LEGION_REVISION=${{ steps.meta.outputs.built_sha }}
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}

      - name: Record digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          test -n "$DIGEST"
          {
            echo "### Worker image"
            echo
            echo "\`${IMAGE}@${DIGEST}\`"
            echo
            echo "Tags:"
            # shellcheck disable=SC2016 # literal backticks and a sed `$` anchor, no expansion wanted
            printf '%s\n' "$TAGS" | sed 's/^/- `/; s/$/`/'
            echo
            echo "Pin \`runtime.kubernetes.image\` to the digest reference above; the daemon refuses a tag."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Append digest to the CLI release
        if: steps.meta.outputs.tag_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIGEST: ${{ steps.build.outputs.digest }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json body -q .body > body.md
          if grep -q "$DIGEST" body.md; then
            echo "Release $RELEASE_TAG already lists $DIGEST"
            exit 0
          fi
          # shellcheck disable=SC2016 # literal Markdown backticks, no expansion wanted
          printf '\n\n## Worker image\n\n`%s@%s`\n' "$IMAGE" "$DIGEST" >> body.md
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --notes-file body.md
