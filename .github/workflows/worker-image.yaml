name: Worker Image

on:
  # release.yaml calls this file twice in one run: once with skip_attest, which builds and pushes
  # the image's sha- tag, and once with attest_digest set to the digest that call pushed, which
  # skips the build and attests that digest after the caller's own publish job. skip_attest makes a
  # call attest nothing: release.yaml's build-only call sets it, and its attest-only call sets it to
  # its plugin-pair gate, so that call attests nothing when the pair did not publish. attest_digest
  # makes a call attest only that digest, skipping the build. ci.yaml's call on a pull request and a
  # `workflow_dispatch` run, where both are unset, build and (off pull requests) attest in one run.
  workflow_call:
    inputs:
      legion_version:
        description: The legion version this run's release decided (legion_build's version), which becomes the image's org.opencontainers.image.version label on main; empty when legion releases nothing
        type: string
        required: false
        default: ""
      pi_legion_version:
        description: Resolved @sjawhar/pi-legion version for this build (empty when neither published nor known)
        type: string
        required: false
        default: ""
      pi_envoy_version:
        description: Resolved @sjawhar/pi-envoy version for this build (empty when neither published nor known)
        type: string
        required: false
        default: ""
      skip_attest:
        description: Attest nothing in this call (release.yaml's build-only call, and its attest-only call when the plugin pair did not publish)
        type: boolean
        required: false
        default: false
      attest_digest:
        description: Attest only this digest the caller's earlier call pushed; the build job skips
        type: string
        required: false
        default: ""
    outputs:
      ref:
        description: The pushed image, pinned by digest (ghcr.io/sjawhar/legion-worker@sha256:…)
        value: ${{ jobs.build.outputs.ref }}
      image:
        description: The pushed image's repository (ghcr.io/sjawhar/legion-worker)
        value: ${{ jobs.build.outputs.image }}
      digest:
        description: The pushed image's digest (sha256:…)
        value: ${{ jobs.build.outputs.digest }}
  # Post-merge only: GitHub dispatches a workflow only once it exists on the default branch.
  workflow_dispatch:
    inputs:
      pi_legion_version:
        description: Optional resolved @sjawhar/pi-legion version to link into the smoke-tested binary
        type: string
        required: false
        default: ""
      pi_envoy_version:
        description: Optional resolved @sjawhar/pi-envoy version to link into the smoke-tested binary
        type: string
        required: false
        default: ""
  # Pull requests: .github/workflows/ci.yaml calls this workflow (its worker-image job) for every
  # pull request whose diff its `worker_image` filter matches, on any base, building the head and
  # publishing :sha-<short> only. A stacked pull request publishes a sha- tag too, which a pin never
  # accepts (docs/kubernetes.md, "Pin by digest, never by tag"). The final `legion probe-image` runs
  # the image's own `legion`, both Oh My Pi plugins and the Claude lane, so a pull request that
  # breaks any of them fails here instead of merging and publishing nothing. .github/scripts/check-image-trigger-paths.sh fails the
  # build when that filter misses a file the image build reads, or matches one it does not read.

# This workflow has no pull_request trigger of its own: a pull request's run is ci.yaml's call on
# pull_request, which gets this same token (a fork pull request would get a read-only one, and this
# repo takes no fork pull requests), so it carries only what the pull request path needs. The
# legion version tag and the release note, which needs `contents: write`, run in release.yaml's own
# `worker_image_release` job, and the attestation's `id-token` and `attestations: write` belong to
# the `attest` job below alone, which a pull request run skips. A pull request runs its own head's
# copy of this file, so one that drops that `if:` gets those scopes too; its attestation is still
# refused, because its certificate names `refs/pull/<n>/merge`, never `refs/heads/main`
# (docs/kubernetes.md, "Pin by digest, never by tag").
permissions:
  contents: read
  packages: write # ghcr.io push

# The image the build pushes and the attest job attests a digest of.
env:
  IMAGE: ghcr.io/sjawhar/legion-worker

jobs:
  build:
    # An attest-only call (attest_digest) attests what the caller's earlier call built, so it skips
    # the build. Every other run leaves attest_digest out (ci.yaml's call on a pull request,
    # release.yaml's build-only call, workflow_dispatch), so it builds.
    # .github/scripts/check-image-trigger-paths.sh admits this call-mode term.
    if: ${{ inputs.attest_digest == '' }}
    runs-on: ubuntu-24.04
    # Job-level (not workflow-level): this file is a called workflow, and job-level concurrency
    # behaves identically for its two triggers, `workflow_call` and `workflow_dispatch`.
    # A pull request's runs share one group per PR number. A new head's run cancels the build of the
    # head it replaced, whether that build is waiting for the group, waiting for a runner or running.
    # The call comes from ci.yaml on pull_request, whose own concurrency group (one per pull request
    # number, cancel-in-progress on pull_request) already cancels an older head's whole run, this
    # call included, and which tests-closed.yaml joins when the pull request closes, cancelling a
    # build still waiting or running then; this group also cancels a build that a re-run of an older
    # head's run starts. Only a head that starts a run of its own can do this. A push carrying
    # `skip-checks: true` (a `.legion/`-only handoff) starts no run, so it never cancels the code
    # head's build. Another pull request's build is in another group. Other events key on
    # github.sha, not github.ref, so a pending run of one main commit never drops another commit's.
    # They never cancel: in a call from release.yaml, `github.event_name` is the caller's (`push` or
    # `workflow_dispatch`, never `pull_request`), so no main commit is left without an image to pin.
    # Of a release run's two calls only the build-only one's build enters this group: the
    # attest-only call's build skips on its `if:`, and a job its `if:` skips enters no job-level
    # group. A further run at main's sha (a manual `gh workflow run worker-image.yaml`) can still
    # replace release.yaml's pending build; release.yaml's worker_image then fails, so
    # worker_image_attest and worker_image_release skip and nothing names an unattested image:
    # that fails closed.
    # On a pull request, the run that reaches the group last wins, and GitHub does not guarantee
    # arrival order: two pushes seconds apart, or a re-run of an older head's run, can cancel the
    # newest head's build, and ci.yaml's ci-ok then fails for that run. `gh run rerun` of the newest
    # head's run restores it, so re-run an older head's run only after the newest head's build has
    # completed. The job has no draft or closed `if:`: its only pull_request run is ci.yaml's call,
    # which never runs on a draft (ci.yaml's `changes` skips it) and has no `closed` trigger.
    concurrency:
      group: worker-image-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    env:
      # The commit that is built and that the sha- tag names: the PR head on a pull request (ci.yaml's
      # call; github.sha would be the ephemeral merge commit there); the triggering commit for
      # release.yaml's call and workflow_dispatch.
      BUILT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    outputs:
      ref: ${{ steps.record.outputs.ref }}
      image: ${{ steps.record.outputs.image }}
      digest: ${{ steps.record.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.BUILT_SHA }}
          # This job never pushes with git.
          persist-credentials: false

      # The sha- tag alone: release.yaml's worker_image_release adds the legion version tag to this
      # image's digest once publish has released that version, so a version tag still means
      # "released". The version label names the legion version legion_build decided (legion_version,
      # on main only; sha-<short> otherwise), so a released image carries it as before: a deployment
      # that builds its own image FROM this one reads that label as the Legion release it carries.
      # If publish then fails to release that version, this image keeps the label but gets no version
      # tag and no release names it; the rerun that releases the version tags and names the image
      # that rerun's worker_image produced (a rerun of the failed jobs reuses this one).
      - name: Compute tags
        id: meta
        env:
          LEGION_VERSION: ${{ inputs.legion_version }}
        run: |
          short="${BUILT_SHA::12}"
          version_label="sha-$short"
          if [ "$GITHUB_REF" = "refs/heads/main" ] && [ -n "$LEGION_VERSION" ]; then
            version_label="$LEGION_VERSION"
          fi
          {
            echo "built_sha=$BUILT_SHA"
            echo "version_label=$version_label"
            echo "tags=${IMAGE}:sha-${short}"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # provenance-add-gha (true by default on the docker-container driver) stages
          # $GITHUB_EVENT_PATH's full JSON into any provenance predicate a build below computes —
          # the mechanism behind the job-log leak the env block below already guards against.
          # provenance: false keeps this build's own attestation empty, but not that; false here
          # too is what actually stops the event payload reaching a predicate at all. image= is the
          # driver's own default BuildKit image, through the mirror.
          driver-opts: |
            provenance-add-gha=false
            image=mirror.gcr.io/moby/buildkit:buildx-stable-1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          # provenance: false below only stops the attestation attaching to the pushed image: the
          # action unconditionally logs buildx's own --metadata-file content (`##[group]Metadata`),
          # whose buildx.build.provenance key still carries this job's full GitHub Actions event
          # context (the triggering pull_request's title and body included) at its "min" default,
          # confirmed live in run 37187574912 even with provenance: false and DOCKER_BUILD_SUMMARY
          # unset. BUILDX_METADATA_PROVENANCE=disabled drops that key from the metadata file
          # entirely; DOCKER_BUILD_SUMMARY=false additionally drops the separate build-summary
          # artifact and page.
          BUILDX_METADATA_PROVENANCE: disabled
          DOCKER_BUILD_SUMMARY: "false"
        with:
          context: .
          file: packages/daemon/docker/worker.Dockerfile
          # The OMP fork release ships linux-x64 (and darwin-arm64) only.
          platforms: linux/amd64
          provenance: false
          push: true
          # The layer cache is the GitHub Actions cache under the image's own scope, worker-image,
          # so the Envoy listener's build (release-envoy-listener.yaml, the default scope) never
          # replaces its index. Every build reads it; only a build on main writes it (release.yaml
          # calls this workflow on main pushes; off main cache-to is empty, which passes no
          # --cache-to). A pull request's build reads the entries main wrote and writes none, and
          # GitHub never lets a main run restore a branch's entries, so a pull request cannot put a
          # layer into the attested release build (no cache shared between trusted and untrusted
          # builds, BuildKit advisory GHSA-f2v9-hprr-32q3). A newer head can cancel a pull request's
          # build mid-export, and on 2026-10-27 the Actions cache held 10.80 GB of
          # pull-request-scope buildkit entries. mode=min exports only the final image's layers, not
          # every intermediate stage's: on 2026-10-28 main alone held 10.44 GB, 5.97 GB of it
          # buildkit blobs, mostly this build's mode=max export, over the repository's limit, so main
          # evicted its own entries (the Envoy listener measured 136.8 MB a run with mode=min
          # against 1.6 GB with mode=max). ignore-error=true: the cache only saves time, so a failed
          # export never fails the build that pushed the image a release pins.
          cache-from: type=gha,scope=worker-image
          cache-to: ${{ github.ref == 'refs/heads/main' && 'type=gha,mode=min,scope=worker-image,ignore-error=true' || '' }}
          tags: ${{ steps.meta.outputs.tags }}
          # org.opencontainers.image.source is the Dockerfile's LABEL (the in-repo convention).
          labels: |
            org.opencontainers.image.revision=${{ steps.meta.outputs.built_sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version_label }}
          # The Go `legion` links the built commit (`legion version` names it); the build refuses without it.
          build-args: |
            LEGION_REVISION=${{ steps.meta.outputs.built_sha }}
            PI_LEGION_VERSION=${{ inputs.pi_legion_version }}
            PI_ENVOY_VERSION=${{ inputs.pi_envoy_version }}
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}

      - name: Record digest
        id: record
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAG: ${{ steps.meta.outputs.tags }}
        run: |
          test -n "$DIGEST"
          REF="${IMAGE}@${DIGEST}"
          {
            echo "image=$IMAGE"
            echo "digest=$DIGEST"
            echo "ref=$REF"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Worker image"
            echo
            echo "\`$REF\`"
            echo
            echo "Tag: \`$TAG\`"
            echo
            echo "Pin \`runtime.kubernetes.image\` to the digest reference above; the daemon refuses a tag."
          } >> "$GITHUB_STEP_SUMMARY"

  # A GitHub artifact attestation of the digest the build pushed, stored with GitHub. A pull request
  # run publishes its head's sha- tag too, and a pull request can edit this workflow, so a tag alone
  # cannot say which run published an image. The attestation's Sigstore certificate carries this
  # workflow file's identity, ref and commit and the calling run's repository, ref and commit from
  # the run's OIDC token, which no workflow edit can change, so the `gh attestation verify` command
  # docs/kubernetes.md gives ("Pin by digest, never by tag") accepts a digest only when a run of this
  # repository's main attested it. Consumers name this file in that command, so moving the
  # attestation to another workflow breaks every one of them. A pull request run skips this job (the
  # comment above `permissions:` covers one that edits the `if:` out). This statement is GitHub's,
  # separate from the BuildKit provenance the build job keeps off (provenance: false and the
  # comments above).
  #
  # It attests this run's own build, or, in an attest-only call, the digest attest_digest names,
  # which this call did not build; a build-only call (skip_attest) skips it. Any repository can call
  # this public reusable workflow with any attest_digest, but such an attestation names the caller's
  # repository as its source and is stored there, so that command (`--repo sjawhar/legion`,
  # `--cert-identity …/worker-image.yaml@refs/heads/main`, `--source-ref refs/heads/main`) refuses
  # it. release.yaml's own attest-only call attests only the digest its build-only call pushed in
  # the same run. `!cancelled()` lets it run past the build job an attest-only call skips.
  attest:
    needs: build
    if: ${{ !cancelled() && github.event_name != 'pull_request' && !inputs.skip_attest && (needs.build.result == 'success' || (needs.build.result == 'skipped' && inputs.attest_digest != '')) }}
    runs-on: ubuntu-24.04
    # id-token: write is the OIDC token Sigstore issues the signing certificate for; attestations:
    # write stores the attestation with GitHub.
    permissions:
      id-token: write
      attestations: write
    steps:
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ inputs.attest_digest || needs.build.outputs.digest }}
