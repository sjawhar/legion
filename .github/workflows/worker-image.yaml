name: Worker Image

on:
  # release.yaml calls this file twice in one run: once with skip_attest, which builds and pushes
  # the image's sha- tag, and once with attest_digest set to the digest that call pushed, which
  # skips the build and attests that digest after the caller's own publish job. skip_attest makes a
  # call attest nothing: release.yaml's build-only call sets it, and its attest-only call sets it to
  # its plugin-pair gate, so that call attests nothing when the pair did not publish. attest_digest
  # makes a call attest only that digest, skipping the build. A `pull_request` or
  # `workflow_dispatch` run, where both are unset, builds and (off pull requests) attests in one run.
  workflow_call:
    inputs:
      legion_version:
        description: The legion version this run's release decided (legion_build's version), which becomes the image's org.opencontainers.image.version label on main; empty when legion releases nothing
        type: string
        required: false
        default: ""
      pi_legion_version:
        description: Resolved @sjawhar/pi-legion version for this build (empty when neither published nor known)
        type: string
        required: false
        default: ""
      pi_envoy_version:
        description: Resolved @sjawhar/pi-envoy version for this build (empty when neither published nor known)
        type: string
        required: false
        default: ""
      skip_attest:
        description: Attest nothing in this call (release.yaml's build-only call, and its attest-only call when the plugin pair did not publish)
        type: boolean
        required: false
        default: false
      attest_digest:
        description: Attest only this digest the caller's earlier call pushed; the build job skips
        type: string
        required: false
        default: ""
    outputs:
      ref:
        description: The pushed image, pinned by digest (ghcr.io/sjawhar/legion-worker@sha256:…)
        value: ${{ jobs.build.outputs.ref }}
      image:
        description: The pushed image's repository (ghcr.io/sjawhar/legion-worker)
        value: ${{ jobs.build.outputs.image }}
      digest:
        description: The pushed image's digest (sha256:…)
        value: ${{ jobs.build.outputs.digest }}
  # Post-merge only: GitHub dispatches a workflow only once it exists on the default branch.
  workflow_dispatch:
    inputs:
      pi_legion_version:
        description: Optional resolved @sjawhar/pi-legion version to link into the smoke-tested binary
        type: string
        required: false
        default: ""
      pi_envoy_version:
        description: Optional resolved @sjawhar/pi-envoy version to link into the smoke-tested binary
        type: string
        required: false
        default: ""
  # Pre-merge iteration: a pull request against main that touches an image input builds its head and
  # publishes :sha-<short> only. `pull_request` (not `push`) because GitHub evaluates these paths against
  # the whole PR diff, so the check attaches to every head of such a PR — a handoff-only commit on top
  # of a Dockerfile change still gets it. A `push` trigger filters on the pushed commits alone and left
  # a PR head with no image check (LEGION-23 tester round 1). The paths are every file worker.Dockerfile
  # builds from: the root manifest, lockfile, patches and every root workspace's package.json (the plugin
  # stage's frozen install); the packages it copies whole — the Dockerfile (packages/daemon), the two
  # plugins (packages/pi-envoy, packages/pi-legion, with packages/pi-shared, packages/envoy-client,
  # packages/contracts), the skills and the prepack that stages them, the Go module and its build
  # inputs (packages/daemon, go.work, go.work.sum), and packages/envoy (copied whole for its
  # agent-secrets binary) but its packages/envoy/infra module, which the .dockerignore drops; the
  # scripts that write its third-party notices; the OMP pin (.omp-pin);
  # the context's .dockerignore; and this workflow. The final `legion probe-image` runs the image's
  # own `legion` and both plugins, so a PR that breaks any of them fails here instead of merging and
  # publishing nothing. A draft's head builds no image until the pull request is marked ready
  # (`ready_for_review`), which builds that head. A `closed` run builds nothing: it enters the
  # concurrency group below and cancels the pull request's build still waiting or running, as a
  # newer head's run cancels an older head's. A reopen within about a minute of the close can race
  # that closed run: tests-closed.yaml says what happens and what to do.
  # .github/scripts/check-image-trigger-paths.sh fails the build when this list misses a file the
  # image build reads.
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, closed]
    paths:
      - package.json
      - bun.lock
      - patches/**
      - packages/envoy-plugin/package.json
      - packages/claude-envoy/package.json
      - packages/proof-editor/package.json
      - packages/dispatch/package.json
      - packages/envoy/internal/dispatch/pmdoc/gen/package.json
      - docs/site/package.json
      - packages/daemon/**
      - packages/pi-envoy/**
      - packages/pi-legion/**
      - packages/pi-shared/**
      - packages/envoy-client/**
      - packages/contracts/**
      - skills/**
      - go.work
      - go.work.sum
      - packages/envoy/**
      - "!packages/envoy/infra/**"
      - .omp-pin
      - .dockerignore
      - .github/workflows/worker-image.yaml
      - scripts/pi-plugin-prepack.sh
      - scripts/third-party-notices.ts
      - scripts/go-third-party-notices.sh
      - scripts/assemble-third-party-notices.sh

# Workflow-level, not job-level, because a job its own `if:` skips enters no job-level group: only
# here does a closed pull request's run, whose build skips, cancel that pull request's build. On
# pull_request the key is the pull request's number, so a newer head, or the closing, cancels an
# older head's build of the same pull request whether it waits or runs (a merged pull request's
# closed event carries github.ref = the base branch, so the number is the one key that names the
# pull request). Every other event keys on github.sha, not github.ref, and cancel-in-progress is
# off for those events, so a running main, workflow_call or workflow_dispatch build is never
# cancelled, and none of those runs cancels a pull request's build. GitHub may still replace a
# pending run with a newer one at the same sha, which builds the same image, so a dropped pending
# main run never leaves a commit with no image to pin (why: this PR's description), except that a
# further run at that sha (a manual `gh workflow run worker-image.yaml` at main's sha) replacing
# release.yaml's pending attest-only call leaves the digest worker_image_release names
# unattested, which the consumers' verify refuses: that fails closed. Under
# workflow_call the github context is the caller's (release.yaml, on push or workflow_dispatch),
# so a release run keys worker-image-<sha>, apart from release.yaml's own
# `release-${{ github.ref }}` group. Both of a release run's calls key that group, and neither
# waits on the other: the attest-only call starts only once the build-only call has finished
# (release.yaml's worker_image_attest needs worker_image). The build job repeats no group: GitHub
# detects a job group named like its workflow's as a deadlock and cancels the run.
concurrency:
  group: worker-image-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Same-repo `pull_request` runs get this token too (a fork PR would get a read-only token, and this
# repo takes no fork PRs), so it carries only what the pull request path needs. The legion version
# tag and the release note, which needs `contents: write`, run in release.yaml's own
# `worker_image_release` job, and the attestation's `id-token` and `attestations: write` belong to
# the `attest` job below alone, which a pull request run skips. A pull request runs its own head's
# copy of this file, so one that drops that `if:` gets those scopes too; its attestation is still
# refused, because its certificate names `refs/pull/<n>/merge`, never `refs/heads/main`
# (docs/kubernetes.md, "Pin by digest, never by tag").
permissions:
  contents: read
  packages: write # ghcr.io push

# The image the build pushes and the attest job attests a digest of.
env:
  IMAGE: ghcr.io/sjawhar/legion-worker

jobs:
  build:
    # An attest-only call (attest_digest) attests what the caller's earlier call built, so it skips
    # the build. workflow_dispatch and a workflow_call from release.yaml (on push or
    # workflow_dispatch) carry no pull_request and no closed action, so the two event terms hold
    # there. .github/scripts/check-image-trigger-paths.sh admits all three terms.
    if: ${{ inputs.attest_digest == '' && github.event.action != 'closed' && !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    env:
      # The commit that is built and that the sha- tag names: the PR head on `pull_request` (github.sha
      # would be the ephemeral merge commit there); the triggering commit for workflow_call/dispatch.
      BUILT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    outputs:
      ref: ${{ steps.record.outputs.ref }}
      image: ${{ steps.record.outputs.image }}
      digest: ${{ steps.record.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.BUILT_SHA }}
          # This job never pushes with git.
          persist-credentials: false

      # The sha- tag alone: release.yaml's worker_image_release adds the legion version tag to this
      # image's digest once publish has released that version, so a version tag still means
      # "released". The version label names the legion version legion_build decided (legion_version,
      # on main only; sha-<short> otherwise), so a released image carries it as before: a deployment
      # that builds its own image FROM this one reads that label as the Legion release it carries.
      # If publish then fails to release that version, this image keeps the label but gets no version
      # tag and no release names it; the rerun that releases the version tags and names the image
      # that rerun's worker_image produced (a rerun of the failed jobs reuses this one).
      - name: Compute tags
        id: meta
        env:
          LEGION_VERSION: ${{ inputs.legion_version }}
        run: |
          short="${BUILT_SHA::12}"
          version_label="sha-$short"
          if [ "$GITHUB_REF" = "refs/heads/main" ] && [ -n "$LEGION_VERSION" ]; then
            version_label="$LEGION_VERSION"
          fi
          {
            echo "built_sha=$BUILT_SHA"
            echo "version_label=$version_label"
            echo "tags=${IMAGE}:sha-${short}"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # provenance-add-gha (true by default on the docker-container driver) stages
          # $GITHUB_EVENT_PATH's full JSON into any provenance predicate a build below computes —
          # the mechanism behind the job-log leak the env block below already guards against.
          # provenance: false keeps this build's own attestation empty, but not that; false here
          # too is what actually stops the event payload reaching a predicate at all. image= is the
          # driver's own default BuildKit image, through the mirror.
          driver-opts: |
            provenance-add-gha=false
            image=mirror.gcr.io/moby/buildkit:buildx-stable-1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          # provenance: false below only stops the attestation attaching to the pushed image: the
          # action unconditionally logs buildx's own --metadata-file content (`##[group]Metadata`),
          # whose buildx.build.provenance key still carries this job's full GitHub Actions event
          # context (the triggering pull_request's title and body included) at its "min" default,
          # confirmed live in run 37187574912 even with provenance: false and DOCKER_BUILD_SUMMARY
          # unset. BUILDX_METADATA_PROVENANCE=disabled drops that key from the metadata file
          # entirely; DOCKER_BUILD_SUMMARY=false additionally drops the separate build-summary
          # artifact and page.
          BUILDX_METADATA_PROVENANCE: disabled
          DOCKER_BUILD_SUMMARY: "false"
        with:
          context: .
          file: packages/daemon/docker/worker.Dockerfile
          # The OMP fork release ships linux-x64 (and darwin-arm64) only.
          platforms: linux/amd64
          provenance: false
          push: true
          # The layer cache is read by every build and written only by a build on main
          # (release.yaml calls this workflow on main pushes, so github.ref there is
          # refs/heads/main): an entry a pull request writes is readable by no other pull request.
          # Off main cache-to is empty, which passes no --cache-to at all. The scope is the
          # worker image's own, so the Envoy listener's build (release-envoy-listener.yaml, the
          # default scope) does not replace its index.
          cache-from: type=gha,scope=worker-image
          cache-to: ${{ github.ref == 'refs/heads/main' && 'type=gha,mode=max,scope=worker-image' || '' }}
          tags: ${{ steps.meta.outputs.tags }}
          # org.opencontainers.image.source is the Dockerfile's LABEL (the in-repo convention).
          labels: |
            org.opencontainers.image.revision=${{ steps.meta.outputs.built_sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version_label }}
          # The Go `legion` links the built commit (`legion version` names it); the build refuses without it.
          build-args: |
            LEGION_REVISION=${{ steps.meta.outputs.built_sha }}
            PI_LEGION_VERSION=${{ inputs.pi_legion_version }}
            PI_ENVOY_VERSION=${{ inputs.pi_envoy_version }}
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}

      - name: Record digest
        id: record
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAG: ${{ steps.meta.outputs.tags }}
        run: |
          test -n "$DIGEST"
          REF="${IMAGE}@${DIGEST}"
          {
            echo "image=$IMAGE"
            echo "digest=$DIGEST"
            echo "ref=$REF"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Worker image"
            echo
            echo "\`$REF\`"
            echo
            echo "Tag: \`$TAG\`"
            echo
            echo "Pin \`runtime.kubernetes.image\` to the digest reference above; the daemon refuses a tag."
          } >> "$GITHUB_STEP_SUMMARY"

  # A GitHub artifact attestation of the digest the build pushed, stored with GitHub. A pull request
  # run publishes its head's sha- tag too, and a pull request can edit this workflow, so a tag alone
  # cannot say which run published an image. The attestation's Sigstore certificate carries this
  # workflow file's identity, ref and commit and the calling run's repository, ref and commit from
  # the run's OIDC token, which no workflow edit can change, so the `gh attestation verify` command
  # docs/kubernetes.md gives ("Pin by digest, never by tag") accepts a digest only when a run of this
  # repository's main attested it. Consumers name this file in that command, so moving the
  # attestation to another workflow breaks every one of them. A pull request run skips this job (the
  # comment above `permissions:` covers one that edits the `if:` out). This statement is GitHub's,
  # separate from the BuildKit provenance the build job keeps off (provenance: false and the
  # comments above).
  #
  # It attests this run's own build, or, in an attest-only call, the digest attest_digest names,
  # which this call did not build; a build-only call (skip_attest) skips it. Any repository can call
  # this public reusable workflow with any attest_digest, but such an attestation names the caller's
  # repository as its source and is stored there, so that command (`--repo sjawhar/legion`,
  # `--cert-identity …/worker-image.yaml@refs/heads/main`, `--source-ref refs/heads/main`) refuses
  # it. release.yaml's own attest-only call attests only the digest its build-only call pushed in
  # the same run. `!cancelled()` lets it run past the build job an attest-only call skips.
  attest:
    needs: build
    if: ${{ !cancelled() && github.event_name != 'pull_request' && !inputs.skip_attest && (needs.build.result == 'success' || (needs.build.result == 'skipped' && inputs.attest_digest != '')) }}
    runs-on: ubuntu-24.04
    # id-token: write is the OIDC token Sigstore issues the signing certificate for; attestations:
    # write stores the attestation with GitHub.
    permissions:
      id-token: write
      attestations: write
    steps:
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ inputs.attest_digest || needs.build.outputs.digest }}
