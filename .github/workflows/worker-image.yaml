name: Worker Image

on:
  workflow_call:
    inputs:
      legion_version:
        description: Version the `legion` job released in this run (empty when it released nothing)
        type: string
        required: false
        default: ""
    outputs:
      ref:
        description: The pushed image, pinned by digest (ghcr.io/sjawhar/legion-worker@sha256:…)
        value: ${{ jobs.build.outputs.ref }}
  # Post-merge only: GitHub dispatches a workflow only once it exists on the default branch.
  workflow_dispatch:
    inputs:
      legion_version:
        description: Optional legion version to also tag the image with (main only)
        type: string
        required: false
        default: ""
  # Pre-merge iteration: a pull request against main that touches an image input builds its head and
  # publishes :sha-<short> only. `pull_request` (not `push`) because GitHub evaluates these paths against
  # the whole PR diff, so the check attaches to every head of such a PR — a handoff-only commit on top
  # of a Dockerfile change still gets it. A `push` trigger filters on the pushed commits alone and left
  # a PR head with no image check (LEGION-23 tester round 1). The paths are every file worker.Dockerfile
  # builds from: the root manifest, lockfile, patches and every root workspace's package.json (the plugin
  # stage's frozen install); the packages it copies whole — the Dockerfile (packages/daemon), the plugin
  # (packages/pi-envoy, packages/envoy-client, packages/contracts), the skills, the Go module and its
  # build inputs (packages/daemon, go.work, go.work.sum), and packages/envoy (copied whole for its
  # agent-secrets binary, AGENTC-393); the OMP pin (.omp-pin); the context's .dockerignore; and this
  # workflow. The final `legion probe-image` runs the image's own `legion` and plugin, so a PR that
  # breaks either fails here instead of merging and publishing nothing.
  # .github/scripts/check-image-trigger-paths.sh fails the build when this list misses a file the
  # image build reads.
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - package.json
      - bun.lock
      - patches/**
      - packages/envoy-plugin/package.json
      - packages/claude-envoy/package.json
      - packages/proof-editor/package.json
      - packages/dispatch/package.json
      - packages/envoy/internal/dispatch/pmdoc/gen/package.json
      - docs/site/package.json
      - packages/daemon/**
      - packages/pi-envoy/**
      - packages/envoy-client/**
      - packages/contracts/**
      - skills/**
      - go.work
      - go.work.sum
      - packages/envoy/**
      - .omp-pin
      - .dockerignore
      - .github/workflows/worker-image.yaml

# Same-repo `pull_request` runs get this token too (a fork PR would get a read-only token, and this
# repo takes no fork PRs), so it carries only what the pull request path needs: a PR that edits this
# workflow must add a write scope to get one, and that line shows in its diff. The release note that
# needs `contents: write` runs in release.yaml's own `worker_image_release_note` job.
permissions:
  contents: read
  packages: write # ghcr.io push

jobs:
  build:
    runs-on: ubuntu-24.04
    # Job-level (not workflow-level): this file is also a called workflow, and job-level concurrency/env
    # behave identically for `workflow_call`, `workflow_dispatch`, and `pull_request`.
    # Two pushes to one PR serialize on the PR number; other events serialize on the ref.
    concurrency:
      group: worker-image-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: false
    env:
      IMAGE: ghcr.io/sjawhar/legion-worker
      # The commit that is built and that the sha- tag names: the PR head on `pull_request` (github.sha
      # would be the ephemeral merge commit there); the triggering commit for workflow_call/dispatch.
      BUILT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    outputs:
      ref: ${{ steps.record.outputs.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.BUILT_SHA }}
          # This job never pushes with git.
          persist-credentials: false

      - name: Compute tags
        id: meta
        env:
          LEGION_VERSION: ${{ inputs.legion_version }}
        run: |
          short="${BUILT_SHA::12}"
          tags="${IMAGE}:sha-${short}"
          version_label="sha-$short"
          if [ "$GITHUB_REF" = "refs/heads/main" ] && [ -n "$LEGION_VERSION" ]; then
            tags="${tags}"$'\n'"${IMAGE}:${LEGION_VERSION}"
            version_label="$LEGION_VERSION"
          fi
          {
            echo "built_sha=$BUILT_SHA"
            echo "short=$short"
            echo "version_label=$version_label"
            echo "tags<<EOF"
            echo "$tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: packages/daemon/docker/worker.Dockerfile
          # The OMP fork release ships linux-x64 (and darwin-arm64) only.
          platforms: linux/amd64
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{ steps.meta.outputs.tags }}
          # org.opencontainers.image.source is the Dockerfile's LABEL (the in-repo convention).
          labels: |
            org.opencontainers.image.revision=${{ steps.meta.outputs.built_sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version_label }}
          # The Go `legion` links the built commit (`legion version` names it); the build refuses without it.
          build-args: |
            LEGION_REVISION=${{ steps.meta.outputs.built_sha }}
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}

      - name: Record digest
        id: record
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          test -n "$DIGEST"
          REF="${IMAGE}@${DIGEST}"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          {
            echo "### Worker image"
            echo
            echo "\`$REF\`"
            echo
            echo "Tags:"
            # shellcheck disable=SC2016 # literal backticks and a sed `$` anchor, no expansion wanted
            printf '%s\n' "$TAGS" | sed 's/^/- `/; s/$/`/'
            echo
            echo "Pin \`runtime.kubernetes.image\` to the digest reference above; the daemon refuses a tag."
          } >> "$GITHUB_STEP_SUMMARY"
