name: Tests (closed pull request)

# Cancels a closed pull request's Tests run (pr-and-main.yaml) still waiting or running. This
# workflow joins Tests' concurrency group, tests-<pull request number>, with cancel-in-progress, so
# that Tests run ends `cancelled`, which neither GitHub nor the Legion daemon counts as passing: it
# fails closed, never a skipped pass. No paths filter, because Tests has none.
#
# The group is set at workflow level, and the one job is always skipped. A run whose jobs all skip
# still enters its workflow's group when GitHub creates it, and cancels the older run there. So a
# close takes no runner and posts no required check: main's ruleset requires lint, typecheck, test
# and pr-title, and this job is cancel-tests.
#
# It is a workflow of its own because a `closed` run inside Tests would post skipped lint, typecheck
# and test, which GitHub and the Legion daemon count as passing, at a head another run tested, and
# so could turn a failure there green.
#
# The quick-reopen race, for all four workflows' closed runs: this one cancels Tests, and
# envoy-and-contracts.yaml, docs.yaml and worker-image.yaml cancel their own runs with a `closed`
# run of their own. When a pull request is reopened within about a minute of its close, GitHub can
# create the closed run after the reopened pull request's runs. The closed run then cancels them.
# Tests has no `closed` trigger, so its required checks end `cancelled` and fail closed. Envoy,
# Docs and Worker Image have one, so their closed run's skipped checks stay newest at the head, and
# Worker Image builds no image at that head. To refresh a pull request's runs, push, or wait a
# minute between close and reopen. If a check shows cancelled or skipped after a quick reopen, push
# or reopen again.
on:
  pull_request:
    types: [closed]

concurrency:
  group: tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# The job reads and writes nothing.
permissions: {}

jobs:
  cancel-tests:
    if: ${{ false }}
    runs-on: ubuntu-24.04
    steps:
      - name: Do nothing; joining the group is what cancels the Tests run
        run: "true"
