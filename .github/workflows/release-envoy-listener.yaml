name: Release Envoy Listener

on:
  push:
    branches: [main]
    paths:
      - "packages/envoy/**"
      - "packages/contracts/**"
      - "packages/dispatch/**"
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write


jobs:

  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: true
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - uses: actions/setup-go@v5
        with:
          go-version-file: packages/envoy/go.mod
      - name: Generate Go contracts
        run: bun run gen:go
        working-directory: packages/contracts
      - name: Build envoy binary
        run: |
          mkdir -p out
          GOOS=linux GOARCH=${{ matrix.arch }} go build -buildvcs=false -o out/envoy-listener ./cmd/listener
          tar czf legion-envoy-${{ matrix.arch }}.tar.gz -C out envoy-listener
        working-directory: packages/envoy
      - uses: actions/upload-artifact@v4
        with:
          name: legion-envoy-${{ matrix.arch }}
          path: packages/envoy/legion-envoy-${{ matrix.arch }}.tar.gz

  docker:
    needs: build
    runs-on: ubuntu-24.04
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: actions/setup-go@v5
        with:
          go-version-file: packages/envoy/go.mod
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Generate Go contracts
        run: bun run gen:go
        working-directory: packages/contracts
      - name: Container smoke test (testcontainers)
        run: go test -tags smoke -v -timeout 5m ./internal/smoke/
        working-directory: packages/envoy
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/envoy/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/sjawhar/legion/envoy:${{ github.sha }}

  release:
    # Docker publishes an immutable SHA tag in parallel; this job alone moves latest and release tags.
    needs: [build, docker]
    concurrency:
      group: release-envoy-listener
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          ssh-key: ${{ secrets.DEPLOY_KEY }}
          fetch-depth: 0

      - name: Determine publication
        id: publish
        run: |
          git fetch origin main --tags
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            {
              echo "should_publish=false"
              echo "should_release=false"
            } >> "$GITHUB_OUTPUT"
            echo "::notice title=Superseded publish::A newer commit is already main; its run will publish latest."
            exit 0
          fi

          echo "should_publish=true" >> "$GITHUB_OUTPUT"
          LATEST_TAG=$(git tag -l 'legion-envoy-v*' --sort=-v:refname | head -1)

          if [ -z "$LATEST_TAG" ]; then
            VERSION="0.1.0"
            TAG="legion-envoy-v${VERSION}"
            {
              echo "version=$VERSION"
              echo "tag=$TAG"
              echo "should_release=true"
            } >> "$GITHUB_OUTPUT"
            echo "First release: $TAG"
            exit 0
          fi

          CURRENT="${LATEST_TAG#legion-envoy-v}"
          CURRENT="${CURRENT%%-*}"
          VERSION=$(.github/scripts/release-bump.sh "$CURRENT" "${LATEST_TAG}..HEAD" -- packages/envoy/ packages/contracts/)

          if [ "$VERSION" = "empty" ]; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "No envoy/contracts commits since $LATEST_TAG"
            exit 0
          fi
          if [ "$VERSION" = "none" ]; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=No release published::No version-bumping commits since $LATEST_TAG"
            echo "**No release published** — No version-bumping commits since $LATEST_TAG" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          TAG="legion-envoy-v${VERSION}"
          {
            echo "version=$VERSION"
            echo "tag=$TAG"
            echo "should_release=true"
          } >> "$GITHUB_OUTPUT"
          echo "Bumping $CURRENT → $VERSION"

      - uses: docker/setup-buildx-action@v3
        if: steps.publish.outputs.should_publish == 'true'

      - uses: docker/login-action@v3
        if: steps.publish.outputs.should_publish == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag current main image as latest
        if: steps.publish.outputs.should_publish == 'true'
        env:
          IMAGE: ghcr.io/sjawhar/legion/envoy
          DIGEST: ${{ needs.docker.outputs.digest }}
        run: |
          test -n "$DIGEST"
          docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE@$DIGEST"
      - name: Tag release
        if: steps.publish.outputs.should_release == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.publish.outputs.tag }}"
          git push origin --tags

      - uses: actions/download-artifact@v4
        if: steps.publish.outputs.should_release == 'true'
        with:
          # Skip the *.dockerbuild attestation artifact uploaded automatically
          # by docker/build-push-action. It's not used by the release and has
          # been hanging in Azure blob download (failed both #607 and #608
          # releases). The release only needs the two binary artifacts.
          pattern: legion-envoy-*
      - name: Generate checksums
        if: steps.publish.outputs.should_release == 'true'
        run: |
          for dir in legion-envoy-amd64 legion-envoy-arm64; do
            (cd "$dir" && sha256sum -- * >> ../SHA256SUMS)
          done
      - name: Create GitHub release
        if: steps.publish.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.publish.outputs.tag }}" \
            --title "${{ steps.publish.outputs.tag }}" \
            --notes "Envoy listener release — Go binary + Docker image." \
            ./legion-envoy-amd64/* \
            ./legion-envoy-arm64/* \
            SHA256SUMS
