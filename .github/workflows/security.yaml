name: Security

# Report-only security checks (AGENTC-1305). zizmor audits the workflows and composite actions; on
# a pull request or a merge group only the findings new against the base are judged
# (.github/scripts/zizmor-findings.sh). osv-scanner and govulncheck audit the dependencies. Each
# scanner job ends in one Gate step, the only step that can fail on findings or tool errors, and
# while .github/security-window.json keeps that check report-only (report_only.zizmor for the
# workflows job, report_only.dependencies for the dependencies job) the step runs under
# continue-on-error, so the job concludes success and blocks no merge. A check whose flag is
# anything but true (false, a base file that fails to set it, or no flag at all because the window
# job failed) fails its job on a finding, and the security job's last step fails with it. Installs
# and tool runs record a tool error instead of failing its step.
# The daily scheduled run also runs
# scripts/security-report.sh, whose exit is that run's conclusion: it fails once the report-only
# window has closed while a check is still report-only, and the window watcher reads that off this
# workflow's status badge.
on:
  pull_request:
    types: [opened, reopened, synchronize]
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      decision:
        description: force prints the day-14 decision before the window closes, and fails the run while a check is still report-only
        type: choice
        options: [none, force]
        default: none

permissions:
  contents: read

# GitHub runs `bash --noprofile --norc -eo pipefail {0}` for a shell: bash step, so a failing
# command anywhere in a pipe fails the step; a bare run: without it gets `bash -e`, no pipefail.
defaults:
  run:
    shell: bash

jobs:
  window:
    runs-on: ubuntu-24.04
    outputs:
      base: ${{ steps.flags.outputs.base }}
      zizmor: ${{ steps.flags.outputs.zizmor }}
      dependencies: ${{ steps.flags.outputs.dependencies }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # The base a pull request or merge group is judged against: the merge commit's first parent
      # (main's tip when GitHub built it; pull_request.base.sha does not follow main) or the merge
      # group's base_sha. None on push, schedule and dispatch.
      #
      # One flag per check, from the base's window file on a pull request or merge group and from
      # the tree's own (main's) otherwise, so a promotion takes effect on main from its merge and a
      # pull request cannot make its own check report-only again by editing the file (it can by
      # editing this workflow or its scripts, which its run executes; review catches that). A missing
      # file reads as report-only (a base from before the file landed); a file that is there sets a
      # check report-only only where it says true, and each check it fails to set is blocking; the
      # step summary and an annotation name each problem (.github/scripts/security-run.sh
      # window-flags). A pull request's or merge group's own copy is validated and never obeyed:
      # window-check fails this job on a copy not in its shape, so a malformed file cannot reach
      # main. The base is fetched without a credential, which persist-credentials: false relies on.
      - name: Read the base and the report-only flags
        id: flags
        env:
          EVENT: ${{ github.event_name }}
          MERGE_GROUP_BASE: ${{ github.event.merge_group.base_sha }}
        run: |
          base=$(.github/scripts/security-run.sh base-commit "$EVENT" "$MERGE_GROUP_BASE")
          echo "base=$base" >> "$GITHUB_OUTPUT"
          at=()
          if [ -n "$base" ]; then
            echo "base: $base"
            at=(--at "$base")
          fi
          .github/scripts/security-run.sh window-flags .github/security-window.json "${at[@]}" > flags.txt 2> notes.txt ||
            { cat notes.txt >&2; exit 1; }
          cat flags.txt >> "$GITHUB_OUTPUT"
          {
            echo "## Report-only flags (.github/security-window.json${base:+ at the base, $base})"
            echo
            sed 's/^/- /' flags.txt notes.txt
          } >> "$GITHUB_STEP_SUMMARY"
          cat flags.txt
          sed 's/^/::warning::/' notes.txt
          if [ -n "$base" ] && ! .github/scripts/security-run.sh window-check .github/security-window.json 2> problems.txt; then
            {
              echo
              echo "## This ${EVENT//_/ }'s own .github/security-window.json is not in its shape"
              echo
              sed 's/^/- /' problems.txt
            } >> "$GITHUB_STEP_SUMMARY"
            sed 's/^/::error::/' problems.txt
            exit 1
          fi

  workflows:
    needs: window
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Install uv
        id: uv
        continue-on-error: true
        # check-image-trigger-paths.sh reads a local action only in its ./ form (its $/ form is refused there).
        uses: ./.github/actions/install-uv # zizmor: ignore[self-repository]

      # The input is `.` from the head's root, so every path reads ./.github/…, as the base's do.
      # The token turns on zizmor's online audits (impostor-commit, known-vulnerable-actions,
      # ref-confusion); the base audit gets the same token so both sides run the same audits. On a
      # pull request the head is audited again with --no-ignores, whose extra findings are the ones
      # the tree's ignores suppress (scripts/security-report.sh counts them as ignored).
      - name: Audit workflows (head)
        id: head
        if: steps.uv.outcome == 'success'
        env:
          EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          tool_error=false
          audit() { # audit OUT [ARG…]
            local out=$1 rc
            shift
            set +e
            "$LEGION_TEST_UV" tool run "zizmor@1.30.1" --config .github/zizmor.yml --format=json-v1 "$@" . > "$out"
            rc=$?
            set -e
            echo "zizmor for $out exited $rc"
            case $rc in
              0 | 11 | 12 | 13 | 14) ;;
              *) tool_error=true ;;
            esac
          }
          audit zizmor-head.json
          if [ "$EVENT" = pull_request ]; then
            audit zizmor-no-ignores.json --no-ignores
          fi
          echo "tool_error=$tool_error" >> "$GITHUB_OUTPUT"

      # The base (the window job's) is audited from its own root with the same input `.`, so its
      # paths match the head's; the head's configuration applies to both through an absolute
      # --config. A public repository fetches without a credential, which persist-credentials:
      # false relies on.
      - name: Audit workflows (base)
        id: base
        if: needs.window.outputs.base != '' && steps.head.outputs.tool_error == 'false'
        env:
          BASE_SHA: ${{ needs.window.outputs.base }}
          CONFIG: ${{ github.workspace }}/.github/zizmor.yml
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          git fetch --no-tags --depth=1 origin "$BASE_SHA" &&
            git worktree add --detach "$RUNNER_TEMP/base" "$BASE_SHA" &&
            (cd "$RUNNER_TEMP/base" && "$LEGION_TEST_UV" tool run "zizmor@1.30.1" --config "$CONFIG" --format=json-v1 . > "$GITHUB_WORKSPACE/zizmor-base.json")
          rc=$?
          set -e
          echo "base audit exited $rc"
          case $rc in
            0 | 11 | 12 | 13 | 14) echo tool_error=false >> "$GITHUB_OUTPUT" ;;
            *) echo tool_error=true >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Fingerprint
        id: fingerprint
        if: steps.head.outputs.tool_error == 'false' && (steps.base.outcome == 'skipped' || steps.base.outputs.tool_error == 'false')
        continue-on-error: true
        env:
          EVENT: ${{ github.event_name }}
          WITH_BASE: ${{ steps.base.outcome == 'success' }}
        run: |
          args=(--head zizmor-head.json --out zizmor-findings.json --annotate)
          if [ "$WITH_BASE" = true ]; then
            args+=(--base zizmor-base.json)
          fi
          if [ "$EVENT" = pull_request ]; then
            args+=(--no-ignores zizmor-no-ignores.json)
          fi
          .github/scripts/zizmor-findings.sh "${args[@]}"

      - name: Record tool errors
        if: always()
        env:
          UV: ${{ steps.uv.outcome }}
          HEAD_ERROR: ${{ steps.head.outputs.tool_error }}
          BASE_ERROR: ${{ steps.base.outputs.tool_error }}
          FINGERPRINT: ${{ steps.fingerprint.outcome }}
        run: |
          if [ "$UV" != success ] || [ "$HEAD_ERROR" != false ] || [ "$BASE_ERROR" = true ] || [ "$FINGERPRINT" != success ]; then
            echo '{"tool_error": true, "head_count": null, "new_count": null}' > zizmor-findings.json
            echo "::warning::zizmor did not run to completion (install-uv: $UV; head audit tool error: ${HEAD_ERROR:-not run}; base audit tool error: ${BASE_ERROR:-not run}; fingerprint: $FINGERPRINT)"
          fi

      - name: Upload the findings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: zizmor-findings
          path: zizmor-findings.json

      - name: Gate
        if: always()
        continue-on-error: ${{ needs.window.outputs.zizmor == 'true' }}
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$(jq -r '.tool_error // false' zizmor-findings.json)" = true ]; then
            echo "::error::zizmor recorded a tool error; see the steps above"
            exit 1
          fi
          case $EVENT in
            pull_request | merge_group) count=$(jq -r .new_count zizmor-findings.json) what="new against the base" ;;
            *) count=$(jq -r .head_count zizmor-findings.json) what="on this tree" ;;
          esac
          echo "zizmor: $count findings $what"
          if [ "$count" -ne 0 ]; then
            echo "::error::zizmor: $count findings $what"
            exit 1
          fi

  dependencies:
    needs: window
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up Go
        id: go
        continue-on-error: true
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: packages/envoy/go.mod
          cache: false

      - name: Install scanners
        id: tools
        if: steps.go.outcome == 'success'
        continue-on-error: true
        run: |
          go install github.com/google/osv-scanner/v2/cmd/osv-scanner@v2.6.0
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0

      # Reads bun.lock and both go.mod files; exit 1 means vulnerabilities were found.
      - name: osv-scanner
        id: osv
        if: steps.tools.outcome == 'success'
        run: |
          set +e
          osv-scanner scan source --recursive --format json --output-file osv.json .
          rc=$?
          set -e
          echo "osv-scanner exited $rc"
          case $rc in
            0 | 1) echo tool_error=false >> "$GITHUB_OUTPUT" ;;
            *) echo tool_error=true >> "$GITHUB_OUTPUT" ;;
          esac

      # -format json exits 0 whatever it finds; .github/scripts/security-run.sh reads a finding
      # whose trace[0] names a function as reachable, and module- and package-level ones as
      # informational.
      - name: govulncheck
        id: govulncheck
        if: steps.tools.outcome == 'success'
        run: |
          tool_error=false
          for module in envoy daemon-go; do
            if ! govulncheck -C "packages/$module" -format json ./... > "govulncheck-$module.json"; then
              echo "::warning::govulncheck failed in packages/$module"
              tool_error=true
            fi
          done
          echo "tool_error=$tool_error" >> "$GITHUB_OUTPUT"

      # A scanner that did not run to completion, or wrote output not in its shape, is a tool
      # error for its half (.github/scripts/security-run.sh summarize).
      - name: Summarize
        if: always()
        env:
          OSV_ERROR: ${{ steps.osv.outputs.tool_error }}
          GOVULNCHECK_ERROR: ${{ steps.govulncheck.outputs.tool_error }}
        run: |
          args=(--out deps-summary.json)
          if [ "$OSV_ERROR" = false ]; then
            args+=(--osv osv.json)
          fi
          if [ "$GOVULNCHECK_ERROR" = false ]; then
            args+=(--govulncheck govulncheck-envoy.json --govulncheck govulncheck-daemon-go.json)
          fi
          .github/scripts/security-run.sh summarize "${args[@]}"
          cat deps-summary.json

      - name: Upload the summary
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: deps-summary
          path: deps-summary.json

      - name: Gate
        if: always()
        continue-on-error: ${{ needs.window.outputs.dependencies == 'true' }}
        run: |
          if ! jq -e '(.osv.tool_error or .govulncheck.tool_error) | not' deps-summary.json > /dev/null; then
            echo "::error::a dependency scanner recorded a tool error; see the steps above"
            exit 1
          fi
          with_fix=$(jq -r .osv.with_fix deps-summary.json)
          reachable=$(jq -r .govulncheck.reachable deps-summary.json)
          echo "osv-scanner: $with_fix vulnerabilities with a fixed version; govulncheck: $reachable reachable"
          if [ "$with_fix" -ne 0 ] || [ "$reachable" -ne 0 ]; then
            echo "::error::$with_fix osv-scanner vulnerabilities with a fixed version, $reachable reachable govulncheck findings"
            exit 1
          fi

  security:
    needs: [window, workflows, dependencies]
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      pull-requests: read
      security-events: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Download the zizmor findings
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: zizmor-findings
          path: artifacts

      - name: Download the dependency summary
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: deps-summary
          path: artifacts

      # A missing or malformed artifact records a tool error for that half, never a clean run
      # (.github/scripts/security-run.sh report).
      - name: Build the report
        id: report
        env:
          RUN_ID: ${{ github.run_id }}
          EVENT: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE_SHA: ${{ needs.window.outputs.base }}
          ZIZMOR_REPORT_ONLY: ${{ needs.window.outputs.zizmor }}
          DEPENDENCIES_REPORT_ONLY: ${{ needs.window.outputs.dependencies }}
          WINDOW_RESULT: ${{ needs.window.result }}
          WORKFLOWS_RESULT: ${{ needs.workflows.result }}
          DEPENDENCIES_RESULT: ${{ needs.dependencies.result }}
        run: |
          .github/scripts/security-run.sh report --zizmor artifacts/zizmor-findings.json \
            --deps artifacts/deps-summary.json --run-id "$RUN_ID" --event "$EVENT" --head "$HEAD_SHA" \
            --base "$BASE_SHA" --report-only-zizmor "$ZIZMOR_REPORT_ONLY" \
            --report-only-dependencies "$DEPENDENCIES_REPORT_ONLY" --window "$WINDOW_RESULT" \
            --workflows "$WORKFLOWS_RESULT" --dependencies "$DEPENDENCIES_RESULT" --out security-report.json \
            >> "$GITHUB_STEP_SUMMARY"
          cat security-report.json
          {
            echo "zizmor_tool_error=$(jq -r .zizmor.tool_error security-report.json)"
            echo "dependencies_tool_error=$(jq -r '.osv.tool_error or .govulncheck.tool_error' security-report.json)"
            echo "zizmor_new=$(jq -r '.zizmor.new_count // 0' security-report.json)"
          } >> "$GITHUB_OUTPUT"

      - name: Upload the report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: security-report
          path: security-report.json

      # Markers scripts/security-report.sh lists by name, so the window's report reads a handful
      # of artifacts rather than one per run: a zizmor tool error drops the run from rule 1b, a
      # dependency scanner's counts toward rule 2.
      - name: Mark a zizmor tool error
        if: steps.report.outputs.zizmor_tool_error == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: zizmor-tool-error
          path: security-report.json

      - name: Mark a dependency scanner tool error
        if: steps.report.outputs.dependencies_tool_error == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dependencies-tool-error
          path: security-report.json

      - name: Mark new zizmor findings
        if: github.event_name == 'pull_request' && steps.report.outputs.zizmor_new != '0'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: zizmor-new
          path: artifacts/zizmor-findings.json

      - name: Report and decide
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          DECISION: ${{ inputs.decision || 'none' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/security-report.sh --repo "$GITHUB_REPOSITORY" --decision "$DECISION" | tee -a "$GITHUB_STEP_SUMMARY"
          exit "${PIPESTATUS[0]}"

      # The step that fails this job on a promoted check's finding: a check whose flag is false is
      # blocking, and its job's failure fails this job too, so a ruleset that requires `security`
      # refuses what a promoted check found. It also fails when the window job did not succeed, since
      # then neither scanner job ran, and on a flag the window job never produced. While a check is
      # report-only its job concludes success and this step passes it by
      # (.github/scripts/security-run.sh enforce).
      - name: Enforce the promoted checks
        if: always() && steps.report.outcome == 'success'
        run: .github/scripts/security-run.sh enforce security-report.json
