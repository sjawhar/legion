name: Mirror Images

# Copies every image .github/ci-images.yaml names into ghcr.io/sjawhar/legion/ci, so no CI job
# fetches an image from a third-party registry (dispatch://INFRA-567). The copy itself is
# .github/scripts/mirror-ci-images.sh, whose header says what it does per row.
#
# A branch run of this workflow can write the package, and the digest is what makes that safe:
# every consuming reference names a digest, so a push can add bytes to the package but can never
# change the bytes a job pulls. .github/scripts/check-ci-images.sh refuses a consumer that names a
# tag, a registry that is not this package, or a digest this file does not hold.
#
# This workflow runs on a push to main and on a `workflow_dispatch`. It has no `pull_request`
# trigger: ci.yaml's ci-images job runs the same script on a pull request, and then runs the gate
# that reads the package. A pull request that adds a row needs that order, because the gate
# answers 404 for a row the package does not hold yet. Two runs of the copy in one event would
# race instead.

on:
  push:
    branches: [main]
    paths:
      - .github/ci-images.yaml
      - .github/workflows/mirror-images.yaml
      - .github/actions/install-crane/action.yml
      - .github/scripts/mirror-ci-images.sh
  workflow_dispatch:

permissions:
  contents: read
  packages: write # ghcr.io push

jobs:
  mirror:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/install-crane

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Copy every image the package does not hold
        run: .github/scripts/mirror-ci-images.sh
