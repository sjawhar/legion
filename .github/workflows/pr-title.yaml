name: PR Title

# This job lives apart from the Tests workflow on purpose (LEGION-90). It is the only job that
# needs the `edited` event (a renamed pull request must be re-checked), and putting it in Tests
# made every body edit — a pull request body is edited several times per Legion round — re-run
# lint, typecheck and test at an unchanged head. `synchronize` stays because a required check
# needs a run at every head.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

# A new push to a pull request cancels this workflow's still-running check for that pull
# request; this workflow has no other trigger, so github.ref is always a pull request's
# refs/pull/<N>/merge here. The group key still branches on event name (matching the other
# workflows' pattern) rather than hardcoding github.ref, since GitHub cancels a group's
# previously *queued* run whenever a newer one joins regardless of cancel-in-progress
# (https://docs.github.com/en/actions/concepts/workflows-and-actions/concurrency), which would
# silently drop a run if this workflow ever gained a push/merge_group trigger sharing one ref.
concurrency:
  group: pr-title-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The job clones the repository for check-pr-text.sh and reads the pull request's commits through
# the API; it writes nothing.
permissions: {}

jobs:
  pr-title:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # The title, body and commit messages are as public as the tree (check-pr-text.sh says
      # where each lands). The required lint job checks them at every push; this step checks an
      # edit. Both steps read the event payload rather than an `env:` block, which the runner
      # prints in the job log.
      - name: Check the title, body, branch name and commits name nothing private
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/check-pr-text.sh

      - name: Require a conventional PR title
        run: |
          if jq -r '.pull_request.title' "$GITHUB_EVENT_PATH" | grep -qE '^[a-z]+(\([^)]+\))?!?: .+'; then
            echo "PR title is conventional"
          else
            echo "::error::PR title must be a conventional commit subject (type(scope): summary). Squash merges use the PR title as the commit subject, and the release workflows version from conventional subjects — a non-conventional title makes the release pipelines rely on the squash body alone."
            exit 1
          fi
