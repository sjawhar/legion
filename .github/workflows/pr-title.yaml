name: PR Title

# Checks that a pull request's title, body, branch name, commits, comments and reviews name
# nothing private and that its title is a conventional commit subject (check-pr-text.sh). It lives
# apart from the lint, typecheck and test jobs of ci.yaml (LEGION-90) so that an edit, which a
# Legion round makes several times, does not re-run them at an unchanged head. An edit (title or
# body) of the pull request runs it, draft or not, and so does a review submitted or edited;
# those two events are all it runs on. Each run reports `pr-title` on the pull request's head,
# which main's ruleset requires, as the job's own check run: the job is named for the check, and
# this workflow holds no `checks: write`.
#
# What it no longer runs on, and why. A check run posted with `POST /repos/.../check-runs` under
# GITHUB_TOKEN joins the Actions App's first check suite at that commit, not the suite of the run
# that posted it: measured on probe branch probe/infra1066-ciok at 365e2766, where the posting job
# ran in suite 114285918850 and the check run it created landed in 114285918626, the other
# workflow's suite. On pull request #2847 that rule put ci.yaml's `ci-ok` into this workflow's
# suite (114222733751 against CI's 114222734375, created in the same second), the rollup reported
# the required `ci-ok` under workflow "PR Title", and the merge queue refused to enqueue with
# `Required status check "ci-ok" is expected`. So CI's suite must be the only github-actions check
# suite at a head ci.yaml runs on, and this workflow gives up two of its triggers:
#   * no merge_group. ci.yaml's lint job runs on the group, checks the queued pull request's text
#     there (it finds the pull request the group's branch names with find-pr-payload.sh, the
#     script both workflows find their payload with) and posts `pr-title` on the group's commit
#     from a runner it already holds. The queue needs that report: a required check that does not
#     report on the merge group fails the group ("The merge will fail as the required status check
#     will not be reported",
#     https://docs.github.com/en/repositories/configuring-branches-and-merges-in-your-repository/configuring-pull-request-merges/managing-a-merge-queue#triggering-merge-group-checks-with-github-actions).
#   * no `opened` and no `reopened`. ci.yaml runs on both, and its lint job checks the same text
#     and posts `pr-title` on the same head, so a run here reports that verdict a second time and
#     its suite can be the older one at that head, which is how #2847 lost its `ci-ok`. The
#     trigger goes rather than the job, because a job-level `if:` would not have helped: GitHub
#     creates the run, and its check suite, before it reads one. At the draft heads f5fc75a0 and
#     e26c2054, where every job of ci.yaml is skipped, that run still holds a suite of 30 skipped
#     check runs (114131780811 and 113923512090) — a skipped job is a suite all the same.
# What that costs is a fork's pull request, which gets no `pr-title` until somebody edits it or
# reviews it, and that costs nothing that could have merged: a fork's GITHUB_TOKEN is read-only,
# so ci.yaml's `ci-ok` post fails there and lint's `pr-title` post is guarded off, and a fork's
# change reaches the merge queue only once a maintainer takes the branch into this repository,
# where every event is same-repo again.
#
# `edited` and `pull_request_review` stay for every head: ci.yaml runs on neither, so nothing else
# checks the text an edit or a review brings. They leave one race, and nothing here closes it: an
# edit or a review in the seconds before CI's suite exists at that head — a title edited the
# moment the pull request opens — makes this workflow's suite the older at that commit, and the
# CI run's `ci-ok` lands in it.
#
# A push starts no run here: ci.yaml's lint job, which runs at every push to a pull request that is
# not a draft and when a draft is marked ready, runs the same check and posts `pr-title` on the
# new head itself, from a runner it already holds (a job of this workflow at every push waited for
# a runner of its own; ci.yaml's header says why that matters). A draft's new head has no
# `pr-title` until it is marked ready or edited, and a draft cannot merge. Comments and review
# comments start no run of their own: GitHub leaves those events' checks out of a pull request's
# checks, an inline comment posted alone arrives with a review event that does run, and every run
# reads every comment, as ci.yaml's lint job does. A newer run that cancels an older one loses
# nothing, since it repeats every check on the title and body as they now are. Anyone signed in
# can review a public pull request, so check-pr-text.sh, not an `if:`, decides whose text counts:
# a skipped job posts a `pr-title` that GitHub and the daemon (classify.RunResult) count as a
# pass, so a skipped run would turn a real failure green. The job carries no `if:` at all.
on:
  pull_request:
    types: [edited]
  pull_request_review:
    types: [submitted, edited]

# A run cancels the run before it of the same pull request and event, so a pull request holds at
# most one running and one pending PR Title run per event however many edits and reviews arrive.
# Nothing is lost: each run reads the title, body, comments and reviews as they are when it runs,
# and the commits of the head its event names, so the newest repeats every check of the runs it
# cancels. The event is in the group because GitHub lists a pull request's checks once per check
# name and event (as `gh pr checks` does): a review run that cancelled a pull_request run would
# leave that event's latest `pr-title` cancelled on the head until the next push or edit. A review
# run checks with main's copy of check-pr-text.sh; the required lint job checks a pull request that
# changes it with
# its own copy (ci.yaml says when that job runs: at every push to a pull request that is not a
# draft, when a draft is marked ready, and on the merge queue's group). Every event here carries
# the pull request, so its number is the whole key.
concurrency:
  group: pr-title-${{ github.event_name }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# The job clones the repository for check-pr-text.sh, which reads the pull request's commits
# through the compare route (`contents: read`), its reviews and review comments
# (`pull-requests: read`), and its issue comments (`issues: read`); it writes nothing.
permissions: {}

jobs:
  pr-title:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      # A review run checks out the default branch, so the script it runs is
      # main's, never the pull request's: a pull_request_review run would otherwise check out the
      # pull request's merge ref, which is its GITHUB_REF. A pull_request run checks out that merge
      # ref as the required lint job does, so a pull request that changes the script is checked by
      # its own version.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name != 'pull_request' && github.event.repository.default_branch || '' }}
          persist-credentials: false

      # The payload the check below reads, as a file: find-pr-payload.sh's answer. For every event
      # this workflow runs on that is the run's own payload, since each of them carries the pull
      # request; the script's other half, which reads the pull request a merge group's queue branch
      # names, is what ci.yaml's lint job calls it for. One script, so the two workflows cannot
      # drift over what they check a queued pull request's text against.
      - name: Find the pull request payload
        id: payload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          path=$(.github/scripts/find-pr-payload.sh)
          echo "path=$path" >> "$GITHUB_OUTPUT"

      # The title, body, commit messages, comments and reviews are as public as the tree
      # (check-pr-text.sh says where each lands), and the title must be a conventional commit
      # subject. ci.yaml's lint job checks them too (that file says when it runs); this step checks
      # them at every event above, an edit and a review alike: a review run reports `pr-title` on
      # the head too, and one that skipped the title would post a passing `pr-title` over a failed
      # one. The step reads the payload file rather than an `env:` block,
      # which the runner prints in the job log; only its path is in `env:`. A workflow `env:` cannot
      # override a GITHUB_* variable, so the shell sets GITHUB_EVENT_PATH for the script.
      - name: Check the title, body, branch name, commits, comments and reviews
        env:
          GH_TOKEN: ${{ github.token }}
          PAYLOAD: ${{ steps.payload.outputs.path }}
        run: GITHUB_EVENT_PATH="$PAYLOAD" .github/scripts/check-pr-text.sh
