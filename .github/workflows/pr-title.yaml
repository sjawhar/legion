name: PR Title

# Checks that a pull request's title, body, branch name, commits, comments and reviews name
# nothing private (check-pr-text.sh) and that its title is a conventional commit subject. It lives
# apart from the Tests workflow (LEGION-90) so that an edit, which a Legion round makes several
# times, does not re-run lint, typecheck and test at an unchanged head. A push, open, reopen or
# edit (title or body) of the pull request runs it, and so does a review submitted or edited; each
# run reports `pr-title` on the pull request's head, which main's ruleset requires. Comments and
# review comments start no run of their own: GitHub leaves those events' checks out of a pull
# request's checks, an inline comment posted alone arrives with a review event that does run, and
# every run, like the required lint job at each push, reads every comment. A newer pull_request
# run that cancels an older one loses nothing, since it repeats every check on the title and body
# as they now are. Anyone signed in can review a public pull request, so check-pr-text.sh, not an
# `if:`, decides whose text counts: a skipped job posts a `pr-title` that GitHub and the daemon
# (classify.RunResult) count as a pass, so a skipped run would turn a real failure green.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
  pull_request_review:
    types: [submitted, edited]

# A pull_request event cancels this workflow's still-running run for the same pull request (its
# merge ref), as the other three workflows' blocks do. A review run never cancels or is cancelled:
# two reviews submitted together each get a run that reads every comment and review, and a
# cancelled run would leave a cancelled required check on the head.
concurrency:
  group: pr-title-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The job clones the repository for check-pr-text.sh, which reads the pull request's commits
# through the compare route (`contents: read`), its reviews and review comments
# (`pull-requests: read`), and its issue comments (`issues: read`); it writes nothing.
permissions: {}

jobs:
  pr-title:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      # A review run checks out the default branch, so the script it runs is main's, never the
      # pull request's: a pull_request_review run would otherwise check out the pull request's
      # merge ref, which is its GITHUB_REF. A pull_request run checks out that merge ref as the
      # required lint job does, so a pull request that changes the script is checked by its own
      # version.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name != 'pull_request' && github.event.repository.default_branch || '' }}
          persist-credentials: false

      # The title, body, commit messages, comments and reviews are as public as the tree
      # (check-pr-text.sh says where each lands). The required lint job checks them at every
      # push; this step checks an edit or a review. Both steps read the event payload rather than
      # an `env:` block, which the runner prints in the job log.
      - name: Check the title, body, branch name, commits, comments and reviews name nothing private
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/check-pr-text.sh

      # Every run checks the title, since a review run reports `pr-title` on the head too and a
      # run that skipped it would post a passing `pr-title` over a failed one.
      - name: Require a conventional PR title
        run: |
          if jq -r '.pull_request.title' "$GITHUB_EVENT_PATH" | grep -qE '^[a-z]+(\([^)]+\))?!?: .+'; then
            echo "PR title is conventional"
          else
            echo "::error::PR title must be a conventional commit subject (type(scope): summary). Squash merges use the PR title as the commit subject, and the release workflows version from conventional subjects — a non-conventional title makes the release pipelines rely on the squash body alone."
            exit 1
          fi
