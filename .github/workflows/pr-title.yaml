name: PR Title

# Checks that a pull request's title, body, branch name, commits, comments and reviews name
# nothing private (check-pr-text.sh) and that its title is a conventional commit subject. It lives
# apart from the Tests workflow (LEGION-90) so that an edit, which a Legion round makes several
# times, does not re-run lint, typecheck and test at an unchanged head. A push, open, reopen or
# edit (title or body) of the pull request runs it, and each run reports `pr-title` on the pull
# request's head, which main's ruleset requires. A review or comment starts no run here: GitHub's
# merge reads the newest `pr-title` of every event it evaluates, and a review run would leave the
# required check pending behind the Actions queue after every approval, though the title and body
# had not changed. pr-public-text.yaml scans the comments and reviews when one is posted, edited or
# deleted, as a `public-text` status that no ruleset requires; every run here, like the lint job at
# each push, reads every comment and review too. A newer run that cancels an older one loses
# nothing, since it repeats every check on the title and body as they now are.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

# A run cancels the run before it of the same pull request, so a pull request holds at most one
# running and one pending PR Title run however many edits and pushes arrive. Nothing is lost: each
# run checks the title and body its event names and reads the commits, comments and reviews live,
# so the newest repeats every check of the runs it cancels.
concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# The job clones the repository for check-pr-text.sh, which reads the pull request's commits
# through the compare route (`contents: read`), its reviews and review comments
# (`pull-requests: read`), and its issue comments (`issues: read`); it writes nothing.
permissions: {}

jobs:
  pr-title:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      # The pull request's merge ref, as the required lint job checks out, so a pull request that
      # changes check-pr-text.sh is checked by its own version.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The title, body, commit messages, comments and reviews are as public as the tree
      # (check-pr-text.sh says where each lands). The required lint job checks them at every
      # push; this step checks an edit. Both steps read the event payload rather than an `env:`
      # block, which the runner prints in the job log.
      - name: Check the title, body, branch name, commits, comments and reviews name nothing private
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/check-pr-text.sh

      - name: Require a conventional PR title
        run: |
          if jq -r '.pull_request.title' "$GITHUB_EVENT_PATH" | grep -qE '^[a-z]+(\([^)]+\))?!?: .+'; then
            echo "PR title is conventional"
          else
            echo "::error::PR title must be a conventional commit subject (type(scope): summary). Squash merges use the PR title as the commit subject, and the release workflows version from conventional subjects — a non-conventional title makes the release pipelines rely on the squash body alone."
            exit 1
          fi
