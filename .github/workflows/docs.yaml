name: Docs

# Builds the documentation site (docs/site) on every pull request that could change it, and
# publishes it to GitHub Pages (https://sjawhar.github.io/legion/) on every push to main. The site's
# reference pages are generated from packages/ and skills/ at build time, so those paths rebuild it.
on:
  push:
    branches: [main]
    paths:
      - "docs/site/**"
      - "packages/**"
      - "skills/**"
      - ".github/workflows/docs.yaml"
  pull_request:
    paths:
      - "docs/site/**"
      - "packages/**"
      - "skills/**"
      - ".github/workflows/docs.yaml"

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Read-only: no job here writes to the repository, a registry or the API. The token clones,
# downloads pinned tools, and, where a job calls dorny/paths-filter, reads the pull request's
# file list, which this public repository serves without `pull-requests: read`.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    # The screenshots step boots Dispatch on the e2e harness, which needs a database it may
    # truncate.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      # Astro runs on Node.js (22.12 or newer).
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      # docs/site/scripts/build-binaries.sh builds the Go binaries the reference generators run, and
      # the screenshots step builds the Dispatch server; both modules name the same Go.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/daemon/go.mod
          cache-dependency-path: |
            packages/daemon/go.sum
            packages/envoy/go.sum
      - run: bun install --frozen-lockfile
      - name: Lint the docs site
        run: bun run lint
        working-directory: docs/site
      - name: Typecheck the docs site
        run: bun run typecheck
        working-directory: docs/site
      # The pages' screenshots are made, not committed (docs/site/media/README.md): Dispatch on
      # the e2e harness, seeded with example data, captured in Chromium.
      - name: Build the Dispatch dashboard the screenshots show
        run: bun run build:web
        working-directory: packages/dispatch
      - name: Install Playwright Chromium
        # The runner image's chrome-stable apt source intermittently fails `apt-get update`, which
        # takes `--with-deps` down with it; Chrome itself is preinstalled, so the source goes.
        run: |
          grep -rl dl.google.com /etc/apt/sources.list.d | xargs -r sudo rm -f
          bunx playwright install --with-deps chromium
        working-directory: docs/site
      - name: Take the screenshots
        run: bun run docs:media
        # A step of the run that hangs fails it within two minutes (STEP_TIMEOUT_MS in
        # docs/site/media/harness.ts); this bounds the rest, the build and the boot.
        timeout-minutes: 15
        env:
          DATABASE_URL: postgres://postgres:ci@localhost:5432/postgres?sslmode=disable
      # What each failed shot's page showed, and the harness's process logs: a hang leaves the
      # Dispatch server's goroutines at the end of dispatch.log.
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-failed-shots-${{ github.run_attempt }}
          path: |
            docs/site/media/.work/failed-shots
            docs/site/media/.work/harness
          if-no-files-found: ignore
      # Generates the reference pages, then builds the site; starlight-links-validator fails it on a
      # broken internal link.
      - name: Build the docs site
        run: bun run docs:build
      - if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/site/dist

  deploy:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-24.04
    # One deployment at a time, and a queued one is never cancelled half-way.
    concurrency:
      group: pages
      cancel-in-progress: false
    # Publishes the built site to GitHub Pages: pages: write performs the deployment, id-token:
    # write is the OIDC token actions/deploy-pages exchanges for it.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
