            npm publish ./*.tgz --access public --provenance
          fi
        working-directory: packages/envoy-plugin

      - name: Commit and tag
        if: steps.version.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          .github/scripts/release-push.sh tag packages/envoy-plugin \
            "chore: release envoy-plugin v$VERSION [skip ci]" \
            "opencode-legion-envoy-v$VERSION"

      - name: Create GitHub release
        if: steps.version.outputs.skip != 'true'
