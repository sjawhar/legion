name: Release Packages

on:
  push:
    branches: [main]
    paths:
      - "package.json"
      - "bun.lock"
      - "patches/**"
      - "packages/contracts/package.json"
      - "packages/envoy-client/package.json"
      - "packages/pi-envoy/package.json"
      - "packages/envoy-plugin/package.json"
      - "packages/claude-envoy/package.json"
      - "packages/proof-editor/package.json"
      - "packages/dispatch/package.json"
      - "packages/envoy/internal/dispatch/pmdoc/gen/package.json"
      - "docs/site/package.json"
      - "packages/daemon/**"
      - "go.work"
      - "go.work.sum"
      - "packages/envoy/**"
      - "packages/envoy-plugin/**"
      - "packages/envoy-client/**"
      - "packages/contracts/**"
      - "packages/pi-envoy/**"
      - "skills/**"
      # The worker image's remaining inputs (worker_image below).
      - ".omp-pin"
      - ".dockerignore"
      - ".github/workflows/worker-image.yaml"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-24.04
    # Job-level permissions replace the workflow's: the checkout, and the run list the base step
    # reads.
    permissions:
      contents: read
      actions: read
    outputs:
      legion: ${{ steps.filter.outputs.legion }}
      envoy_plugin: ${{ steps.filter.outputs.envoy_plugin }}
      pi_envoy: ${{ steps.filter.outputs.pi_envoy }}
      worker_image: ${{ steps.filter.outputs.worker_image }}
    steps:
      # Full history, for the base step's ancestry check.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # The filters compare against the commit the last successful run of this workflow on main
      # checked out, not against the push's own before-sha. GitHub keeps one pending run per
      # concurrency group and cancels it when a newer push queues behind it, and a run can fail
      # after releasing some packages and before others; comparing against the push alone would
      # leave those commits to no run. Every job versions from its package's last tag, so a commit
      # two ranges hold releases once. The range also holds the version-bump commits
      # (`[skip ci]`) that run pushed after its checkout: after each npm release, the next run
      # starts that package's job, which finds nothing since its tag and skips, and builds a
      # sha- worker image.
      #
      # Only push and workflow_dispatch runs count: only the repository's writers create those,
      # and a fork's pull request run can carry a branch named main and a commit of the fork's
      # choosing. The base must also be in this commit's history. The lookup reads this run's own
      # workflow, so a renamed file reads its own runs, and a workflow_dispatch skips it and the
      # filters, since every job runs on a dispatch; a dispatch on main is how a renamed workflow
      # gets its first base.
      - name: Find the commit the last successful run checked out
        id: base
        if: github.event_name != 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          workflow=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .workflow_id)
          newest() {
            gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?branch=main&event=$1&status=success&per_page=1" \
              --jq '.workflow_runs[] | "\(.created_at) \(.head_sha)"'
          }
          sha=$({ newest push; newest workflow_dispatch; } | sort -r | awk 'NR == 1 { print $2 }')
          if [ -z "$sha" ]; then
            echo "::error::No successful push or workflow_dispatch run of this workflow on main to compare against; run it once with workflow_dispatch on main"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$sha" HEAD; then
            echo "::error::$sha, the commit the last successful run checked out, is not in the history of $GITHUB_SHA"
            exit 1
          fi
          echo "Changes since $sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          base: ${{ steps.base.outputs.sha }}
          filters: |
            # The Go `legion` the legion job releases and worker.Dockerfile's go stage compiles: its
            # module, the modules go.work binds it to (packages/envoy is also copied whole into the
            # image for the agent-secrets binary it builds, AGENTC-393), and the role prompts every
            # release archive carries beside the binary.
            legion:
              - 'packages/daemon/**'
              - 'go.work'
              - 'go.work.sum'
              - 'packages/envoy/**'
              - 'packages/pi-envoy/roles/**'
            envoy_plugin:
              - 'packages/envoy-plugin/**'
              - 'packages/envoy-client/**'
              - 'packages/contracts/**'
              - 'skills/**'
            pi_envoy:
              - 'packages/pi-envoy/**'
              - 'packages/envoy-client/**'
              - 'packages/contracts/**'
              - 'skills/**'
            # The plugin stage's frozen install needs the root manifest, lockfile, patches, and each
            # root-workspace manifest. Keep this explicit because a workspace can affect Bun's
            # install without its source becoming part of the worker image. The OMP pin, the
            # context's .dockerignore and the called workflow change the image too. With legion
            # (which holds the Dockerfile, packages/daemon/docker) and pi_envoy this covers every
            # file worker.Dockerfile builds from; .github/scripts/check-image-trigger-paths.sh fails
            # the build when it misses one.
            worker_image:
              - 'package.json'
              - 'bun.lock'
              - 'patches/**'
              - 'packages/contracts/package.json'
              - 'packages/envoy-client/package.json'
              - 'packages/pi-envoy/package.json'
              - 'packages/envoy-plugin/package.json'
              - 'packages/claude-envoy/package.json'
              - 'packages/proof-editor/package.json'
              - 'packages/dispatch/package.json'
              - 'packages/envoy/internal/dispatch/pmdoc/gen/package.json'
              - 'docs/site/package.json'
              - '.omp-pin'
              - '.dockerignore'
              - '.github/workflows/worker-image.yaml'

  # The Go `legion`: linux and darwin archives of the binary with the role prompts it reads beside
  # itself (role-prompts/, which a standalone `legion` needs unless LEGION_ROLE_PROMPTS_DIR names
  # another bundle), on a legion-v* tag of the commit the run checked out. Nothing is committed: a
  # Go module carries no version file, so the tag alone records the version, and `legion version`
  # names it. Only main releases one: a workflow_dispatch from another branch skips this job, and the
  # worker image job below then publishes that commit's sha- tag alone, as it does for any branch.
  legion:
    needs: changes
    if: >-
      github.ref == 'refs/heads/main' &&
      (needs.changes.outputs.legion == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    # The workflow's own grants, plus the attestations API for the archives' provenance below
    # (id-token is already one of them: it is the Sigstore signing certificate's OIDC token).
    permissions:
      contents: write
      id-token: write
      attestations: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      release_tag: ${{ steps.version.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          ssh-key: ${{ secrets.DEPLOY_KEY }}
          fetch-depth: 0
      - name: Determine next version
        id: version
        run: |
          PREV_TAG=$(git tag -l 'legion-v*' --sort=-v:refname | head -1)
          if [ -z "$PREV_TAG" ]; then
            # The first Go release continues the version line of the TypeScript CLI it replaces
            # (cli-v*), counting the Go module's commits since that CLI's last release.
            PREV_TAG=$(git tag -l 'cli-v*' --sort=-v:refname | head -1)
            test -n "$PREV_TAG"
            PREV_VERSION="${PREV_TAG#cli-v}"
          else
            PREV_VERSION="${PREV_TAG#legion-v}"
          fi
          # The role prompts ship as runtime: packages/pi-envoy/roles is each archive's role-prompts/,
          # and the binary embeds internal/prompts/go, so a docs: commit to either still releases.
          # release-bump.sh reads a --patch-path only when it is also one of the paths after --.
          VERSION=$(.github/scripts/release-bump.sh "$PREV_VERSION" "${PREV_TAG}..HEAD" \
            --patch-path packages/pi-envoy/roles/ --patch-path packages/daemon/internal/prompts/go/ \
            -- packages/daemon/ packages/pi-envoy/roles/ packages/daemon/internal/prompts/go/)

          if [ "$VERSION" = "empty" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "No commits in packages/daemon/ or packages/pi-envoy/roles/ since $PREV_TAG"
            exit 0
          fi
          if [ "$VERSION" = "none" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=No release published::No version-bumping commits since $PREV_TAG"
            echo "**No release published** — No version-bumping commits since $PREV_TAG" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          {
            echo "version=$VERSION"
            echo "release_tag=legion-v${VERSION}"
            echo "skip=false"
          } >> "$GITHUB_OUTPUT"
          echo "Bumping $PREV_TAG -> legion-v${VERSION}"
      - uses: actions/setup-go@v5
        if: steps.version.outputs.skip != 'true'
        with:
          go-version-file: packages/daemon/go.mod
          cache-dependency-path: |
            packages/daemon/go.sum
            packages/envoy/go.sum
      # CGO_ENABLED=0: a static binary, as the worker image builds it, so a linux archive runs on any
      # distribution. Each archive holds one top-level directory, legion-<os>-<arch>, with `legion`
      # and `role-prompts/` in it: mise's github backend strips that one directory, leaving the
      # binary beside its prompts.
      - name: Build legion
        if: steps.version.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p out assets
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os=${target%/*}
            arch=${target#*/}
            dir="legion-$os-$arch"
            mkdir -p "out/$dir"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go -C packages/daemon build -buildvcs=false \
              -ldflags "-X main.revision=$GITHUB_SHA -X main.release=v$VERSION" \
              -o "$GITHUB_WORKSPACE/out/$dir/legion" ./cmd/legion
            cp -R packages/pi-envoy/roles "out/$dir/role-prompts"
            tar czf "assets/$dir.tar.gz" -C out "$dir"
          done
          (cd assets && sha256sum -- * > SHA256SUMS)
      - name: Smoke test
        if: steps.version.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          version=$(out/legion-linux-amd64/legion version)
          echo "$version"
          test "$version" = "legion v$VERSION commit $GITHUB_SHA"
      # Build provenance for the archives a mise pin installs, so `gh attestation verify
      # legion-<os>-<arch>.tar.gz --repo sjawhar/legion` checks a downloaded asset against this
      # workflow run rather than against SHA256SUMS, which sits in the same mutable release. The
      # release below uploads these exact files.
      - uses: actions/attest-build-provenance@v4
        if: steps.version.outputs.skip != 'true'
        with:
          subject-path: assets/legion-*.tar.gz
      - name: Tag release
        if: steps.version.outputs.skip != 'true'
        env:
          TAG: ${{ steps.version.outputs.release_tag }}
        run: |
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            test "$(git rev-list -n 1 "$TAG")" = "$GITHUB_SHA"
            exit 0
          fi
          git tag "$TAG"
          git push origin "refs/tags/$TAG"
      - name: Create GitHub release
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.release_tag }}
        run: |
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release $TAG already exists; reusing it"
          else
            gh release create "$TAG" \
              assets/* \
              --repo "${{ github.repository }}" \
              --title "legion v${{ steps.version.outputs.version }}" \
              --generate-notes \
              --verify-tag
          fi

  worker_image:
    needs: [changes, legion]
    if: >-
      always() && (needs.legion.result == 'success' || needs.legion.result == 'skipped') &&
      (needs.changes.outputs.legion == 'true' || needs.changes.outputs.pi_envoy == 'true' ||
      needs.changes.outputs.worker_image == 'true' || github.event_name == 'workflow_dispatch')
    uses: ./.github/workflows/worker-image.yaml
    # No `secrets:`: the called workflow reads only GITHUB_TOKEN, which it receives automatically;
    # `inherit` would hand DEPLOY_KEY and every other repository secret to a job that runs a
    # PR-authored Dockerfile. Job-level permissions replace the top-level set for this job and must
    # cover everything the called workflow declares (packages: write is for the ghcr.io push).
    permissions:
      contents: write
      packages: write
    with:
      legion_version: ${{ needs.legion.outputs.version }}
      release_tag: ${{ needs.legion.outputs.release_tag }}

  envoy_plugin:
    needs: changes
    if: needs.changes.outputs.envoy_plugin == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ssh-key: ${{ secrets.DEPLOY_KEY }}
          fetch-depth: 0

      - uses: ./.github/actions/setup-bun
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Determine next version
        id: version
        run: |
          # The package's prepack copies skills/ into the tarball (package.json "prepack"), where
          # OpenCode loads it as the plugin's skills, so a commit there releases whatever its type.
          PREV_TAG=$(git tag -l 'opencode-legion-envoy-v*' --sort=-v:refname | head -1)
          if [ -z "$PREV_TAG" ]; then
            # When no release tag exists, seed from the published npm version so
            # an already-published version is never recomputed. Once a release
            # tags successfully, this branch stops running.
            PREV_VERSION=$(npm view @sjawhar/opencode-legion-envoy version 2>/dev/null || echo "0.0.0")
            VERSION=$(.github/scripts/release-bump.sh "$PREV_VERSION" HEAD --patch-path skills/ -- packages/envoy-plugin/ packages/contracts/ packages/envoy-client/ skills/)
          else
            PREV_VERSION="${PREV_TAG#opencode-legion-envoy-v}"
            VERSION=$(.github/scripts/release-bump.sh "$PREV_VERSION" "${PREV_TAG}..HEAD" --patch-path skills/ -- packages/envoy-plugin/ packages/contracts/ packages/envoy-client/ skills/)
          fi

          if [ "$VERSION" = "empty" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=No release published::No commits in tracked paths since ${PREV_TAG:-beginning}"
            echo "**No release published** — No commits in tracked paths since ${PREV_TAG:-beginning}" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$VERSION" = "none" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=No release published::No version-bumping commits since ${PREV_TAG:-beginning}"
            echo "**No release published** — No version-bumping commits since ${PREV_TAG:-beginning}" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "Bumping opencode-legion-envoy-v${PREV_VERSION} -> opencode-legion-envoy-v${VERSION}"

      - name: Set release version
        if: steps.version.outputs.skip != 'true'
        run: |
          jq --arg v "${{ steps.version.outputs.version }}" '.version = $v' \
            packages/envoy-plugin/package.json > tmp.json \
            && mv tmp.json packages/envoy-plugin/package.json

      - name: Pack plugin
        if: steps.version.outputs.skip != 'true'
        run: rm -f ./*.tgz && bun pm pack
        working-directory: packages/envoy-plugin

      - name: Publish to npm
        if: steps.version.outputs.skip != 'true'
        run: |
          if npm view "@sjawhar/opencode-legion-envoy@${{ steps.version.outputs.version }}" version >/dev/null 2>&1; then
            echo "npm already has ${{ steps.version.outputs.version }}; skipping publish"
          else
            npm publish ./*.tgz --access public --provenance
          fi
        working-directory: packages/envoy-plugin

      - name: Commit and tag
        if: steps.version.outputs.skip != 'true'
        run: |
          .github/scripts/release-push.sh tag packages/envoy-plugin \
            "chore: release envoy-plugin v${{ steps.version.outputs.version }} [skip ci]" \
            "opencode-legion-envoy-v${{ steps.version.outputs.version }}"

      - name: Create GitHub release
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="opencode-legion-envoy-v${{ steps.version.outputs.version }}"
          if gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release $tag already exists; reusing it"
          else
            gh release create "$tag" \
              packages/envoy-plugin/*.tgz \
              --repo "${{ github.repository }}" \
              --title "Envoy Plugin v${{ steps.version.outputs.version }}" \
              --generate-notes \
              --verify-tag
          fi

      - name: Push version bump
        if: steps.version.outputs.skip != 'true'
        run: .github/scripts/release-push.sh push-main packages/envoy-plugin "${{ steps.version.outputs.version }}"

  pi_envoy:
    needs: [changes, envoy_plugin]
    if: >-
      always() && (needs.envoy_plugin.result == 'success' || needs.envoy_plugin.result == 'skipped') &&
      (needs.changes.outputs.pi_envoy == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ssh-key: ${{ secrets.DEPLOY_KEY }}
          fetch-depth: 0

      - uses: ./.github/actions/setup-bun
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Determine next version
        id: version
        run: |
          # prepack.sh copies skills/ into dist/skills, which every Oh My Pi session loads as the
          # plugin's skills, so a commit there releases whatever its type.
          PREV_TAG=$(git tag -l 'pi-legion-envoy-v*' --sort=-v:refname | head -1)
          if [ -z "$PREV_TAG" ]; then
            # When no release tag exists, seed from the published npm version so
            # an already-published version is never recomputed. Once a release
            # tags successfully, this branch stops running.
            PREV_VERSION=$(npm view @sjawhar/pi-legion-envoy version 2>/dev/null || echo "0.0.0")
            VERSION=$(.github/scripts/release-bump.sh "$PREV_VERSION" HEAD --patch-path skills/ -- packages/pi-envoy/ packages/envoy-client/ packages/contracts/ skills/)
          else
            PREV_VERSION="${PREV_TAG#pi-legion-envoy-v}"
            VERSION=$(.github/scripts/release-bump.sh "$PREV_VERSION" "${PREV_TAG}..HEAD" --patch-path skills/ -- packages/pi-envoy/ packages/envoy-client/ packages/contracts/ skills/)
          fi

          if [ "$VERSION" = "empty" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=No release published::No commits in tracked paths since ${PREV_TAG:-beginning}"
            echo "**No release published** — No commits in tracked paths since ${PREV_TAG:-beginning}" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$VERSION" = "none" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=No release published::No version-bumping commits since ${PREV_TAG:-beginning}"
            echo "**No release published** — No version-bumping commits since ${PREV_TAG:-beginning}" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "Bumping pi-legion-envoy-v${PREV_VERSION} -> pi-legion-envoy-v${VERSION}"

      - name: Set release version
        if: steps.version.outputs.skip != 'true'
        run: |
          jq --arg v "${{ steps.version.outputs.version }}" '.version = $v' \
            packages/pi-envoy/package.json > tmp.json \
            && mv tmp.json packages/pi-envoy/package.json

      - name: Point extensions at the packed bundles
        if: steps.version.outputs.skip != 'true'
        run: |
          # The committed manifest keeps source paths (extensions/*.ts) so
          # repo checkouts (dev sessions) load sources without a build. The
          # published tarball ships only self-contained dist bundles, both
          # envoy.js and legion.js: legion.ts is inert without
          # LEGION_TREE/LEGION_ROLE/LEGION_CONTROLLER in the environment, so
          # every installed session loading it is safe; the Legion daemon
          # relies on this single installed copy instead of a repo checkout.
          cp packages/pi-envoy/package.json "$RUNNER_TEMP/pi-envoy-manifest.json"
          jq '.omp.extensions = ["dist/envoy.js","dist/legion.js"]' \
            packages/pi-envoy/package.json > tmp.json \
            && mv tmp.json packages/pi-envoy/package.json

      - name: Pack extension
        if: steps.version.outputs.skip != 'true'
        run: rm -f ./*.tgz && bun pm pack
        working-directory: packages/pi-envoy

      - name: Publish to npm
        if: steps.version.outputs.skip != 'true'
        run: |
          if npm view "@sjawhar/pi-legion-envoy@${{ steps.version.outputs.version }}" version >/dev/null 2>&1; then
            echo "npm already has ${{ steps.version.outputs.version }}; skipping publish"
          else
            npm publish ./*.tgz --access public --provenance
          fi
        working-directory: packages/pi-envoy

      - name: Restore committed manifest
        if: always() && steps.version.outputs.skip == 'false'
        run: |
          if [ -f "$RUNNER_TEMP/pi-envoy-manifest.json" ]; then
            mv "$RUNNER_TEMP/pi-envoy-manifest.json" packages/pi-envoy/package.json
          fi

      - name: Commit and tag
        if: steps.version.outputs.skip != 'true'
        run: |
          .github/scripts/release-push.sh tag packages/pi-envoy \
            "chore: release pi-envoy v${{ steps.version.outputs.version }} [skip ci]" \
            "pi-legion-envoy-v${{ steps.version.outputs.version }}"

      - name: Create GitHub release
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="pi-legion-envoy-v${{ steps.version.outputs.version }}"
          if gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release $tag already exists; reusing it"
          else
            gh release create "$tag" \
              packages/pi-envoy/*.tgz \
              --repo "${{ github.repository }}" \
              --title "Pi Envoy v${{ steps.version.outputs.version }}" \
              --generate-notes \
              --verify-tag
          fi

      - name: Push version bump
        if: steps.version.outputs.skip != 'true'
        run: .github/scripts/release-push.sh push-main packages/pi-envoy "${{ steps.version.outputs.version }}"
