name: Release Packages

on:
  push:
    branches: [main]
    paths:
      - "package.json"
      - "bun.lock"
      - "patches/**"
      - "packages/contracts/package.json"
      - "packages/envoy-client/package.json"
      - "packages/pi-envoy/package.json"
      - "packages/pi-legion/package.json"
      - "packages/pi-shared/package.json"
      - "packages/envoy-plugin/package.json"
      - "packages/claude-envoy/package.json"
      - "packages/proof-editor/package.json"
      - "packages/dispatch/package.json"
      - "packages/envoy/internal/dispatch/pmdoc/gen/package.json"
      - "docs/site/package.json"
      - "packages/daemon/**"
      - "go.work"
      - "go.work.sum"
      - "packages/envoy/**"
      - "packages/envoy-plugin/**"
      - "packages/envoy-client/**"
      - "packages/contracts/**"
      - "packages/pi-envoy/**"
      - "packages/pi-legion/**"
      - "packages/pi-shared/**"
      - "skills/**"
      # The two plugins' shared prepack, which stages each one's skills and writes its notices.
      - "scripts/pi-plugin-prepack.sh"
      # The notices each artifact ships: the bundles', the Go binaries' and the worker image's, and
      # the Go archives' target list.
      - "scripts/third-party-notices.ts"
      - "scripts/go-third-party-notices.sh"
      - "scripts/assemble-third-party-notices.sh"
      - ".github/go-release-targets.json"
      # The worker image's remaining inputs (worker_image below).
      - ".omp-pin"
      - ".dockerignore"
      - ".github/workflows/worker-image.yaml"
  workflow_dispatch:

# Every job declares its own permissions (changes, legion_build, legion_publish, worker_image,
# worker_image_release_note, envoy_plugin_build, envoy_plugin_publish, pi_envoy_build,
# pi_envoy_publish, pi_legion_build, pi_legion_publish below); nothing runs under this
# workflow-level default, so it stays empty rather than becoming an unreviewed grant to a job added
# later with no block of its own.
#
# Each release is split into a build job and a publish job. The build job versions, installs,
# packs, builds and tests: it runs the dependencies' code and every third-party module it links, so
# it holds no write scope and no secret, uploads what it made as an artifact, and ends in a tripwire
# (`release-push.sh no-credential`) that fails when a credential is reachable from it anyway. The
# publish job holds the credentials and runs no dependency code: only release-push.sh, git, gh, jq,
# sha256sum, npm (view, and publish of the handed tarball) and the pinned actions below, with no
# cache restored (`cache-mode: none`) and the deploy key in the env of the one or two steps that
# push. release-push.sh handed checks what the build job handed over before anything acts on it.
#
# Every job condition downstream of a skippable job takes one shape: `always() &&
# needs.<job>.result == 'success' && …` before it reads that job's outputs. GitHub gives an `if:`
# that calls no status function an implicit `success()`, false whenever any job upstream through
# `needs`, at any distance, was skipped (actions/runner#491), so a condition reading a build's
# `skip` output without `always()` never decides anything once some plugin job upstream skipped:
# that is what skipped legion_publish in the first run on this split (run 38822866387) while
# legion_build had cut a version. `always()` turns that gating off, so each such condition tests
# the result of every job whose outputs it reads, else a skipped or failed job is read through its
# empty outputs. check-release-credentials.sh rule 6 pins it.
permissions: {}

concurrency:
  # Only one run at a time by design, and a pending run GitHub drops in favor of a newer one
  # loses nothing: `changes`' base step below diffs since the last *successful* run, not this
  # run's commit alone, so the next run picks up every commit a dropped run skipped.
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-24.04
    # contents: read is for the checkout; actions: read is for the run list the base step reads.
    permissions:
      contents: read
      actions: read
    outputs:
      legion: ${{ steps.filter.outputs.legion }}
      envoy_plugin: ${{ steps.filter.outputs.envoy_plugin }}
      pi_envoy: ${{ steps.filter.outputs.pi_envoy }}
      pi_legion: ${{ steps.filter.outputs.pi_legion }}
      worker_image: ${{ steps.filter.outputs.worker_image }}
    steps:
      # Full history, for the base step's ancestry check.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # The filters compare against the commit the last successful run of this workflow on main
      # checked out, not against the push's own before-sha. GitHub keeps one pending run per
      # concurrency group and cancels it when a newer push queues behind it, and a run can fail
      # after releasing some packages and before others; comparing against the push alone would
      # leave those commits to no run. Every job versions from its package's last tag, so a commit
      # two ranges hold releases once. The range also holds the version-bump commits
      # (`[skip ci]`) that run pushed after its checkout: after each npm release, the next run
      # starts that package's job, which finds nothing since its tag and skips, and builds a
      # sha- worker image.
      #
      # Only push and workflow_dispatch runs count: only the repository's writers create those,
      # and a fork's pull request run can carry a branch named main and a commit of the fork's
      # choosing. The base must also be in this commit's history. The lookup reads this run's own
      # workflow, so a renamed file reads its own runs, and a workflow_dispatch skips it and the
      # filters, since every job runs on a dispatch; a dispatch on main is how a renamed workflow
      # gets its first base.
      - name: Find the commit the last successful run checked out
        id: base
        if: github.event_name != 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          workflow=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .workflow_id)
          newest() {
            gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?branch=main&event=$1&status=success&per_page=1" \
              --jq '.workflow_runs[] | "\(.created_at) \(.head_sha)"'
          }
          # Each query is its own assignment, so the step's `set -e` stops on gh's own error rather
          # than awk reading an error body as a commit.
          push=$(newest push)
          dispatch=$(newest workflow_dispatch)
          sha=$(printf '%s\n' "$push" "$dispatch" | sort -r | awk 'NR == 1 { print $2 }')
          if [ -z "$sha" ]; then
            echo "::error::No successful push or workflow_dispatch run of this workflow on main to compare against; run it once with workflow_dispatch on main"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$sha" HEAD; then
            echo "::error::$sha, the commit the last successful run checked out, is not in the history of $GITHUB_SHA; run it once with workflow_dispatch on main"
            exit 1
          fi
          echo "Changes since $sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          base: ${{ steps.base.outputs.sha }}
          filters: |
            # The Go `legion` the legion_build and legion_publish jobs release and worker.Dockerfile's go
            # stage compiles: its module, which embeds the role prompts, the modules go.work binds it to
            # (packages/envoy is also copied whole into the image for the agent-secrets binary it
            # builds), the notices scripts that change its archives or worker image, and the list of
            # the targets it builds.
            legion:
              - 'packages/daemon/**'
              - 'go.work'
              - 'go.work.sum'
              - 'packages/envoy/**'
              - 'scripts/go-third-party-notices.sh'
              - 'scripts/assemble-third-party-notices.sh'
              - '.github/go-release-targets.json'
            envoy_plugin:
              - 'packages/envoy-plugin/**'
              - 'packages/envoy-client/**'
              - 'packages/contracts/**'
              - 'skills/**'
              - 'scripts/third-party-notices.ts'
            # The two Oh My Pi plugins, each with the workspace packages its bundle inlines, the
            # skills scripts/pi-plugin-prepack.sh stages into its tarball (the Envoy plugin's four,
            # the Legion plugin's eight: the partition that script holds), and the two scripts the
            # pack runs.
            pi_envoy:
              - 'packages/pi-envoy/**'
              - 'packages/pi-shared/**'
              - 'packages/envoy-client/**'
              - 'packages/contracts/**'
              - 'skills/dispatch/**'
              - 'skills/dispatch-first/**'
              - 'skills/dispatch-brainstorming/**'
              - 'skills/envoy/**'
              - 'scripts/third-party-notices.ts'
              - 'scripts/pi-plugin-prepack.sh'
            pi_legion:
              - 'packages/pi-legion/**'
              - 'packages/pi-shared/**'
              - 'packages/envoy-client/**'
              - 'packages/contracts/**'
              - 'skills/legion-architect/**'
              - 'skills/legion-controller/**'
              - 'skills/legion-oracle/**'
              - 'skills/legion-retro/**'
              - 'skills/legion-worker/**'
              - 'skills/ce-simplify-code/**'
              - 'skills/thermonuclear-code-quality/**'
              - 'skills/thermonuclear-deep-review/**'
              - 'scripts/third-party-notices.ts'
              - 'scripts/pi-plugin-prepack.sh'
            # The plugin stage's frozen install needs the root manifest, lockfile, patches, and each
            # root-workspace manifest. Keep this explicit because a workspace can affect Bun's
            # install without its source becoming part of the worker image. The OMP pin, the
            # context's .dockerignore and the called workflow change the image too. With legion
            # (which holds the Dockerfile, packages/daemon/docker, and the notices scripts),
            # pi_envoy and pi_legion this covers every file worker.Dockerfile builds from;
            # .github/scripts/check-image-trigger-paths.sh fails the build when it misses one.
            worker_image:
              - 'package.json'
              - 'bun.lock'
              - 'patches/**'
              - 'packages/contracts/package.json'
              - 'packages/envoy-client/package.json'
              - 'packages/pi-envoy/package.json'
              - 'packages/pi-legion/package.json'
              - 'packages/pi-shared/package.json'
              - 'packages/envoy-plugin/package.json'
              - 'packages/claude-envoy/package.json'
              - 'packages/proof-editor/package.json'
              - 'packages/dispatch/package.json'
              - 'packages/envoy/internal/dispatch/pmdoc/gen/package.json'
              - 'docs/site/package.json'
              - '.omp-pin'
              - '.dockerignore'
              - '.github/workflows/worker-image.yaml'

  # The Go `legion`: linux and darwin archives of the binary, which embeds its role prompts, with
  # its THIRD_PARTY_NOTICES, on a legion-v* tag of the commit the run checked out. Nothing is
  # committed: a Go module carries no version file, so the tag alone records the version, and
  # `legion version` names it. Only main releases one: a workflow_dispatch from another branch skips
  # this job, and the worker image job below then publishes that commit's sha- tag alone, as it does
  # for any branch.
  #
  # legion_build versions, builds and smoke-tests the archives and hands them to legion_publish as
  # an artifact. It runs the module's code and every third-party module it links, so it holds no
  # write scope and no secret: whatever that code does to this VM (a planted binary on the path, an
  # environment variable for later steps, the runner's memory) never meets the deploy key, the
  # write token or the OIDC token, which legion_publish holds on a VM of its own.
  legion_build:
    needs: [changes, pi_envoy_build, pi_envoy_publish, pi_legion_build, pi_legion_publish]
    if: >-
      always() &&
      needs.changes.result == 'success' &&
      github.ref == 'refs/heads/main' &&
      (needs.changes.outputs.legion == 'true' || github.event_name == 'workflow_dispatch') &&
      (needs.pi_envoy_build.result == 'success' || needs.pi_envoy_build.result == 'skipped') &&
      (needs.pi_envoy_publish.result == 'success' || needs.pi_envoy_publish.result == 'skipped') &&
      (needs.pi_legion_build.result == 'success' || needs.pi_legion_build.result == 'skipped') &&
      (needs.pi_legion_publish.result == 'success' || needs.pi_legion_publish.result == 'skipped')
    runs-on: ubuntu-24.04
    # contents: read is for the checkout; nothing here writes to the repository, a registry or a
    # release.
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      skip: ${{ steps.version.outputs.skip }}
      pi_legion_version: ${{ steps.plugin_versions.outputs.pi_legion_version }}
      pi_envoy_version: ${{ steps.plugin_versions.outputs.pi_envoy_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # First, before setup-go: no dependency code has run and no cache has been restored when the
      # tags are read. release-push.sh version releases again a tag an earlier attempt pushed for
      # this commit (`tagged`, which refuses a tag that is not legion-vX.Y.Z; legion_publish's "Tag
      # release" accepts its own tag at this commit and its "Create GitHub release" reuses a
      # published release and publishes a draft one), and otherwise bumps from the newest legion-v*
      # tag. The binary embeds its prompts (internal/prompts/roles and go), so a docs: commit there
      # still releases. The notices scripts and the target list are runtime inputs of the release
      # archives and worker image, so any change to one needs a new tag rather than a CI-only
      # rebuild. release-bump.sh reads a --patch-path only when it is also one of the paths after --.
      - name: Determine next version
        id: version
        run: |
          .github/scripts/release-push.sh version legion-v \
            --patch-path packages/daemon/internal/prompts/roles/ --patch-path packages/daemon/internal/prompts/go/ \
            --patch-path scripts/go-third-party-notices.sh --patch-path scripts/assemble-third-party-notices.sh \
            --patch-path .github/go-release-targets.json \
            -- packages/daemon/ packages/daemon/internal/prompts/roles/ packages/daemon/internal/prompts/go/ \
            scripts/go-third-party-notices.sh scripts/assemble-third-party-notices.sh .github/go-release-targets.json \
            >> "$GITHUB_OUTPUT"
      - name: Resolve plugin versions for the smoke test and worker image
        id: plugin_versions
        env:
          PI_LEGION_VERSION: ${{ needs.pi_legion_publish.outputs.version }}
          PI_ENVOY_VERSION: ${{ needs.pi_envoy_publish.outputs.version }}
        run: |
          # Non-empty means pi_legion_publish/pi_envoy_publish published this run; otherwise this
          # run's checkout (at the triggering commit) still holds the manifest's last published
          # version, since the bump commit a publish makes lands on main only after that job's own
          # push.
          legion_version="$PI_LEGION_VERSION"
          if [ -z "$legion_version" ]; then
            legion_version=$(jq -r '.version // empty' packages/pi-legion/package.json)
          fi
          envoy_version="$PI_ENVOY_VERSION"
          if [ -z "$envoy_version" ]; then
            envoy_version=$(jq -r '.version // empty' packages/pi-envoy/package.json)
          fi
          if [ -z "$legion_version" ]; then
            echo "::error::Could not resolve @sjawhar/pi-legion version"
            exit 1
          fi
          if [ -z "$envoy_version" ]; then
            echo "::error::Could not resolve @sjawhar/pi-envoy version"
            exit 1
          fi
          {
            echo "pi_legion_version=$legion_version"
            echo "pi_envoy_version=$envoy_version"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.version.outputs.skip != 'true'
        with:
          go-version-file: packages/daemon/go.mod
          cache-dependency-path: |
            packages/daemon/go.sum
            packages/envoy/go.sum
      # CGO_ENABLED=0: a static binary, as the worker image builds it, so a linux archive runs on any
      # distribution. One archive per target .github/go-release-targets.json lists (the pull
      # request's notices check reads the same list), each holding one top-level directory,
      # legion-<os>-<arch>, with `legion` and THIRD_PARTY_NOTICES in it: mise's github backend
      # strips that one directory, leaving the binary. THIRD_PARTY_NOTICES is the license of every
      # Go module that target's binary compiles in (scripts/go-third-party-notices.sh, run with the
      # build's own GOOS, GOARCH and CGO_ENABLED), and fails the build when one cannot be determined.
      # legion_publish writes SHA256SUMS over the archives it accepts.
      - name: Build legion
        if: steps.version.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PI_LEGION_VERSION: ${{ steps.plugin_versions.outputs.pi_legion_version }}
          PI_ENVOY_VERSION: ${{ steps.plugin_versions.outputs.pi_envoy_version }}
        run: |
          mkdir -p out assets
          for target in $(jq -r '.legion[]' .github/go-release-targets.json); do
            os=${target%/*}
            arch=${target#*/}
            dir="legion-$os-$arch"
            mkdir -p "out/$dir"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go -C packages/daemon build -buildvcs=false \
              -ldflags "-X main.revision=$GITHUB_SHA -X main.release=v$VERSION -X main.piLegionVersion=$PI_LEGION_VERSION -X main.piEnvoyVersion=$PI_ENVOY_VERSION" \
              -o "$GITHUB_WORKSPACE/out/$dir/legion" ./cmd/legion
            (cd packages/daemon && CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              ../../scripts/go-third-party-notices.sh "$GITHUB_WORKSPACE/out/$dir/THIRD_PARTY_NOTICES" ./cmd/legion)
            tar czf "assets/$dir.tar.gz" -C out "$dir"
          done
      - name: Smoke test
        if: steps.version.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PI_LEGION_VERSION: ${{ steps.plugin_versions.outputs.pi_legion_version }}
          PI_ENVOY_VERSION: ${{ steps.plugin_versions.outputs.pi_envoy_version }}
        run: |
          version=$(out/legion-linux-amd64/legion version)
          echo "$version"
          lines=$(printf '%s\n' "$version" | wc -l)
          test "$lines" -eq 2
          test "$(printf '%s\n' "$version" | sed -n '1p')" = "legion v$VERSION commit $GITHUB_SHA"
          test "$(printf '%s\n' "$version" | sed -n '2p')" = "plugins @sjawhar/pi-legion $PI_LEGION_VERSION @sjawhar/pi-envoy $PI_ENVOY_VERSION"
      # The archives, exactly as built and smoke-tested, for legion_publish.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.version.outputs.skip != 'true'
        with:
          name: legion-assets
          path: assets/
          if-no-files-found: error
      - name: Check this job holds no credential (tripwire)
        run: .github/scripts/release-push.sh no-credential

  # Checks what legion_build hands over, writes SHA256SUMS, tags the commit, attests legion_build's
  # archives and releases them. It runs no Go and no built binary, only release-push.sh, git, jq,
  # sha256sum and the pinned actions below, so the scopes and the deploy key it holds never meet the
  # code legion_build runs. Its condition runs on `always()`, so a plugin job skipped upstream of
  # legion_build does not skip this one, and tests legion_build's result before reading its skip.
  legion_publish:
    needs: legion_build
    if: always() && needs.legion_build.result == 'success' && needs.legion_build.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    # contents: write creates the GitHub release (`release-push.sh release`, below); id-token and
    # attestations: write are for the archives' provenance attestation (id-token is the Sigstore
    # signing certificate's OIDC token). The tag push uses the deploy key, held only by the "Tag
    # release" step's env, not either scope.
    permissions:
      contents: write
      id-token: write
      attestations: write
    # No cache is restored in a job that holds a credential.
    cache-mode: none
    outputs:
      version: ${{ needs.legion_build.outputs.version }}
      tag: ${{ needs.legion_build.outputs.tag }}
    steps:
      # For release-push.sh and the tag, with every tag (the existing-tag check below reads them).
      # No credential is left in the checkout: the deploy key reaches the "Tag release" step alone.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: legion-assets
          path: assets
      # legion_build chooses the archives' bytes, and hands over only them and the version. This job
      # names the archives itself, from that version and its own checkout of the target list;
      # release-push.sh handed refuses a version that is not X.Y.Z and an artifact that is not
      # exactly those archives, each a regular file, and prints the tag. SHA256SUMS is then written
      # over them, and the tag and the explicit lists go to the steps below.
      - name: Check build's archives and write SHA256SUMS
        id: assets
        env:
          VERSION: ${{ needs.legion_build.outputs.version }}
        run: |
          archives=()
          targets=$(jq -r '.legion[]' .github/go-release-targets.json)
          [ -n "$targets" ] || { echo "::error::.github/go-release-targets.json lists no legion target"; exit 1; }
          for target in $targets; do
            os=${target%/*}
            arch=${target#*/}
            archives+=("legion-$os-$arch.tar.gz")
          done
          tag=$(.github/scripts/release-push.sh handed legion-v "$VERSION" assets "${archives[@]}")
          (cd assets && sha256sum -- "${archives[@]}" > SHA256SUMS)
          {
            echo "tag=$tag"
            echo "subjects<<SUBJECTS"
            printf 'assets/%s\n' "${archives[@]}"
            echo "SUBJECTS"
            echo "files<<FILES"
            printf 'assets/%s\n' "${archives[@]}" SHA256SUMS
            echo "FILES"
          } >> "$GITHUB_OUTPUT"
      # The only step that holds the deploy key. release-push.sh push-tag writes it to a directory
      # of its own, pushes the tag over SSH to GitHub's pinned host keys, and removes the key again.
      - name: Tag release
        env:
          TAG: ${{ steps.assets.outputs.tag }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            test "$(git rev-list -n 1 "$TAG")" = "$GITHUB_SHA"
            exit 0
          fi
          git tag "$TAG"
          .github/scripts/release-push.sh push-tag "$TAG"
      # Build provenance for the archives a mise pin installs, which the release below uploads
      # exactly, so a downloaded asset is checked against a run of this workflow on main rather than
      # against SHA256SUMS, which sits in the same mutable release. `--repo` alone accepts an
      # archive any workflow of this repository attested, so the check pins the signer as
      # docs/kubernetes.md ("Pin by digest, never by tag") does:
      #   gh attestation verify legion-<os>-<arch>.tar.gz --repo sjawhar/legion \
      #     --cert-identity https://github.com/sjawhar/legion/.github/workflows/release.yaml@refs/heads/main \
      #     --source-ref refs/heads/main --deny-self-hosted-runners
      # and adds `--source-digest <the legion-v<version> tag's commit>` to pin the commit as well.
      # It runs after "Tag release", so a run whose tag step refuses (the tag already names another
      # commit) leaves no attestation for archives no release carries.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.assets.outputs.subjects }}
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.assets.outputs.tag }}
          VERSION: ${{ needs.legion_build.outputs.version }}
          FILES: ${{ steps.assets.outputs.files }}
        # release-push.sh `release`: creates the release, reuses a published one, or publishes a
        # draft an earlier attempt left, with the files the check above listed.
        run: |
          assets=()
          while IFS= read -r file; do
            [ -z "$file" ] || assets+=("$file")
          done <<< "$FILES"
          .github/scripts/release-push.sh release "$TAG" "legion v$VERSION" "${assets[@]}"

  worker_image:
    needs: [changes, legion_build, legion_publish]
    if: >-
      always() &&
      needs.changes.result == 'success' &&
      (needs.legion_build.result == 'success' || needs.legion_build.result == 'skipped') &&
      (needs.legion_publish.result == 'success' || needs.legion_publish.result == 'skipped') &&
      (needs.changes.outputs.legion == 'true' || needs.changes.outputs.pi_envoy == 'true' ||
      needs.changes.outputs.pi_legion == 'true' || needs.changes.outputs.worker_image == 'true' ||
      github.event_name == 'workflow_dispatch')
    uses: ./.github/workflows/worker-image.yaml
    # No `secrets:`: the called workflow reads only GITHUB_TOKEN, which it receives automatically;
    # `inherit` would hand DEPLOY_KEY and every other repository secret to a job that runs a
    # PR-authored Dockerfile. This job's permissions must cover every scope worker-image.yaml's
    # `permissions:` blocks declare: its workflow-level block (the build) and its `attest` job's
    # (id-token and attestations: write, for the image's GitHub attestation). The release note, the
    # one step needing contents: write, is worker_image_release_note below.
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    with:
      legion_version: ${{ needs.legion_publish.outputs.version }}
      pi_legion_version: ${{ needs.legion_build.outputs.pi_legion_version }}
      pi_envoy_version: ${{ needs.legion_build.outputs.pi_envoy_version }}

  worker_image_release_note:
    needs: [legion_publish, worker_image]
    # On `always()`, so a plugin job skipped upstream does not skip this one; it tests the result of
    # both jobs it reads.
    if: >-
      always() &&
      needs.worker_image.result == 'success' &&
      needs.legion_publish.result == 'success' && needs.legion_publish.outputs.tag != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: write # gh release edit
    # No cache is restored in a job that holds a credential.
    cache-mode: none
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REF: ${{ needs.worker_image.outputs.ref }}
      RELEASE_TAG: ${{ needs.legion_publish.outputs.tag }}
    steps:
      - name: Name the worker image on the legion release
        run: |
          test -n "$REF"
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json body -q .body > body.md
          # A whole-run rerun rebuilds the image under the same version tag, so an existing
          # "## Worker image" section is replaced rather than added to: the body names only the
          # digest the tag points at now. The section runs to the next heading of level 1 or 2.
          rest=$(awk '/^## Worker image[ \t\r]*$/ { skip = 1; next } skip && /^##? / { skip = 0 } !skip' body.md)
          if [ -n "$rest" ]; then
            printf '%s\n\n' "$rest" > notes.md
          else
            : > notes.md
          fi
          # shellcheck disable=SC2016 # literal Markdown backticks, no expansion wanted
          printf '## Worker image\n\n`%s`\n' "$REF" >> notes.md
          # $(<…) drops trailing newlines, so a body differing only in those is unchanged.
          if [ "$(<body.md)" = "$(<notes.md)" ]; then
            echo "Release $RELEASE_TAG already names $REF"
            exit 0
          fi
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --notes-file notes.md

  # The Envoy OpenCode plugin, @sjawhar/opencode-legion-envoy. envoy_plugin_build versions it,
  # installs the workspace and packs it (the dependencies' code, so no write scope and no secret),
  # and hands the tarball to envoy_plugin_publish, which publishes those bytes to npm, commits and
  # tags the version bump, creates the GitHub release and pushes the bump to main.
  envoy_plugin_build:
    needs: changes
    if: needs.changes.outputs.envoy_plugin == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    # contents: read is for the checkout; nothing here writes to the repository, a registry or a
    # release.
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      skip: ${{ steps.version.outputs.skip }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # First, before setup-bun: no dependency code has run and no cache has been restored when the
      # tags are read. A re-run after envoy_plugin_publish's "Push tag" pushed the tag checks out
      # this same commit with that tag on the bump commit above it, where the range would be empty
      # and skip the release it never finished; release-push.sh version releases that tag again
      # instead (`tagged`), and every publish step is safe to repeat: npm reuses a published
      # version, `release-push.sh release` reuses a published release and publishes a draft one,
      # `tag` accepts its own tag, and `push-main` pushes nothing once main holds this version or a
      # later one. Otherwise it bumps from the newest opencode-legion-envoy-v* tag, or, before the
      # first one, from the version npm publishes, so an already-published version is never
      # recomputed. The package's prepack copies skills/ into the tarball (package.json "prepack"),
      # where OpenCode loads it as the plugin's skills, so a commit there releases whatever its type.
      # Its notices generator is another shipped build input, so it gets the same patch release.
      - name: Determine next version
        id: version
        run: |
          .github/scripts/release-push.sh version opencode-legion-envoy-v \
            --package-dir packages/envoy-plugin --first-npm @sjawhar/opencode-legion-envoy \
            --patch-path skills/ --patch-path scripts/third-party-notices.ts \
            -- packages/envoy-plugin/ packages/contracts/ packages/envoy-client/ skills/ scripts/third-party-notices.ts \
            >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/setup-bun
        if: steps.version.outputs.skip != 'true'

      - name: Install dependencies
        if: steps.version.outputs.skip != 'true'
        run: bun install --frozen-lockfile

      - name: Set release version
        if: steps.version.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          jq --arg v "$VERSION" '.version = $v' \
            packages/envoy-plugin/package.json > tmp.json \
            && mv tmp.json packages/envoy-plugin/package.json

      - name: Pack plugin
        if: steps.version.outputs.skip != 'true'
        run: rm -f ./*.tgz && bun pm pack
        working-directory: packages/envoy-plugin

      # The tarball, exactly as packed, for envoy_plugin_publish.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.version.outputs.skip != 'true'
        with:
          name: envoy-plugin-tarball
          path: packages/envoy-plugin/*.tgz
          if-no-files-found: error

      - name: Check this job holds no credential (tripwire)
        run: .github/scripts/release-push.sh no-credential

  # Publishes what envoy_plugin_build packed. It runs no bun, no node and no scripts/ program, only
  # release-push.sh, git, jq, npm (view, and publish of the handed tarball) and the pinned actions
  # below, so the scopes and the deploy key it holds never meet the code envoy_plugin_build runs.
  envoy_plugin_publish:
    needs: envoy_plugin_build
    if: always() && needs.envoy_plugin_build.result == 'success' && needs.envoy_plugin_build.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    # contents: write creates the GitHub release (`release-push.sh release`, below); id-token: write
    # is the OIDC token npm trusted publishing exchanges for the publish credential (the registry
    # records `trustedPublisher: github` for this package; no NPM_TOKEN is set) and that also signs
    # provenance (`npm publish --provenance`). The tag push and version-bump commit use the deploy
    # key, held only by the "Push tag" and "Push version bump" steps' env, not either scope.
    permissions:
      contents: write
      id-token: write
    # No cache is restored in a job that holds a credential.
    cache-mode: none
    steps:
      # For release-push.sh, the bump commit and the tag, with every tag. No credential is left in
      # the checkout: the deploy key reaches the two push steps alone.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: envoy-plugin-tarball
          path: tarball

      # envoy_plugin_build chooses the tarball's bytes, and hands over only it and the version. This
      # job names the tarball itself, from that version and the committed manifest's name (Bun names
      # a scoped tarball sjawhar-pi-legion-1.2.3.tgz); release-push.sh handed refuses a version that
      # is not X.Y.Z and an artifact that is not exactly that one regular file, and prints the tag.
      # The steps below take the name's stem and spell the `.tgz` themselves, so each reads as the
      # publish of a tarball (check-release-credentials.sh allows `npm publish` of nothing else).
      - name: Check the hand-over
        id: handed
        env:
          VERSION: ${{ needs.envoy_plugin_build.outputs.version }}
        run: |
          name=$(jq -r .name packages/envoy-plugin/package.json)
          stem="${name#@}"
          stem="${stem//\//-}-$VERSION"
          tag=$(.github/scripts/release-push.sh handed opencode-legion-envoy-v "$VERSION" tarball "$stem.tgz")
          { echo "tag=$tag"; echo "stem=$stem"; } >> "$GITHUB_OUTPUT"

      # The committed manifest takes the version "Commit and tag" commits; the tarball carries it already.
      - name: Set release version
        env:
          VERSION: ${{ needs.envoy_plugin_build.outputs.version }}
        run: |
          jq --arg v "$VERSION" '.version = $v' \
            packages/envoy-plugin/package.json > tmp.json \
            && mv tmp.json packages/envoy-plugin/package.json

      # The tarball is envoy_plugin_build's bytes, never a repack here: npm publish is handed the
      # .tgz, so no package script (prepack) runs in this job.
      - name: Publish to npm
        env:
          VERSION: ${{ needs.envoy_plugin_build.outputs.version }}
          STEM: ${{ steps.handed.outputs.stem }}
        run: |
          if npm view "$(jq -r .name package.json)@$VERSION" version >/dev/null 2>&1; then
            echo "npm already has $VERSION; skipping publish"
          else
            npm publish "$GITHUB_WORKSPACE/tarball/$STEM.tgz" --access public --provenance
          fi
        working-directory: packages/envoy-plugin

      - name: Commit and tag
        env:
          VERSION: ${{ needs.envoy_plugin_build.outputs.version }}
          TAG: ${{ steps.handed.outputs.tag }}
        run: |
          .github/scripts/release-push.sh tag packages/envoy-plugin \
            "chore: release envoy-plugin v$VERSION [skip ci]" "$TAG"

      # The deploy key reaches this step and "Push version bump" alone. release-push.sh push-tag
      # and push-main write it to a directory of their own, push over SSH to GitHub's pinned host
      # keys, and remove the key again. The tag goes first (`release` below verifies it on GitHub),
      # the bump commit last, after the tag and the release exist.
      - name: Push tag
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          TAG: ${{ steps.handed.outputs.tag }}
        run: .github/scripts/release-push.sh push-tag "$TAG"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.handed.outputs.tag }}
          VERSION: ${{ needs.envoy_plugin_build.outputs.version }}
          STEM: ${{ steps.handed.outputs.stem }}
        run: .github/scripts/release-push.sh release "$TAG" "Envoy Plugin v$VERSION" "tarball/$STEM.tgz"

      - name: Push version bump
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          VERSION: ${{ needs.envoy_plugin_build.outputs.version }}
        run: .github/scripts/release-push.sh push-main packages/envoy-plugin "$VERSION"

  # The Envoy Oh My Pi plugin, @sjawhar/pi-envoy, built and published as the Envoy OpenCode plugin
  # above is. The build jobs run beside each other; only the publish jobs are chained.
  pi_envoy_build:
    needs: changes
    if: needs.changes.outputs.pi_envoy == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    # contents: read is for the checkout; nothing here writes to the repository, a registry or a
    # release.
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      skip: ${{ steps.version.outputs.skip }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # First, before setup-bun, as envoy_plugin_build's version step is, and releasing again a tag
      # an earlier attempt pushed for this commit as that step does. The seed before the first
      # pi-envoy-v* tag is the version line this package continues, @sjawhar/pi-legion-envoy, which
      # it was split from: its own name on npm holds only a placeholder 0.0.0 until its first
      # publish, so reading it would restart the line at 0.x. scripts/pi-plugin-prepack.sh copies
      # this plugin's four skills into dist/skills, which every Oh My Pi session loads as the
      # plugin's skills, so a commit there releases whatever its type. Its notices generator and the
      # prepack itself are shipped build inputs too, so they get the same patch release.
      - name: Determine next version
        id: version
        run: |
          .github/scripts/release-push.sh version pi-envoy-v \
            --package-dir packages/pi-envoy --first-npm @sjawhar/pi-legion-envoy \
            --patch-path skills/dispatch/ --patch-path skills/dispatch-first/ \
            --patch-path skills/dispatch-brainstorming/ --patch-path skills/envoy/ \
            --patch-path scripts/third-party-notices.ts --patch-path scripts/pi-plugin-prepack.sh \
            -- packages/pi-envoy/ packages/pi-shared/ packages/envoy-client/ packages/contracts/ \
            skills/dispatch/ skills/dispatch-first/ skills/dispatch-brainstorming/ skills/envoy/ \
            scripts/third-party-notices.ts scripts/pi-plugin-prepack.sh \
            >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/setup-bun
        if: steps.version.outputs.skip != 'true'

      - name: Install dependencies
        if: steps.version.outputs.skip != 'true'
        run: bun install --frozen-lockfile

      - name: Set release version
        if: steps.version.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          jq --arg v "$VERSION" '.version = $v' \
            packages/pi-envoy/package.json > tmp.json \
            && mv tmp.json packages/pi-envoy/package.json

      - name: Point extensions at the packed bundle
        if: steps.version.outputs.skip != 'true'
        run: |
          # The committed manifest keeps the source path (extensions/envoy.ts) so repo checkouts
          # (dev sessions) load the source without a build. The published tarball ships only the
          # self-contained dist bundle, and scripts/pi-plugin-prepack.sh refuses to pack any other
          # omp.extensions. Nothing restores the manifest: this job's tree is discarded, and
          # pi_envoy_publish commits the bump on its own checkout of the committed one.
          jq '.omp.extensions = ["dist/envoy.js"]' \
            packages/pi-envoy/package.json > tmp.json \
            && mv tmp.json packages/pi-envoy/package.json

      - name: Pack extension
        if: steps.version.outputs.skip != 'true'
        run: rm -f ./*.tgz && bun pm pack
        working-directory: packages/pi-envoy

      # The tarball, exactly as packed, for pi_envoy_publish.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.version.outputs.skip != 'true'
        with:
          name: pi-envoy-tarball
          path: packages/pi-envoy/*.tgz
          if-no-files-found: error

      - name: Check this job holds no credential (tripwire)
        run: .github/scripts/release-push.sh no-credential

  # Publishes what pi_envoy_build packed, as envoy_plugin_publish does. After envoy_plugin_publish,
  # never beside it: both jobs end in `release-push.sh push-main`, whose rebase repair resolves a
  # conflict only in the one manifest of the package being released, so two bump commits racing
  # from different packages would fail the later push. A skipped envoy_plugin_build or
  # envoy_plugin_publish (nothing of its own to release) still lets this run.
  pi_envoy_publish:
    needs: [pi_envoy_build, envoy_plugin_build, envoy_plugin_publish]
    if: >-
      always() &&
      needs.pi_envoy_build.result == 'success' && needs.pi_envoy_build.outputs.skip != 'true' &&
      (needs.envoy_plugin_build.result == 'success' || needs.envoy_plugin_build.result == 'skipped') &&
      (needs.envoy_plugin_publish.result == 'success' || needs.envoy_plugin_publish.result == 'skipped')
    runs-on: ubuntu-24.04
    # contents: write creates the GitHub release (`release-push.sh release`, below); id-token: write
    # is the OIDC token npm trusted publishing exchanges for the publish credential (the registry
    # records `trustedPublisher: github` for this package; no NPM_TOKEN is set) and that also signs
    # provenance (`npm publish --provenance`). The tag push and version-bump commit use the deploy
    # key, held only by the "Push tag" and "Push version bump" steps' env, not either scope.
    permissions:
      contents: write
      id-token: write
    # No cache is restored in a job that holds a credential.
    cache-mode: none
    outputs:
      version: ${{ needs.pi_envoy_build.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pi-envoy-tarball
          path: tarball

      # As envoy_plugin_publish's: the tarball is named from the version and the committed manifest,
      # and release-push.sh handed checks the artifact is exactly that file before anything acts on it.
      - name: Check the hand-over
        id: handed
        env:
          VERSION: ${{ needs.pi_envoy_build.outputs.version }}
        run: |
          name=$(jq -r .name packages/pi-envoy/package.json)
          stem="${name#@}"
          stem="${stem//\//-}-$VERSION"
          tag=$(.github/scripts/release-push.sh handed pi-envoy-v "$VERSION" tarball "$stem.tgz")
          { echo "tag=$tag"; echo "stem=$stem"; } >> "$GITHUB_OUTPUT"

      - name: Set release version
        env:
          VERSION: ${{ needs.pi_envoy_build.outputs.version }}
        run: |
          jq --arg v "$VERSION" '.version = $v' \
            packages/pi-envoy/package.json > tmp.json \
            && mv tmp.json packages/pi-envoy/package.json

      - name: Publish to npm
        env:
          VERSION: ${{ needs.pi_envoy_build.outputs.version }}
          STEM: ${{ steps.handed.outputs.stem }}
        run: |
          if npm view "$(jq -r .name package.json)@$VERSION" version >/dev/null 2>&1; then
            echo "npm already has $VERSION; skipping publish"
          else
            npm publish "$GITHUB_WORKSPACE/tarball/$STEM.tgz" --access public --provenance
          fi
        working-directory: packages/pi-envoy

      - name: Commit and tag
        env:
          VERSION: ${{ needs.pi_envoy_build.outputs.version }}
          TAG: ${{ steps.handed.outputs.tag }}
        run: |
          .github/scripts/release-push.sh tag packages/pi-envoy \
            "chore: release pi-envoy v$VERSION [skip ci]" "$TAG"

      # The deploy key reaches this step and "Push version bump" alone; the tag goes first, the bump
      # commit last, as in envoy_plugin_publish.
      - name: Push tag
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          TAG: ${{ steps.handed.outputs.tag }}
        run: .github/scripts/release-push.sh push-tag "$TAG"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.handed.outputs.tag }}
          VERSION: ${{ needs.pi_envoy_build.outputs.version }}
          STEM: ${{ steps.handed.outputs.stem }}
        run: .github/scripts/release-push.sh release "$TAG" "Pi Envoy v$VERSION" "tarball/$STEM.tgz"

      - name: Push version bump
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          VERSION: ${{ needs.pi_envoy_build.outputs.version }}
        run: .github/scripts/release-push.sh push-main packages/pi-envoy "$VERSION"

  # The Legion Oh My Pi plugin, @sjawhar/pi-legion, built and published as @sjawhar/pi-envoy is.
  pi_legion_build:
    needs: changes
    if: needs.changes.outputs.pi_legion == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    # contents: read is for the checkout; nothing here writes to the repository, a registry or a
    # release.
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      skip: ${{ steps.version.outputs.skip }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # First, before setup-bun, as envoy_plugin_build's version step is, and releasing again a tag
      # an earlier attempt pushed for this commit as that step does. The seed before the first
      # pi-legion-v* tag is the version line this package continues, @sjawhar/pi-legion-envoy, which
      # it was split from: its own name on npm holds only a placeholder 0.0.0 until its first
      # publish, so reading it would restart the line at 0.x. scripts/pi-plugin-prepack.sh copies
      # this plugin's eight skills into dist/skills, which a Legion pane's prompts load, so a commit
      # there releases whatever its type. Its notices generator and the prepack itself are shipped
      # build inputs too, so they get the same patch release.
      - name: Determine next version
        id: version
        run: |
          .github/scripts/release-push.sh version pi-legion-v \
            --package-dir packages/pi-legion --first-npm @sjawhar/pi-legion-envoy \
            --patch-path skills/legion-architect/ --patch-path skills/legion-controller/ \
            --patch-path skills/legion-oracle/ --patch-path skills/legion-retro/ \
            --patch-path skills/legion-worker/ --patch-path skills/ce-simplify-code/ \
            --patch-path skills/thermonuclear-code-quality/ --patch-path skills/thermonuclear-deep-review/ \
            --patch-path scripts/third-party-notices.ts --patch-path scripts/pi-plugin-prepack.sh \
            -- packages/pi-legion/ packages/pi-shared/ packages/envoy-client/ packages/contracts/ \
            skills/legion-architect/ skills/legion-controller/ skills/legion-oracle/ skills/legion-retro/ \
            skills/legion-worker/ skills/ce-simplify-code/ skills/thermonuclear-code-quality/ \
            skills/thermonuclear-deep-review/ scripts/third-party-notices.ts scripts/pi-plugin-prepack.sh \
            >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/setup-bun
        if: steps.version.outputs.skip != 'true'

      - name: Install dependencies
        if: steps.version.outputs.skip != 'true'
        run: bun install --frozen-lockfile

      - name: Set release version
        if: steps.version.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          jq --arg v "$VERSION" '.version = $v' \
            packages/pi-legion/package.json > tmp.json \
            && mv tmp.json packages/pi-legion/package.json

      - name: Point extensions at the packed bundle
        if: steps.version.outputs.skip != 'true'
        run: |
          # The committed manifest keeps the source path (extensions/legion.ts) so repo checkouts
          # (dev sessions) load the source without a build. The published tarball ships only the
          # self-contained dist bundle, and scripts/pi-plugin-prepack.sh refuses to pack any other
          # omp.extensions. legion.ts is inert without LEGION_TREE/LEGION_ROLE/LEGION_CONTROLLER in
          # the environment, so every installed session loading it is safe; the Legion daemon
          # relies on this single installed copy instead of a repo checkout. Nothing restores the
          # manifest: this job's tree is discarded, and pi_legion_publish commits the bump on its
          # own checkout of the committed one.
          jq '.omp.extensions = ["dist/legion.js"]' \
            packages/pi-legion/package.json > tmp.json \
            && mv tmp.json packages/pi-legion/package.json

      - name: Pack extension
        if: steps.version.outputs.skip != 'true'
        run: rm -f ./*.tgz && bun pm pack
        working-directory: packages/pi-legion

      # The tarball, exactly as packed, for pi_legion_publish.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.version.outputs.skip != 'true'
        with:
          name: pi-legion-tarball
          path: packages/pi-legion/*.tgz
          if-no-files-found: error

      - name: Check this job holds no credential (tripwire)
        run: .github/scripts/release-push.sh no-credential

  # Publishes what pi_legion_build packed, as envoy_plugin_publish does. After pi_envoy_publish,
  # never beside it: both jobs end in `release-push.sh push-main`, whose rebase repair resolves a
  # conflict only in the one manifest of the package being released, so two bump commits racing
  # from different packages would fail the later push. A skipped pi_envoy_build or pi_envoy_publish
  # (nothing of its own to release) still lets this run.
  pi_legion_publish:
    needs: [pi_legion_build, pi_envoy_build, pi_envoy_publish]
    if: >-
      always() &&
      needs.pi_legion_build.result == 'success' && needs.pi_legion_build.outputs.skip != 'true' &&
      (needs.pi_envoy_build.result == 'success' || needs.pi_envoy_build.result == 'skipped') &&
      (needs.pi_envoy_publish.result == 'success' || needs.pi_envoy_publish.result == 'skipped')
    runs-on: ubuntu-24.04
    # contents: write creates the GitHub release (`release-push.sh release`, below); id-token: write
    # is the OIDC token npm trusted publishing exchanges for the publish credential (the registry
    # records `trustedPublisher: github` for this package; no NPM_TOKEN is set) and that also signs
    # provenance (`npm publish --provenance`). The tag push and version-bump commit use the deploy
    # key, held only by the "Push tag" and "Push version bump" steps' env, not either scope.
    permissions:
      contents: write
      id-token: write
    # No cache is restored in a job that holds a credential.
    cache-mode: none
    outputs:
      version: ${{ needs.pi_legion_build.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pi-legion-tarball
          path: tarball

      # As envoy_plugin_publish's: the tarball is named from the version and the committed manifest,
      # and release-push.sh handed checks the artifact is exactly that file before anything acts on it.
      - name: Check the hand-over
        id: handed
        env:
          VERSION: ${{ needs.pi_legion_build.outputs.version }}
        run: |
          name=$(jq -r .name packages/pi-legion/package.json)
          stem="${name#@}"
          stem="${stem//\//-}-$VERSION"
          tag=$(.github/scripts/release-push.sh handed pi-legion-v "$VERSION" tarball "$stem.tgz")
          { echo "tag=$tag"; echo "stem=$stem"; } >> "$GITHUB_OUTPUT"

      - name: Set release version
        env:
          VERSION: ${{ needs.pi_legion_build.outputs.version }}
        run: |
          jq --arg v "$VERSION" '.version = $v' \
            packages/pi-legion/package.json > tmp.json \
            && mv tmp.json packages/pi-legion/package.json

      - name: Publish to npm
        env:
          VERSION: ${{ needs.pi_legion_build.outputs.version }}
          STEM: ${{ steps.handed.outputs.stem }}
        run: |
          if npm view "$(jq -r .name package.json)@$VERSION" version >/dev/null 2>&1; then
            echo "npm already has $VERSION; skipping publish"
          else
            npm publish "$GITHUB_WORKSPACE/tarball/$STEM.tgz" --access public --provenance
          fi
        working-directory: packages/pi-legion

      - name: Commit and tag
        env:
          VERSION: ${{ needs.pi_legion_build.outputs.version }}
          TAG: ${{ steps.handed.outputs.tag }}
        run: |
          .github/scripts/release-push.sh tag packages/pi-legion \
            "chore: release pi-legion v$VERSION [skip ci]" "$TAG"

      # The deploy key reaches this step and "Push version bump" alone; the tag goes first, the bump
      # commit last, as in envoy_plugin_publish.
      - name: Push tag
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          TAG: ${{ steps.handed.outputs.tag }}
        run: .github/scripts/release-push.sh push-tag "$TAG"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.handed.outputs.tag }}
          VERSION: ${{ needs.pi_legion_build.outputs.version }}
          STEM: ${{ steps.handed.outputs.stem }}
        run: .github/scripts/release-push.sh release "$TAG" "Pi Legion v$VERSION" "tarball/$STEM.tgz"

      - name: Push version bump
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          VERSION: ${{ needs.pi_legion_build.outputs.version }}
        run: .github/scripts/release-push.sh push-main packages/pi-legion "$VERSION"
