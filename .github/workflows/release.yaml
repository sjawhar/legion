name: Release Packages

on:
  push:
    branches: [main]
    paths:
      - "package.json"
      - "bun.lock"
      - "patches/**"
      - "packages/contracts/package.json"
      - "packages/envoy-client/package.json"
      - "packages/pi-envoy/package.json"
      - "packages/pi-legion/package.json"
      - "packages/pi-shared/package.json"
      - "packages/envoy-plugin/package.json"
      - "packages/claude-envoy/package.json"
      - "packages/proof-editor/package.json"
      - "packages/dispatch/package.json"
      - "packages/envoy/internal/dispatch/pmdoc/gen/package.json"
      - "docs/site/package.json"
      - "packages/daemon/**"
      - "go.work"
      - "go.work.sum"
      - "packages/envoy/**"
      - "packages/envoy-plugin/**"
      - "packages/envoy-client/**"
      - "packages/contracts/**"
      - "packages/pi-envoy/**"
      - "packages/pi-legion/**"
      - "packages/pi-shared/**"
      - "skills/**"
      # The two plugins' shared prepack, which stages each one's skills and writes its notices.
      - "scripts/pi-plugin-prepack.sh"
      # The notices each artifact ships: the bundles', the Go binaries' and the worker image's, and
      # the Go archives' target list.
      - "scripts/third-party-notices.ts"
      - "scripts/go-third-party-notices.sh"
      - "scripts/assemble-third-party-notices.sh"
      - ".github/go-release-targets.json"
      # The worker image's remaining inputs (worker_image below).
      - ".omp-pin"
      - ".dockerignore"
      - ".github/workflows/worker-image.yaml"
  workflow_dispatch:

# Every job declares its own permissions (changes, legion, worker_image, worker_image_release_note,
# envoy_plugin, pi_envoy, pi_legion below); nothing runs under this workflow-level default, so it
# stays empty rather than becoming an unreviewed grant to a job added later with no block of its own.
permissions: {}

concurrency:
  # Only one run at a time by design, and a pending run GitHub drops in favor of a newer one
  # loses nothing: `changes`' base step below diffs since the last *successful* run, not this
  # run's commit alone, so the next run picks up every commit a dropped run skipped.
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-24.04
    # contents: read is for the checkout; actions: read is for the run list the base step reads.
    permissions:
      contents: read
      actions: read
    outputs:
      legion: ${{ steps.filter.outputs.legion }}
      envoy_plugin: ${{ steps.filter.outputs.envoy_plugin }}
      pi_envoy: ${{ steps.filter.outputs.pi_envoy }}
      pi_legion: ${{ steps.filter.outputs.pi_legion }}
      worker_image: ${{ steps.filter.outputs.worker_image }}
    steps:
      # Full history, for the base step's ancestry check.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # The filters compare against the commit the last successful run of this workflow on main
      # checked out, not against the push's own before-sha. GitHub keeps one pending run per
      # concurrency group and cancels it when a newer push queues behind it, and a run can fail
      # after releasing some packages and before others; comparing against the push alone would
      # leave those commits to no run. Every job versions from its package's last tag, so a commit
      # two ranges hold releases once. The range also holds the version-bump commits
      # (`[skip ci]`) that run pushed after its checkout: after each npm release, the next run
      # starts that package's job, which finds nothing since its tag and skips, and builds a
      # sha- worker image.
      #
      # Only push and workflow_dispatch runs count: only the repository's writers create those,
      # and a fork's pull request run can carry a branch named main and a commit of the fork's
      # choosing. The base must also be in this commit's history. The lookup reads this run's own
      # workflow, so a renamed file reads its own runs, and a workflow_dispatch skips it and the
      # filters, since every job runs on a dispatch; a dispatch on main is how a renamed workflow
      # gets its first base.
      - name: Find the commit the last successful run checked out
        id: base
        if: github.event_name != 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          workflow=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .workflow_id)
          newest() {
            gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?branch=main&event=$1&status=success&per_page=1" \
              --jq '.workflow_runs[] | "\(.created_at) \(.head_sha)"'
          }
          # Each query is its own assignment, so the step's `set -e` stops on gh's own error rather
          # than awk reading an error body as a commit.
          push=$(newest push)
          dispatch=$(newest workflow_dispatch)
          sha=$(printf '%s\n' "$push" "$dispatch" | sort -r | awk 'NR == 1 { print $2 }')
          if [ -z "$sha" ]; then
            echo "::error::No successful push or workflow_dispatch run of this workflow on main to compare against; run it once with workflow_dispatch on main"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$sha" HEAD; then
            echo "::error::$sha, the commit the last successful run checked out, is not in the history of $GITHUB_SHA; run it once with workflow_dispatch on main"
            exit 1
          fi
          echo "Changes since $sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          base: ${{ steps.base.outputs.sha }}
          filters: |
            # The Go `legion` the legion job releases and worker.Dockerfile's go stage compiles: its
            # module, which embeds the role prompts, the modules go.work binds it to (packages/envoy
            # is also copied whole into the image for the agent-secrets binary it builds), the
            # notices scripts that change its archives or worker image, and the list of the
            # targets it builds.
            legion:
              - 'packages/daemon/**'
              - 'go.work'
              - 'go.work.sum'
              - 'packages/envoy/**'
              - 'scripts/go-third-party-notices.sh'
              - 'scripts/assemble-third-party-notices.sh'
              - '.github/go-release-targets.json'
            envoy_plugin:
              - 'packages/envoy-plugin/**'
              - 'packages/envoy-client/**'
              - 'packages/contracts/**'
              - 'skills/**'
              - 'scripts/third-party-notices.ts'
            # The two Oh My Pi plugins, each with the workspace packages its bundle inlines, the
            # skills scripts/pi-plugin-prepack.sh stages into its tarball (the Envoy plugin's four,
            # the Legion plugin's eight: the partition that script holds), and the two scripts the
            # pack runs.
            pi_envoy:
              - 'packages/pi-envoy/**'
              - 'packages/pi-shared/**'
              - 'packages/envoy-client/**'
              - 'packages/contracts/**'
              - 'skills/dispatch/**'
              - 'skills/dispatch-first/**'
              - 'skills/dispatch-brainstorming/**'
              - 'skills/envoy/**'
              - 'scripts/third-party-notices.ts'
              - 'scripts/pi-plugin-prepack.sh'
            pi_legion:
              - 'packages/pi-legion/**'
              - 'packages/pi-shared/**'
              - 'packages/envoy-client/**'
              - 'packages/contracts/**'
              - 'skills/legion-architect/**'
              - 'skills/legion-controller/**'
              - 'skills/legion-oracle/**'
              - 'skills/legion-retro/**'
              - 'skills/legion-worker/**'
              - 'skills/ce-simplify-code/**'
              - 'skills/thermonuclear-code-quality/**'
              - 'skills/thermonuclear-deep-review/**'
              - 'scripts/third-party-notices.ts'
              - 'scripts/pi-plugin-prepack.sh'
            # The plugin stage's frozen install needs the root manifest, lockfile, patches, and each
            # root-workspace manifest. Keep this explicit because a workspace can affect Bun's
            # install without its source becoming part of the worker image. The OMP pin, the
            # context's .dockerignore and the called workflow change the image too. With legion
            # (which holds the Dockerfile, packages/daemon/docker, and the notices scripts),
            # pi_envoy and pi_legion this covers every file worker.Dockerfile builds from;
            # .github/scripts/check-image-trigger-paths.sh fails the build when it misses one.
            worker_image:
              - 'package.json'
              - 'bun.lock'
              - 'patches/**'
              - 'packages/contracts/package.json'
              - 'packages/envoy-client/package.json'
              - 'packages/pi-envoy/package.json'
              - 'packages/pi-legion/package.json'
              - 'packages/pi-shared/package.json'
              - 'packages/envoy-plugin/package.json'
              - 'packages/claude-envoy/package.json'
              - 'packages/proof-editor/package.json'
              - 'packages/dispatch/package.json'
              - 'packages/envoy/internal/dispatch/pmdoc/gen/package.json'
              - 'docs/site/package.json'
              - '.omp-pin'
              - '.dockerignore'
              - '.github/workflows/worker-image.yaml'

  # The Go `legion`: linux and darwin archives of the binary, which embeds its role prompts, with
  # its THIRD_PARTY_NOTICES, on a legion-v* tag of the commit the run checked out. Nothing is
  # committed: a Go module carries no version file, so the tag alone records the version, and
  # `legion version` names it. Only main releases one: a workflow_dispatch from another branch skips
  # this job, and the worker image job below then publishes that commit's sha- tag alone, as it does
  # for any branch.
  legion:
    needs: [changes, pi_envoy, pi_legion]
    if: >-
      always() &&
      github.ref == 'refs/heads/main' &&
      (needs.changes.outputs.legion == 'true' || github.event_name == 'workflow_dispatch') &&
      (needs.pi_envoy.result == 'success' || needs.pi_envoy.result == 'skipped') &&
      (needs.pi_legion.result == 'success' || needs.pi_legion.result == 'skipped')
    runs-on: ubuntu-24.04
    # contents: write creates the GitHub release (`release-push.sh release`, below); id-token and
    # attestations: write are for the archives' provenance attestation (id-token is the Sigstore
    # signing certificate's OIDC token). The tag push uses the deploy key, not either scope.
    permissions:
      contents: write
      id-token: write
      attestations: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      release_tag: ${{ steps.version.outputs.release_tag }}
      pi_legion_version: ${{ steps.plugin_versions.outputs.pi_legion_version }}
      pi_envoy_version: ${{ steps.plugin_versions.outputs.pi_envoy_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ssh-key: ${{ secrets.DEPLOY_KEY }}
          fetch-depth: 0
      - name: Resolve plugin versions for the smoke test and worker image
        id: plugin_versions
        env:
          PI_LEGION_VERSION: ${{ needs.pi_legion.outputs.version }}
          PI_ENVOY_VERSION: ${{ needs.pi_envoy.outputs.version }}
        run: |
          # Non-empty means pi_legion/pi_envoy published this run; otherwise this run's checkout
          # (at the triggering commit) still holds the manifest's last published version, since the
          # bump commit a publish makes lands on main only after that job's own push.
          legion_version="$PI_LEGION_VERSION"
          if [ -z "$legion_version" ]; then
            legion_version=$(jq -r '.version // empty' packages/pi-legion/package.json)
          fi
          envoy_version="$PI_ENVOY_VERSION"
          if [ -z "$envoy_version" ]; then
            envoy_version=$(jq -r '.version // empty' packages/pi-envoy/package.json)
          fi
          if [ -z "$legion_version" ]; then
            echo "::error::Could not resolve @sjawhar/pi-legion version"
            exit 1
          fi
          if [ -z "$envoy_version" ]; then
            echo "::error::Could not resolve @sjawhar/pi-envoy version"
            exit 1
          fi
          {
            echo "pi_legion_version=$legion_version"
            echo "pi_envoy_version=$envoy_version"
          } >> "$GITHUB_OUTPUT"
      - name: Determine next version
        id: version
        run: |
          # A re-run after "Tag release" pushed the tag checks out this same commit with that tag at
          # HEAD, where the range below would be empty and skip the release it never finished.
          # Release that tag again instead (release-push.sh, `tagged`, which refuses a tag that is
          # not legion-vX.Y.Z): "Tag release" accepts its own tag at this commit and "Create GitHub
          # release" reuses a published release and publishes a draft one.
          TAGGED=$(.github/scripts/release-push.sh tagged legion-v)
          if [ -n "$TAGGED" ]; then
            {
              echo "version=${TAGGED#legion-v}"
              echo "release_tag=$TAGGED"
              echo "skip=false"
            } >> "$GITHUB_OUTPUT"
            echo "Releasing $TAGGED, already at HEAD"
            exit 0
          fi
          PREV_TAG=$(git tag -l 'legion-v*' --sort=-v:refname | head -1)
          if [ -z "$PREV_TAG" ]; then
            # The first Go release continues the version line of the TypeScript CLI it replaces
            # (cli-v*), counting the Go module's commits since that CLI's last release.
            PREV_TAG=$(git tag -l 'cli-v*' --sort=-v:refname | head -1)
            test -n "$PREV_TAG"
            PREV_VERSION="${PREV_TAG#cli-v}"
          else
            PREV_VERSION="${PREV_TAG#legion-v}"
          fi
          # The binary embeds its prompts (internal/prompts/roles and go), so a docs: commit there
          # still releases. The notices scripts and the target list are runtime inputs of the
          # release archives and worker image, so any change to one needs a new tag rather than a
          # CI-only rebuild. release-bump.sh reads a --patch-path only when it is also one of the
          # paths after --.
          VERSION=$(.github/scripts/release-bump.sh "$PREV_VERSION" "${PREV_TAG}..HEAD" \
            --patch-path packages/daemon/internal/prompts/roles/ --patch-path packages/daemon/internal/prompts/go/ \
            --patch-path scripts/go-third-party-notices.sh --patch-path scripts/assemble-third-party-notices.sh \
            --patch-path .github/go-release-targets.json \
            -- packages/daemon/ packages/daemon/internal/prompts/roles/ packages/daemon/internal/prompts/go/ \
            scripts/go-third-party-notices.sh scripts/assemble-third-party-notices.sh .github/go-release-targets.json)

          if [ "$VERSION" = "empty" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "No commits in packages/daemon/ since $PREV_TAG"
            exit 0
          fi
          if [ "$VERSION" = "none" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=No release published::No version-bumping commits since $PREV_TAG"
            echo "**No release published** — No version-bumping commits since $PREV_TAG" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          {
            echo "version=$VERSION"
            echo "release_tag=legion-v${VERSION}"
            echo "skip=false"
          } >> "$GITHUB_OUTPUT"
          echo "Bumping $PREV_TAG -> legion-v${VERSION}"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.version.outputs.skip != 'true'
        with:
          go-version-file: packages/daemon/go.mod
          cache-dependency-path: |
            packages/daemon/go.sum
            packages/envoy/go.sum
      # CGO_ENABLED=0: a static binary, as the worker image builds it, so a linux archive runs on any
      # distribution. One archive per target .github/go-release-targets.json lists (the pull
      # request's notices check reads the same list), each holding one top-level directory,
      # legion-<os>-<arch>, with `legion` and THIRD_PARTY_NOTICES in it: mise's github backend
      # strips that one directory, leaving the binary. THIRD_PARTY_NOTICES is the license of every
      # Go module that target's binary compiles in (scripts/go-third-party-notices.sh, run with the
      # build's own GOOS, GOARCH and CGO_ENABLED), and fails the build when one cannot be determined.
      - name: Build legion
        if: steps.version.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PI_LEGION_VERSION: ${{ steps.plugin_versions.outputs.pi_legion_version }}
          PI_ENVOY_VERSION: ${{ steps.plugin_versions.outputs.pi_envoy_version }}
        run: |
          mkdir -p out assets
          for target in $(jq -r '.legion[]' .github/go-release-targets.json); do
            os=${target%/*}
            arch=${target#*/}
            dir="legion-$os-$arch"
            mkdir -p "out/$dir"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go -C packages/daemon build -buildvcs=false \
              -ldflags "-X main.revision=$GITHUB_SHA -X main.release=v$VERSION -X main.piLegionVersion=$PI_LEGION_VERSION -X main.piEnvoyVersion=$PI_ENVOY_VERSION" \
              -o "$GITHUB_WORKSPACE/out/$dir/legion" ./cmd/legion
            (cd packages/daemon && CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              ../../scripts/go-third-party-notices.sh "$GITHUB_WORKSPACE/out/$dir/THIRD_PARTY_NOTICES" ./cmd/legion)
            tar czf "assets/$dir.tar.gz" -C out "$dir"
          done
          (cd assets && sha256sum -- * > SHA256SUMS)
      - name: Smoke test
        if: steps.version.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PI_LEGION_VERSION: ${{ steps.plugin_versions.outputs.pi_legion_version }}
          PI_ENVOY_VERSION: ${{ steps.plugin_versions.outputs.pi_envoy_version }}
        run: |
          version=$(out/legion-linux-amd64/legion version)
          echo "$version"
          lines=$(printf '%s\n' "$version" | wc -l)
          test "$lines" -eq 2
          test "$(printf '%s\n' "$version" | sed -n '1p')" = "legion v$VERSION commit $GITHUB_SHA"
          test "$(printf '%s\n' "$version" | sed -n '2p')" = "plugins @sjawhar/pi-legion $PI_LEGION_VERSION @sjawhar/pi-envoy $PI_ENVOY_VERSION"
      # Build provenance for the archives a mise pin installs, which the release below uploads
      # exactly, so a downloaded asset is checked against a run of this workflow on main rather than
      # against SHA256SUMS, which sits in the same mutable release. `--repo` alone accepts an
      # archive any workflow of this repository attested, so the check pins the signer as
      # docs/kubernetes.md ("Pin by digest, never by tag") does:
      #   gh attestation verify legion-<os>-<arch>.tar.gz --repo sjawhar/legion \
      #     --cert-identity https://github.com/sjawhar/legion/.github/workflows/release.yaml@refs/heads/main \
      #     --source-ref refs/heads/main --deny-self-hosted-runners
      # and adds `--source-digest <the legion-v<version> tag's commit>` to pin the commit as well.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: steps.version.outputs.skip != 'true'
        with:
          subject-path: assets/legion-*.tar.gz
      - name: Tag release
        if: steps.version.outputs.skip != 'true'
        env:
          TAG: ${{ steps.version.outputs.release_tag }}
        run: |
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            test "$(git rev-list -n 1 "$TAG")" = "$GITHUB_SHA"
            exit 0
          fi
          git tag "$TAG"
          git push origin "refs/tags/$TAG"
      - name: Create GitHub release
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.release_tag }}
          VERSION: ${{ steps.version.outputs.version }}
        # release-push.sh `release`: creates the release, reuses a published one, or publishes a
        # draft an earlier attempt left, with this run's assets.
        run: .github/scripts/release-push.sh release "$TAG" "legion v$VERSION" assets/*

  worker_image:
    needs: [changes, legion]
    if: >-
      always() && (needs.legion.result == 'success' || needs.legion.result == 'skipped') &&
      (needs.changes.outputs.legion == 'true' || needs.changes.outputs.pi_envoy == 'true' ||
      needs.changes.outputs.pi_legion == 'true' || needs.changes.outputs.worker_image == 'true' ||
      github.event_name == 'workflow_dispatch')
    uses: ./.github/workflows/worker-image.yaml
    # No `secrets:`: the called workflow reads only GITHUB_TOKEN, which it receives automatically;
    # `inherit` would hand DEPLOY_KEY and every other repository secret to a job that runs a
    # PR-authored Dockerfile. This job's permissions must cover every scope worker-image.yaml's
    # `permissions:` blocks declare: its workflow-level block (the build) and its `attest` job's
    # (id-token and attestations: write, for the image's GitHub attestation). The release note, the
    # one step needing contents: write, is worker_image_release_note below.
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    with:
      legion_version: ${{ needs.legion.outputs.version }}
      pi_legion_version: ${{ needs.legion.outputs.pi_legion_version }}
      pi_envoy_version: ${{ needs.legion.outputs.pi_envoy_version }}

  worker_image_release_note:
    needs: [legion, worker_image]
    if: needs.worker_image.result == 'success' && needs.legion.outputs.release_tag != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: write # gh release edit
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REF: ${{ needs.worker_image.outputs.ref }}
      RELEASE_TAG: ${{ needs.legion.outputs.release_tag }}
    steps:
      - name: Name the worker image on the legion release
        run: |
          test -n "$REF"
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json body -q .body > body.md
          # A whole-run rerun rebuilds the image under the same version tag, so an existing
          # "## Worker image" section is replaced rather than added to: the body names only the
          # digest the tag points at now. The section runs to the next heading of level 1 or 2.
          rest=$(awk '/^## Worker image[ \t\r]*$/ { skip = 1; next } skip && /^##? / { skip = 0 } !skip' body.md)
          if [ -n "$rest" ]; then
            printf '%s\n\n' "$rest" > notes.md
          else
            : > notes.md
          fi
          # shellcheck disable=SC2016 # literal Markdown backticks, no expansion wanted
          printf '## Worker image\n\n`%s`\n' "$REF" >> notes.md
          # $(<…) drops trailing newlines, so a body differing only in those is unchanged.
          if [ "$(<body.md)" = "$(<notes.md)" ]; then
            echo "Release $RELEASE_TAG already names $REF"
            exit 0
          fi
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --notes-file notes.md

  envoy_plugin:
    needs: changes
    if: needs.changes.outputs.envoy_plugin == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    # contents: write creates the GitHub release (`release-push.sh release`, below); id-token: write is
    # the OIDC token npm trusted publishing exchanges for the publish credential (the registry
    # records `trustedPublisher: github` for this package; no NPM_TOKEN is set) and that also signs
    # provenance (`npm publish --provenance`). The tag push and version-bump commit use the deploy
    # key, not either scope.
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ssh-key: ${{ secrets.DEPLOY_KEY }}
          fetch-depth: 0

      - uses: ./.github/actions/setup-bun
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Determine next version
        id: version
        run: |
          # A re-run after "Commit and tag" pushed the tag checks out this same commit with that
          # tag, where the range below would be empty and skip the release it never finished.
          # Release that tag again instead (release-push.sh, `tagged`); every later step is safe to
          # repeat: npm reuses a published version, `release-push.sh release` reuses a published
          # release and publishes a draft one, `tag` accepts its own tag, and `push-main` pushes
          # nothing once main holds this version or a later one.
          TAGGED=$(.github/scripts/release-push.sh tagged opencode-legion-envoy-v packages/envoy-plugin)
          if [ -n "$TAGGED" ]; then
            echo "version=${TAGGED#opencode-legion-envoy-v}" >> "$GITHUB_OUTPUT"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Releasing $TAGGED, which an earlier attempt pushed for this commit"
            exit 0
          fi
          # The package's prepack copies skills/ into the tarball (package.json "prepack"), where
          # OpenCode loads it as the plugin's skills, so a commit there releases whatever its type.
          # Its notices generator is another shipped build input, so it gets the same patch release.
          PREV_TAG=$(git tag -l 'opencode-legion-envoy-v*' --sort=-v:refname | head -1)
