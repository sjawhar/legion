            RANGE="${PREV_TAG}..HEAD"
          fi
          VERSION=$(.github/scripts/release-bump.sh "$PREV_VERSION" "$RANGE" \
            --patch-path skills/dispatch/ --patch-path skills/dispatch-first/ \
            --patch-path skills/dispatch-brainstorming/ --patch-path skills/envoy/ \
            --patch-path scripts/third-party-notices.ts --patch-path scripts/pi-plugin-prepack.sh \
            -- packages/pi-envoy/ packages/pi-shared/ packages/envoy-client/ packages/contracts/ \
            skills/dispatch/ skills/dispatch-first/ skills/dispatch-brainstorming/ skills/envoy/ \
            scripts/third-party-notices.ts scripts/pi-plugin-prepack.sh)

          if [ "$VERSION" = "empty" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=No release published::No commits in tracked paths since ${PREV_TAG:-beginning}"
            echo "**No release published** — No commits in tracked paths since ${PREV_TAG:-beginning}" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$VERSION" = "none" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=No release published::No version-bumping commits since ${PREV_TAG:-beginning}"
            echo "**No release published** — No version-bumping commits since ${PREV_TAG:-beginning}" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "Bumping pi-envoy-v${PREV_VERSION} -> pi-envoy-v${VERSION}"

      - name: Set release version
        if: steps.version.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          jq --arg v "$VERSION" '.version = $v' \
            packages/pi-envoy/package.json > tmp.json \
            && mv tmp.json packages/pi-envoy/package.json

      - name: Point extensions at the packed bundle
        if: steps.version.outputs.skip != 'true'
        run: |
          # The committed manifest keeps the source path (extensions/envoy.ts) so repo checkouts
          # (dev sessions) load the source without a build. The published tarball ships only the
          # self-contained dist bundle, and scripts/pi-plugin-prepack.sh refuses to pack any other
          # omp.extensions.
          cp packages/pi-envoy/package.json "$RUNNER_TEMP/pi-envoy-manifest.json"
