name: Release Packages

on:
  push:
    branches: [main]
    paths:
      - "package.json"
      - "bun.lock"
      - "patches/**"
      - "packages/contracts/package.json"
      - "packages/envoy-client/package.json"
      - "packages/broker-client/package.json"
      - "packages/pi-envoy/package.json"
      - "packages/pi-legion/package.json"
      - "packages/pi-shared/package.json"
      - "packages/claude-envoy/**"
      - "packages/proof-editor/package.json"
      - "packages/dispatch/package.json"
      - "packages/envoy/internal/dispatch/pmdoc/gen/package.json"
      - "docs/site/package.json"
      - "packages/daemon/**"
      - "go.work"
      - "go.work.sum"
      - "packages/envoy/**"
      - "packages/envoy-client/**"
      - "packages/broker-client/**"
      - "packages/contracts/**"
      - "packages/pi-envoy/**"
      - "packages/pi-legion/**"
      - "packages/pi-shared/**"
      - "skills/**"
      # The two plugins' shared prepack, which stages each one's skills and writes its notices.
      - "scripts/pi-plugin-prepack.sh"
      # The notices each artifact ships: the bundles', the Go binaries' and the worker image's, and
      # the Go archives' target list.
      - "scripts/third-party-notices.ts"
      - "scripts/go-third-party-notices.sh"
      - "scripts/assemble-third-party-notices.sh"
      - ".github/go-release-targets.json"
      # The worker image's remaining inputs (worker_image below).
      - ".omp-pin"
      - ".bun-version"
      - ".dockerignore"
      - ".github/workflows/worker-image.yaml"
  workflow_dispatch:

# Every job declares its own permissions (legion_build, pi_envoy_build, pi_legion_build,
# claude_envoy_build, publish,
# worker_image, worker_image_attest, worker_image_release below); nothing runs under this
# workflow-level default, so it stays empty rather than becoming an unreviewed grant to a job
# added later with no block of its own.
#
# Each package is built by a build job of its own and published by the one publish job. A build job
# versions, installs, packs, builds and tests: it runs the dependencies' code and every third-party
# module it links, so it holds no write scope and no secret, uploads what it made as an artifact,
# and ends in a tripwire (`release-push.sh no-credential`) that fails when a credential is reachable
# from it anyway. The publish job holds the credentials and runs no dependency code: only
# release-push.sh, git, gh, jq, sha256sum, npm (view, and publish of a handed tarball) and the
# pinned actions below, with no cache restored (`cache-mode: none`) and the deploy key in the env
# of the steps that push. release-push.sh handed checks what each build job handed over before
# anything acts on it.
#
# So a release waits for a runner three times: for the four build jobs together; for publish beside
# worker_image's build; and for worker_image_attest's attestation beside worker_image_release. Each
# stage holds what the one before it may not: publish cannot run in a job that built what it
# publishes, the image build needs the plugin pair legion_build decides, and the attestation, which
# holds id-token and attestations: write, cannot run in the job that ran the Dockerfile.
#
# Every job condition downstream of a skippable job takes one shape: `always() &&
# needs.<job>.result == 'success' && …` before it reads that job's outputs. GitHub gives an `if:`
# that calls no status function an implicit `success()`, false whenever any job upstream through
# `needs`, at any distance, was skipped (actions/runner#491), so a condition reading a build's
# `skip` output without `always()` never decides anything once some plugin job upstream skipped:
# that is what skipped legion's publish job in the first run on the build/publish split (run
# 38822866387) while legion_build had cut a version. `always()` turns that gating off, so each such
# condition tests the result of every job whose outputs it reads, else a skipped or failed job is
# read through its empty outputs. check-release-credentials.sh rule 5 pins it.
permissions: {}

concurrency:
  # Only one run at a time by design, and a pending run GitHub replaces with a newer one loses
  # nothing: each build releases every commit in its package's paths since that package's last tag,
  # not this run's commit alone, so the next run releases every commit a replaced run would have.
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Each package's version arguments, after its tag prefix: the one list its build job's version
  # step passes to `release-push.sh version`, and that legion_build passes for the two Oh My Pi
  # plugins too, to decide the plugin pair it links. A step expands one unquoted on purpose: it is
  # the argument list, split on its spaces. release-bump.sh reads a --patch-path only when it is
  # also one of the paths after --.
  #
  # The Envoy Oh My Pi plugin. The seed before the first pi-envoy-v* tag is the version line this
  # package continues, @sjawhar/pi-legion-envoy, which it was split from: its own name on npm holds
  # only a placeholder 0.0.0 until its first publish, so reading it would restart the line at 0.x.
  # scripts/pi-plugin-prepack.sh copies this plugin's ten skills into dist/skills, which every Oh
  # My Pi session loads as the plugin's skills, so a commit there releases whatever its type. Its
  # notices generator, the prepack itself and patches/ (the bundle inlines nats.js with
  # patches/nats@2.29.3.patch applied) are shipped build inputs too, so they get the same patch
  # release.
  PI_ENVOY_VERSION_ARGS: >-
    --first-npm @sjawhar/pi-legion-envoy
    --patch-path skills/agent-secrets/ --patch-path skills/asd-ste100/
    --patch-path skills/dispatch/ --patch-path skills/dispatch-first/
    --patch-path skills/dispatch-writing-specs/ --patch-path skills/envoy/
    --patch-path skills/outside-message/ --patch-path skills/plain-words/
    --patch-path skills/thermonuclear-code-quality/ --patch-path skills/thermonuclear-deep-review/
    --patch-path scripts/third-party-notices.ts --patch-path scripts/pi-plugin-prepack.sh
    --patch-path patches/
    -- packages/pi-envoy/ packages/pi-shared/ packages/envoy-client/ packages/contracts/
    packages/broker-client/
    skills/agent-secrets/ skills/asd-ste100/ skills/dispatch/ skills/dispatch-first/
    skills/dispatch-writing-specs/ skills/envoy/ skills/outside-message/ skills/plain-words/
    skills/thermonuclear-code-quality/ skills/thermonuclear-deep-review/
    scripts/third-party-notices.ts scripts/pi-plugin-prepack.sh patches/
  # The Legion Oh My Pi plugin, seeded as the Envoy one is. scripts/pi-plugin-prepack.sh copies
  # this plugin's seven skills into dist/skills, which a Legion pane's prompts load, so a commit
  # there releases whatever its type. Its notices generator, the prepack itself and patches/ (the
  # bundle inlines nats.js through envoy-client, with its patch applied) are shipped build inputs
  # too, so they get the same patch release.
  PI_LEGION_VERSION_ARGS: >-
    --first-npm @sjawhar/pi-legion-envoy
    --patch-path skills/legion-architect/ --patch-path skills/legion-controller/
    --patch-path skills/legion-oracle/ --patch-path skills/legion-retro/
    --patch-path skills/legion-worker/ --patch-path skills/leading-a-work-stream/
    --patch-path skills/simplify-settled-diff/
    --patch-path scripts/third-party-notices.ts --patch-path scripts/pi-plugin-prepack.sh
    --patch-path patches/
    -- packages/pi-legion/ packages/pi-shared/ packages/envoy-client/ packages/contracts/
    packages/broker-client/
    skills/legion-architect/ skills/legion-controller/ skills/legion-oracle/ skills/legion-retro/
    skills/legion-worker/ skills/leading-a-work-stream/ skills/simplify-settled-diff/
    scripts/third-party-notices.ts scripts/pi-plugin-prepack.sh patches/
  # The Claude Code plugin, @sjawhar/claude-envoy. Its build runs from
  # packages/claude-envoy/scripts/build-inputs.txt, the one statement of what can change this
  # plugin's bundles and its generated legion/ plugin, so the paths below are that list's, in its
  # order: this package, the workspace packages its bundles inline, pi-legion's agents and all of
  # skills/ (scripts/pi-plugin-prepack.sh stages pi-legion's share into legion/skills and this
  # package's skills/ links into skills/), the notices generator, the prepack and patches/ (the
  # bundles inline nats.js with patches/nats@2.29.3.patch applied). Everything after
  # packages/claude-envoy/ is content the plugin ships rather than documentation, so a docs:
  # commit there still releases: each is a --patch-path. Nothing has been published under this
  # name, so --first-npm seeds the line at npm's 0.0.0 and the first release bumps from the whole
  # history.
  CLAUDE_ENVOY_VERSION_ARGS: >-
    --first-npm @sjawhar/claude-envoy
    --patch-path packages/pi-shared/ --patch-path packages/envoy-client/
    --patch-path packages/contracts/ --patch-path packages/broker-client/
    --patch-path packages/pi-legion/agents/ --patch-path skills/
    --patch-path scripts/third-party-notices.ts --patch-path scripts/pi-plugin-prepack.sh
    --patch-path patches/
    -- packages/claude-envoy/ packages/pi-shared/ packages/envoy-client/ packages/contracts/
    packages/broker-client/ packages/pi-legion/agents/ skills/
    scripts/third-party-notices.ts scripts/pi-plugin-prepack.sh patches/
  # The Go `legion`. The binary embeds its prompts (internal/prompts/roles and go), so a docs:
  # commit there still releases. It also compiles in the two packages/envoy packages that
  # `go list -deps ./cmd/legion` in packages/daemon names, listenfd and roleholder, so a change to
  # either changes the binary. The notices scripts and the target list are runtime inputs of the
  # release archives and worker image, so any change to one needs a new tag rather than a CI-only
  # rebuild. The envoy packages below are every package `go list -deps ./cmd/legion` reaches
  # through the module's `replace` on ../envoy — its five public packages, and the internal ones
  # they pull in with them: the splitter, parser, contracts and text reader behind
  # `dispatchbody`, and the token client, its wire and the identity reader behind `brokerclient`
  # — so a change to any of them changes the binary and must release one, and the envoy module's
  # own go.mod and go.sum decide which versions of their dependencies it links. That list is
  # written here by hand; this is the command that prints it, to be run from packages/daemon
  # whenever what the binary links moves:
  #   go list -deps ./cmd/legion | grep '^github.com/sjawhar/envoy' |
  #     sed 's#^github.com/sjawhar/envoy#packages/envoy#' | sort
  LEGION_VERSION_ARGS: >-
    --patch-path packages/daemon/internal/prompts/roles/ --patch-path packages/daemon/internal/prompts/go/
    --patch-path scripts/go-third-party-notices.sh --patch-path scripts/assemble-third-party-notices.sh
    --patch-path .github/go-release-targets.json
    -- packages/daemon/ packages/daemon/internal/prompts/roles/ packages/daemon/internal/prompts/go/
    packages/envoy/brokerclient/ packages/envoy/dispatchbody/ packages/envoy/listenfd/
    packages/envoy/migrationid/ packages/envoy/roleholder/ packages/envoy/sessiontiming/
    packages/envoy/internal/broker/oauthwire/ packages/envoy/internal/brokerclient/
    packages/envoy/internal/contracts/ packages/envoy/internal/dispatch/itemblocks/
    packages/envoy/internal/dispatch/model/ packages/envoy/internal/dispatch/pmdoc/
    packages/envoy/internal/dispatch/text/ packages/envoy/internal/googleidentity/
    packages/envoy/go.mod packages/envoy/go.sum
    scripts/go-third-party-notices.sh scripts/assemble-third-party-notices.sh .github/go-release-targets.json

  # A `|` between proxy entries makes a go command fall through to the next source after ANY error,
  # where a `,` falls through only after a 404 or a 410 (Go's module reference, "GOPROXY protocol").
  # proxy.golang.org reset a download mid-stream and turned a Go lane red on a module whose hash
  # go.sum already holds (sjawhar/legion#2512); with `|direct` the command fetches the same bytes
  # straight from the source and checks them against go.sum, so this is a second path, not a weaker
  # check.
  GOPROXY: https://proxy.golang.org|direct

jobs:
  # The Go `legion`: linux and darwin archives of the binary, which embeds its role prompts, with
  # its THIRD_PARTY_NOTICES, on a legion-v* tag of the commit the run checked out. Nothing is
  # committed: a Go module carries no version file, so the tag alone records the version, and
  # `legion version` names it. Only main releases one: a workflow_dispatch from another branch skips
  # this job, and the worker image job below then publishes that commit's sha- tag alone, as it does
  # for any branch.
  #
  # legion_build versions, builds and smoke-tests the archives and hands them to publish as an
  # artifact. It runs the module's code and every third-party module it links, so it holds no write
  # scope and no secret: whatever that code does to this VM (a planted binary on the path, an
  # environment variable for later steps, the runner's memory) never meets the deploy key, the write
  # token or the OIDC token, which publish holds on a VM of its own.
  legion_build:
    # Only main releases, as above; a workflow_dispatch on main runs it as a push does.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # contents: read is for the checkout; nothing here writes to the repository, a registry or a
    # release.
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      skip: ${{ steps.version.outputs.skip }}
      pi_legion_version: ${{ steps.plugin_versions.outputs.pi_legion_version }}
      pi_envoy_version: ${{ steps.plugin_versions.outputs.pi_envoy_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # First, before setup-go: no dependency code has run and no cache has been restored when the
      # tags are read. release-push.sh version releases again a tag an earlier attempt pushed for
      # this commit (`tagged`, which refuses a tag that is not legion-vX.Y.Z; publish's "legion: Tag
      # release" accepts its own tag at this commit and its "legion: Create GitHub release" reuses a
      # published release and publishes a draft one), and otherwise bumps from the newest legion-v*
      # tag over the paths $LEGION_VERSION_ARGS names (the workflow's `env:` says why each is there).
      - name: Determine next version
        id: version
        run: |
          # shellcheck disable=SC2086 # $LEGION_VERSION_ARGS is the argument list, split on purpose
          .github/scripts/release-push.sh version legion-v $LEGION_VERSION_ARGS >> "$GITHUB_OUTPUT"
      # Also before setup-go, so no dependency code has run yet either: the plugin pair this legion
      # links, which the smoke test checks and the worker image installs. For each Oh My Pi plugin
      # it is the version that plugin's build job releases in this run, decided from the same tags
      # and the same arguments as that job's own version step, or, when the plugin has nothing to
      # release, the version of its newest tag, which npm carries: a release commits nothing, so
      # the committed manifest records no release and the tags alone say what was published. The
      # workflow's one concurrency group keeps one run of main at a time, so no other run moves a
      # tag between this step and the plugins' build jobs. publish's "legion: Check the linked
      # plugin pair" refuses to release this legion unless npm then carries exactly this pair.
      - name: Resolve plugin versions for the smoke test and worker image
        id: plugin_versions
        run: |
          # pair_member <version output> <tag prefix>: the version npm carries for the plugin in
          # this run. This step's own dispatch is which that is: the version the plugin releases,
          # or, when it skips, nothing, and release-push.sh pair-version then reads the version of
          # its newest tag, which is what npm carries. A newest tag whose name is not <tag
          # prefix>X.Y.Z, and no such tag at all, print nothing, which the guards below refuse.
          pair_member() {
            local released=''
            if [ "$(sed -n 's/^skip=//p' <<<"$1")" != true ]; then
              released=$(sed -n 's/^version=//p' <<<"$1")
            fi
            .github/scripts/release-push.sh pair-version "$2" "$released"
          }
          # The plugins' own build jobs write their "No release published" summary lines; with
          # GITHUB_STEP_SUMMARY empty these two calls write none into this job's summary.
          # shellcheck disable=SC2086 # $PI_ENVOY_VERSION_ARGS is the argument list, split on purpose
          envoy=$(GITHUB_STEP_SUMMARY='' .github/scripts/release-push.sh version pi-envoy-v $PI_ENVOY_VERSION_ARGS)
          # shellcheck disable=SC2086 # $PI_LEGION_VERSION_ARGS is the argument list, split on purpose
          legion=$(GITHUB_STEP_SUMMARY='' .github/scripts/release-push.sh version pi-legion-v $PI_LEGION_VERSION_ARGS)
          envoy_version=$(pair_member "$envoy" pi-envoy-v)
          legion_version=$(pair_member "$legion" pi-legion-v)
          if [ -z "$legion_version" ]; then
            echo "::error::Could not resolve @sjawhar/pi-legion version"
            exit 1
          fi
          if [ -z "$envoy_version" ]; then
            echo "::error::Could not resolve @sjawhar/pi-envoy version"
            exit 1
          fi
          {
            echo "pi_legion_version=$legion_version"
            echo "pi_envoy_version=$envoy_version"
          } >> "$GITHUB_OUTPUT"
      - id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.version.outputs.skip != 'true'
        with:
          go-version-file: packages/daemon/go.mod
          cache: false
      # ci.yaml's go-daemon, restored and never saved: .github/workflows/ci-caches.yaml fills that
      # family on a push to main.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.version.outputs.skip != 'true'
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-daemon-${{ runner.os }}-go${{ steps.setup-go.outputs.go-version }}
          restore-keys: go-daemon-${{ runner.os }}-
      # CGO_ENABLED=0: a static binary, as the worker image builds it, so a linux archive runs on any
      # distribution. One archive per target .github/go-release-targets.json lists (the pull
      # request's notices check reads the same list), each holding one top-level directory,
      # legion-<os>-<arch>, with `legion` and THIRD_PARTY_NOTICES in it: mise's github backend
      # strips that one directory, leaving the binary. THIRD_PARTY_NOTICES is the license of every
      # Go module that target's binary compiles in (scripts/go-third-party-notices.sh, run with the
      # build's own GOOS, GOARCH and CGO_ENABLED), and fails the build when one cannot be determined.
      # publish writes SHA256SUMS over the archives it accepts.
      - name: Build legion
        if: steps.version.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PI_LEGION_VERSION: ${{ steps.plugin_versions.outputs.pi_legion_version }}
          PI_ENVOY_VERSION: ${{ steps.plugin_versions.outputs.pi_envoy_version }}
        run: |
          mkdir -p out assets
          for target in $(jq -r '.legion[]' .github/go-release-targets.json); do
            os=${target%/*}
            arch=${target#*/}
            dir="legion-$os-$arch"
            mkdir -p "out/$dir"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go -C packages/daemon build -buildvcs=false \
              -ldflags "-X main.revision=$GITHUB_SHA -X main.release=v$VERSION -X main.piLegionVersion=$PI_LEGION_VERSION -X main.piEnvoyVersion=$PI_ENVOY_VERSION" \
              -o "$GITHUB_WORKSPACE/out/$dir/legion" ./cmd/legion
            (cd packages/daemon && CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              ../../scripts/go-third-party-notices.sh "$GITHUB_WORKSPACE/out/$dir/THIRD_PARTY_NOTICES" ./cmd/legion)
            tar czf "assets/$dir.tar.gz" -C out "$dir"
          done
      - name: Smoke test
        if: steps.version.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PI_LEGION_VERSION: ${{ steps.plugin_versions.outputs.pi_legion_version }}
          PI_ENVOY_VERSION: ${{ steps.plugin_versions.outputs.pi_envoy_version }}
        run: |
          version=$(out/legion-linux-amd64/legion version)
          echo "$version"
          lines=$(printf '%s\n' "$version" | wc -l)
          test "$lines" -eq 2
          test "$(printf '%s\n' "$version" | sed -n '1p')" = "legion v$VERSION commit $GITHUB_SHA"
          test "$(printf '%s\n' "$version" | sed -n '2p')" = "plugins @sjawhar/pi-legion $PI_LEGION_VERSION @sjawhar/pi-envoy $PI_ENVOY_VERSION"
      # The archives, exactly as built and smoke-tested, for publish.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.version.outputs.skip != 'true'
        with:
          name: legion-assets
          path: assets/
          if-no-files-found: error
      - name: Check this job holds no credential (tripwire)
        run: .github/scripts/release-push.sh no-credential

  # The Envoy Oh My Pi plugin, @sjawhar/pi-envoy. pi_envoy_build versions it, installs the
  # workspace and packs it (the dependencies' code, so no write scope and no secret), and hands the
  # tarball to publish, which publishes those bytes to npm, tags the release and creates the
  # GitHub release. Nothing is committed: the tag records the version.
  pi_envoy_build:
    # Only main publishes: a workflow_dispatch from another branch skips this job and publish, so
    # no branch build ever reaches npm or moves `latest` (AGENTS.md, "Deploys come only from
    # main"). A workflow_dispatch on main runs it as a push does.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # contents: read is for the checkout; nothing here writes to the repository, a registry or a
    # release.
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      skip: ${{ steps.version.outputs.skip }}
      notes: ${{ steps.notes.outputs.notes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # First, before setup-bun: no dependency code has run and no cache has been restored when the
      # tags are read. A re-run after publish's "pi-envoy: Push tag" pushed the tag checks out this
      # same commit with that tag on it, where the range would be empty and skip the release it
      # never finished; release-push.sh version releases that tag again instead (`tagged`), and
      # every publish step is safe to repeat: npm reuses a published version, `release-push.sh
      # release` reuses a published release and publishes a draft one, and `tag` accepts its own
      # tag on this commit. Otherwise it bumps from the newest pi-envoy-v* tag over the paths
      # $PI_ENVOY_VERSION_ARGS names (the workflow's `env:` says why each is there).
      - name: Determine next version
        id: version
        run: |
          # shellcheck disable=SC2086 # $PI_ENVOY_VERSION_ARGS is the argument list, split on purpose
          .github/scripts/release-push.sh version pi-envoy-v $PI_ENVOY_VERSION_ARGS >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/install-changie
        if: steps.version.outputs.skip != 'true'

      # This release's own changelog entries, which publish writes into the GitHub release's body.
      # A fragment stays under packages/pi-envoy/.changes/unreleased/ after the release that ships
      # it, so fold-notes renders the ones this release's own commits first added, which are the
      # ones its tag will hold. A release no fragment belongs to renders no file, and the `notes`
      # line fold-notes prints says which of the two it was, since publish cannot look into the
      # artifact before it downloads it.
      - name: Render this release's changelog entries
        id: notes
        if: steps.version.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          .github/scripts/release-push.sh fold-notes "$VERSION" \
            "$RUNNER_TEMP/release-notes.md" packages/pi-envoy pi-envoy-v >> "$GITHUB_OUTPUT"

      # The entries, exactly as rendered, for publish; a release with none uploads nothing at all.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.version.outputs.skip != 'true' && steps.notes.outputs.notes == 'true'
        with:
          name: pi-envoy-notes
          path: ${{ runner.temp }}/release-notes.md
          if-no-files-found: error

      - uses: ./.github/actions/setup-bun
        if: steps.version.outputs.skip != 'true'

      - name: Install dependencies
        if: steps.version.outputs.skip != 'true'
        run: bun install --frozen-lockfile

      - name: Set release version
        if: steps.version.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          jq --arg v "$VERSION" '.version = $v' \
            packages/pi-envoy/package.json > tmp.json \
            && mv tmp.json packages/pi-envoy/package.json

      - name: Point extensions at the packed bundle
        if: steps.version.outputs.skip != 'true'
        run: |
          # The committed manifest keeps the source path (extensions/envoy.ts) so repo checkouts
          # (dev sessions) load the source without a build. The published tarball ships only the
          # self-contained dist bundle, and scripts/pi-plugin-prepack.sh refuses to pack any other
          # omp.extensions. Nothing restores the manifest: this job's tree is discarded, and no job
          # commits a version, so the committed manifest keeps whatever it last held.
          jq '.omp.extensions = ["dist/envoy.js"]' \
            packages/pi-envoy/package.json > tmp.json \
            && mv tmp.json packages/pi-envoy/package.json

      - name: Point the manifest at the publishing repository
        if: steps.version.outputs.skip != 'true'
        run: |
          # npm matches a package's repository.url against the repository publishing it, case for
          # case, and refuses a publish with provenance whose url is not that repository's (npm
          # docs, "Generating provenance statements", Prerequisites; the registry answers E422
          # "Error verifying sigstore provenance bundle: Failed to validate repository
          # information"). The publish job hands npm this job's tarball exactly as packed and
          # never repacks it, so the field has to be right here, before the pack below.
          #
          # The committed manifest is left alone: it holds today's repository, which is true
          # today, and this step writes whichever repository the job runs in, so moving the
          # repository to another owner or name needs no commit. Nothing restores it, as with the
          # rewrites above: this job's tree is discarded.
          url=$(.github/scripts/repo-paths.sh repository_url)
          jq --arg u "$url" '.repository.url = $u' \
            packages/pi-envoy/package.json > tmp.json \
            && mv tmp.json packages/pi-envoy/package.json

      - name: Pack extension
        if: steps.version.outputs.skip != 'true'
        run: rm -f ./*.tgz && bun pm pack
        working-directory: packages/pi-envoy

      - name: Check the packed tarball names the publishing repository
        if: steps.version.outputs.skip != 'true'
        run: |
          # Read repository.url back out of the tarball the publish job will hand npm, not out of
          # the working tree the step above wrote: npm refuses a publish with provenance whose url
          # is not the publishing repository's, so this is the check that catches a regression at
          # the moment it would refuse the publish, here in the build job rather than in the job
          # holding the credentials.
          url=$(.github/scripts/repo-paths.sh repository_url)
          tar -xzOf packages/pi-envoy/*.tgz package/package.json \
            | jq -e --arg u "$url" '.repository.url == $u'

      # The tarball, exactly as packed, for publish.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.version.outputs.skip != 'true'
        with:
          name: pi-envoy-tarball
          path: packages/pi-envoy/*.tgz
          if-no-files-found: error

      - name: Check this job holds no credential (tripwire)
        run: .github/scripts/release-push.sh no-credential

  # The Legion Oh My Pi plugin, @sjawhar/pi-legion, built and published as @sjawhar/pi-envoy is.
  pi_legion_build:
    # Only main publishes, as pi_envoy_build says.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # contents: read is for the checkout; nothing here writes to the repository, a registry or a
    # release.
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      skip: ${{ steps.version.outputs.skip }}
      notes: ${{ steps.notes.outputs.notes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # First, before setup-bun, as pi_envoy_build's version step is, and releasing again a tag
      # an earlier attempt pushed for this commit as that step does, over the paths
      # $PI_LEGION_VERSION_ARGS names (the workflow's `env:` says why each is there).
      - name: Determine next version
        id: version
        run: |
          # shellcheck disable=SC2086 # $PI_LEGION_VERSION_ARGS is the argument list, split on purpose
          .github/scripts/release-push.sh version pi-legion-v $PI_LEGION_VERSION_ARGS >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/install-changie
        if: steps.version.outputs.skip != 'true'

      # This release's own changelog entries, as in pi_envoy_build and for the reasons given
      # there: the fragments this release's own commits first added, and the `notes` line
      # fold-notes prints says whether there were any.
      - name: Render this release's changelog entries
        id: notes
        if: steps.version.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          .github/scripts/release-push.sh fold-notes "$VERSION" \
            "$RUNNER_TEMP/release-notes.md" packages/pi-legion pi-legion-v >> "$GITHUB_OUTPUT"

      # The entries, exactly as rendered, for publish; a release with none uploads nothing at all.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.version.outputs.skip != 'true' && steps.notes.outputs.notes == 'true'
        with:
          name: pi-legion-notes
          path: ${{ runner.temp }}/release-notes.md
          if-no-files-found: error

      - uses: ./.github/actions/setup-bun
        if: steps.version.outputs.skip != 'true'

      - name: Install dependencies
        if: steps.version.outputs.skip != 'true'
        run: bun install --frozen-lockfile

      - name: Set release version
        if: steps.version.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          jq --arg v "$VERSION" '.version = $v' \
            packages/pi-legion/package.json > tmp.json \
            && mv tmp.json packages/pi-legion/package.json

      - name: Point extensions at the packed bundle
        if: steps.version.outputs.skip != 'true'
        run: |
          # The committed manifest keeps the source path (extensions/legion.ts) so repo checkouts
          # (dev sessions) load the source without a build. The published tarball ships only the
          # self-contained dist bundle, and scripts/pi-plugin-prepack.sh refuses to pack any other
          # omp.extensions. legion.ts is inert without LEGION_TREE/LEGION_ROLE/LEGION_CONTROLLER in
          # the environment, so every installed session loading it is safe; the Legion daemon
          # relies on this single installed copy instead of a repo checkout. Nothing restores the
          # manifest: this job's tree is discarded, and no job commits a version, so the committed
          # manifest keeps whatever it last held.
          jq '.omp.extensions = ["dist/legion.js"]' \
            packages/pi-legion/package.json > tmp.json \
            && mv tmp.json packages/pi-legion/package.json

      - name: Point the manifest at the publishing repository
        if: steps.version.outputs.skip != 'true'
        run: |
          # As in pi_envoy_build, and for the reason given there: npm refuses a publish with
          # provenance whose repository.url is not the publishing repository's, case for case, and
          # the publish job packs nothing of its own. The committed manifest keeps today's
          # repository; this writes whichever one the job runs in, and this job's tree is
          # discarded.
          url=$(.github/scripts/repo-paths.sh repository_url)
          jq --arg u "$url" '.repository.url = $u' \
            packages/pi-legion/package.json > tmp.json \
            && mv tmp.json packages/pi-legion/package.json

      - name: Pack extension
        if: steps.version.outputs.skip != 'true'
        run: rm -f ./*.tgz && bun pm pack
        working-directory: packages/pi-legion

      - name: Check the packed tarball names the publishing repository
        if: steps.version.outputs.skip != 'true'
        run: |
          # pi_envoy_build's check, over this package's tarball: the packed manifest, which is
          # what npm verifies the provenance against, must name the publishing repository.
          url=$(.github/scripts/repo-paths.sh repository_url)
          tar -xzOf packages/pi-legion/*.tgz package/package.json \
            | jq -e --arg u "$url" '.repository.url == $u'

      # The tarball, exactly as packed, for publish.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.version.outputs.skip != 'true'
        with:
          name: pi-legion-tarball
          path: packages/pi-legion/*.tgz
          if-no-files-found: error

      - name: Check this job holds no credential (tripwire)
        run: .github/scripts/release-push.sh no-credential

  # The Claude Code plugin, @sjawhar/claude-envoy, built and published as the two Oh My Pi plugins
  # are. The difference is what it packs: the plugin's own tree carries no built file, so this job
  # builds dist/ and legion/ with packages/claude-envoy/scripts/verify-build.sh — the one
  # statement of what the published plugin must hold, which ci.yaml runs on every pull request —
  # puts that checked build into the checkout and packs it with the rest of the package.
  # .claude-plugin/marketplace.json names this package as an `npm` source with the range
  # `>=1.0.0`, so Claude Code installs the newest release and never the 0.0.0 placeholder that
  # `latest` points at until the first one.
  claude_envoy_build:
    # Only main publishes, as pi_envoy_build says.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # contents: read is for the checkout; nothing here writes to the repository, a registry or a
    # release.
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      skip: ${{ steps.version.outputs.skip }}
      notes: ${{ steps.notes.outputs.notes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # First, before setup-bun, as pi_envoy_build's version step is, and releasing again a tag
      # an earlier attempt pushed for this commit as that step does, over the paths
      # $CLAUDE_ENVOY_VERSION_ARGS names (the workflow's `env:` says why each is there).
      - name: Determine next version
        id: version
        run: |
          # shellcheck disable=SC2086 # $CLAUDE_ENVOY_VERSION_ARGS is the argument list, split on purpose
          .github/scripts/release-push.sh version claude-envoy-v $CLAUDE_ENVOY_VERSION_ARGS >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/install-changie
        if: steps.version.outputs.skip != 'true'

      # This release's own changelog entries, as in pi_envoy_build and for the reasons given
      # there: the fragments this release's own commits first added, and the `notes` line
      # fold-notes prints says whether there were any.
      - name: Render this release's changelog entries
        id: notes
        if: steps.version.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          .github/scripts/release-push.sh fold-notes "$VERSION" \
            "$RUNNER_TEMP/release-notes.md" packages/claude-envoy claude-envoy-v >> "$GITHUB_OUTPUT"

      # The entries, exactly as rendered, for publish; a release with none uploads nothing at all.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.version.outputs.skip != 'true' && steps.notes.outputs.notes == 'true'
        with:
          name: claude-envoy-notes
          path: ${{ runner.temp }}/release-notes.md
          if-no-files-found: error

      - uses: ./.github/actions/setup-bun
        if: steps.version.outputs.skip != 'true'

      - name: Install dependencies
        if: steps.version.outputs.skip != 'true'
        run: bun install --frozen-lockfile

      - name: Set release version
        if: steps.version.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # All three manifests, and for different readers. package.json's version is what npm
          # publishes and what the MCP server reports. .claude-plugin/plugin.json's is what Claude
          # Code calls the installed plugin's version: it reads the manifest, never the registry,
          # and an install whose manifest declares none lands in a plugin-cache directory named
          # `unknown` and never updates, since one `unknown` is indistinguishable from the next
          # (measured on Claude Code 2.1.311). .omp-plugin/plugin.json's is what Oh My Pi reports,
          # and tests/envoy-channel-server.test.ts holds it equal to package.json's, so a release
          # that rewrote the first two alone would publish a plugin naming two versions. The
          # committed .claude-plugin manifest declares none, which is what keeps a checkout from
          # pinning every install at one string, and this job's tree is discarded, as with the
          # rewrites below.
          for manifest in packages/claude-envoy/package.json \
            packages/claude-envoy/.claude-plugin/plugin.json \
            packages/claude-envoy/.omp-plugin/plugin.json; do
            jq --arg v "$VERSION" '.version = $v' "$manifest" > tmp.json && mv tmp.json "$manifest"
          done

      - name: Point the manifest at the publishing repository
        if: steps.version.outputs.skip != 'true'
        run: |
          # As in pi_envoy_build, and for the reason given there: npm refuses a publish with
          # provenance whose repository.url is not the publishing repository's, case for case, and
          # the publish job packs nothing of its own. The committed manifest keeps today's
          # repository; this writes whichever one the job runs in, and this job's tree is
          # discarded.
          url=$(.github/scripts/repo-paths.sh repository_url)
          jq --arg u "$url" '.repository.url = $u' \
            packages/claude-envoy/package.json > tmp.json \
            && mv tmp.json packages/claude-envoy/package.json

      # What it builds and checks: packages/claude-envoy/scripts/verify-build.sh, which builds the
      # plugin twice into scratch directories outside the checkout, compares the two byte for
      # byte, runs the private-name check over the build and packs it into the tar
      # `release-push.sh check-built` then checks member by member.
      - name: Build, check and pack the plugin
        if: steps.version.outputs.skip != 'true'
        run: bun run verify-build "$RUNNER_TEMP/claude-envoy-built.tar"
        working-directory: packages/claude-envoy

      # What it writes: release-push.sh extract-built. The package tracks neither directory, so
      # this is what puts the checked build where `bun pm pack` finds it.
      - name: Put the checked build into the checkout
        if: steps.version.outputs.skip != 'true'
        run: .github/scripts/release-push.sh extract-built "$RUNNER_TEMP/claude-envoy-built.tar"

      # package.json's "files" decides what is packed, not git, so the build's two directories go
      # in even though .gitignore names them. The pack runs the package's prepack and postpack
      # (packages/claude-envoy/scripts/pack-skills.sh): skills/<name> is a link into the
      # repository's skills/, which bun packs as nothing at all, so the prepack replaces each
      # link with the skill's files and the postpack puts the links back.
      - name: Pack plugin
        if: steps.version.outputs.skip != 'true'
        run: rm -f ./*.tgz && bun pm pack
        working-directory: packages/claude-envoy

      - name: Check the packed tarball names the publishing repository and the release, and holds the build and the skills
        if: steps.version.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # pi_envoy_build's check, over this package's tarball, and four more: the version
          # Claude Code reads off .claude-plugin/plugin.json, without which every install is
          # `unknown` and no update is ever seen; the version Oh My Pi reads off
          # .omp-plugin/plugin.json, which tests/envoy-channel-server.test.ts holds equal to
          # package.json's; the two generated directories, which the plugin runs from and
          # .gitignore names, so a packer that started honouring git would publish a plugin that
          # cannot start; and the skills, which only the pack's prepack turns into files. All of
          # them are read out of the tarball the publish job will hand npm, never out of the
          # working tree.
          url=$(.github/scripts/repo-paths.sh repository_url)
          tar -xzOf packages/claude-envoy/*.tgz package/package.json \
            | jq -e --arg u "$url" '.repository.url == $u'
          for manifest in package/package.json package/.claude-plugin/plugin.json \
            package/.omp-plugin/plugin.json; do
            tar -xzOf packages/claude-envoy/*.tgz "$manifest" \
              | jq -e --arg v "$VERSION" '.version == $v'
          done
          members=$(tar -tzf packages/claude-envoy/*.tgz)
          for member in package/dist/envoy-channel.js package/legion/.claude-plugin/plugin.json; do
            if ! printf '%s\n' "$members" | grep -qxF "$member"; then
              echo "::error::the packed tarball holds no $member, which the installed plugin runs from"
              exit 1
            fi
          done
          # The skills, read back out of the same tarball: the rules are in
          # packages/claude-envoy/scripts/check-packed-skills.sh, which tests/packed-skills.test.ts
          # runs over tarballs of its own. Without them every install loses all ten skills and
          # the dispatch-first hook hooks/hooks.json runs on every session throws.
          packages/claude-envoy/scripts/check-packed-skills.sh packages/claude-envoy/*.tgz

      # The tarball, exactly as packed, for publish.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.version.outputs.skip != 'true'
        with:
          name: claude-envoy-tarball
          path: packages/claude-envoy/*.tgz
          if-no-files-found: error

      - name: Check this job holds no credential (tripwire)
        run: .github/scripts/release-push.sh no-credential

  # Publishes what the four build jobs made, in one job for all four packages, so their release
  # waits for a runner once: pi-envoy, pi-legion, claude-envoy, then legion, which links the two
  # Oh My Pi plugins and so goes only once both are on npm. It runs no bun, no node, no Go, no
  # built binary and no scripts/
  # program, only release-push.sh, git, gh, jq, sha256sum, npm (view, and publish of a handed
  # tarball) and the pinned actions below, so the scopes and the deploy key it holds never meet the
  # code the build jobs ran. It runs on main even when nothing releases: its pair_ok output decides
  # whether worker_image_attest attests the image, and each step decides for its own package.
  #
  # A package's first step runs when its build released, and each later step when the one before it
  # in the same package succeeded (`steps.<id>.outcome`, under `!cancelled()`). So a failed step
  # stops the rest of its own package and no other: one package's failure never holds back another
  # whose build released. Each package starts from the run's commit (`git checkout --force --detach
  # "$GITHUB_SHA"` and `git clean -ffdx`, in its hand-over check), and nothing of a release is
  # committed: `release-push.sh tag` tags $GITHUB_SHA itself, which main already holds, and
  # `tagged` finds a tag only on HEAD. So no package's steps move main, and a re-run of this job
  # reads the same tags its first attempt pushed.
  publish:
    needs: [pi_envoy_build, pi_legion_build, claude_envoy_build, legion_build]
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # contents: write creates the GitHub releases (`release-push.sh release`, below); id-token: write
    # is the OIDC token npm trusted publishing exchanges for the publish credential (the registry
    # records `trustedPublisher: github` for each plugin; no NPM_TOKEN is set), which also signs npm
    # provenance (`npm publish --provenance`) and is the Sigstore signing certificate's token for
    # the legion archives' provenance attestation, which attestations: write stores. The tag pushes
    # use the deploy key, held only by the env of each plugin's "Push tag" step and of legion's
    # "Tag release", which pushes its own tag, not any scope.
    permissions:
      contents: write
      id-token: write
      attestations: write
    # No cache is restored in a job that holds a credential.
    cache-mode: none
    outputs:
      # Whether pi-envoy and pi-legion each published or had nothing to release in this run.
      pair_ok: ${{ steps.pair.outputs.ok }}
      # The legion release this run made; empty unless legion released in this run.
      version: ${{ steps.legion_release.outputs.version }}
      tag: ${{ steps.legion_release.outputs.tag }}
    steps:
      # For release-push.sh and the tags, with every tag (legion's existing-tag check reads them).
      # No credential is left in the checkout: the deploy key reaches the push steps alone.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Only the npm publishes use node.
      - if: (needs.pi_envoy_build.result == 'success' && needs.pi_envoy_build.outputs.skip != 'true') || (needs.pi_legion_build.result == 'success' && needs.pi_legion_build.outputs.skip != 'true') || (needs.claude_envoy_build.result == 'success' && needs.claude_envoy_build.outputs.skip != 'true')
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      # Each artifact goes under the runner's temporary directory, outside the checkout, so no
      # package's reset of the checkout removes it and no git command sees it.
      - name: "pi-envoy: Download the tarball"
        id: pi_envoy_download
        if: ${{ !cancelled() && needs.pi_envoy_build.result == 'success' && needs.pi_envoy_build.outputs.skip != 'true' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pi-envoy-tarball
          path: ${{ runner.temp }}/pi-envoy-tarball

      # pi_envoy_build chooses the tarball's bytes, and hands over only it and the version. This
      # step puts the checkout back on the run's commit, then names the tarball itself, from that
      # version and the committed manifest's name (Bun names a scoped tarball
      # sjawhar-pi-legion-1.2.3.tgz); release-push.sh handed refuses a version that is not X.Y.Z and
      # an artifact that is not exactly that one regular file, and prints the tag. The steps below
      # take the name's stem and spell the `.tgz` themselves, so each reads as the publish of a
      # tarball (check-release-credentials.sh allows `npm publish` of nothing else).
      - name: "pi-envoy: Check the hand-over"
        id: pi_envoy_handed
        if: ${{ !cancelled() && steps.pi_envoy_download.outcome == 'success' }}
        env:
          VERSION: ${{ needs.pi_envoy_build.outputs.version }}
        run: |
          git checkout --force --detach "$GITHUB_SHA"
          git clean -ffdx
          name=$(jq -r .name packages/pi-envoy/package.json)
          stem="${name#@}"
          stem="${stem//\//-}-$VERSION"
          tag=$(.github/scripts/release-push.sh handed pi-envoy-v "$VERSION" "$RUNNER_TEMP/pi-envoy-tarball" "$stem.tgz")
          { echo "tag=$tag"; echo "stem=$stem"; } >> "$GITHUB_OUTPUT"

      # The tarball is pi_envoy_build's bytes, never a repack here: npm publish is handed the .tgz,
      # so no package script (prepack) runs in this job.
      - name: "pi-envoy: Publish to npm"
        id: pi_envoy_npm
        if: ${{ !cancelled() && steps.pi_envoy_handed.outcome == 'success' }}
        env:
          VERSION: ${{ needs.pi_envoy_build.outputs.version }}
          STEM: ${{ steps.pi_envoy_handed.outputs.stem }}
        run: |
          if npm view "$(jq -r .name package.json)@$VERSION" version >/dev/null 2>&1; then
            echo "npm already has $VERSION; skipping publish"
          else
            npm publish "$RUNNER_TEMP/pi-envoy-tarball/$STEM.tgz" --access public --provenance
          fi
        working-directory: packages/pi-envoy

      - name: "pi-envoy: Tag release"
        id: pi_envoy_tag
        if: ${{ !cancelled() && steps.pi_envoy_npm.outcome == 'success' }}
        env:
          VERSION: ${{ needs.pi_envoy_build.outputs.version }}
          TAG: ${{ steps.pi_envoy_handed.outputs.tag }}
        run: .github/scripts/release-push.sh tag "$VERSION" "$TAG"

      # The deploy key reaches this step alone of this package's. release-push.sh push-tag writes
      # it to a directory of its own, pushes over SSH to GitHub's pinned host keys, and removes the
      # key again. The tag goes before the release below, which verifies it on GitHub; the tag is
      # all this package puts in the repository.
      - name: "pi-envoy: Push tag"
        id: pi_envoy_push_tag
        if: ${{ !cancelled() && steps.pi_envoy_tag.outcome == 'success' }}
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          TAG: ${{ steps.pi_envoy_handed.outputs.tag }}
        run: .github/scripts/release-push.sh push-tag "$TAG"

      - name: "pi-envoy: Create GitHub release"
        id: pi_envoy_release
        if: ${{ !cancelled() && steps.pi_envoy_push_tag.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.pi_envoy_handed.outputs.tag }}
          VERSION: ${{ needs.pi_envoy_build.outputs.version }}
          STEM: ${{ steps.pi_envoy_handed.outputs.stem }}
        run: .github/scripts/release-push.sh release "$TAG" "Pi Envoy v$VERSION" "$RUNNER_TEMP/pi-envoy-tarball/$STEM.tgz"

      # The entries pi_envoy_build rendered from this release's fragments, under the runner's
      # temporary directory as the tarball is, outside the checkout.
      - name: "pi-envoy: Download the changelog entries"
        id: pi_envoy_notes
        if: ${{ !cancelled() && steps.pi_envoy_release.outcome == 'success' && needs.pi_envoy_build.outputs.notes == 'true' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pi-envoy-notes
          path: ${{ runner.temp }}/pi-envoy-notes

      # pi_envoy_build's entries become the release body's one "## Changelog" section, below the
      # notes `release-push.sh release` generated for it. release-section replaces a section that
      # heading already holds, and says there why the write is a replace and not an append. The
      # artifact holds the one file fold-notes wrote, under the name the build job gave it.
      - name: "pi-envoy: Write the changelog into the release body"
        if: ${{ !cancelled() && steps.pi_envoy_notes.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.pi_envoy_handed.outputs.tag }}
        run: |
          .github/scripts/release-push.sh release-section "$TAG" '## Changelog' \
            "$RUNNER_TEMP/pi-envoy-notes/release-notes.md"

      # pi-legion: what pi_legion_build packed, published as pi-envoy's above is.
      - name: "pi-legion: Download the tarball"
        id: pi_legion_download
        if: ${{ !cancelled() && needs.pi_legion_build.result == 'success' && needs.pi_legion_build.outputs.skip != 'true' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pi-legion-tarball
          path: ${{ runner.temp }}/pi-legion-tarball

      - name: "pi-legion: Check the hand-over"
        id: pi_legion_handed
        if: ${{ !cancelled() && steps.pi_legion_download.outcome == 'success' }}
        env:
          VERSION: ${{ needs.pi_legion_build.outputs.version }}
        run: |
          git checkout --force --detach "$GITHUB_SHA"
          git clean -ffdx
          name=$(jq -r .name packages/pi-legion/package.json)
          stem="${name#@}"
          stem="${stem//\//-}-$VERSION"
          tag=$(.github/scripts/release-push.sh handed pi-legion-v "$VERSION" "$RUNNER_TEMP/pi-legion-tarball" "$stem.tgz")
          { echo "tag=$tag"; echo "stem=$stem"; } >> "$GITHUB_OUTPUT"

      - name: "pi-legion: Publish to npm"
        id: pi_legion_npm
        if: ${{ !cancelled() && steps.pi_legion_handed.outcome == 'success' }}
        env:
          VERSION: ${{ needs.pi_legion_build.outputs.version }}
          STEM: ${{ steps.pi_legion_handed.outputs.stem }}
        run: |
          if npm view "$(jq -r .name package.json)@$VERSION" version >/dev/null 2>&1; then
            echo "npm already has $VERSION; skipping publish"
          else
            npm publish "$RUNNER_TEMP/pi-legion-tarball/$STEM.tgz" --access public --provenance
          fi
        working-directory: packages/pi-legion

      - name: "pi-legion: Tag release"
        id: pi_legion_tag
        if: ${{ !cancelled() && steps.pi_legion_npm.outcome == 'success' }}
        env:
          VERSION: ${{ needs.pi_legion_build.outputs.version }}
          TAG: ${{ steps.pi_legion_handed.outputs.tag }}
        run: .github/scripts/release-push.sh tag "$VERSION" "$TAG"

      # The deploy key reaches this step alone of this package's, as for pi-envoy.
      - name: "pi-legion: Push tag"
        id: pi_legion_push_tag
        if: ${{ !cancelled() && steps.pi_legion_tag.outcome == 'success' }}
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          TAG: ${{ steps.pi_legion_handed.outputs.tag }}
        run: .github/scripts/release-push.sh push-tag "$TAG"

      - name: "pi-legion: Create GitHub release"
        id: pi_legion_release
        if: ${{ !cancelled() && steps.pi_legion_push_tag.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.pi_legion_handed.outputs.tag }}
          VERSION: ${{ needs.pi_legion_build.outputs.version }}
          STEM: ${{ steps.pi_legion_handed.outputs.stem }}
        run: .github/scripts/release-push.sh release "$TAG" "Pi Legion v$VERSION" "$RUNNER_TEMP/pi-legion-tarball/$STEM.tgz"

      # pi-legion's entries, written into its release body as pi-envoy's are above.
      - name: "pi-legion: Download the changelog entries"
        id: pi_legion_notes
        if: ${{ !cancelled() && steps.pi_legion_release.outcome == 'success' && needs.pi_legion_build.outputs.notes == 'true' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pi-legion-notes
          path: ${{ runner.temp }}/pi-legion-notes

      - name: "pi-legion: Write the changelog into the release body"
        if: ${{ !cancelled() && steps.pi_legion_notes.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.pi_legion_handed.outputs.tag }}
        run: |
          # pi_legion_build's one rendered file, written into the body as pi-envoy's is above.
          .github/scripts/release-push.sh release-section "$TAG" '## Changelog' \
            "$RUNNER_TEMP/pi-legion-notes/release-notes.md"

      # claude-envoy: what claude_envoy_build packed, published as the two Oh My Pi plugins above
      # are. It is not part of the plugin pair below: that pair is the two Oh My Pi plugins the
      # Go `legion` links and the worker image installs, and neither the binary nor the image
      # reads this one, which Claude Code installs for itself from the marketplace. So a run whose
      # steps for this plugin fail still releases legion, in the steps after them. This job does
      # need claude_envoy_build, as it needs every build job, so a legion release waits for that
      # build to finish, whatever it decided.
      - name: "claude-envoy: Download the tarball"
        id: claude_envoy_download
        if: ${{ !cancelled() && needs.claude_envoy_build.result == 'success' && needs.claude_envoy_build.outputs.skip != 'true' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: claude-envoy-tarball
          path: ${{ runner.temp }}/claude-envoy-tarball

      - name: "claude-envoy: Check the hand-over"
        id: claude_envoy_handed
        if: ${{ !cancelled() && steps.claude_envoy_download.outcome == 'success' }}
        env:
          VERSION: ${{ needs.claude_envoy_build.outputs.version }}
        run: |
          git checkout --force --detach "$GITHUB_SHA"
          git clean -ffdx
          name=$(jq -r .name packages/claude-envoy/package.json)
          stem="${name#@}"
          stem="${stem//\//-}-$VERSION"
          tag=$(.github/scripts/release-push.sh handed claude-envoy-v "$VERSION" "$RUNNER_TEMP/claude-envoy-tarball" "$stem.tgz")
          { echo "tag=$tag"; echo "stem=$stem"; } >> "$GITHUB_OUTPUT"

      - name: "claude-envoy: Publish to npm"
        id: claude_envoy_npm
        if: ${{ !cancelled() && steps.claude_envoy_handed.outcome == 'success' }}
        env:
          VERSION: ${{ needs.claude_envoy_build.outputs.version }}
          STEM: ${{ steps.claude_envoy_handed.outputs.stem }}
        run: |
          if npm view "$(jq -r .name package.json)@$VERSION" version >/dev/null 2>&1; then
            echo "npm already has $VERSION; skipping publish"
          else
            npm publish "$RUNNER_TEMP/claude-envoy-tarball/$STEM.tgz" --access public --provenance
          fi
        working-directory: packages/claude-envoy

      - name: "claude-envoy: Tag release"
        id: claude_envoy_tag
        if: ${{ !cancelled() && steps.claude_envoy_npm.outcome == 'success' }}
        env:
          VERSION: ${{ needs.claude_envoy_build.outputs.version }}
          TAG: ${{ steps.claude_envoy_handed.outputs.tag }}
        run: .github/scripts/release-push.sh tag "$VERSION" "$TAG"

      # The deploy key reaches this step alone of this package's, as for pi-envoy.
      - name: "claude-envoy: Push tag"
        id: claude_envoy_push_tag
        if: ${{ !cancelled() && steps.claude_envoy_tag.outcome == 'success' }}
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          TAG: ${{ steps.claude_envoy_handed.outputs.tag }}
        run: .github/scripts/release-push.sh push-tag "$TAG"

      - name: "claude-envoy: Create GitHub release"
        id: claude_envoy_release
        if: ${{ !cancelled() && steps.claude_envoy_push_tag.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.claude_envoy_handed.outputs.tag }}
          VERSION: ${{ needs.claude_envoy_build.outputs.version }}
          STEM: ${{ steps.claude_envoy_handed.outputs.stem }}
        run: .github/scripts/release-push.sh release "$TAG" "Claude Envoy v$VERSION" "$RUNNER_TEMP/claude-envoy-tarball/$STEM.tgz"

      # claude-envoy's entries, written into its release body as pi-envoy's are above.
      - name: "claude-envoy: Download the changelog entries"
        id: claude_envoy_notes
        if: ${{ !cancelled() && steps.claude_envoy_release.outcome == 'success' && needs.claude_envoy_build.outputs.notes == 'true' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: claude-envoy-notes
          path: ${{ runner.temp }}/claude-envoy-notes

      - name: "claude-envoy: Write the changelog into the release body"
        if: ${{ !cancelled() && steps.claude_envoy_notes.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.claude_envoy_handed.outputs.tag }}
        run: |
          # claude_envoy_build's one rendered file, written into the body as pi-envoy's is above.
          .github/scripts/release-push.sh release-section "$TAG" '## Changelog' \
            "$RUNNER_TEMP/claude-envoy-notes/release-notes.md"

      # The plugin pair npm carries for this run, which legion links and the worker image installs:
      # for each Oh My Pi plugin, the version its build released when "Create GitHub release", the
      # step that publishes its package, succeeded, or, when its build had nothing to release, the
      # version of its newest tag, which npm carries: a release commits nothing, so the committed
      # manifest records no release and the tags alone say what was published. ok=true only when
      # both plugins are in one of those states; otherwise legion is not released and
      # worker_image_attest does not attest the image on main, so neither links a plugin version
      # npm lacks.
      - name: Check the plugin pair npm carries
        id: pair
        if: ${{ !cancelled() }}
        env:
          PI_ENVOY_RESULT: ${{ needs.pi_envoy_build.result }}
          PI_ENVOY_SKIP: ${{ needs.pi_envoy_build.outputs.skip }}
          PI_ENVOY_VERSION: ${{ needs.pi_envoy_build.outputs.version }}
          PI_ENVOY_RELEASED: ${{ steps.pi_envoy_release.outcome }}
          PI_LEGION_RESULT: ${{ needs.pi_legion_build.result }}
          PI_LEGION_SKIP: ${{ needs.pi_legion_build.outputs.skip }}
          PI_LEGION_VERSION: ${{ needs.pi_legion_build.outputs.version }}
          PI_LEGION_RELEASED: ${{ steps.pi_legion_release.outcome }}
        run: |
          # pair_member <build result> <skip> <release outcome> <released version> <tag prefix>:
          # the version npm carries for the package, or nothing when its release did not publish.
          # This step's own dispatch is which of the three a run is in; release-push.sh
          # pair-version turns that answer into a version, reading the newest tag for a package
          # that released nothing in this run.
          pair_member() {
            local released=''
            [ "$1" = success ] || return 0
            if [ "$2" != true ]; then
              [ "$3" = success ] || return 0
              released=$4
            fi
            .github/scripts/release-push.sh pair-version "$5" "$released"
          }
          pi_envoy=$(pair_member "$PI_ENVOY_RESULT" "$PI_ENVOY_SKIP" "$PI_ENVOY_RELEASED" "$PI_ENVOY_VERSION" pi-envoy-v)
          pi_legion=$(pair_member "$PI_LEGION_RESULT" "$PI_LEGION_SKIP" "$PI_LEGION_RELEASED" "$PI_LEGION_VERSION" pi-legion-v)
          ok=true
          if [ -z "$pi_envoy" ]; then
            echo "::warning::@sjawhar/pi-envoy had a release in this run that did not publish, so legion is not released and the worker image is not attested"
            ok=false
          fi
          if [ -z "$pi_legion" ]; then
            echo "::warning::@sjawhar/pi-legion had a release in this run that did not publish, so legion is not released and the worker image is not attested"
            ok=false
          fi
          {
            echo "ok=$ok"
            echo "pi_envoy_version=$pi_envoy"
            echo "pi_legion_version=$pi_legion"
          } >> "$GITHUB_OUTPUT"

      # legion: what legion_build built and smoke-tested. It goes only once both plugins it links
      # are on npm, and this first step refuses archives that link any pair but the one npm now
      # carries: the binary installs that pair from npm on a stale-plugin relaunch.
      - name: "legion: Check the linked plugin pair"
        id: legion_pair
        if: ${{ !cancelled() && steps.pair.outputs.ok == 'true' && needs.legion_build.result == 'success' && needs.legion_build.outputs.skip != 'true' }}
        env:
          LINKED_PI_ENVOY: ${{ needs.legion_build.outputs.pi_envoy_version }}
          LINKED_PI_LEGION: ${{ needs.legion_build.outputs.pi_legion_version }}
          PI_ENVOY_VERSION: ${{ steps.pair.outputs.pi_envoy_version }}
          PI_LEGION_VERSION: ${{ steps.pair.outputs.pi_legion_version }}
        run: |
          if [ "$LINKED_PI_ENVOY" != "$PI_ENVOY_VERSION" ] || [ "$LINKED_PI_LEGION" != "$PI_LEGION_VERSION" ]; then
            echo "::error::legion_build linked @sjawhar/pi-envoy $LINKED_PI_ENVOY and @sjawhar/pi-legion $LINKED_PI_LEGION, but npm carries @sjawhar/pi-envoy $PI_ENVOY_VERSION and @sjawhar/pi-legion $PI_LEGION_VERSION for this run; not releasing legion"
            exit 1
          fi
          echo "legion links @sjawhar/pi-envoy $PI_ENVOY_VERSION and @sjawhar/pi-legion $PI_LEGION_VERSION, both on npm"

      - name: "legion: Download the archives"
        id: legion_download
        if: ${{ !cancelled() && steps.legion_pair.outcome == 'success' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: legion-assets
          path: ${{ runner.temp }}/legion-assets

      # legion_build chooses the archives' bytes, and hands over only them and the version. This
      # step puts the checkout back on the run's commit, then names the archives itself, from that
      # version and that commit's target list; release-push.sh handed refuses a version that is not
      # X.Y.Z and an artifact that is not exactly those archives, each a regular file, and prints the
      # tag. SHA256SUMS is then written over them, and the tag and the explicit lists go to the
      # steps below.
      - name: "legion: Check build's archives and write SHA256SUMS"
        id: legion_assets
        if: ${{ !cancelled() && steps.legion_download.outcome == 'success' }}
        env:
          VERSION: ${{ needs.legion_build.outputs.version }}
        run: |
          git checkout --force --detach "$GITHUB_SHA"
          git clean -ffdx
          dir="$RUNNER_TEMP/legion-assets"
          archives=()
          targets=$(jq -r '.legion[]' .github/go-release-targets.json)
          [ -n "$targets" ] || { echo "::error::.github/go-release-targets.json lists no legion target"; exit 1; }
          for target in $targets; do
            os=${target%/*}
            arch=${target#*/}
            archives+=("legion-$os-$arch.tar.gz")
          done
          tag=$(.github/scripts/release-push.sh handed legion-v "$VERSION" "$dir" "${archives[@]}")
          (cd "$dir" && sha256sum -- "${archives[@]}" > SHA256SUMS)
          {
            echo "tag=$tag"
            echo "subjects<<SUBJECTS"
            printf '%s\n' "${archives[@]/#/$dir/}"
            echo "SUBJECTS"
            echo "files<<FILES"
            printf '%s\n' "${archives[@]/#/$dir/}" "$dir/SHA256SUMS"
            echo "FILES"
          } >> "$GITHUB_OUTPUT"

      # The only legion step that holds the deploy key. release-push.sh push-tag writes it to a
      # directory of its own, pushes the tag over SSH to GitHub's pinned host keys, and removes the
      # key again. The tag names $GITHUB_SHA, the commit legion_build built, which is what every
      # package of this job checks out and tags.
      - name: "legion: Tag release"
        id: legion_tag
        if: ${{ !cancelled() && steps.legion_assets.outcome == 'success' }}
        env:
          VERSION: ${{ needs.legion_build.outputs.version }}
          TAG: ${{ steps.legion_assets.outputs.tag }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          .github/scripts/release-push.sh tag "$VERSION" "$TAG"
          .github/scripts/release-push.sh push-tag "$TAG"

      # Build provenance for the archives a mise pin installs, which the release below uploads
      # exactly, so a downloaded asset is checked against a run of this workflow on main rather than
      # against SHA256SUMS, which sits in the same mutable release. `--repo` alone accepts an
      # archive any workflow of this repository attested, so the check pins the signer as
      # docs/kubernetes.md ("Pin by digest, never by tag") does:
      #   gh attestation verify legion-<os>-<arch>.tar.gz --repo cybermonklabs/legion \
      #     --cert-identity https://github.com/cybermonklabs/legion/.github/workflows/release.yaml@refs/heads/main \
      #     --source-ref refs/heads/main --deny-self-hosted-runners
      # and adds `--source-digest <the legion-v<version> tag's commit>` to pin the commit as well.
      # It runs after "legion: Tag release", so a run whose tag step refuses (the tag already names
      # another commit) leaves no attestation for archives no release carries.
      - name: "legion: Attest the archives"
        id: legion_attest
        if: ${{ !cancelled() && steps.legion_tag.outcome == 'success' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.legion_assets.outputs.subjects }}

      # release-push.sh `release`: creates the release, reuses a published one, or publishes a draft
      # an earlier attempt left, with the files the check above listed. Its version and tag are the
      # job's outputs, which worker_image_release names the worker image on.
      - name: "legion: Create GitHub release"
        id: legion_release
        if: ${{ !cancelled() && steps.legion_attest.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.legion_assets.outputs.tag }}
          VERSION: ${{ needs.legion_build.outputs.version }}
          FILES: ${{ steps.legion_assets.outputs.files }}
        run: |
          assets=()
          while IFS= read -r file; do
            [ -z "$file" ] || assets+=("$file")
          done <<< "$FILES"
          .github/scripts/release-push.sh release "$TAG" "legion v$VERSION" "${assets[@]}"
          { echo "version=$VERSION"; echo "tag=$TAG"; } >> "$GITHUB_OUTPUT"

  # The worker image, built from this run's commit with the plugin pair legion_build decided (empty
  # off main, where legion_build skips and the Dockerfile links none) and labelled with the legion
  # version legion_build decided (`legion_version`; empty when legion_build skips or has nothing to
  # release, which leaves the label sha-<short>). This first call of worker-image.yaml builds and
  # pushes the image's sha- tag only (`skip_attest`): worker_image_attest attests it and
  # worker_image_release tags it with that version and names it on the legion release once publish
  # released it.
  worker_image:
    needs: legion_build
    if: always() && (needs.legion_build.result == 'success' || needs.legion_build.result == 'skipped')
    uses: ./.github/workflows/worker-image.yaml
    # No `secrets:`: the called workflow reads only GITHUB_TOKEN, which it receives automatically;
    # `inherit` would hand DEPLOY_KEY and every other repository secret to a job that runs a
    # PR-authored Dockerfile. This job's permissions must cover every scope worker-image.yaml's
    # `permissions:` blocks declare, even for the `attest` job this call skips: its workflow-level
    # block (the build, with actions: read and checks: write for the ci-ok report its build runs
    # only on ci.yaml's pull_request call) and its `attest` job's (id-token and attestations:
    # write, for the image's GitHub attestation). The legion version tag and the release note,
    # which need contents: write, are worker_image_release below.
    permissions:
      contents: read
      packages: write
      actions: read
      checks: write
      id-token: write
      attestations: write
    with:
      skip_attest: true
      legion_version: ${{ needs.legion_build.outputs.version }}
      pi_legion_version: ${{ needs.legion_build.outputs.pi_legion_version }}
      pi_envoy_version: ${{ needs.legion_build.outputs.pi_envoy_version }}

  # The worker image's GitHub attestation: a second call of worker-image.yaml, whose attest job
  # attests the digest worker_image pushed (`attest_digest`; its build job then skips). It stays in
  # worker-image.yaml, whose file the consumers' `gh attestation verify --cert-identity` names
  # (docs/kubernetes.md, "Pin by digest, never by tag"), and it holds id-token and attestations:
  # write, so it cannot run in the job that ran the Dockerfile. It waits on publish so an image
  # attested on main never links a plugin version that did not publish: on main it attests only
  # when publish's pair_ok says both plugins it links are on npm. That condition is the
  # `skip_attest` input rather than this job's `if:`, because check-image-trigger-paths.sh reads
  # the `if:` of a job calling worker-image.yaml as an image gate and refuses one that tests another
  # job's outputs or the ref. Off main (a workflow_dispatch from a branch) publish skips and the
  # image is attested, as a branch dispatch's image always was.
  worker_image_attest:
    needs: [worker_image, publish]
    if: always() && needs.worker_image.result == 'success'
    uses: ./.github/workflows/worker-image.yaml
    # The same scopes as worker_image, for the same reason: the grant must cover every
    # `permissions:` block worker-image.yaml declares, the build's this call skips included.
    permissions:
      contents: read
      packages: write
      actions: read
      checks: write
      id-token: write
      attestations: write
    with:
      attest_digest: ${{ needs.worker_image.outputs.digest }}
      # The image repository the attestation names. worker-image.yaml derives it from
      # $GITHUB_REPOSITORY in its build job, which this call skips (attest_digest), and its attest
      # job holds id-token and attestations: write, so it runs no script to derive it for itself.
      # The build-only call above reported the repository it pushed to as its `image` output, so
      # this call hands that value back: both calls name one image, whatever the repository is
      # called.
      image: ${{ needs.worker_image.outputs.image }}
      skip_attest: ${{ github.ref == 'refs/heads/main' && needs.publish.outputs.pair_ok != 'true' }}

  # Names the worker image on the legion release this run made: tags the image's digest with the
  # legion version on ghcr.io, so a version tag still means "released", and writes the digest
  # reference into the release notes. It runs when legion released in this run, even when a later
  # package in publish failed. It runs beside worker_image_attest, not after it: if the attestation
  # fails, the release names a digest that the consumers' `gh attestation verify` refuses, which
  # fails closed. It runs no build and no dependency code, only the runner's own `docker buildx
  # imagetools`, release-push.sh, gh and the pinned login action, so the scopes it holds never meet
  # the Dockerfile worker_image ran.
  worker_image_release:
    needs: [worker_image, publish]
    # On `always()`, so a job skipped upstream does not skip this one; it tests the result of both
    # jobs it reads.
    if: >-
      always() &&
      needs.worker_image.result == 'success' &&
      (needs.publish.result == 'success' || needs.publish.result == 'failure') &&
      needs.publish.outputs.tag != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # gh release edit
      packages: write # the legion version tag on ghcr.io
    # No cache is restored in a job that holds a credential.
    cache-mode: none
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      IMAGE: ${{ needs.worker_image.outputs.image }}
      DIGEST: ${{ needs.worker_image.outputs.digest }}
      REF: ${{ needs.worker_image.outputs.ref }}
      VERSION: ${{ needs.publish.outputs.version }}
      RELEASE_TAG: ${{ needs.publish.outputs.tag }}
    steps:
      # For release-push.sh, which the last step runs: nothing else checks this job out, and that
      # step would exit 127. The run's commit by sha, the commit the release this names was built
      # from; no credential is left in the checkout.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The runner's own docker buildx runs imagetools, so this job sets up no BuildKit builder.
      # --prefer-index=false makes the tag a carbon copy of the single manifest the build pushed,
      # where the default would wrap it in a new index of another digest; the read-back below fails
      # the job unless the tag names exactly the digest the release note and the attestation name.
      - name: Tag the worker image with the legion version
        run: |
          test -n "$IMAGE"
          test -n "$DIGEST"
          test -n "$VERSION"
          docker buildx imagetools create --prefer-index=false --tag "$IMAGE:$VERSION" "$IMAGE@$DIGEST"
          tagged=$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "$IMAGE:$VERSION")
          if [ "$tagged" != "$DIGEST" ]; then
            echo "::error::$IMAGE:$VERSION names $tagged, not $DIGEST, the digest worker_image pushed"
            exit 1
          fi
          echo "$IMAGE:$VERSION names $DIGEST"

      # The release's body gets one "## Worker image" section, naming the digest the version tag
      # points at now. release-section replaces a section that heading already holds, which is what
      # a whole-run rerun of this image needs, and says there why the write is a replace.
      - name: Name the worker image on the legion release
        run: |
          test -n "$REF"
          # shellcheck disable=SC2016 # literal Markdown backticks, no expansion wanted
          printf '`%s`\n' "$REF" |
            .github/scripts/release-push.sh release-section "$RELEASE_TAG" '## Worker image' -
