  # The envoy-infra Pulumi plugin (packages/envoy/infra): one archive per target, each holding
  # pulumi-resource-envoy-infra and its THIRD_PARTY_NOTICES at the archive root, released on an
  # envoy-infra-v* tag of the commit the run checked out. The plugin's schema names that release
  # as its download URL, so `pulumi package add envoy-infra@<version> --server <that URL>` installs
  # it. Nothing is committed: a Go module carries no version file, so the tag alone records the
  # version, and the binary's schema carries it. Only main releases one: a workflow_dispatch from
  # another branch skips this job.
  envoy_infra:
    # After pi_legion, as legion is: pi_legion runs after pi_envoy, which runs after envoy_plugin,
    # so every job here that pushes a version-bump commit to main has finished before this one
    # starts. A skipped pi_legion (nothing of its own to release) still lets this run.
    needs: [changes, pi_legion]
    if: >-
      always() &&
      github.ref == 'refs/heads/main' &&
      (needs.changes.outputs.envoy_infra == 'true' || github.event_name == 'workflow_dispatch') &&
      (needs.pi_legion.result == 'success' || needs.pi_legion.result == 'skipped')
    runs-on: ubuntu-24.04
    # contents: write creates the GitHub release (`gh release create`, below); id-token and
    # attestations: write are for the archives' provenance attestation (id-token is the Sigstore
    # signing certificate's OIDC token). The tag push uses the deploy key, not either scope.
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ssh-key: ${{ secrets.DEPLOY_KEY }}
          fetch-depth: 0
      - name: Determine next version
        id: version
        run: |
          # Anyone who can push a tag names one (no ruleset guards envoy-infra-v*), and git accepts
          # shell syntax in a tag name, so a version taken from one is used only when it is a plain
          # X.Y.Z. Every later step reads the version and the tag through env:, never pasted into
          # its script.
          plain_version() { [[ $1 =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; }

          # A tag already at this commit is a re-run of a run that pushed it, perhaps without its
          # release: rebuild and release that version, as release-envoy-listener.yaml does, so the
          # tag and release steps below take their reuse branches rather than the run skipping.
          EXISTING_TAG=$(git tag --list 'envoy-infra-v*' --points-at HEAD --sort=-v:refname | head -1)
          if [ -n "$EXISTING_TAG" ]; then
            if ! plain_version "${EXISTING_TAG#envoy-infra-v}"; then
              echo "::error::The tag $EXISTING_TAG at this commit is not envoy-infra-v<X.Y.Z>; refusing to release it"
              exit 1
            fi
            {
              echo "version=${EXISTING_TAG#envoy-infra-v}"
              echo "release_tag=$EXISTING_TAG"
              echo "skip=false"
            } >> "$GITHUB_OUTPUT"
            echo "Ensuring release for existing tag $EXISTING_TAG"
            exit 0
          fi

          PREV_TAG=$(git tag -l 'envoy-infra-v*' --sort=-v:refname | head -1)
          if [ -z "$PREV_TAG" ]; then
            # The first release is 0.1.0, as the listener's first was: the history of the paths
            # below predates the plugin, and its breaking commits say nothing about its API.
            VERSION="0.1.0"
            {
              echo "version=$VERSION"
              echo "release_tag=envoy-infra-v${VERSION}"
              echo "skip=false"
            } >> "$GITHUB_OUTPUT"
            echo "First release: envoy-infra-v${VERSION}"
            exit 0
          fi
          PREV_VERSION="${PREV_TAG#envoy-infra-v}"
          if ! plain_version "$PREV_VERSION"; then
            echo "::error::The newest envoy-infra-v* tag, $PREV_TAG, is not envoy-infra-v<X.Y.Z>; refusing to version from it"
            exit 1
          fi
          # The plugin renders grants from the Envoy packages it compiles in, so a commit to one of
          # them releases it; .github/scripts/check-envoy-infra-release-paths.sh holds these paths
          # to `go list -deps`. The notices script and the target list are runtime inputs of the
          # archives, so any change to one needs a new tag rather than a CI-only rebuild.
          # release-bump.sh reads a --patch-path only when it is also one of the paths after --.
          VERSION=$(.github/scripts/release-bump.sh "$PREV_VERSION" "${PREV_TAG}..HEAD" \
            --patch-path scripts/go-third-party-notices.sh --patch-path .github/envoy-infra-targets.json \
            -- packages/envoy/infra/ packages/envoy/internal/bus/ packages/envoy/internal/contracts/ \
            packages/envoy/go.mod packages/envoy/go.sum scripts/go-third-party-notices.sh \
            .github/envoy-infra-targets.json)

          if [ "$VERSION" = "empty" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "No commits in the envoy-infra plugin's paths since $PREV_TAG"
            exit 0
          fi
          if [ "$VERSION" = "none" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=No release published::No version-bumping commits since $PREV_TAG"
            echo "**No release published** — No version-bumping commits since $PREV_TAG" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          {
            echo "version=$VERSION"
            echo "release_tag=envoy-infra-v${VERSION}"
            echo "skip=false"
          } >> "$GITHUB_OUTPUT"
          echo "Bumping $PREV_TAG -> envoy-infra-v${VERSION}"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.version.outputs.skip != 'true'
        with:
          go-version-file: packages/envoy/infra/go.mod
          cache-dependency-path: |
            packages/envoy/infra/go.sum
            packages/envoy/go.sum
      # CGO_ENABLED=0: a static binary, so a linux archive runs on any distribution. One archive per
      # target .github/envoy-infra-targets.json lists (the pull request's notices check reads the
      # same list), under the name Pulumi requests from the schema's download URL,
      # pulumi-resource-envoy-infra-v<version>-<os>-<arch>.tar.gz, with the binary and
      # THIRD_PARTY_NOTICES at its root, where Pulumi looks for the binary. THIRD_PARTY_NOTICES is
      # the license of every Go module that target's binary compiles in
      # (scripts/go-third-party-notices.sh, run with the build's own GOOS, GOARCH and CGO_ENABLED),
      # and fails the build when one cannot be determined. SHA256SUMS, beside the archives, holds
      # each one's SHA-256, for a consumer that pins the plugin by digest. Every go command here
      # runs in the module's own go.work, which binds it and packages/envoy.
      - name: Build pulumi-resource-envoy-infra
        if: steps.version.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p out assets
          for target in $(jq -r '.["envoy-infra"][]' .github/envoy-infra-targets.json); do
            os=${target%/*}
            arch=${target#*/}
            dir="out/$os-$arch"
            mkdir -p "$dir"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go -C packages/envoy/infra build -buildvcs=false \
              -ldflags "-X main.version=$VERSION" \
              -o "$GITHUB_WORKSPACE/$dir/pulumi-resource-envoy-infra" ./cmd/pulumi-resource-envoy-infra
            (cd packages/envoy/infra && CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              ../../../scripts/go-third-party-notices.sh "$GITHUB_WORKSPACE/$dir/THIRD_PARTY_NOTICES" \
              ./cmd/pulumi-resource-envoy-infra)
            tar czf "assets/pulumi-resource-envoy-infra-v$VERSION-$os-$arch.tar.gz" -C "$dir" \
              pulumi-resource-envoy-infra THIRD_PARTY_NOTICES
          done
          (cd assets && sha256sum -- * > SHA256SUMS)
      # The Pulumi CLI the envoy-smoke job's live tests run, checked against its SHA-256 before it
      # is unpacked.
      - name: Install the Pulumi CLI
        if: steps.version.outputs.skip != 'true'
        run: |
          tarball="$RUNNER_TEMP/pulumi-v3.268.0-linux-x64.tar.gz"
          curl -fsSL -o "$tarball" https://get.pulumi.com/releases/sdk/pulumi-v3.268.0-linux-x64.tar.gz
          echo "903cafeaa9f6327e4bf53a8b7b99ae660f26198acfa804a2f982bf5de3f1de0b  $tarball" | sha256sum -c -
          tar -xzf "$tarball" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/pulumi" >> "$GITHUB_PATH"
      # The schema the linux/amd64 binary serves carries the version it was built with and names
      # the release this job creates as the place Pulumi downloads the plugin from. ${VERSION} in
      # the URL is Pulumi's own placeholder, which it fills in at install, so it is compared
      # literally. The binary's path is absolute: `pulumi package get-schema` reads a path that
      # starts with neither `/` nor `./` as a package name to resolve.
      - name: Smoke test
        if: steps.version.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          schema=$(pulumi package get-schema "$GITHUB_WORKSPACE/out/linux-amd64/pulumi-resource-envoy-infra")
          jq '{name, version, pluginDownloadURL}' <<<"$schema"
          # shellcheck disable=SC2016 # ${VERSION} is Pulumi's placeholder, not a shell expansion
          jq -e --arg v "$VERSION" \
            '.version == $v and .pluginDownloadURL == "https://github.com/sjawhar/legion/releases/download/envoy-infra-v${VERSION}"' \
            <<<"$schema"
      # Build provenance for the archives Pulumi installs, which the release below uploads exactly,
      # with SHA256SUMS, as the legion job's release does. `--repo` alone accepts an archive any
      # workflow of this repository attested, so a consumer pins the signer as docs/kubernetes.md
      # ("Pin by digest, never by tag") does:
      #   gh attestation verify pulumi-resource-envoy-infra-v<version>-<os>-<arch>.tar.gz --repo sjawhar/legion \
      #     --cert-identity https://github.com/sjawhar/legion/.github/workflows/release.yaml@refs/heads/main \
      #     --source-ref refs/heads/main --deny-self-hosted-runners
      # and adds `--source-digest <the envoy-infra-v<version> tag's commit>` to pin the commit as well.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: steps.version.outputs.skip != 'true'
        with:
          subject-path: assets/pulumi-resource-envoy-infra-v*.tar.gz
      - name: Tag release
        if: steps.version.outputs.skip != 'true'
        env:
          TAG: ${{ steps.version.outputs.release_tag }}
        run: |
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            test "$(git rev-list -n 1 "$TAG")" = "$GITHUB_SHA"
            exit 0
          fi
          git tag "$TAG"
          git push origin "refs/tags/$TAG"
      # A re-run can find this release already there. gh release create makes a draft, uploads every
      # asset and only then publishes it, so a published release holds them all and is reused as
      # is. A draft is what a job that died mid-upload leaves (gh release view finds drafts too), so
      # this run uploads its own attested assets over it and publishes it.
      - name: Create GitHub release
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.release_tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if is_draft=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$is_draft" = true ]; then
              echo "Release $TAG is an unpublished draft; uploading this run's assets and publishing it"
              gh release upload "$TAG" assets/* --clobber --repo "$GITHUB_REPOSITORY"
              gh release edit "$TAG" --draft=false --repo "$GITHUB_REPOSITORY"
            else
              echo "Release $TAG already exists; reusing it"
            fi
          else
            gh release create "$TAG" \
              assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "envoy-infra v$VERSION" \
              --generate-notes \
              --verify-tag
          fi
