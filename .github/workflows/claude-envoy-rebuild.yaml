name: Rebuild Claude Envoy plugin

# Keeps the built Claude Code plugin on the claude-plugin branch, packages/claude-envoy/dist and
# packages/claude-envoy/legion, equal to a build of main's own source. Claude Code installs the
# plugin from that branch (.claude-plugin/marketplace.json names the git-subdir source
# packages/claude-envoy at ref claude-plugin), and its plugin cache holds that tree with no
# node_modules, so the bundles and the Legion plugin must be tracked there, built. A pull request
# never commits them: this workflow builds main after each merge and puts the build on the branch.
# Nothing on main reads the branch, so a push to it resets no merge queue; main keeps the two
# directories it already tracks, as the last build it carried, and nothing here rewrites them.
#
# The repository's release-credential rule (AGENTS.md, Conventions) binds it, since it pushes with
# the deploy key, and check-release-credentials.sh pins its shape. `build` runs the dependencies'
# code (install, the bundler, the notices) and holds no write scope and no secret: it runs
# packages/claude-envoy/scripts/verify-build.sh (its header names every job that runs it), puts
# the tar that script packs into this job's own checkout with release-push.sh extract-built and
# fails when the build changed a file outside the two directories, hands that tar over, and ends
# in the no-credential tripwire. `push` holds the deploy key and actions: write, runs no dependency
# code and restores no cache: release-push.sh push-built checks the tar, member by member, before
# anything acts on it, commits it over main's tip and force-updates the branch with that one
# commit. It runs on every run of main, whatever the build found: push-built is the one decider of
# what is pushed, and it pushes nothing and says so when the branch already holds this build.
#
# `build` checks out main's tip when it starts, not the commit that started the run, so the newest
# pending run, the one the concurrency group below keeps, builds the newest main. `push` waits for a
# runner again, often past the next merge or a release's version-bump commit, so main has usually
# moved on by then. It makes the commit on main's tip all the same, a commit that changes only the
# two directories over that tip's tree, unless the branch already holds a newer build (the base
# named in the branch's tip does not precede this run's), when it pushes nothing; and when a build
# input (packages/claude-envoy/scripts/build-inputs.txt; tests/build-inputs.test.ts checks it
# against the files the bundles and the Legion plugin read, and the files read by path are listed
# by hand) changed between the two, it also starts a fresh run on main, which builds the new
# inputs. Main rewritten past the build's base pushes nothing and starts a fresh run. The push goes
# out only while main's tip is still the tip push-built checked; when main moves again in those
# seconds, nothing is pushed and one fresh run is started. So the branch's built files are a build
# of a recent main, at most one run behind its inputs, and never move backward. Its commit carries
# no skip keyword and needs none: every workflow of this repository that triggers on a push names
# `branches: [main]`, so a push to claude-plugin starts no run of its own; `build` ran the
# private-name check over the bundle already. A failed run pushes nothing and is red on its own;
# the next run builds again.
#
# A push to main that changes a build input starts a run, and only a newer run replaces a pending
# one, so the newest main is built. A push that changes no build input - a document, a daemon or
# listener source, a package's tests, a workflow this build never reads - would rebuild the
# bundles the branch already holds, so it starts no run at all. `paths:` below is what decides that,
# and packages/claude-envoy/tests/build-inputs.test.ts holds the two decisions equal over every
# tracked file: the one `paths:` makes and the one
# packages/claude-envoy/scripts/build-inputs.txt's pathspecs make, which is the list
# release-push.sh push-built already reads. A file either list takes and the other leaves fails
# that test, naming the file, so the trigger and the list cannot drift.
#
# One push can still change a build input and start nothing: GitHub leaves a path filter
# unsatisfied when the push's diff holds more than 3,000 files and no matching file is in the
# first 3,000 ("Workflow syntax for GitHub Actions", on.<push>.<paths>). The daily run below
# covers that push, as it covers a push carrying GitHub's skip keyword, such as a release's
# version bump, that changed a build input. So the branch's build is behind its inputs for at most
# a day in those two cases, and one run otherwise.
#
# A pull request that changes this workflow, release-push.sh or verify-build.sh runs `build` on its
# merge commit, its own proof before merge; `push` runs only on main.
on:
  push:
    branches: [main]
    # Every pathspec of packages/claude-envoy/scripts/build-inputs.txt, in its order, as GitHub
    # reads a path filter: a directory as `<dir>/**`, an exclusion as a `!` pattern after the
    # patterns it narrows, since a later match decides. The four paths that name no file today
    # (bunfig.toml and the .gitattributes files) are here all the same: the push that creates one
    # changes a build input, and no job of this repository would otherwise run on it.
    paths:
      - ".bun-version"
      - "bun.lock"
      - "package.json"
      - "bunfig.toml"
      - "patches/**"
      - ".gitignore"
      - ".gitattributes"
      - "packages/.gitignore"
      - "packages/.gitattributes"
      - "packages/claude-envoy/**"
      - "packages/envoy-client/**"
      - "packages/contracts/**"
      - "packages/pi-shared/**"
      - "packages/broker-client/**"
      - "packages/pi-legion/agents/**"
      - "skills/**"
      - "scripts/third-party-notices.ts"
      - "scripts/pi-plugin-prepack.sh"
      - ".github/scripts/check-private-names.sh"
      - ".github/scripts/release-push.sh"
      - ".github/workflows/claude-envoy-rebuild.yaml"
      - ".github/actions/setup-bun/**"
      # The build's own outputs, and the known non-inputs inside the packages above.
      - "!packages/claude-envoy/dist/**"
      - "!packages/claude-envoy/legion/**"
      - "!packages/*/.changes/**"
      - "!packages/*/CHANGELOG.md"
      - "!packages/*/AGENTS.md"
      - "!packages/*/README.md"
      - "!packages/*/tests/**"
      - "!packages/*/test/**"
      - "!packages/**/__tests__/**"
      - "!packages/**/*.test.ts"
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/claude-envoy-rebuild.yaml"
      - ".github/scripts/release-push.sh"
      - "packages/claude-envoy/scripts/verify-build.sh"

# Every job declares its own permissions (build, push below); nothing runs under this workflow-level
# default.
permissions: {}

# Main's runs never overlap, and a pending one is replaced only by a newer one, which builds a main
# at least as new; a branch's run is in a group of its own and never replaces main's.
concurrency:
  group: claude-envoy-rebuild-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Builds the plugin from main's tip (a pull request's merge commit on a pull request), checks the
  # build and packs it (verify-build), and hands it over. No write scope, no secret.
  build:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      base: ${{ steps.state.outputs.base }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.sha || 'main' }}
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # What it builds and checks: packages/claude-envoy/scripts/verify-build.sh.
      - name: Build, check and pack the plugin
        run: bun run verify-build "$RUNNER_TEMP/claude-envoy-built.tar"
        working-directory: packages/claude-envoy
      # What it writes: release-push.sh extract-built.
      - name: Put the checked build into the checkout
        run: .github/scripts/release-push.sh extract-built "$RUNNER_TEMP/claude-envoy-built.tar"
      # base is the commit this job built from, which push-built names in its commit's subject. The
      # build may change the two directories and nothing else. Whether it changed them at all is
      # no gate here: main's copies are frozen at the last build it carried, so a build equal to
      # them is still one the claude-plugin branch may lack, and push-built compares the build with
      # that branch instead.
      - name: Record the base, failing when the build changed anything else
        id: state
        run: |
          echo "base=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          other=$(git status --porcelain -- . ':(exclude)packages/claude-envoy/dist' ':(exclude)packages/claude-envoy/legion')
          if [ -n "$other" ]; then
            echo "::error::The build changed files outside packages/claude-envoy/dist and packages/claude-envoy/legion: ${other//$'\n'/; }"
            exit 1
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: claude-envoy-built
          path: ${{ runner.temp }}/claude-envoy-built.tar
          if-no-files-found: error
          retention-days: 1
      - name: Check this job holds no credential (tripwire)
        run: .github/scripts/release-push.sh no-credential

  # Commits build's tar over main's tip and force-updates the claude-plugin branch with that one
  # commit, unless the branch already holds a newer build, and starts a fresh run when a build
  # input changed since build's base (release-push.sh push-built). It runs no dependency code: only
  # release-push.sh, git, gh and tar, and the two pinned actions below. Its condition runs on
  # `always()` and tests build's result before reading its outputs. It needs no test of the event:
  # a pull_request run's github.ref is refs/pull/<number>/merge, never refs/heads/main.
  push:
    needs: build
    if: always() && needs.build.result == 'success' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # actions: write is for `gh workflow run`, which starts the fresh run; the push itself uses the
    # deploy key, held only by the "Land the build on the claude-plugin branch" step's env.
    permissions:
      contents: read
      actions: write
    # No cache is restored in a job that holds a credential.
    cache-mode: none
    steps:
      # The commit build built from, with history, for push-built's fetch of main's tip, its
      # comparison of the two and land_on_branch's fetch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.base }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: claude-envoy-built
          path: ${{ runner.temp }}/built
      # The only step that holds the deploy key.
      - name: Land the build on the claude-plugin branch
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE: ${{ needs.build.outputs.base }}
        run: .github/scripts/release-push.sh push-built "$BASE" "$RUNNER_TEMP/built/claude-envoy-built.tar"
