name: Rebuild Claude Envoy plugin

# Keeps the built Claude Code plugin on main, packages/claude-envoy/dist and
# packages/claude-envoy/legion, equal to a build of main's own source. Claude Code installs the
# plugin from main's git tree (.claude-plugin/marketplace.json names the source
# `./packages/claude-envoy`), and its plugin cache holds that tree with no node_modules, so the
# bundles and the Legion plugin must be tracked there, built. A pull request never commits them:
# this workflow builds main after each merge and lands the change.
#
# The repository's release-credential rule (AGENTS.md, Conventions) binds it, since it pushes with
# the deploy key, and check-release-credentials.sh pins its shape. `build` runs the dependencies'
# code (install, the bundler, the notices) and holds no write scope and no secret; it hands the
# build over as one tar and ends in the no-credential tripwire. `push` holds the deploy key and
# actions: write, runs no dependency code and restores no cache: release-push.sh push-built checks
# the tar, member by member, before anything acts on it, commits it over the commit it was built
# from and lands that one commit.
#
# `build` checks out main's tip when it starts, not the commit that started the run, so the newest
# pending run, the one the concurrency group below keeps, builds the newest main. `push` lands only
# onto the commit `build` built from: when main has moved on since — a newer merge, or a release's
# version-bump commit, which starts no run of its own — it pushes nothing and starts a fresh run on
# main instead, which builds main's tip. Its commit carries GitHub's skip keyword in its subject, so
# it starts no CI or release run of its own; `build` ran the private-name check over the bundle
# already. A failed run lands nothing, and the next push to main or the next hourly run builds
# again. The hourly run is the net under a missed or failed run: it ends red when it repaired a copy
# that had been stale for more than 30 minutes, so a person learns that a push run missed it.
#
# A pull request that changes this workflow or release-push.sh runs `build` on its merge commit, its
# own proof before merge; `push` runs only on main.
on:
  push:
    branches: [main]
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/claude-envoy-rebuild.yaml"
      - ".github/scripts/release-push.sh"

# Every job declares its own permissions (build, push below); nothing runs under this workflow-level
# default.
permissions: {}

# Main's runs never overlap, and a pending one is replaced only by a newer one, which builds a main
# at least as new; a branch's run is in a group of its own and never replaces main's.
concurrency:
  group: claude-envoy-rebuild-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Builds the plugin from main's tip (a pull request's merge commit on a pull request), checks the
  # build, and hands it over when it differs from the tracked files. No write scope, no secret.
  build:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      base: ${{ steps.state.outputs.base }}
      changed: ${{ steps.state.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.sha || 'main' }}
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build the plugin in place
        run: bun run build -- --in-place
        working-directory: packages/claude-envoy
      # A second build, byte-compared with the first: what lands is what the source builds to, not
      # one run's accident.
      - name: Check a second build matches the first
        run: bun run check-dist
        working-directory: packages/claude-envoy
      - name: Check the built plugin names nothing private
        run: .github/scripts/check-private-names.sh packages/claude-envoy/dist packages/claude-envoy/legion
      # base is the commit this job built from, the only commit push lands onto. The build may
      # change the two directories and nothing else.
      - name: Record the base and whether the build changed the tracked files
        id: state
        run: |
          echo "base=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          other=$(git status --porcelain -- . ':(exclude)packages/claude-envoy/dist' ':(exclude)packages/claude-envoy/legion')
          if [ -n "$other" ]; then
            echo "::error::The build changed files outside packages/claude-envoy/dist and packages/claude-envoy/legion: ${other//$'\n'/; }"
            exit 1
          fi
          if [ -n "$(git status --porcelain -- packages/claude-envoy/dist packages/claude-envoy/legion)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Pack the build
        if: steps.state.outputs.changed == 'true'
        run: tar -cf "$RUNNER_TEMP/claude-envoy-built.tar" -C packages/claude-envoy dist legion
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.state.outputs.changed == 'true'
        with:
          name: claude-envoy-built
          path: ${{ runner.temp }}/claude-envoy-built.tar
          if-no-files-found: error
          retention-days: 1
      - name: Check this job holds no credential (tripwire)
        run: .github/scripts/release-push.sh no-credential

  # Lands build's tar on main as one commit over the commit build built from, or starts a fresh run
  # when main has moved on (release-push.sh push-built). It runs no dependency code: only
  # release-push.sh, git, gh, tar and date, and the two pinned actions below. Its condition runs on
  # `always()` and tests build's result before reading its outputs.
  push:
    needs: build
    if: always() && needs.build.result == 'success' && needs.build.outputs.changed == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    # actions: write is for `gh workflow run`, which starts the fresh run; the push itself uses the
    # deploy key, held only by the "Land the build on main" step's env.
    permissions:
      contents: read
      actions: write
    # No cache is restored in a job that holds a credential.
    cache-mode: none
    steps:
      # The commit build built from, with history, for push-built's commit and land_on_main's fetch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.base }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: claude-envoy-built
          path: ${{ runner.temp }}/built
      # The only step that holds the deploy key.
      - name: Land the build on main
        id: push
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE: ${{ needs.build.outputs.base }}
        run: .github/scripts/release-push.sh push-built "$BASE" "$RUNNER_TEMP/built/claude-envoy-built.tar"
      # A copy that stayed stale for more than 30 minutes until the hourly run means a push run
      # missed it: the repair landed, and the run ends red so a person looks.
      - name: Fail when the hourly run repaired a stale copy
        if: github.event_name == 'schedule' && steps.push.outputs.pushed == 'true'
        env:
          BASE: ${{ needs.build.outputs.base }}
        run: |
          age=$(( $(date +%s) - $(git log -1 --format=%ct "$BASE") ))
          if [ "$age" -gt 1800 ]; then
            echo "::error::main's built Claude Envoy plugin was stale at $BASE, committed $((age / 60)) minutes before this hourly run repaired it; a push run missed it"
            exit 1
          fi
