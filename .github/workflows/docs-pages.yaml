name: Docs (main)

# Builds the documentation site (docs/site) on every push to main whose change could change it, and
# publishes it to GitHub Pages, at the address .github/scripts/repo-paths.sh derives from the
# repository this runs in (https://sjawhar.github.io/legion/ today). The build is docs-site.yaml's,
# which holds those steps once. Pull requests and merge groups call the same workflow from
# ci.yaml's docs job; this workflow is main's half.
#
# A `workflow_dispatch` run starts this workflow on any branch. The build job runs as it does on
# main, with the `upload-pages-artifact` step that no other caller of docs-site.yaml asks for, so
# a dispatch of a branch proves that step before the merge. The deploy job runs on main alone
# (`github.ref`), so a dispatch of a branch deploys nothing to the live site.
#
# A workflow of its own, so deployments happen in push order and the site ends at the newest
# docs-selecting commit's build. A workflow-level concurrency group takes runs in the order they
# start, and GitHub starts a push's run when the push lands. A job-level group takes jobs in the
# order the jobs they need end: in ci.yaml every push to main is a run of its own, so a deploy job
# there joined its group when its build ended, and a slower build of an older commit could deploy
# after a newer one.
#
# The paths below are ci.yaml's docs filter flattened as dorny/paths-filter reads it (each
# anchor's group in its place and order, the one duplicate kept), so main builds the site on
# exactly the changes a pull request's docs job builds it on. .github/scripts/check-ci-filters.sh
# fails when the two lists differ, naming each missing and extra pattern (ci_job_reads.py's
# PUSH_WORKFLOWS pairs them), so change the filter and this list together.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ci.yaml'
      - '.github/workflows/docs-pages.yaml'
      - '.github/workflows/docs-site.yaml'
      # ci.yaml's *bun_install, 16 patterns:
      - 'package.json'
      - 'bun.lock'
      - 'patches/**'
      - 'packages/contracts/package.json'
      - 'packages/envoy-client/package.json'
      - 'packages/pi-envoy/package.json'
      - 'packages/pi-legion/package.json'
      - 'packages/pi-shared/package.json'
      - 'packages/claude-envoy/package.json'
      - 'packages/proof-editor/package.json'
      - 'packages/dispatch/package.json'
      - 'packages/envoy/internal/dispatch/pmdoc/gen/package.json'
      - 'docs/site/package.json'
      - '.bun-version'
      - '.github/actions/setup-bun/**'
      # ci.yaml's *biome, 2 patterns:
      - 'biome.json'
      - '.gitignore'
      # ci.yaml's *go_workspace, 6 patterns:
      - 'go.work'
      - 'go.work.sum'
      - 'packages/daemon/go.mod'
      - 'packages/daemon/go.sum'
      - 'packages/envoy/go.mod'
      - 'packages/envoy/go.sum'
      # The docs filter's own:
      - 'docs/site/**'
      # ci.yaml's *legion_command, 57 patterns:
      - 'packages/daemon/cmd/legion/*'
      - 'packages/daemon/internal/admit/*'
