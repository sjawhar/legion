# One run at a time, in push order: `queue: max` keeps up to 100 runs waiting in the group, first
# in, first out, where the default keeps one and replaces it with the next arrival
# (docs.github.com, "Control the concurrency of workflows and jobs"), and cancel-in-progress: false
# never cancels a running one. GitHub promises two bounds and no more: a run past the 100 waiting
# is not queued, and the `paths:` filter skips a push whose diff holds more than 3,000 files when
# none of the first 3,000 matches (workflow syntax, "Git diff comparisons"). A push either bound
# drops leaves the site at the last build published; the next docs-selecting push heals it.
concurrency:
  group: pages
  cancel-in-progress: false
  queue: max

# Read-only: the token clones and downloads pinned tools. The deploy job declares what publishing
# to GitHub Pages needs in a block of its own.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    # The screenshots step boots Dispatch on the e2e harness, which needs a database it may
    # truncate.
    services:
      postgres:
        image: mirror.gcr.io/pgvector/pgvector@sha256:2358fcba361ed2233a5ed81b5fe4ca779ccb304120ce531a3bf51c0ed7e2bc11
        env:
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      # Astro runs on Node.js (22.12 or newer).
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      # docs/site/scripts/build-binaries.sh builds the Go binaries the reference generators run, and
      # the screenshots step builds the Dispatch server; both modules name the same Go.
      - id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/daemon/go.mod
          cache: false
      # go-docs, the family ci.yaml's docs job restores, kept as ci.yaml's header says: restored
      # in the form docs/solutions/github/join-a-job-to-the-ci-router.md gives (on main, by the
      # exact key only) and saved by this job alone.
      - id: go-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-docs-${{ runner.os }}-go${{ steps.setup-go.outputs.go-version }}
          restore-keys: ${{ github.ref != 'refs/heads/main' && format('go-docs-{0}-', runner.os) || '' }}
      - run: bun install --frozen-lockfile
      - name: Lint the docs site
        run: bun run lint
        working-directory: docs/site
      - name: Typecheck the docs site
        run: bun run typecheck
        working-directory: docs/site
      # The pages' screenshots are made, not committed (docs/site/media/README.md): Dispatch on
      # the e2e harness, seeded with example data, captured in Chromium.
      - name: Build the Dispatch dashboard the screenshots show
        run: bun run build:web
        working-directory: packages/dispatch
      - name: Install Playwright Chromium
        # The runner image's chrome-stable apt source intermittently fails `apt-get update`, which
        # takes `--with-deps` down with it; Chrome itself is preinstalled, so the source goes.
        run: |
          grep -rl dl.google.com /etc/apt/sources.list.d | xargs -r sudo rm -f
          bunx playwright install --with-deps chromium
        working-directory: docs/site
      - name: Take the screenshots
        run: bun run docs:media
        # A step of the run that hangs fails it within two minutes (STEP_TIMEOUT_MS in
        # docs/site/media/harness.ts); this bounds the rest, the build and the boot.
        timeout-minutes: 15
        env:
          DATABASE_URL: postgres://postgres:ci@localhost:5432/postgres?sslmode=disable
      # What each failed shot's page showed, and the harness's process logs: a hang leaves the
      # Dispatch server's goroutines at the end of dispatch.log.
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-failed-shots-${{ github.run_attempt }}
          path: |
            docs/site/media/.work/failed-shots
            docs/site/media/.work/harness
          if-no-files-found: ignore
      # Generates the reference pages, then builds the site; starlight-links-validator fails it on a
      # broken internal link. The build writes dist/THIRD_PARTY_NOTICES.txt (docs/site/astro.config.mjs),
      # failing on a package whose license cannot be determined; the listing shows the site ships it.
      - name: Build the docs site
        run: |
          bun run docs:build
          ls -l docs/site/dist/THIRD_PARTY_NOTICES.txt
      # The built site, generated reference pages and copied media captions include no private
      # deployment repository, company, internal host, or Tailscale MagicDNS host; ci.yaml's lint
      # job checks the sources.
      - name: Check the built site has no private name, internal host, or tailnet host
        run: .github/scripts/check-private-names.sh docs/site/dist
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/site/dist
      - if: github.event_name == 'push' && success() && steps.go-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ steps.go-cache.outputs.cache-primary-key }}

  # No concurrency of its own: the workflow's group already holds the next run until this one's
  # deploy ends.
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    # Publishes the built site to GitHub Pages: pages: write performs the deployment, id-token:
    # write is the OIDC token actions/deploy-pages exchanges for it.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
