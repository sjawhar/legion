      - 'scripts/third-party-notices.ts'
      - '.github/scripts/check-private-names.sh'
      - '.github/scripts/repo-paths.sh'
  workflow_dispatch:

# One run at a time, in push order: `queue: max` keeps up to 100 runs waiting in the group, first
# in, first out, where the default keeps one and replaces it with the next arrival
# (docs.github.com, "Control the concurrency of workflows and jobs"), and cancel-in-progress: false
# never cancels a running one. GitHub promises two bounds and no more: a run past the 100 waiting
# is not queued, and the `paths:` filter skips a push whose diff holds more than 3,000 files when
# none of the first 3,000 matches (workflow syntax, "Git diff comparisons"). A push either bound
# drops leaves the site at the last build published; the next docs-selecting push heals it.
concurrency:
  group: pages
  cancel-in-progress: false
  queue: max

# Read-only: the token clones and downloads pinned tools. The deploy job declares what publishing
# to GitHub Pages needs in a block of its own.
permissions:
  contents: read

jobs:
  # The shared build, plus the two steps only main needs: the Pages artifact the deploy job
  # below publishes, and the save of the go-docs cache entry.
  #
  # No timeout-minutes: GitHub's keywords for a job that calls a reusable workflow leave it out.
  # docs-site.yaml's own job carries the limit.
  build:
    uses: ./.github/workflows/docs-site.yaml
    with:
      upload-pages-artifact: true
      save-cache: true

  # No concurrency of its own: the workflow's group already holds the next run until this one's
  # deploy ends. The if: holds the deployment to main: a workflow_dispatch of a branch builds the
  # site and uploads the artifact, and publishes nothing to the live site.
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Publishes the built site to GitHub Pages: pages: write performs the deployment, id-token:
    # write is the OIDC token actions/deploy-pages exchanges for it.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
