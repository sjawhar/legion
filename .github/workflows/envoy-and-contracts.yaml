name: Legion Envoy and Contracts

on:
  push:
    branches: [main]
    paths:
      - "packages/envoy/**"
      - "packages/contracts/**"
      # Every skill: pi-envoy ships them, and its skills-guard test checks their sizes and links.
      - "skills/**"
      - "packages/envoy-client/**"
      - "packages/envoy-plugin/**"
      - "packages/claude-envoy/**"
      - "packages/pi-envoy/**"
      - "packages/dispatch/**"
      - "packages/proof-editor/**"
      - "patches/**"
      - "package.json"
      - "bun.lock"
      - "packages/daemon-go/**"
      - "packages/daemon/docker/worker.Dockerfile"
      - ".github/actions/install-jj/**"
      - ".github/actions/install-uv/**"
      - "go.work"
      - "go.work.sum"
      - "scripts/e2e/**"
      - "deploy/kubernetes/operator-route/**"
      - "packages/daemon/src/daemon/omp-pin.ts"
      - ".github/actions/install-omp/**"
      # The envoy-smoke job builds packages/envoy/docker/Dockerfile, so this list owes every
      # file that build reads: the four below are the ones the entries above do not already
      # cover. .github/scripts/check-image-trigger-paths.sh fails the build when one is missing.
      - ".github/workflows/envoy-and-contracts.yaml"
      - ".dockerignore"
      - "packages/daemon/package.json"
      - "packages/workspace/package.json"
  pull_request:
    paths:
      - "packages/envoy/**"
      - "packages/contracts/**"
      # Every skill: pi-envoy ships them, and its skills-guard test checks their sizes and links.
      - "skills/**"
      - "packages/envoy-client/**"
      - "packages/envoy-plugin/**"
      - "packages/claude-envoy/**"
      - "packages/pi-envoy/**"
      - "packages/dispatch/**"
      - "packages/proof-editor/**"
      - "patches/**"
      - "package.json"
      - "bun.lock"
      - "packages/daemon-go/**"
      - "packages/daemon/docker/worker.Dockerfile"
      - ".github/actions/install-jj/**"
      - ".github/actions/install-uv/**"
      - "go.work"
      - "go.work.sum"
      - "scripts/e2e/**"
      - "deploy/kubernetes/operator-route/**"
      - "packages/daemon/src/daemon/omp-pin.ts"
      - ".github/actions/install-omp/**"
      # Same four the push list owes, for the same build.
      - ".github/workflows/envoy-and-contracts.yaml"
      - ".dockerignore"
      - "packages/daemon/package.json"
      - "packages/workspace/package.json"
  merge_group:
    types: [checks_requested]

jobs:
  # Detect which packages actually changed to skip unnecessary jobs.
  changes:
    runs-on: ubuntu-24.04
    outputs:
      contracts: ${{ steps.filter.outputs.contracts }}
      envoy_client: ${{ steps.filter.outputs.envoy_client }}
      envoy: ${{ steps.filter.outputs.envoy }}
      envoy_e2e_local: ${{ steps.filter.outputs.envoy_e2e_local }}
      envoy_image: ${{ steps.filter.outputs.envoy_image }}
      plugin: ${{ steps.filter.outputs.plugin }}
      claude_plugin: ${{ steps.filter.outputs.claude_plugin }}
      pi_envoy: ${{ steps.filter.outputs.pi_envoy }}
      dispatch: ${{ steps.filter.outputs.dispatch }}
      daemon_go: ${{ steps.filter.outputs.daemon_go }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            contracts:
              - 'packages/contracts/**'
              - 'skills/dispatch/**'
              # A lockfile or root manifest change moves what the package resolves (#1519 nested
              # a second zod under contracts through the lock alone).
              - 'package.json'
              - 'bun.lock'
            envoy_client:
              - 'packages/envoy-client/**'
              - 'packages/contracts/**'
              - 'package.json'
              - 'bun.lock'
            envoy:
              - 'packages/envoy/**'
              - 'packages/proof-editor/**'
              - 'packages/contracts/**'
              - 'skills/dispatch/**'
              - 'go.work'
              - 'go.work.sum'
              # Its bun run gen:go step imports contracts' zod schemas.
              - 'package.json'
              - 'bun.lock'
            # Every file packages/envoy/docker/Dockerfile builds from, so the envoy-smoke job
            # runs whenever the image it smokes changes. `envoy` is deliberately not widened to
            # this: that would run the whole Go suite on every Dispatch pull request.
            # .github/scripts/check-image-trigger-paths.sh fails the build when this list misses
            # a file the build reads.
            envoy_image:
              - 'packages/envoy/**'
              - 'packages/contracts/**'
              - 'packages/dispatch/**'
              - 'packages/proof-editor/**'
              - 'package.json'
              - 'bun.lock'
              - 'patches/**'
              - 'packages/envoy-client/package.json'
              - 'packages/pi-envoy/package.json'
              - 'packages/daemon/package.json'
              - 'packages/envoy-plugin/package.json'
              - 'packages/claude-envoy/package.json'
              - 'packages/workspace/package.json'
              - '.dockerignore'
              - '.github/workflows/envoy-and-contracts.yaml'
              # The job also COMPILES TestSmoke, in workspace mode, so the workspace files and
              # every module in it belong here too — `envoy` carried go.work and go.work.sum and
              # this filter must not be narrower. packages/daemon-go requires testcontainers-go,
              # so its manifests move the smoke's module graph.
              - 'go.work'
              - 'go.work.sum'
              - 'packages/daemon-go/go.mod'
              - 'packages/daemon-go/go.sum'
            # The local acceptance run drives the Go listener and renders every frame with the
            # shared TypeScript renderer, so a change to either side, or to the contracts both
            # read, must run it.
            envoy_e2e_local:
              - 'packages/envoy/**'
              - 'packages/envoy-client/**'
              - 'packages/contracts/**'
              - 'go.work'
              - 'go.work.sum'
              - 'package.json'
              - 'bun.lock'
            plugin:
              - 'packages/envoy-plugin/**'
              - 'packages/envoy-client/**'
              - 'packages/contracts/**'
              - 'package.json'
              - 'bun.lock'
            claude_plugin:
              - 'packages/claude-envoy/**'
              - 'packages/envoy-client/**'
              - 'packages/contracts/**'
              - 'package.json'
              - 'bun.lock'
            pi_envoy:
              - 'packages/pi-envoy/**'
              - 'packages/envoy-client/**'
              - 'packages/contracts/**'
              - 'package.json'
              - 'bun.lock'
              # The skills pi-envoy ships, which src/skills-guard.test.ts checks.
              - 'skills/**'
              # The Oh My Pi pin the real-binary tests run (extensions/legion-phase-stall-omp.test.ts,
              # extensions/dispatch-first-omp.test.ts).
              - 'packages/daemon/src/daemon/omp-pin.ts'
              - '.github/actions/install-omp/**'
              # The jj its tests drive is the worker image's.
              - 'packages/daemon/docker/worker.Dockerfile'
              - '.github/actions/install-jj/**'
            dispatch:
              - 'packages/dispatch/**'
              - 'packages/proof-editor/**'
              - 'packages/contracts/**'
              - 'packages/envoy/internal/dispatch/**'
              - 'packages/envoy/cmd/dispatch/**'
              # The editor's source pin and its remaining patches can change document rendering,
              # including the Dark Reader inline-style guard.
              - 'patches/**'
              - 'package.json'
              - 'bun.lock'
            daemon_go:
              - 'packages/daemon-go/**'
              - 'packages/envoy/go.mod'
              - 'packages/envoy/go.sum'
              - 'go.work'
              - 'go.work.sum'
              - 'scripts/e2e/**'
              # The operator route's pod.yml, which two daemon-go tests load (config, sandbox).
              - 'deploy/kubernetes/operator-route/**'
              # The jj and uv its tests drive are the worker image's.
              - 'packages/daemon/docker/worker.Dockerfile'
              - '.github/actions/install-jj/**'
              - '.github/actions/install-uv/**'
              # Stage 3's live proof consumes the Go wire fixtures and the native Dispatch
              # server through the Go client. Any change on either side must run the Go lanes.
              - 'packages/contracts/fixtures/**'
              - 'packages/envoy/internal/dispatch/**'
              - 'packages/envoy/cmd/dispatch/**'
              # The plugin's Go client and the manifest field the boot gate holds it to.
              - 'packages/pi-envoy/**'
              # The skills the plugin ships, which internal/daemon's image-probe test resolves with
              # the plugin's agents and role prompts (TestTheImageProbeRequiresTheDeepRoleOfTheShippedDeepWorker).
              - 'skills/**'
              # The Oh My Pi pin the real-binary tests run (internal/podsafety's baseline, the
              # pod agent's argv in internal/runtime/sandbox).
              - 'packages/daemon/src/daemon/omp-pin.ts'
              - '.github/actions/install-omp/**'

  contracts:
    needs: changes
    if: needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-bun
      - run: bun install --frozen-lockfile
      - name: Lint contracts
        run: bun run lint
        working-directory: packages/contracts
      - name: Typecheck contracts
        run: bun run typecheck
        working-directory: packages/contracts
      - name: Test contracts
        run: bun run test
        working-directory: packages/contracts
      - name: Build contracts
        run: bun run build
        working-directory: packages/contracts

  envoy-plugin:
    needs: changes
    if: needs.changes.outputs.plugin == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-bun
      - run: bun install --frozen-lockfile
      - name: Lint envoy plugin
        run: bun run lint
        working-directory: packages/envoy-plugin
      - name: Typecheck envoy plugin
        run: bun run typecheck
        working-directory: packages/envoy-plugin
      - name: Test envoy plugin
        run: bun run test
        working-directory: packages/envoy-plugin
      - name: Pack envoy plugin
        run: bun pm pack --destination ../../out/pr-artifacts
        working-directory: packages/envoy-plugin
      - uses: actions/upload-artifact@v4
        with:
          name: opencode-legion-envoy-plugin-pr
          path: out/pr-artifacts/*.tgz

  envoy-client:
    needs: changes
    if: needs.changes.outputs.envoy_client == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-bun
      - run: bun install --frozen-lockfile
      - name: Build contracts for Envoy client
        run: bun run build
        working-directory: packages/contracts
      - name: Lint Envoy client
        run: bun run lint
        working-directory: packages/envoy-client
      - name: Typecheck Envoy client
        run: bun run typecheck
        working-directory: packages/envoy-client
      - name: Pre-pull the NATS image the credential tests run
        run: docker pull nats:2.10
      - name: Test Envoy client
        run: bun run test
        working-directory: packages/envoy-client
        env:
          LEGION_E2E: "1"
      - name: Build Envoy client
        run: bun run build
        working-directory: packages/envoy-client

  pi-envoy:
    needs: changes
    if: needs.changes.outputs.pi_envoy == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-bun
      - uses: ./.github/actions/install-jj
      # extensions/legion-phase-stall-omp.test.ts and extensions/dispatch-first-omp.test.ts run the
      # pinned Oh My Pi against stand-ins (extensions/test-omp-harness.ts) and refuse on GitHub Actions
      # without one. The pin is read from omp-pin.ts, the repository's one copy of it, installed
      # through the mise install-jj leaves at ~/.local/bin/mise (.github/actions/install-omp).
      - uses: ./.github/actions/install-omp
      - run: bun install --frozen-lockfile
      - name: Build contracts for pi-envoy
        run: bun run build
        working-directory: packages/contracts
      - name: Lint pi-envoy
        run: bun run lint
        working-directory: packages/pi-envoy
      - name: Typecheck pi-envoy
        run: bun run typecheck
        working-directory: packages/pi-envoy
      - name: Test pi-envoy
        run: bun run test
        working-directory: packages/pi-envoy
      - name: Build pi-envoy
        run: bun run build
        working-directory: packages/pi-envoy

  dispatch:
    needs: changes
    if: needs.changes.outputs.dispatch == 'true'
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:ci@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: packages/envoy/go.mod
      - uses: ./.github/actions/setup-bun
      - run: bun install --frozen-lockfile
      - name: Lint proof editor
        run: bun run lint
        working-directory: packages/proof-editor
      - name: Typecheck proof editor
        run: bun run typecheck
        working-directory: packages/proof-editor
      - name: Test proof editor
        run: bun run test
        working-directory: packages/proof-editor
      - name: Lint dispatch dashboard
        run: bun run lint
        working-directory: packages/dispatch
      - name: Typecheck dispatch dashboard
        run: bun run typecheck
        working-directory: packages/dispatch
      - name: Test dispatch dashboard
        run: bun run test
        working-directory: packages/dispatch
      - name: Build dispatch dashboard
        run: bun run build:web
        working-directory: packages/dispatch
      - name: Check dispatch dashboard CSS classes
        run: bun run check:classes
        working-directory: packages/dispatch
      - name: Install Playwright Chromium, WebKit and Firefox
        # The runner image preconfigures Google's chrome-stable apt source, whose
        # index intermittently fails `apt-get update` with a hash-sum mismatch and
        # takes `--with-deps` down with it. Chrome is already installed there; the
        # source only serves upgrades, so drop it before installing our deps.
        run: |
          grep -rl dl.google.com /etc/apt/sources.list.d | xargs -r sudo rm -f
          bunx playwright install --with-deps chromium webkit firefox
        working-directory: packages/dispatch
      - name: Browser-test dispatch dashboard
        # `bun run e2e` builds the SPA itself, which would rebuild it a second time in this job.
        # Calling Playwright directly reuses the "Build dispatch dashboard" step's dist above and
        # drops this job to one Vite build. Safe because that build and this one are now the same
        # binary: `packages/dispatch` no longer has an E2E-only build flag (removed with its sole,
        # unconsumed consumer, the `window.__dispatchDocument` inspection probe).
        run: bunx playwright test --config e2e/playwright.config.ts
        working-directory: packages/dispatch
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: dispatch-e2e-test-results-${{ github.run_attempt }}
          path: packages/dispatch/e2e/test-results

  claude-envoy:
    needs: changes
    if: needs.changes.outputs.claude_plugin == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-bun
      - run: bun install --frozen-lockfile
      - name: Lint Claude Envoy plugin
        run: bun run lint
        working-directory: packages/claude-envoy
      - name: Typecheck Claude Envoy plugin
        run: bun run typecheck
        working-directory: packages/claude-envoy
      - name: Check the committed bundle is fresh
        run: bun run check-dist
        working-directory: packages/claude-envoy
      - name: Test Claude Envoy plugin
        run: bun run test
        working-directory: packages/claude-envoy
      - name: Pack Claude Envoy plugin
        run: bun pm pack --destination ../../out/pr-artifacts
        working-directory: packages/claude-envoy
      - uses: actions/upload-artifact@v4
        with:
          name: claude-envoy-pr
          path: out/pr-artifacts/*.tgz

  envoy-go:
    needs: changes
    if: needs.changes.outputs.envoy == 'true'
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DISPATCH_TEST_DATABASE_URL: postgres://postgres:ci@localhost:5432/postgres?sslmode=disable
      BROKER_TEST_DATABASE_URL: postgres://postgres:ci@localhost:5432/postgres?sslmode=disable
      # The runner VM is discarded after the job, so testcontainers' Ryuk reaper has nothing to
      # clean up, and its image would be one more registry pull a test could fail on.
      TESTCONTAINERS_RYUK_DISABLED: "true"
      # (The smoke test and the image it runs live in the envoy-smoke job below.)
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-bun
      - run: bun install --frozen-lockfile
      - uses: actions/setup-go@v5
        with:
          go-version-file: packages/envoy/go.mod
      - name: Check Go formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt -l lists files that are not gofmt-formatted; run gofmt -w on them:"
            echo "$unformatted"
            exit 1
          fi
        working-directory: packages/envoy
      - name: Check Go contracts are generated from the shared schema
        run: bun run check:go
        working-directory: packages/contracts
      - name: Check pmdoc fixtures are up to date
        run: bun run check
        working-directory: packages/envoy/internal/dispatch/pmdoc/gen
      # Testcontainers pulls a missing image when a test first asks for it, and the Docker daemon
      # reports a registry connection reset as an internal error that testcontainers does not
      # retry, so one reset failed every test sharing that container. Pull the image every test
      # here starts (testnats.Image) instead, with the bounded retry the runner gives its own
      # service images.
      - name: Pull test container images
        run: |
          nats_image=$(sed -n 's/^const Image = "\(.*\)"$/\1/p' internal/testnats/nats.go)
          [ -n "$nats_image" ] || { echo "::error::no const Image in internal/testnats/nats.go"; exit 1; }
          for attempt in 1 2 3; do
            docker pull "$nats_image" && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 10
          done
        working-directory: packages/envoy
      - name: Unit test envoy Go package
        run: go list ./... | grep -v /integration | xargs go test
        working-directory: packages/envoy
      - name: Isolation test for dev-broker.sh (fakes docker/go/curl; no real Postgres or network)
        run: bash scripts/dev-broker.test.sh
        working-directory: packages/envoy
      - name: Integration test envoy (testcontainers + NATS)
        run: go test ./internal/integration/ -timeout 300s -count=1
        working-directory: packages/envoy
      - name: Build envoy services
        run: go build ./cmd/dispatch ./cmd/listener
        working-directory: packages/envoy
      - name: Pack envoy binaries
        run: |
          mkdir -p ../../out/pr-artifacts/envoy-amd64
          GOOS=linux GOARCH=amd64 go build -buildvcs=false -o ../../out/pr-artifacts/envoy-amd64/envoy-listener ./cmd/listener
          tar czf ../../out/pr-artifacts/legion-envoy-amd64.tar.gz -C ../../out/pr-artifacts/envoy-amd64 envoy-listener
          mkdir -p ../../out/pr-artifacts/envoy-arm64
          GOOS=linux GOARCH=arm64 go build -buildvcs=false -o ../../out/pr-artifacts/envoy-arm64/envoy-listener ./cmd/listener
          tar czf ../../out/pr-artifacts/legion-envoy-arm64.tar.gz -C ../../out/pr-artifacts/envoy-arm64 envoy-listener
        working-directory: packages/envoy
      - uses: actions/upload-artifact@v4
        with:
          name: legion-envoy-binaries-pr
          path: |
            out/pr-artifacts/legion-envoy-amd64.tar.gz
            out/pr-artifacts/legion-envoy-arm64.tar.gz

  # The container smoke test, and the image it runs. Its own job, gated on envoy_image rather
  # than envoy: the image is built from the Dispatch SPA and the Bun workspace as well as the Go
  # sources, so a Dispatch-only change changes the image and must smoke it, while widening
  # `envoy` would run the whole Go suite on every Dispatch pull request instead. Before this
  # split the smoke lived in envoy-go, so PR #1562 (packages/dispatch only) skipped envoy-go and
  # never smoked the image it changed (run 36494702052).
  # .github/scripts/check-image-trigger-paths.sh fails the build when envoy_image misses a file
  # the build reads.
  envoy-smoke:
    needs: changes
    if: needs.changes.outputs.envoy_image == 'true'
    runs-on: ubuntu-24.04
    env:
      # The runner VM is discarded after the job, so testcontainers' Ryuk reaper has nothing to
      # clean up, and its image would be one more registry pull a test could fail on.
      TESTCONTAINERS_RYUK_DISABLED: "true"
      # The listener image the smoke test runs against, built by its own step below.
      ENVOY_SMOKE_IMAGE: legion-envoy-smoke:${{ github.sha }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: packages/envoy/go.mod
      # Testcontainers pulls a missing image when a test first asks for it, and the Docker daemon
      # reports a registry connection reset as an internal error that testcontainers does not
      # retry, so one reset failed every test sharing that container. Pull every image the build
      # or the test starts from here instead (testnats.Image and the smoke image's base images),
      # with the bounded retry the runner gives its own service images.
      - name: Pull test container images
        run: |
          nats_image=$(sed -n 's/^const Image = "\(.*\)"$/\1/p' internal/testnats/nats.go)
          [ -n "$nats_image" ] || { echo "::error::no const Image in internal/testnats/nats.go"; exit 1; }
          # The SPA stage's base carries an ARG (the Bun pin), so expand each ARG default
          # into the FROM that uses it before pulling.
          dockerfile_images=$(awk '
            $1 == "ARG" { eq = index($2, "="); if (eq > 0) args[substr($2, 1, eq - 1)] = substr($2, eq + 1) }
            $1 == "FROM" { image = $2; for (name in args) gsub("[$][{]" name "[}]", args[name], image); print image }
          ' docker/Dockerfile)
          for image in "$nats_image" $dockerfile_images; do
            for attempt in 1 2 3; do
              docker pull "$image" && break
              [ "$attempt" -lt 3 ] || exit 1
              sleep 10
            done
          done
        working-directory: packages/envoy
      # The image build is a step of its own: what TestSmoke asserts is the container's
      # behaviour, so a slow build must fail nothing. Inside the test it spent 256.60–289.47 s
      # of `go test -timeout 5m` across ten Release Envoy Listener runs while the five
      # assertions measured 0.00 s each (LEGION-361;
      # docs/solutions/testing/a-container-build-inside-go-test-spends-the-tests-deadline.md).
      # The test refuses to run without ENVOY_SMOKE_IMAGE rather than building one, so dropping
      # or renaming this step turns the lane red instead of restoring that budget silently.
      # `load: true` is Docker's documented test-before-push shape, and the only build form
      # .github/scripts/check-image-trigger-paths.sh can read. No LEGION_COMMIT: this job
      # publishes no image to match. The pull step above put the base images in the daemon's
      # store, which the default `docker` driver reads.
      - name: Build the listener image the smoke test runs against
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/envoy/docker/Dockerfile
          load: true
          tags: ${{ env.ENVOY_SMOKE_IMAGE }}
      # 5m bounds only what the test does: pull NATS, start both containers behind the test's
      # own 60 s health wait, and assert. This job has measured 1.82 s, 3.16 s and 1.88 s (the
      # last in run 36508580490), and 2.2–20.7 s across four runs on a devbox at load average
      # 80, so the bound is deliberate headroom, not a build budget.
      - name: Container smoke test (testcontainers)
        run: go test -tags smoke -v -timeout 5m ./internal/smoke/
        working-directory: packages/envoy

  # packages/envoy/scripts/e2e-local.sh: signed GitHub fixtures and a direct message through a real
  # listener and NATS, every frame rendered by both inbound renderers (renderInbound and Go's
  # Deliverer.Text) and checked against the acceptance contract.
  envoy-e2e-local:
    needs: changes
    if: needs.changes.outputs.envoy_e2e_local == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      E2E_NATS_CONTAINER: envoy-e2e-nats-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-bun
      - run: bun install --frozen-lockfile
      - uses: actions/setup-go@v5
        with:
          go-version-file: packages/envoy/go.mod
          cache-dependency-path: packages/envoy/go.sum
      # The same bounded retry envoy-go gives its test images: a registry connection reset during
      # the script's own implicit pull would fail the run for a reason outside it.
      - name: Pull the NATS image the script starts
        run: |
          nats_image=$(sed -n 's/^docker run .* \(nats:[^ ]*\) -js .*$/\1/p' scripts/e2e-local.sh)
          [ -n "$nats_image" ] || { echo "::error::no nats image on the docker run line of scripts/e2e-local.sh"; exit 1; }
          for attempt in 1 2 3; do
            docker pull "$nats_image" && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 10
          done
        working-directory: packages/envoy
      - name: Local end-to-end acceptance
        run: bash scripts/e2e-local.sh
        working-directory: packages/envoy
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: envoy-e2e-local-evidence-${{ github.run_attempt }}
          path: packages/envoy/out/e2e

  daemon-go:
    needs: changes
    if: needs.changes.outputs.daemon_go == 'true'
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # One service for both: the unit lane's Postgres and the stage script's. Setting
      # LEGION_E2E_PG_DSN is what tells the script not to start a container of its own — that
      # path is the devbox's.
      LEGION_TEST_PG_DSN: postgres://postgres:ci@localhost:5432/postgres?sslmode=disable
      LEGION_E2E_PG_DSN: postgres://postgres:ci@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: packages/daemon-go/go.mod
      # With the e2e tag, vet also compiles the live proofs behind it (the Stage 4a harness,
      # sandbox/live*_test.go), which run on the devbox against a real cluster.
      - name: Vet the Go daemon, its e2e-tagged live proofs included
        run: go vet -tags e2e ./...
        working-directory: packages/daemon-go
      # Before the tests: the tmux runtime's tests drive a real tmux server and skip without one,
      # and the daemon supervises under tmux and refuses to start without it.
      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tmux
      # The workspace and boundary tests drive a real jj, the one the worker image ships (its
      # working-copy filters are among what they plant), and the daemon resolves jj at boot and
      # refuses to start without it.
      - uses: ./.github/actions/install-jj
      # internal/podsafety's baseline test and the pod agent's argv test run the Oh My Pi the worker
      # image ships, and refuse on GitHub Actions without one. The pin is read from
      # omp-pin.ts, the repository's one copy of it, installed through the mise above
      # (.github/actions/install-omp).
      - uses: ./.github/actions/install-omp
      # internal/runtime/sandbox's uv link-mode test installs a wheel with the uv the worker image
      # ships (ARG UV_VERSION, checked against ARG UV_SHA256), and refuses on GitHub Actions
      # without one (.github/actions/install-uv).
      - uses: ./.github/actions/install-uv
      - name: Test the Go daemon
        run: go test -count=1 ./...
        working-directory: packages/daemon-go
      - name: Stage 1 live proof
        run: bash scripts/e2e/stage1-skeleton.sh
