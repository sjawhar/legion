name: Legion Envoy and Contracts

on:
  push:
    branches: [main]
    paths:
      - "packages/envoy/**"
      - "packages/contracts/**"
      # Every skill: the two Oh My Pi plugins ship them between them, and each one's skills-guard
      # test checks the sizes and links of its partition.
      - "skills/**"
      - "packages/envoy-client/**"
      - "packages/envoy-plugin/**"
      - "packages/claude-envoy/**"
      # claude-envoy's tests hold the marketplace entry to no version (Claude Code tracks commits).
      - ".claude-plugin/marketplace.json"
      - "packages/pi-envoy/**"
      - "packages/pi-legion/**"
      - "packages/pi-shared/**"
      # The plugins' shared prepack, which their pack steps and pi-shared's partition test run.
      - "scripts/pi-plugin-prepack.sh"
      # What the jobs' checks read outside their packages beyond the entries here: pi-envoy's
      # prepack test packs through pack-plugin.sh, pi-legion's skills guard sweeps the root guides
      # and docs below, and every Bun job installs Bun through setup-bun from .bun-version.
      - "scripts/e2e/lib/pack-plugin.sh"
      - "AGENTS.md"
      - "README.md"
      - "docs/kubernetes.md"
      - "docs/site/src/content/docs/**"
      - "deploy/kubernetes/daemon/controller.yaml.example"
      - ".bun-version"
      - ".github/actions/setup-bun/**"
      - "packages/dispatch/**"
      - "packages/proof-editor/**"
      - "patches/**"
      - "package.json"
      - "bun.lock"
      # The Go module: envoy-smoke compiles in workspace mode, pi-legion's skill-scenario rig runs
      # its code, and the worker image's Dockerfile pins the jj the pi-legion tests drive. The Go
      # daemon's own suite is the Tests workflow's (pr-and-main.yaml), on every pull request.
      - "packages/daemon/**"
      - ".github/actions/install-jj/**"
      - "go.work"
      - "go.work.sum"
      - ".omp-pin"
      - ".github/actions/install-omp/**"
      # The Pulumi CLI envoy-smoke's envoy-infra live tests run.
      - ".github/actions/install-pulumi/**"
      # The image pull envoy-go, envoy-infra-go, envoy-go-race and envoy-smoke run first.
      - ".github/actions/pull-test-images/**"
      # The envoy-smoke job builds packages/envoy/docker/Dockerfile, so this list owes every
      # file that build reads: the six below before the target list are the ones the entries
      # above do not already cover. .github/scripts/check-image-trigger-paths.sh fails the build
      # when one is missing. The notices scripts also write what the packed plugins and binaries
      # below ship, and the target list names the archives the envoy-go job packs.
      - ".github/workflows/envoy-and-contracts.yaml"
      - ".dockerignore"
      - "docs/site/package.json"
      - "scripts/third-party-notices.ts"
      - "scripts/go-third-party-notices.sh"
      - "scripts/assemble-third-party-notices.sh"
      - ".github/go-release-targets.json"
  pull_request:
    paths:
      - "packages/envoy/**"
      - "packages/contracts/**"
      # Every skill: the two Oh My Pi plugins ship them between them, and each one's skills-guard
      # test checks the sizes and links of its partition.
      - "skills/**"
      - "packages/envoy-client/**"
      - "packages/envoy-plugin/**"
      - "packages/claude-envoy/**"
      - ".claude-plugin/marketplace.json"
      - "packages/pi-envoy/**"
      - "packages/pi-legion/**"
      - "packages/pi-shared/**"
      - "scripts/pi-plugin-prepack.sh"
      - "scripts/e2e/lib/pack-plugin.sh"
      - "AGENTS.md"
      - "README.md"
      - "docs/kubernetes.md"
      - "docs/site/src/content/docs/**"
      - "deploy/kubernetes/daemon/controller.yaml.example"
      - ".bun-version"
      - ".github/actions/setup-bun/**"
      - "packages/dispatch/**"
      - "packages/proof-editor/**"
      - "patches/**"
      - "package.json"
      - "bun.lock"
      - "packages/daemon/**"
      - ".github/actions/install-jj/**"
      - "go.work"
      - "go.work.sum"
      - ".omp-pin"
      - ".github/actions/install-omp/**"
      - ".github/actions/install-pulumi/**"
      - ".github/actions/pull-test-images/**"
      # Same entries the push list owes, for the same jobs.
      - ".github/workflows/envoy-and-contracts.yaml"
      - ".dockerignore"
      - "docs/site/package.json"
      - "scripts/third-party-notices.ts"
      - "scripts/go-third-party-notices.sh"
      - "scripts/assemble-third-party-notices.sh"
      - ".github/go-release-targets.json"
  merge_group:
    types: [checks_requested]

# A new push to a pull request cancels that pull request's still-running checks here; outside
# pull_request the key is github.sha, not github.ref, so a busy runner pool never drops a
# main push's or merge-queue entry's run (why: this PR's description).
concurrency:
  group: envoy-and-contracts-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Read-only: no job here writes to the repository, a registry or the API. The token clones,
# downloads pinned tools, and, where a job calls dorny/paths-filter, reads the pull request's
# file list, which this public repository serves without `pull-requests: read`.
permissions:
  contents: read

jobs:
  # Detect which packages actually changed to skip unnecessary jobs.
  changes:
    runs-on: ubuntu-24.04
    outputs:
      contracts: ${{ steps.filter.outputs.contracts }}
      envoy_client: ${{ steps.filter.outputs.envoy_client }}
      envoy: ${{ steps.filter.outputs.envoy }}
      envoy_e2e_local: ${{ steps.filter.outputs.envoy_e2e_local }}
      envoy_image: ${{ steps.filter.outputs.envoy_image }}
      plugin: ${{ steps.filter.outputs.plugin }}
      claude_plugin: ${{ steps.filter.outputs.claude_plugin }}
      pi_shared: ${{ steps.filter.outputs.pi_shared }}
      pi_envoy: ${{ steps.filter.outputs.pi_envoy }}
      pi_legion: ${{ steps.filter.outputs.pi_legion }}
      dispatch: ${{ steps.filter.outputs.dispatch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          # Each filter names everything its job's checks read: the package and what its tests
          # and typecheck read outside it, the composite actions the job installs its tools
          # through, and, for a Go build in workspace mode, every module go.work binds, whose
          # go.mod moves the versions the build compiles. `bun_toolchain` is no job's gate: it is
          # the Bun pin and the action that installs it (.github/actions/setup-bun reads
          # .bun-version), written once and named by every Bun job's filter through its anchor,
          # which dorny/paths-filter flattens into the list that names it.
          filters: |
            bun_toolchain: &bun_toolchain
              - '.bun-version'
              - '.github/actions/setup-bun/**'
            contracts:
              - 'packages/contracts/**'
              - 'skills/dispatch/**'
              # The Go copies its tests hold the TypeScript to: src/dispatch-text-references.test.ts
              # and src/dispatch-href.test.ts read the Go reader's JSON tables, and
              # scripts/gen-go.test.ts checks the generated Go file is current.
              - 'packages/envoy/internal/dispatch/text/testdata/**'
              - 'packages/envoy/internal/contracts/generated.go'
              # A lockfile or root manifest change moves what the package resolves (#1519 nested
              # a second zod under contracts through the lock alone).
              - 'package.json'
              - 'bun.lock'
              - *bun_toolchain
            envoy_client:
              - 'packages/envoy-client/**'
              - 'packages/contracts/**'
              - 'package.json'
              - 'bun.lock'
              - *bun_toolchain
            envoy:
              - 'packages/envoy/**'
              - 'packages/proof-editor/**'
              - 'packages/contracts/**'
              - 'skills/dispatch/**'
              - 'go.work'
              - 'go.work.sum'
              # The Go builds run in workspace mode, where the daemon module's requirements raise
              # the versions envoy compiles with.
              - 'packages/daemon/go.mod'
              - 'packages/daemon/go.sum'
              # Its bun run gen:go step imports contracts' zod schemas.
              - 'package.json'
              - 'bun.lock'
              # The pmdoc fixture check and pmdoc's render tests run pmdoc/gen, which reads the
              # editor's schema through @milkdown/preset-gfm; bun.lock names the patch only by path.
              - 'patches/**'
              - *bun_toolchain
              # Its pack step writes each archive's notices, for each target the list names.
              - 'scripts/go-third-party-notices.sh'
              - '.github/go-release-targets.json'
              # The image pull envoy-go, envoy-infra-go and envoy-go-race run before their tests.
              - '.github/actions/pull-test-images/**'
            # Every file packages/envoy/docker/Dockerfile builds from, so the envoy-smoke job
            # runs whenever the image it smokes changes. `envoy` is deliberately not widened to
            # this: that would run the whole Go suite on every Dispatch pull request.
            # .github/scripts/check-image-trigger-paths.sh fails the build when this list misses
            # a file the build reads.
            envoy_image:
              - 'packages/envoy/**'
              - 'packages/contracts/**'
              - 'packages/dispatch/**'
              - 'packages/proof-editor/**'
              - 'package.json'
              - 'bun.lock'
              - 'patches/**'
              - 'packages/envoy-client/package.json'
              - 'packages/pi-envoy/package.json'
              - 'packages/pi-legion/package.json'
              - 'packages/pi-shared/package.json'
              - 'packages/envoy-plugin/package.json'
              - 'packages/claude-envoy/package.json'
              - 'docs/site/package.json'
              - '.dockerignore'
              - '.github/workflows/envoy-and-contracts.yaml'
              # The Pulumi CLI the job's envoy-infra live tests run.
              - '.github/actions/install-pulumi/**'
              # The image pull the job runs before its build and tests.
              - '.github/actions/pull-test-images/**'
              # The job also COMPILES TestSmoke, in workspace mode, so the workspace files and
              # every module in it belong here too — `envoy` carried go.work and go.work.sum and
              # this filter must not be narrower. packages/daemon requires testcontainers-go,
              # so its manifests move the smoke's module graph.
              - 'go.work'
              - 'go.work.sum'
              - 'packages/daemon/go.mod'
              - 'packages/daemon/go.sum'
              - 'scripts/third-party-notices.ts'
              - 'scripts/go-third-party-notices.sh'
              - 'scripts/assemble-third-party-notices.sh'
            # The local acceptance run drives the Go listener and renders every frame with the
            # shared TypeScript renderer, so a change to either side, or to the contracts both
            # read, must run it.
            envoy_e2e_local:
              - 'packages/envoy/**'
              - 'packages/envoy-client/**'
              - 'packages/contracts/**'
              - 'go.work'
              - 'go.work.sum'
              # The listener it builds compiles in workspace mode (envoy's note above).
              - 'packages/daemon/go.mod'
              - 'packages/daemon/go.sum'
              - 'package.json'
              - 'bun.lock'
              - *bun_toolchain
            plugin:
              - 'packages/envoy-plugin/**'
              - 'packages/envoy-client/**'
              - 'packages/contracts/**'
              - 'package.json'
              - 'bun.lock'
              - *bun_toolchain
              # Its pack step writes dist/THIRD_PARTY_NOTICES.
              - 'scripts/third-party-notices.ts'
              # Its prepack copies the repository's skills/ into the tarball scripts/prepack.test.ts
              # unpacks, and src/__tests__/config.test.ts loads the server from the checkout, where
              # it reads skills/dispatch-first.
              - 'skills/**'
            claude_plugin:
              - 'packages/claude-envoy/**'
              - 'packages/envoy-client/**'
              - 'packages/contracts/**'
              - 'package.json'
              - 'bun.lock'
              # check-dist rebuilds the committed dist/THIRD_PARTY_NOTICES.
              - 'scripts/third-party-notices.ts'
              # scripts/build.ts, which check-dist and tests/dist-fresh.test.ts run, builds only under
              # the Bun .bun-version pins, since the committed bundle depends on it.
              - *bun_toolchain
              # tests/dispatch-first-hook.test.ts reads the skill through the plugin's skills/ link
              # and holds the hook's context to Claude Code's 10,000-character cap.
              - 'skills/dispatch-first/**'
              # tests/envoy-channel-server.test.ts holds claude-envoy's marketplace entry to no
              # version, so Claude Code tracks its commits.
              - '.claude-plugin/marketplace.json'
            # The private workspace package both Oh My Pi plugins import. Its tests stage each
            # plugin's skills through the prepack script and hold the two lists to a partition of
            # skills/ (test/skills-partition.test.ts).
            pi_shared:
              - 'packages/pi-shared/**'
              - 'packages/envoy-client/**'
              - 'packages/contracts/**'
              - 'package.json'
              - 'bun.lock'
              - *bun_toolchain
              - 'skills/**'
              - 'scripts/pi-plugin-prepack.sh'
            # The Envoy plugin: its own sources, the workspace packages its bundle inlines, and the
            # Oh My Pi pin its real-binary test runs (extensions/dispatch-first-omp.test.ts),
            # installed through the mise install-jj leaves. Every skill and every daemon prompt:
            # src/skills-guard.test.ts stages its four skills through the prepack script and resolves
            # their skill:// links across all of skills/, and its native-tool-name rule scans every
            # .md under skills/ and packages/daemon/internal/prompts, so a prompt that names a
            # Dispatch tool fails the pull request that writes it, not the next one to touch this
            # package. scripts/prepack.test.ts packs the plugin through pack-plugin.sh, as the
            # release does.
            pi_envoy:
              - 'packages/pi-envoy/**'
              - 'packages/pi-shared/**'
              - 'packages/envoy-client/**'
              - 'packages/contracts/**'
              - 'package.json'
              - 'bun.lock'
              - *bun_toolchain
              # Its pack step writes dist/THIRD_PARTY_NOTICES.
              - 'scripts/third-party-notices.ts'
              - 'scripts/pi-plugin-prepack.sh'
              - 'scripts/e2e/lib/pack-plugin.sh'
              - 'skills/**'
              - 'packages/daemon/internal/prompts/**'
              - '.omp-pin'
              - '.github/actions/install-omp/**'
              - '.github/actions/install-jj/**'
              # install-jj reads the mise version and checksum it installs from here.
              - 'packages/daemon/docker/worker.Dockerfile'
            # The Legion plugin: its own sources, the workspace packages its bundle inlines, the Oh
            # My Pi pin its real-binary tests run (extensions/legion-phase-stall-omp.test.ts), and
            # every file its tests and typecheck read outside the package:
            # - every skill: src/skills-guard.test.ts resolves each skill:// link across all of
            #   skills/ (the Legion skills link into skills/dispatch by heading), and the Envoy entry
            #   its tests load beside this one reads skills/dispatch-first at load;
            # - the Envoy plugin, whose entry extensions/legion.test.ts, legion-role-claim.test.ts and
            #   the omp harness load beside this one, and whose sources the typecheck reaches;
            # - the daemon: its prompts are the skills guard's other linking root, and
            #   scripts/skill-scenarios/daemon-pane.test.ts runs daemon-pane.go inside the daemon
            #   module in workspace mode, where the envoy module's requirements move the versions it
            #   builds with and the worker image's Dockerfile pins the jj the tests drive;
            # - the guides and docs the skills guard sweeps for a claim that the controller holds no
            #   GitHub credential;
            # - the Dispatch e2e client scripts/skill-scenarios/seed.ts imports, which the
            #   typecheck compiles.
            pi_legion:
              - 'packages/pi-legion/**'
              - 'packages/pi-shared/**'
              - 'packages/envoy-client/**'
              - 'packages/contracts/**'
              - 'package.json'
              - 'bun.lock'
              - *bun_toolchain
              - 'scripts/third-party-notices.ts'
              - 'scripts/pi-plugin-prepack.sh'
              - 'skills/**'
              - 'packages/pi-envoy/**'
              - '.omp-pin'
              - '.github/actions/install-omp/**'
              - 'packages/daemon/**'
              - 'go.work'
              - 'go.work.sum'
              - 'packages/envoy/go.mod'
              - 'packages/envoy/go.sum'
              - '.github/actions/install-jj/**'
              - 'AGENTS.md'
              - 'README.md'
              - 'docs/kubernetes.md'
              - 'docs/site/src/content/docs/**'
              - 'deploy/kubernetes/daemon/controller.yaml.example'
              - 'packages/dispatch/e2e/api.ts'
              - 'packages/dispatch/e2e/harness-ports.ts'
              - 'packages/dispatch/web/src/api/types.ts'
            dispatch:
              - 'packages/dispatch/**'
              - 'packages/proof-editor/**'
              - 'packages/contracts/**'
              - 'packages/envoy/internal/dispatch/**'
              - 'packages/envoy/cmd/dispatch/**'
              # The other envoy packages the Dispatch server the browser tests build compiles
              # (`go list -deps ./cmd/dispatch` in packages/envoy), and the file store image the
              # job's S3 step reads.
              - 'packages/envoy/internal/bus/**'
              - 'packages/envoy/internal/contracts/**'
              - 'packages/envoy/internal/oidc/**'
              - 'packages/envoy/internal/pgmigrate/**'
              - 'packages/envoy/internal/routing/**'
              - 'packages/envoy/internal/tests3/seaweedfs.go'
              # e2e/__tests__/local-instance-support.test.ts holds shellQuote to this table, which
              # dev-postgres.test.sh (envoy-go) reads too.
              - 'packages/envoy/scripts/fixtures/shell-quote.json'
              # The modules the Dispatch server the browser tests start is built from, ygo's
              # document and websocket server among them, and the daemon module's, whose
              # requirements the workspace build takes too.
              - 'packages/envoy/go.mod'
              - 'packages/envoy/go.sum'
              - 'packages/daemon/go.mod'
              - 'packages/daemon/go.sum'
              - 'go.work'
              - 'go.work.sum'
              # The editor's source pin and its remaining patches can change document rendering,
              # including the Dark Reader inline-style guard.
              - 'patches/**'
              - 'package.json'
              - 'bun.lock'
              - *bun_toolchain
              # The SPA build writes dist/THIRD_PARTY_NOTICES.txt.
              - 'scripts/third-party-notices.ts'

  contracts:
    needs: changes
    if: needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - run: bun install --frozen-lockfile
      - name: Lint contracts
        run: bun run lint
        working-directory: packages/contracts
      - name: Typecheck contracts
        run: bun run typecheck
        working-directory: packages/contracts
      - name: Test contracts
        run: bun run test
        working-directory: packages/contracts
      - name: Build contracts
        run: bun run build
        working-directory: packages/contracts

  envoy-plugin:
    needs: changes
    if: needs.changes.outputs.plugin == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - run: bun install --frozen-lockfile
      - name: Lint envoy plugin
        run: bun run lint
        working-directory: packages/envoy-plugin
      - name: Typecheck envoy plugin
        run: bun run typecheck
        working-directory: packages/envoy-plugin
      - name: Test envoy plugin
        run: bun run test
        working-directory: packages/envoy-plugin
      # prepack.sh writes dist/THIRD_PARTY_NOTICES, failing the pack on a bundled package whose
      # license cannot be determined; the listing shows the tarball ships it.
      - name: Pack envoy plugin
        run: |
          bun pm pack --destination ../../out/pr-artifacts
          tar tzf ../../out/pr-artifacts/*.tgz | grep -x package/dist/THIRD_PARTY_NOTICES
        working-directory: packages/envoy-plugin
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: opencode-legion-envoy-plugin-pr
          path: out/pr-artifacts/*.tgz

  envoy-client:
    needs: changes
    if: needs.changes.outputs.envoy_client == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - run: bun install --frozen-lockfile
      - name: Build contracts for Envoy client
        run: bun run build
        working-directory: packages/contracts
      - name: Lint Envoy client
        run: bun run lint
        working-directory: packages/envoy-client
      - name: Typecheck Envoy client
        run: bun run typecheck
        working-directory: packages/envoy-client
      - name: Pre-pull the NATS image the credential tests run
        run: docker pull mirror.gcr.io/library/nats:2.10
      - name: Test Envoy client
        run: bun run test
        working-directory: packages/envoy-client
        env:
          LEGION_E2E: "1"
      - name: Build Envoy client
        run: bun run build
        working-directory: packages/envoy-client

  pi-shared:
    needs: changes
    if: needs.changes.outputs.pi_shared == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - run: bun install --frozen-lockfile
      - name: Lint pi-shared
        run: bun run lint
        working-directory: packages/pi-shared
      - name: Typecheck pi-shared
        run: bun run typecheck
        working-directory: packages/pi-shared
      # test/skills-partition.test.ts stages each plugin's skills with scripts/pi-plugin-prepack.sh
      # --stage-skills and holds the two lists to a partition of skills/.
      - name: Test pi-shared
        run: bun run test
        working-directory: packages/pi-shared

  pi-envoy:
    needs: changes
    if: needs.changes.outputs.pi_envoy == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      # Only for the mise it leaves at ~/.local/bin/mise, which install-omp installs the pin through:
      # nothing in this package drives jj.
      - uses: ./.github/actions/install-jj
      # extensions/dispatch-first-omp.test.ts runs the pinned Oh My Pi against stand-ins
      # (packages/pi-shared/test/omp-harness.ts) and refuses on GitHub Actions without one. The pin
      # is read from .omp-pin, the repository's one copy of it (.github/actions/install-omp).
      - uses: ./.github/actions/install-omp
      - run: bun install --frozen-lockfile
      - name: Build contracts for pi-envoy
        run: bun run build
        working-directory: packages/contracts
      - name: Lint pi-envoy
        run: bun run lint
        working-directory: packages/pi-envoy
      - name: Typecheck pi-envoy
        run: bun run typecheck
        working-directory: packages/pi-envoy
      - name: Test pi-envoy
        run: bun run test
        working-directory: packages/pi-envoy
      # The release's pack (release.yaml's pi_envoy_build job), which is also this job's build: the
      # manifest pointed at the one bundle, then scripts/pi-plugin-prepack.sh, which bundles
      # envoy.ts, writes dist/THIRD_PARTY_NOTICES (failing the pack on a bundled package whose
      # license cannot be determined) and stages this plugin's four skills. The listing shows the
      # tarball ships those and nothing of the Legion plugin's: no legion.js, no agents/, none of
      # its skills.
      - name: Pack pi-envoy
        run: |
          jq '.omp.extensions = ["dist/envoy.js"]' package.json > "$RUNNER_TEMP/package.json"
          mv "$RUNNER_TEMP/package.json" package.json
          bun pm pack --destination ../../out/pr-artifacts
          listing=$RUNNER_TEMP/pi-envoy-listing
          tar tzf ../../out/pr-artifacts/*.tgz > "$listing"
          for shipped in package/dist/envoy.js package/dist/THIRD_PARTY_NOTICES package/dist/skills/dispatch/SKILL.md; do
            grep -qxF "$shipped" "$listing" || { echo "::error::the pi-envoy tarball does not ship $shipped"; exit 1; }
          done
          for legion in package/dist/legion.js package/agents/ package/dist/skills/legion-worker/; do
            if grep -qF "$legion" "$listing"; then
              echo "::error::the pi-envoy tarball ships $legion, which is the Legion plugin's"
              exit 1
            fi
          done
        working-directory: packages/pi-envoy
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pi-envoy-pr
          path: out/pr-artifacts/*.tgz

  pi-legion:
    needs: changes
    if: needs.changes.outputs.pi_legion == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - uses: ./.github/actions/install-jj
      # extensions/legion-phase-stall-omp.test.ts runs the pinned Oh My Pi against stand-ins
      # (packages/pi-shared/test/omp-harness.ts) and refuses on GitHub Actions without one. The pin
      # is read from .omp-pin, the repository's one copy of it, installed through the mise
      # install-jj leaves at ~/.local/bin/mise (.github/actions/install-omp).
      - uses: ./.github/actions/install-omp
      # scripts/skill-scenarios/daemon-pane.test.ts runs daemon-pane.go with `go run` inside packages/daemon.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/daemon/go.mod
          cache-dependency-path: packages/daemon/go.sum
      - run: bun install --frozen-lockfile
      - name: Build contracts for pi-legion
        run: bun run build
        working-directory: packages/contracts
      - name: Lint pi-legion
        run: bun run lint
        working-directory: packages/pi-legion
      - name: Typecheck pi-legion
        run: bun run typecheck
        working-directory: packages/pi-legion
      - name: Test pi-legion
        run: bun run test
        working-directory: packages/pi-legion
      # The release's pack (release.yaml's pi_legion_build job), which is also this job's build: the
      # manifest pointed at the one bundle, then scripts/pi-plugin-prepack.sh, which bundles
      # legion.ts, writes dist/THIRD_PARTY_NOTICES (failing the pack on a bundled package whose
      # license cannot be determined) and stages this plugin's eight skills. The listing shows the
      # tarball ships those, its agents/, and nothing of the Envoy plugin's: no envoy.js, none of
      # its skills.
      - name: Pack pi-legion
        run: |
          jq '.omp.extensions = ["dist/legion.js"]' package.json > "$RUNNER_TEMP/package.json"
          mv "$RUNNER_TEMP/package.json" package.json
          bun pm pack --destination ../../out/pr-artifacts
          listing=$RUNNER_TEMP/pi-legion-listing
          tar tzf ../../out/pr-artifacts/*.tgz > "$listing"
          for shipped in package/dist/legion.js package/dist/THIRD_PARTY_NOTICES package/dist/skills/legion-worker/SKILL.md package/agents/deep-worker.md; do
            grep -qxF "$shipped" "$listing" || { echo "::error::the pi-legion tarball does not ship $shipped"; exit 1; }
          done
          for envoy in package/dist/envoy.js package/dist/skills/dispatch/; do
            if grep -qF "$envoy" "$listing"; then
              echo "::error::the pi-legion tarball ships $envoy, which is the Envoy plugin's"
              exit 1
            fi
          done
        working-directory: packages/pi-legion
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pi-legion-pr
          path: out/pr-artifacts/*.tgz

  dispatch:
    needs: changes
    if: needs.changes.outputs.dispatch == 'true'
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: mirror.gcr.io/pgvector/pgvector@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
        env:
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:ci@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/envoy/go.mod
      - uses: ./.github/actions/setup-bun
      - run: bun install --frozen-lockfile
      - name: Build contracts for dispatch e2e
        # e2e/agent-view.e2e.ts imports AGENT_STREAM_LIMITS and capAgentStreamText as values
        # (LEGION-548), which Playwright's own Node resolution reads from contracts' built
        # dist/, unlike a type-only import or the dashboard's own Vite build (which bundles the
        # TS source directly through the workspace's "bun" export condition).
        run: bun run build
        working-directory: packages/contracts
      - name: Lint proof editor
        run: bun run lint
        working-directory: packages/proof-editor
      - name: Typecheck proof editor
        run: bun run typecheck
        working-directory: packages/proof-editor
      - name: Test proof editor
        run: bun run test
        working-directory: packages/proof-editor
      - name: Lint dispatch dashboard
        run: bun run lint
        working-directory: packages/dispatch
      - name: Typecheck dispatch dashboard
        run: bun run typecheck
        working-directory: packages/dispatch
      - name: Test dispatch dashboard
        run: bun run test
        working-directory: packages/dispatch
      # The build writes dist/THIRD_PARTY_NOTICES.txt, failing on a bundled package whose license
      # cannot be determined; the listing shows the build shipped it.
      - name: Build dispatch dashboard
        run: |
          bun run build:web
          ls -l web/dist/THIRD_PARTY_NOTICES.txt
        working-directory: packages/dispatch
      - name: Check dispatch dashboard CSS classes
        run: bun run check:classes
        working-directory: packages/dispatch
      - name: Install Playwright Chromium, WebKit and Firefox
        # The runner image preconfigures Google's chrome-stable apt source, whose
        # index intermittently fails `apt-get update` with a hash-sum mismatch and
        # takes `--with-deps` down with it. Chrome is already installed there; the
        # source only serves upgrades, so drop it before installing our deps.
        run: |
          grep -rl dl.google.com /etc/apt/sources.list.d | xargs -r sudo rm -f
          bunx playwright install --with-deps chromium webkit firefox
        working-directory: packages/dispatch
      - name: Start an S3-compatible server for uploaded files
        # The browser suite runs the server with DISPATCH_FILE_STORE_BUCKET set (e2e/run-server.sh
        # reads DISPATCH_E2E_FILE_STORE_ENDPOINT), so every upload and download the dashboard makes
        # goes through the file store, as production's does. Same image as the Go tests
        # (internal/tests3), read from its declaration; the bucket is created by an anonymous PUT.
        run: |
          image=$(sed -n 's/^const Image = "\(.*\)"$/\1/p' ../envoy/internal/tests3/seaweedfs.go)
          [ -n "$image" ] || { echo "::error::no const Image in packages/envoy/internal/tests3/seaweedfs.go"; exit 1; }
          for attempt in 1 2 3; do
            docker pull "$image" && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 10
          done
          docker run -d --name dispatch-e2e-files -p 127.0.0.1:18333:8333 "$image" server -s3 -dir=/data -ip=0.0.0.0 -s3.port=8333
          for attempt in $(seq 1 60); do
            curl -sf -o /dev/null http://127.0.0.1:18333/ && break
            [ "$attempt" -lt 60 ] || { docker logs dispatch-e2e-files; exit 1; }
            sleep 1
          done
          curl -sf -X PUT -o /dev/null http://127.0.0.1:18333/dispatch-e2e-files
          echo "DISPATCH_E2E_FILE_STORE_ENDPOINT=http://127.0.0.1:18333" >> "$GITHUB_ENV"
          echo "DISPATCH_E2E_FILE_STORE_BUCKET=dispatch-e2e-files" >> "$GITHUB_ENV"
        working-directory: packages/dispatch
      - name: Browser-test dispatch dashboard
        # `bun run e2e` builds the SPA itself, which would rebuild it a second time in this job.
        # Calling Playwright directly reuses the "Build dispatch dashboard" step's dist above and
        # drops this job to one Vite build. Safe because that build and this one are now the same
        # binary: `packages/dispatch` no longer has an E2E-only build flag (removed with its sole,
        # unconsumed consumer, the `window.__dispatchDocument` inspection probe).
        run: bunx playwright test --config e2e/playwright.config.ts
        working-directory: packages/dispatch
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: dispatch-e2e-test-results-${{ github.run_attempt }}
          path: packages/dispatch/e2e/test-results

  claude-envoy:
    needs: changes
    if: needs.changes.outputs.claude_plugin == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - run: bun install --frozen-lockfile
      - name: Lint Claude Envoy plugin
        run: bun run lint
        working-directory: packages/claude-envoy
      - name: Typecheck Claude Envoy plugin
        run: bun run typecheck
        working-directory: packages/claude-envoy
      - name: Check the committed bundle is fresh
        run: bun run check-dist
        working-directory: packages/claude-envoy
      - name: Test Claude Envoy plugin
        run: bun run test
        working-directory: packages/claude-envoy
      - name: Pack Claude Envoy plugin
        run: bun pm pack --destination ../../out/pr-artifacts
        working-directory: packages/claude-envoy
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: claude-envoy-pr
          path: out/pr-artifacts/*.tgz

  envoy-go:
    needs: changes
    if: needs.changes.outputs.envoy == 'true'
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: mirror.gcr.io/pgvector/pgvector@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
        env:
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DISPATCH_TEST_DATABASE_URL: postgres://postgres:ci@localhost:5432/postgres?sslmode=disable
      BROKER_TEST_DATABASE_URL: postgres://postgres:ci@localhost:5432/postgres?sslmode=disable
      # The runner VM is discarded after the job, so testcontainers' Ryuk reaper has nothing to
      # clean up, and its image would be one more registry pull a test could fail on.
      TESTCONTAINERS_RYUK_DISABLED: "true"
      # (The smoke test and the image it runs live in the envoy-smoke job below.)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - run: bun install --frozen-lockfile
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/envoy/go.mod
      - name: Check Go formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt -l lists files that are not gofmt-formatted; run gofmt -w on them:"
            echo "$unformatted"
            exit 1
          fi
        working-directory: packages/envoy
      - name: Check Go contracts are generated from the shared schema
        run: bun run check:go
        working-directory: packages/contracts
      - name: Check pmdoc fixtures are up to date
        run: bun run check
        working-directory: packages/envoy/internal/dispatch/pmdoc/gen
      # Every image the tests here start: testnats.Image, testnats.HubImage (which testnats's own
      # tests start) and tests3.Image, pulled first for the reason the action gives.
      - name: Pull test container images
        uses: ./.github/actions/pull-test-images
        with:
          consts: |
            packages/envoy/internal/testnats/nats.go Image
            packages/envoy/internal/testnats/nats.go HubImage
            packages/envoy/internal/tests3/seaweedfs.go Image
      - name: Unit test envoy Go package
        run: go list ./... | grep -v /integration | xargs go test
        working-directory: packages/envoy
      - name: Isolation test for dev-broker.sh (fakes docker/go/curl; no real Postgres or network)
        run: bash scripts/dev-broker.test.sh
        working-directory: packages/envoy
      - name: Reuse test for dev-postgres.sh (a fake docker; refuses a dispatch-pg off the pinned image)
        run: bash scripts/dev-postgres.test.sh
        working-directory: packages/envoy
      - name: Verdict test for listener-deploy-probe.sh (two fake listener tasks on 127.0.0.1 and 127.0.0.2)
        run: bash scripts/listener-deploy-probe.test.sh
        working-directory: packages/envoy
      - name: Integration test envoy (testcontainers + NATS)
        run: go test ./internal/integration/ -timeout 300s -count=1
        working-directory: packages/envoy
      - name: Build envoy services
        run: go build ./cmd/dispatch ./cmd/listener
        working-directory: packages/envoy
      # The release's archives (release-envoy-listener.yaml), THIRD_PARTY_NOTICES included.
      - name: Pack envoy binaries
        run: |
          for arch in $(jq -r '.envoy[]' ../../.github/go-release-targets.json); do
            out="../../out/pr-artifacts/envoy-$arch"
            mkdir -p "$out"
            GOOS=linux GOARCH=$arch go build -buildvcs=false -o "$out/envoy-listener" ./cmd/listener
            GOOS=linux GOARCH=$arch ../../scripts/go-third-party-notices.sh "$out/THIRD_PARTY_NOTICES" ./cmd/listener
            tar czf "../../out/pr-artifacts/legion-envoy-$arch.tar.gz" -C "$out" envoy-listener THIRD_PARTY_NOTICES
            tar tzvf "../../out/pr-artifacts/legion-envoy-$arch.tar.gz"
          done
        working-directory: packages/envoy
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: legion-envoy-binaries-pr
          path: |
            out/pr-artifacts/legion-envoy-amd64.tar.gz
            out/pr-artifacts/legion-envoy-arm64.tar.gz

  # The envoy-infra Pulumi plugin's module (packages/envoy/infra). It is not in the root go.work:
  # its own go.work binds it and packages/envoy, so Pulumi's requirements never move the versions
  # the Envoy binaries and the daemon build with, and every go command below runs in that
  # workspace. Vet compiles the files behind the live-test tags (pulumilive, natslive) too. The unit
  # tests start no container; the natslive files run in a step of their own against real
  # nats-server, on testnats.Image and testnats.HubImage, pulled first for the reason
  # .github/actions/pull-test-images gives. The per-target compile runs in pr-and-main.yaml's
  # required lint job.
  envoy-infra-go:
    needs: changes
    if: needs.changes.outputs.envoy == 'true'
    runs-on: ubuntu-24.04
    env:
      TESTCONTAINERS_RYUK_DISABLED: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/envoy/infra/go.mod
          cache-dependency-path: packages/envoy/infra/go.sum
      - name: Pull the NATS test container images
        uses: ./.github/actions/pull-test-images
        with:
          consts: |
            packages/envoy/internal/testnats/nats.go Image
            packages/envoy/internal/testnats/nats.go HubImage
      - name: Check Go formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt -l lists files that are not gofmt-formatted; run gofmt -w on them:"
            echo "$unformatted"
            exit 1
          fi
        working-directory: packages/envoy/infra
      - name: Vet envoy-infra, its live-test tags included
        run: go vet -tags pulumilive,natslive ./...
        working-directory: packages/envoy/infra
      - name: Unit test envoy-infra
        run: go test ./...
        working-directory: packages/envoy/infra
      - name: Live tests of envoy-infra against nats-server (natslive)
        run: go test -tags natslive ./core/ ./seed/
        working-directory: packages/envoy/infra

  # The document service and the API that drives it, pmdoc (LEGION-571: its own flakes under
  # -race and load, not a race in production code, cost three review rounds because nothing ran
  # this package under -race before a PR claimed it), delivery (its intake handler reads the
  # routing settings the poll loop publishes, from NATS's delivery goroutine), and store (the
  # pool's one-connection guard, and the hold mark of its own each concurrent read takes),
  # all under the race detector. A read that walks a live document without its lock races the
  # room's peers, which no ordinary run shows: the unit-test step above runs without -race
  # (LEGION-499). Its own job beside envoy-go because -race runs these packages several times
  # slower, and with its own package deadline, since go test's ten-minute default is a whole
  # package's. pmdoc's tests shell out to the generated TypeScript fixtures under
  # internal/dispatch/pmdoc/gen (envoy-go's own "Check pmdoc fixtures are up to date" step), so
  # this job needs Bun installed and its workspace linked the same way, though not that freshness
  # check itself - a stale fixture is envoy-go's failure to catch, not a race. delivery's tests
  # start a NATS container, so the job takes envoy-go's Ryuk setting and pulls that image first,
  # for the reason .github/actions/pull-test-images gives.
  envoy-go-race:
    needs: changes
    if: needs.changes.outputs.envoy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: mirror.gcr.io/pgvector/pgvector@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
        env:
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DISPATCH_TEST_DATABASE_URL: postgres://postgres:ci@localhost:5432/postgres?sslmode=disable
      TESTCONTAINERS_RYUK_DISABLED: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - run: bun install --frozen-lockfile
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/envoy/go.mod
      - name: Pull the NATS test container image
        uses: ./.github/actions/pull-test-images
        with:
          consts: packages/envoy/internal/testnats/nats.go Image
      - name: Race-test the document service, its API, pmdoc, delivery, and the store
        run: go test -race -timeout 30m ./internal/dispatch/docs/ ./internal/dispatch/api/ ./internal/dispatch/pmdoc/... ./internal/dispatch/delivery/... ./internal/dispatch/store/...
        working-directory: packages/envoy

  # The real-process memory tests (packages/envoy/cmd/dispatch/memory_test.go, LEGION-481): each
  # row starts a Dispatch server, drives it over HTTP and the document websocket and reads its
  # resident memory from /proc, and together they run past go test's default ten-minute deadline,
  # which took envoy-go red at 600 s (run 37116639565). They build only under the `memory` tag, so
  # envoy-go's unit run leaves them out and this job runs them with a deadline of its own.
  dispatch-memory:
    needs: changes
    if: needs.changes.outputs.envoy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    services:
      postgres:
        image: mirror.gcr.io/pgvector/pgvector@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
        env:
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DISPATCH_TEST_DATABASE_URL: postgres://postgres:ci@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/envoy/go.mod
      - name: Memory tests of the Dispatch server
        run: go test -tags memory -count=1 -timeout 60m -v ./cmd/dispatch
        working-directory: packages/envoy

  # The container smoke test, the envoy-infra plugin's live tests, and the image both run. Its own
  # job, gated on envoy_image rather than envoy: the image is built from the Dispatch SPA and the
  # Bun workspace as well as the Go sources, so a Dispatch-only change changes the image and must
  # smoke it, while widening `envoy` would run the whole Go suite on every Dispatch pull request
  # instead. Before this split the smoke lived in envoy-go, so PR #1562 (packages/dispatch only)
  # skipped envoy-go and never smoked the image it changed (run 36494702052).
  # .github/scripts/check-image-trigger-paths.sh fails the build when envoy_image misses a file
  # the build reads.
  envoy-smoke:
    needs: changes
    if: needs.changes.outputs.envoy_image == 'true'
    runs-on: ubuntu-24.04
    env:
      # The runner VM is discarded after the job, so testcontainers' Ryuk reaper has nothing to
      # clean up, and its image would be one more registry pull a test could fail on.
      TESTCONTAINERS_RYUK_DISABLED: "true"
      # The listener image the smoke test and envoy-infra's live tests run, built by its own step
      # below.
      ENVOY_SMOKE_IMAGE: legion-envoy-smoke:${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/envoy/go.mod
      # Every image the build or the test starts (testnats.Image and the smoke image's base
      # images) is pulled first, for the reason .github/actions/pull-test-images gives. The SPA
      # stage's base carries an ARG (the Bun pin), so each ARG default is expanded into the FROM
      # that uses it.
      - name: Read the smoke image's base images
        id: base-images
        run: |
          {
            echo "images<<IMAGES"
            awk '
              $1 == "ARG" { eq = index($2, "="); if (eq > 0) args[substr($2, 1, eq - 1)] = substr($2, eq + 1) }
              $1 == "FROM" { image = $2; for (name in args) gsub("[$][{]" name "[}]", args[name], image); print image }
            ' docker/Dockerfile
            echo "IMAGES"
          } >> "$GITHUB_OUTPUT"
        working-directory: packages/envoy
      - name: Pull test container images
        uses: ./.github/actions/pull-test-images
        with:
          consts: packages/envoy/internal/testnats/nats.go Image
          images: ${{ steps.base-images.outputs.images }}
      # The image build is a step of its own: what TestSmoke asserts is the container's
      # behaviour, so a slow build must fail nothing. Inside the test it spent 256.60–289.47 s
      # of `go test -timeout 5m` across ten Release Envoy Listener runs while the five
      # assertions measured 0.00 s each (LEGION-361;
      # docs/solutions/testing/a-container-build-inside-go-test-spends-the-tests-deadline.md).
      # The test refuses to run without ENVOY_SMOKE_IMAGE rather than building one, so dropping
      # or renaming this step turns the lane red instead of restoring that budget silently.
      # `load: true` is Docker's documented test-before-push shape, and the only build form
      # .github/scripts/check-image-trigger-paths.sh can read. No LEGION_COMMIT: this job
      # publishes no image to match. The pull step above put the base images in the daemon's
      # store, which the default `docker` driver reads.
      - name: Build the listener image the smoke test runs against
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          # This build never pushes, and its Metadata log is confirmed empty of both an
          # attestation and this job's pull_request payload today (no docker/setup-buildx-action
          # here means no docker-container builder, so buildx never captures the CI event into the
          # provenance predicate in the first place). Hardened anyway, so a future change that adds
          # one (for cache, say) can't reopen either leak; worker-image.yaml's identical block is
          # the confirmed-necessary case.
          BUILDX_METADATA_PROVENANCE: disabled
          DOCKER_BUILD_SUMMARY: "false"
        with:
          context: .
          file: packages/envoy/docker/Dockerfile
          load: true
          provenance: false
          tags: ${{ env.ENVOY_SMOKE_IMAGE }}
      # The image's notices (packages/envoy/docker/Dockerfile): the build fails when a license cannot
      # be determined, and the listing shows the image ships both files.
      - name: List the image's third-party notices
        run: >-
          docker run --rm --entrypoint ls "$ENVOY_SMOKE_IMAGE" -l
          /usr/share/doc/legion/THIRD_PARTY_NOTICES /srv/dispatch-web/THIRD_PARTY_NOTICES.txt
      # 5m bounds only what the test does: pull NATS, start both containers behind the test's
      # own 60 s health wait, and assert. This job has measured 1.82 s, 3.16 s and 1.88 s (the
      # last in run 36508580490), and 2.2–20.7 s across four runs on a devbox at load average
      # 80, so the bound is deliberate headroom, not a build budget.
      - name: Container smoke test (testcontainers)
        run: go test -tags smoke -v -timeout 5m ./internal/smoke/
        working-directory: packages/envoy
      # The envoy-infra plugin's live tests (packages/envoy/infra/host/live_test.go) apply Pulumi
      # YAML programs with the pinned Pulumi CLI (.github/actions/install-pulumi) against this
      # runner's Docker, on the listener image built above and on the docker provider the plugin's
      # first consumer pins. Each download is checked against its SHA-256 before it is unpacked or
      # installed.
      - name: Install the Pulumi CLI
        uses: ./.github/actions/install-pulumi
      # The version is the one the live programs pin, read from pulumitest.DockerPluginVersion, and
      # the step hands the tarball's path to the live tests through ENVOY_INFRA_DOCKER_PLUGIN. The
      # release's own checksums file lists SHA-1 digests (this asset's is
      # 9a7f6014d3ebc330030ec033ddc7222ec13ad116); the SHA-256 is the digest GitHub records for the
      # release asset, which hashes to that same SHA-1. The live tests install the verified tarball
      # into a PULUMI_HOME of their own, so the CLI downloads none.
      - name: Download the docker provider plugin the live tests pin
        run: |
          version=$(sed -n 's/^const DockerPluginVersion = "\(.*\)"$/\1/p' internal/pulumitest/pulumitest.go)
          [ -n "$version" ] || { echo "::error::no const DockerPluginVersion in internal/pulumitest/pulumitest.go"; exit 1; }
          tarball="$RUNNER_TEMP/pulumi-resource-docker-v$version-linux-amd64.tar.gz"
          curl -fsSL -o "$tarball" "https://github.com/pulumi/pulumi-docker/releases/download/v$version/pulumi-resource-docker-v$version-linux-amd64.tar.gz"
          echo "4dbcd9defa0fb03999cdfeab50bd461451b7c65e8566927994f63ee956055ffe  $tarball" | sha256sum -c -
          echo "ENVOY_INFRA_DOCKER_PLUGIN=$tarball" >> "$GITHUB_ENV"
        working-directory: packages/envoy/infra
      - name: Live tests of envoy-infra's host:Listener
        run: go test -tags pulumilive -v -timeout 15m ./host/
        working-directory: packages/envoy/infra
      - name: The envoy-infra plugin's schema carries the version it was built with
        run: >-
          go build -ldflags "-X main.version=1.2.3" -o /tmp/pr ./cmd/pulumi-resource-envoy-infra &&
          pulumi package get-schema /tmp/pr | jq -e '.version == "1.2.3"'
        working-directory: packages/envoy/infra

  # packages/envoy/scripts/e2e-local.sh: signed GitHub fixtures and a direct message through a real
  # listener and NATS, every frame rendered by both inbound renderers (renderInbound and Go's
  # Deliverer.Text) and checked against the acceptance contract.
  envoy-e2e-local:
    needs: changes
    if: needs.changes.outputs.envoy_e2e_local == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      E2E_NATS_CONTAINER: envoy-e2e-nats-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - run: bun install --frozen-lockfile
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/envoy/go.mod
          cache-dependency-path: packages/envoy/go.sum
      # The same bounded retry .github/actions/pull-test-images gives test images: a registry
      # connection reset during the script's own implicit pull would fail the run for a reason
      # outside it.
      - name: Pull the NATS image the script starts
        run: |
          nats_image=$(sed -n 's/^docker run .* \([^ ]*nats:[^ ]*\) -js .*$/\1/p' scripts/e2e-local.sh)
          [ -n "$nats_image" ] || { echo "::error::no nats image on the docker run line of scripts/e2e-local.sh"; exit 1; }
          for attempt in 1 2 3; do
            docker pull "$nats_image" && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 10
          done
        working-directory: packages/envoy
      - name: Local end-to-end acceptance
        run: bash scripts/e2e-local.sh
        working-directory: packages/envoy
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: envoy-e2e-local-evidence-${{ github.run_attempt }}
          path: packages/envoy/out/e2e
