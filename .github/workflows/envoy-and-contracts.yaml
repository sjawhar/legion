name: Legion Envoy and Contracts

on:
  push:
    branches: [main]
    paths:
      - "packages/envoy/**"
      - "packages/contracts/**"
      - "packages/envoy-client/**"
      - "packages/envoy-plugin/**"
      - "packages/claude-envoy-bridge/**"
      - "packages/pi-envoy/**"
      - "packages/dispatch/**"
  pull_request:
    paths:
      - "packages/envoy/**"
      - "packages/contracts/**"
      - "packages/envoy-client/**"
      - "packages/envoy-plugin/**"
      - "packages/claude-envoy-bridge/**"
      - "packages/pi-envoy/**"
      - "packages/dispatch/**"

jobs:
  # Detect which packages actually changed to skip unnecessary jobs.
  changes:
    runs-on: ubuntu-24.04
    outputs:
      contracts: ${{ steps.filter.outputs.contracts }}
      envoy_client: ${{ steps.filter.outputs.envoy_client }}
      envoy: ${{ steps.filter.outputs.envoy }}
      plugin: ${{ steps.filter.outputs.plugin }}
      claude_plugin: ${{ steps.filter.outputs.claude_plugin }}
      pi_envoy: ${{ steps.filter.outputs.pi_envoy }}
      dispatch: ${{ steps.filter.outputs.dispatch }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            contracts:
              - 'packages/contracts/**'
            envoy_client:
              - 'packages/envoy-client/**'
              - 'packages/contracts/**'
            envoy:
              - 'packages/envoy/**'
              - 'packages/contracts/**'
            plugin:
              - 'packages/envoy-plugin/**'
              - 'packages/envoy-client/**'
              - 'packages/contracts/**'
            claude_plugin:
              - 'packages/claude-envoy-bridge/**'
              - 'packages/contracts/**'
            pi_envoy:
              - 'packages/pi-envoy/**'
              - 'packages/contracts/**'
            dispatch:
              - 'packages/dispatch/**'

  contracts:
    needs: changes
    if: needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Lint contracts
        run: bun run lint
        working-directory: packages/contracts
      - name: Typecheck contracts
        run: bun run typecheck
        working-directory: packages/contracts
      - name: Test contracts
        run: bun run test
        working-directory: packages/contracts
      - name: Build contracts
        run: bun run build
        working-directory: packages/contracts

  envoy-plugin:
    needs: changes
    if: needs.changes.outputs.plugin == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Lint envoy plugin
        run: bun run lint
        working-directory: packages/envoy-plugin
      - name: Typecheck envoy plugin
        run: bun run typecheck
        working-directory: packages/envoy-plugin
      - name: Pack envoy plugin
        run: bun pm pack --destination ../../out/pr-artifacts
        working-directory: packages/envoy-plugin
      - uses: actions/upload-artifact@v4
        with:
          name: opencode-legion-envoy-plugin-pr
          path: out/pr-artifacts/*.tgz

  envoy-client:
    needs: changes
    if: needs.changes.outputs.envoy_client == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Build contracts for Envoy client
        run: bun run build
        working-directory: packages/contracts
      - name: Lint Envoy client
        run: bun run lint
        working-directory: packages/envoy-client
      - name: Typecheck Envoy client
        run: bun run typecheck
        working-directory: packages/envoy-client
      - name: Test Envoy client
        run: bun run test
        working-directory: packages/envoy-client
      - name: Build Envoy client
        run: bun run build
        working-directory: packages/envoy-client

  pi-envoy:
    needs: changes
    if: needs.changes.outputs.pi_envoy == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - name: Install extension test tools
        env:
          MISE_VERSION: v2026.8.12
          MISE_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl https://mise.run | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/share/mise/shims" >> "$GITHUB_PATH"
          "$HOME/.local/bin/mise" use -g github:jj-vcs/jj@0.44.0
      - name: Verify extension test tools
        run: |
          mise env --json
          jj --version
      - run: bun install --frozen-lockfile
      - name: Build contracts for pi-envoy
        run: bun run build
        working-directory: packages/contracts
      - name: Lint pi-envoy
        run: bun run lint
        working-directory: packages/pi-envoy
      - name: Typecheck pi-envoy
        run: bun run typecheck
        working-directory: packages/pi-envoy
      - name: Test pi-envoy
        run: bun run test
        working-directory: packages/pi-envoy
      - name: Build pi-envoy
        run: bun run build
        working-directory: packages/pi-envoy

  dispatch:
    needs: changes
    if: needs.changes.outputs.dispatch == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Lint dispatch dashboard
        run: bun run lint
        working-directory: packages/dispatch
      - name: Typecheck dispatch dashboard
        run: bun run typecheck
        working-directory: packages/dispatch
      - name: Test dispatch dashboard
        run: bun run test
        working-directory: packages/dispatch
      - name: Build dispatch dashboard
        run: bun run build:web
        working-directory: packages/dispatch

  claude-envoy-bridge:
    needs: changes
    if: needs.changes.outputs.claude_plugin == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Lint Claude Envoy plugin
        run: bun run lint
        working-directory: packages/claude-envoy-bridge
      - name: Typecheck Claude Envoy plugin
        run: bun run typecheck
        working-directory: packages/claude-envoy-bridge
      - name: Pack Claude Envoy plugin
        run: bun pm pack --destination ../../out/pr-artifacts
        working-directory: packages/claude-envoy-bridge
      - uses: actions/upload-artifact@v4
        with:
          name: claude-envoy-bridge-pr
          path: out/pr-artifacts/*.tgz

  envoy-go:
    needs: changes
    if: needs.changes.outputs.envoy == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - uses: actions/setup-go@v5
        with:
          go-version-file: packages/envoy/go.mod
      - name: Generate Go contracts from shared schema
        run: bun run gen:go
        working-directory: packages/contracts
      - name: Unit test envoy Go package
        run: go list ./... | grep -v /integration | xargs go test
        working-directory: packages/envoy
      - name: Integration test envoy (testcontainers + NATS)
        run: go test ./internal/integration/ -timeout 300s -count=1
        working-directory: packages/envoy
      - name: Build envoy services
        run: go build ./cmd/listener
        working-directory: packages/envoy
      - name: Container smoke test (testcontainers)
        run: go test -tags smoke -v -timeout 5m ./internal/smoke/
        working-directory: packages/envoy
      - name: Pack envoy binaries
        run: |
          mkdir -p ../../out/pr-artifacts/envoy-amd64
          GOOS=linux GOARCH=amd64 go build -buildvcs=false -o ../../out/pr-artifacts/envoy-amd64/envoy-listener ./cmd/listener
          tar czf ../../out/pr-artifacts/legion-envoy-amd64.tar.gz -C ../../out/pr-artifacts/envoy-amd64 envoy-listener
          mkdir -p ../../out/pr-artifacts/envoy-arm64
          GOOS=linux GOARCH=arm64 go build -buildvcs=false -o ../../out/pr-artifacts/envoy-arm64/envoy-listener ./cmd/listener
          tar czf ../../out/pr-artifacts/legion-envoy-arm64.tar.gz -C ../../out/pr-artifacts/envoy-arm64 envoy-listener
        working-directory: packages/envoy
      - uses: actions/upload-artifact@v4
        with:
          name: legion-envoy-binaries-pr
          path: |
            out/pr-artifacts/legion-envoy-amd64.tar.gz
            out/pr-artifacts/legion-envoy-arm64.tar.gz
