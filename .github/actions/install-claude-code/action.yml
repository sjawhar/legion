name: Install the pinned Claude Code
description: >-
  Installs the @anthropic-ai/claude-code release .claude-code-pin pins (the repository's one copy
  of the pin, an npm version on one line) with Bun into the runner's temporary directory, and
  exports its path as LEGION_TEST_CLAUDE for the tests that run it; they refuse on GitHub Actions
  without one. `bun add` rather than `bunx`, so the binary has a path the job names: bunx keeps its
  install under a cache directory of its own layout. Needs the repository checked out and Bun on
  PATH (.github/actions/setup-bun).
runs:
  using: composite
  steps:
    - name: Install the pinned Claude Code
      shell: bash
      run: |
        set -euo pipefail
        pin=$(<.claude-code-pin)
        test -n "$pin"
        started=$(date +%s)
        directory="$RUNNER_TEMP/claude-code-$pin"
        mkdir -p "$directory"
        # `bun add` downloads from the npm registry, so it retries like any other download: five
        # bounded attempts through .github/scripts/ci-retry.sh, the last starting 150 s after the
        # first. 180 s per attempt, the bound every Bun install of this repository's CI carries
        # (dispatch://INFRA-1545): a frozen workspace install measured 20.70 s cold on a pod
        # against 11 s in CI over 180 observations, and this one package is smaller than that
        # workspace. This step measured at most 2 s across the 20 most recent successful ci.yaml
        # push runs on main.
        # shellcheck source=.github/scripts/ci-retry.sh
        . "$GITHUB_ACTION_PATH/../../scripts/ci-retry.sh"
        retry_fetch "the pinned Claude Code" 180 -- \
          bun add --cwd "$directory" --exact --no-save "@anthropic-ai/claude-code@$pin"
        claude="$directory/node_modules/.bin/claude"
        "$claude" --version
        echo "installed @anthropic-ai/claude-code@$pin in $(( $(date +%s) - started ))s"
        echo "LEGION_TEST_CLAUDE=$claude" >> "$GITHUB_ENV"
