name: Install the Pulumi CLI
description: >-
  Installs the Pulumi CLI v3.268.0 the envoy-infra plugin is tested and released with, checked
  against its SHA-256 before it is unpacked, and puts it on PATH for the job's later steps.
runs:
  using: composite
  steps:
    - name: Install the Pulumi CLI
      shell: bash
      run: |
        tarball="$RUNNER_TEMP/pulumi-v3.268.0-linux-x64.tar.gz"
        # Retried, in the spelling .github/actions/install-changie explains: 8 bounded attempts,
        # the last starting 127 s after the first, with `--fail` kept so a 504's body never lands
        # in the tarball. 60 s per attempt: this step measured at most 7 s across the 20 most
        # recent successful ci.yaml push runs on main, so the bound is over eight times that
        # maximum, and five attempts plus the waits stay well inside the job's budget.
        curl -fsSL --retry 7 --retry-all-errors --max-time 60 \
          -o "$tarball" https://get.pulumi.com/releases/sdk/pulumi-v3.268.0-linux-x64.tar.gz
        echo "903cafeaa9f6327e4bf53a8b7b99ae660f26198acfa804a2f982bf5de3f1de0b  $tarball" | sha256sum -c -
        tar -xzf "$tarball" -C "$RUNNER_TEMP"
        echo "$RUNNER_TEMP/pulumi" >> "$GITHUB_PATH"
