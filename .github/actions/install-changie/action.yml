name: Install changie
description: >-
  Installs changie v1.26.0, the changelog-fragment tool the packages' .changie.yaml files are
  written for, checked against its SHA-256 before it is unpacked, and puts it on PATH for the
  job's later steps.
runs:
  using: composite
  steps:
    - name: Install changie
      shell: bash
      run: |
        version=1.26.0
        tarball="$RUNNER_TEMP/changie_${version}_linux_amd64.tar.gz"
        curl -fsSL -o "$tarball" "https://github.com/miniscruff/changie/releases/download/v$version/changie_${version}_linux_amd64.tar.gz"
        echo "eab168c8287a6e91912e1c02e5260911232d945bfd3c89d8a0e1ace6bb7b6161  $tarball" | sha256sum -c -
        mkdir -p "$RUNNER_TEMP/changie"
        tar -xzf "$tarball" -C "$RUNNER_TEMP/changie"
        echo "$RUNNER_TEMP/changie" >> "$GITHUB_PATH"
