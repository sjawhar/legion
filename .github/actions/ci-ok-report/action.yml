name: Report ci-ok when this is the run's last job
description: >-
  The last step of every job of ci.yaml but `changes`, and of the job of each workflow ci.yaml
  calls. It records this job's result as an artifact of the run, then posts ci-ok on the run's
  head when every job that runs has recorded one (.github/scripts/ci-ok-report.sh says how), so
  ci-ok needs no job, and no runner, of its own. Call it with `if: always()`, so a failed,
  timed-out or cancelled job reports too. The job needs `actions: read` and `checks: write`.

  Two artifacts come out of it, both named once in .github/scripts/ci-ok.jq and read twice: the
  job's result, `ci-ok-<job>-<run attempt>-<success|failure|cancelled>`, uploaded before
  anything is posted, and `ci-ok-posted-<job>-<run attempt>`, uploaded only once this job's
  ci-ok post succeeded. .github/scripts/ci-ok-report.sh below reads the first to tell whether
  every job that runs has reported, and, on a merge group, the follower cancel job of this job
  (.github/actions/merge-group-cancel) reads both: the first says whether this job's own work
  failed, and the second whether the failing ci-ok of this group is already posted. It
  force-cancels this run only when it is, since a run whose verdict never went up is the only
  run that can still post one.

  A fork pull request's run gets a read-only token, which can post no check run, so on one this
  action does nothing and the pull request gets no ci-ok: this repository takes no fork pull
  requests (their runs wait for an approval nobody gives). A fork is a head repository whose id
  is not the base repository's, both read from the event: a re-run keeps its first attempt's
  event, so a name compared with github.repository would call every pull request a fork after
  the repository is renamed or transferred (sjawhar/legion became cybermonklabs/legion on
  2026-11-03, and the re-run of run 41668010626 then posted no ci-ok).

inputs:
  job:
    description: The job's id in ci.yaml; a called workflow's job passes the id of ci.yaml's job that calls it.
    default: ${{ github.job }}
  changes:
    description: "`toJSON(needs.changes)` of the job (a called workflow takes it as an input from its caller)."
    required: true
  job-status:
    description: "`job.status` of the job: success, failure or cancelled."
    required: true

runs:
  using: composite
  steps:
    - name: Write this job's result
      if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.id == github.event.pull_request.base.repo.id)
      shell: bash
      env:
        STATUS: ${{ inputs.job-status }}
      run: printf '%s\n' "$STATUS" > "$RUNNER_TEMP/ci-ok-report"

    # The artifact's name is the report; its file only gives the upload something to carry.
    - if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.id == github.event.pull_request.base.repo.id)
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ci-ok-${{ inputs.job }}-${{ github.run_attempt }}-${{ inputs.job-status }}
        path: ${{ runner.temp }}/ci-ok-report
        retention-days: 1
        if-no-files-found: error

    - name: Post ci-ok when every job that runs has reported
      if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.id == github.event.pull_request.base.repo.id)
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        JOB: ${{ inputs.job }}
        CHANGES: ${{ inputs.changes }}
        EVENT: ${{ github.event_name }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        POSTED_FILE: ${{ runner.temp }}/ci-ok-posted
      run: '"$GITHUB_ACTION_PATH/../../scripts/ci-ok-report.sh"'

    # The marker the step above leaves only when it posted ci-ok, which this job's merge-group
    # follower waits for. `if-no-files-found: ignore` is what makes the absence of that file the
    # absence of the artifact: no file matched, no artifact created, and the follower then reads
    # this job's report as a verdict that never went up. `always()`, so the marker of a post that
    # a later refusal in that step followed is uploaded too.
    - if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.id == github.event.pull_request.base.repo.id)
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ci-ok-posted-${{ inputs.job }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/ci-ok-posted
        retention-days: 1
        if-no-files-found: ignore
