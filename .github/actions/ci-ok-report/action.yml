name: Report ci-ok when this job decides a merge-group run
description: >-
  The last step of every job of ci.yaml but `changes` and those CI_OK_EXEMPT names, and of the job
  of each workflow ci.yaml calls. On a merge-group run whose group this job's own result decides —
  its failure or its cancellation, or a `changes` that failed or was cancelled — it posts the
  failing ci-ok on the group's commit at once (.github/scripts/ci-ok-report.sh says how), so the
  queue takes the pull request out at the first failure instead of waiting for the rest of the
  run. It posts nothing on any other run: there the verdict is ci.yaml's own `ci-ok` job, which
  needs every job of the run and carries the verdict as its own check run. Call it with
  `if: always()`, so a failed, timed-out or cancelled job reaches it. The job needs `actions: read`
  (the run's jobs, which the posted check's summary names) and `checks: write` (the post).

  A fork pull request's run gets a read-only token, which can post no check run, so on one this
  action does nothing and the pull request gets no ci-ok: this repository takes no fork pull
  requests (their runs wait for an approval nobody gives). A fork is a head repository whose id
  is not the base repository's, both read from the event: a re-run keeps its first attempt's
  event, so a name compared with github.repository would call every pull request a fork after
  the repository is renamed or transferred (sjawhar/legion became cybermonklabs/legion on
  2026-11-03, and the re-run of run 41668010626 then posted no ci-ok).

inputs:
  job:
    description: The job's id in ci.yaml; a called workflow's job passes the id of ci.yaml's job that calls it.
    default: ${{ github.job }}
  changes:
    description: "`toJSON(needs.changes)` of the job (a called workflow takes it as an input from its caller)."
    required: true
  job-status:
    description: "`job.status` of the job: success, failure or cancelled."
    required: true

runs:
  using: composite
  steps:
    - name: Post the failing ci-ok when this job's result decides a merge-group run
      if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.id == github.event.pull_request.base.repo.id)
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        JOB: ${{ inputs.job }}
        JOB_STATUS: ${{ inputs.job-status }}
        CHANGES: ${{ inputs.changes }}
        EVENT: ${{ github.event_name }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      run: '"$GITHUB_ACTION_PATH/../../scripts/ci-ok-report.sh"'
