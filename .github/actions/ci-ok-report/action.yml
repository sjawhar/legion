name: Report ci-ok when this is the run's last job
description: >-
  The last step of every job of ci.yaml but `changes`, and of the job of each workflow ci.yaml
  calls. It records this job's result as an artifact of the run, then posts ci-ok on the run's
  head when every job that runs has recorded one (.github/scripts/ci-ok-report.sh says how), so
  ci-ok needs no job, and no runner, of its own. Call it with `if: always()`, so a failed,
  timed-out or cancelled job reports too. The job needs `actions: read` and `checks: write`.

  A fork pull request's run gets a read-only token, which can post no check run, so on one this
  action does nothing and the pull request gets no ci-ok: this repository takes no fork pull
  requests (their runs wait for an approval nobody gives).

inputs:
  job:
    description: The job's id in ci.yaml; a called workflow's job passes the id of ci.yaml's job that calls it.
    default: ${{ github.job }}
  changes:
    description: "`toJSON(needs.changes)` of the job (a called workflow takes it as an input from its caller)."
    required: true
  job-status:
    description: "`job.status` of the job: success, failure or cancelled."
    required: true

runs:
  using: composite
  steps:
    - name: Write this job's result
      if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
      shell: bash
      env:
        STATUS: ${{ inputs.job-status }}
      run: printf '%s\n' "$STATUS" > "$RUNNER_TEMP/ci-ok-report"

    # The artifact's name is the report; its file only gives the upload something to carry.
    - if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ci-ok-${{ inputs.job }}-${{ github.run_attempt }}-${{ inputs.job-status }}
        path: ${{ runner.temp }}/ci-ok-report
        retention-days: 1
        if-no-files-found: error

    - name: Post ci-ok when every job that runs has reported
      if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        JOB: ${{ inputs.job }}
        CHANGES: ${{ inputs.changes }}
        EVENT: ${{ github.event_name }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      run: '"$GITHUB_ACTION_PATH/../../scripts/ci-ok-report.sh"'
