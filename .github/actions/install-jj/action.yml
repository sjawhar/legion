name: Install jj
description: >-
  Installs the jj the worker image ships, the fork pinned by `ARG JJ_TOOL` in
  packages/daemon/docker/worker.Dockerfile, with the mise that file pins, as the image does: the
  binary itself at ~/.local/bin/jj, never a mise shim. Provisioning's tests give jj a fresh
  XDG_CONFIG_HOME, as a pod's init container has, and a shim looks its version up in the mise
  configuration under it ("No version is set for shim: jj"). mise stays at ~/.local/bin/mise, on
  PATH for later steps. Needs the repository checked out.

  mise itself installs from its GitHub release tarball, checked against the `ARG MISE_SHA256` the
  Dockerfile pins next to `ARG MISE_VERSION` before anything extracts or runs it — not mise.run's
  `curl | sh`, which runs the installer unverified. That step reads no token. Bumping mise is one
  edit, in the Dockerfile: both this action and the worker image's own `tools` stage read the same
  pair.
runs:
  using: composite
  steps:
    - name: Install mise
      shell: bash
      run: |
        set -euo pipefail
        dockerfile=packages/daemon/docker/worker.Dockerfile
        mise_version=$(sed -n 's/^ARG MISE_VERSION=//p' "$dockerfile")
        mise_sha256=$(sed -n 's/^ARG MISE_SHA256=//p' "$dockerfile")
        if [ -z "$mise_version" ] || [ -z "$mise_sha256" ]; then
          echo "$dockerfile names no ARG MISE_VERSION or ARG MISE_SHA256" >&2
          exit 1
        fi
        dir="$RUNNER_TEMP/mise-install"
        mkdir -p "$dir"
        archive="mise-${mise_version}-linux-x64.tar.gz"
        # Retried, in the spelling .github/actions/install-changie explains: 8 bounded attempts,
        # the last starting 127 s after the first, with `--fail` kept so a 504's body never lands
        # in the tarball. 60 s per attempt: a release asset is tens of megabytes — the Bun
        # release zip this repository measures is 51,794,595 bytes — and 60 s is the bound every
        # release-asset fetch of this repository's CI carries (dispatch://INFRA-1545). This
        # action's two steps measured at most 3 s together across the 20 most recent successful
        # ci.yaml push runs on main.
        curl -fsSLo "$dir/$archive" --retry 7 --retry-all-errors --max-time 60 \
          "https://github.com/jdx/mise/releases/download/${mise_version}/${archive}"
        printf '%s  %s\n' "$mise_sha256" "$dir/$archive" > "$dir/SHA256SUMS"
        sha256sum --check --strict "$dir/SHA256SUMS"
        tar -xzf "$dir/$archive" -C "$dir"
        mkdir -p "$HOME/.local/bin"
        install -m 0755 "$dir/mise/bin/mise" "$HOME/.local/bin/mise"
        rm -rf "$dir"
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        "$HOME/.local/bin/mise" --version

    - name: Install the worker image's jj
      shell: bash
      env:
        MISE_GITHUB_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        dockerfile=packages/daemon/docker/worker.Dockerfile
        jj_tool=$(sed -n 's/^ARG JJ_TOOL=//p' "$dockerfile")
        if [ -z "$jj_tool" ]; then
          echo "$dockerfile names no ARG JJ_TOOL" >&2
          exit 1
        fi
        # mise fetches the jj release through its github backend here, so this is a download and
        # retries like one: .github/scripts/ci-retry.sh makes five attempts, the last starting
        # 150 s after the first, each under `timeout`. 60 s per attempt: this action's two steps
        # measured at most 3 s together across the 20 most recent successful ci.yaml push runs on
        # main, so the bound is 20 times that.
        # What the retry holds is `mise install`, not the `mise x` this step used to wrap: `mise
        # x` only warns when it cannot resolve the tool and then runs whatever binary of that name
        # is already on PATH, so a retry around it waits for a failure that never comes, and
        # `mise install` is the half that fails (exit 1, dispatch://INFRA-1545). The `mise x`
        # below reads the path of what the install put on disk — a local lookup, not a fetch,
        # which is why it is bare — and it stays a lookup rather than a `mise where` because
        # whether the binary sits at the install's root or under its `bin/` differs by backend.
        # shellcheck source=.github/scripts/ci-retry.sh
        . "$GITHUB_ACTION_PATH/../../scripts/ci-retry.sh"
        retry_fetch "the worker image's jj" 60 -- "$HOME/.local/bin/mise" install "$jj_tool"
        jj_path=$("$HOME/.local/bin/mise" x "$jj_tool" -- sh -c 'command -v jj')
        install -m 0755 "$jj_path" "$HOME/.local/bin/jj"
        echo "$jj_tool: $HOME/.local/bin/jj"
        "$HOME/.local/bin/jj" --version
