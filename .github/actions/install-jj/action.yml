name: Install jj
description: >-
  Installs the jj the worker image ships, the fork pinned by `ARG JJ_TOOL` in
  packages/daemon/docker/worker.Dockerfile, with the mise that file pins, as the image does: the
  binary itself at ~/.local/bin/jj, never a mise shim. Provisioning's tests give jj a fresh
  XDG_CONFIG_HOME, as a pod's init container has, and a shim looks its version up in the mise
  configuration under it ("No version is set for shim: jj"). mise stays at ~/.local/bin/mise, on
  PATH for later steps. Needs the repository checked out.

  mise itself installs from its GitHub release tarball, checked against the sha256 this file pins
  (from mise's own published SHASUMS256.txt for that release) before anything extracts or runs it —
  not mise.run's `curl | sh`, which runs the installer unverified. That step reads no token.
  Bumping `ARG MISE_VERSION` in the Dockerfile means bumping `pinned_sha256` below to match, or
  this step refuses, naming both versions.
runs:
  using: composite
  steps:
    - name: Install mise
      shell: bash
      run: |
        set -euo pipefail
        dockerfile=packages/daemon/docker/worker.Dockerfile
        mise_version=$(sed -n 's/^ARG MISE_VERSION=//p' "$dockerfile")
        if [ -z "$mise_version" ]; then
          echo "$dockerfile names no ARG MISE_VERSION" >&2
          exit 1
        fi
        # linux-x64 tar.gz from mise's own SHASUMS256.txt for this release:
        # curl -fsSL "https://github.com/jdx/mise/releases/download/${pinned_version}/SHASUMS256.txt"
        pinned_version="v2026.8.12"
        pinned_sha256="0c782233b97745fd3ed317ba3acbfd7d256e6268470373757f0cc48d57bb87e6"
        if [ "$mise_version" != "$pinned_version" ]; then
          echo "::error::$dockerfile names ARG MISE_VERSION=$mise_version, but this action's sha256 is pinned to $pinned_version; update pinned_version and pinned_sha256 in $0 to match" >&2
          exit 1
        fi
        dir="$RUNNER_TEMP/mise-install"
        mkdir -p "$dir"
        archive="mise-${mise_version}-linux-x64.tar.gz"
        curl -fsSLo "$dir/$archive" \
          "https://github.com/jdx/mise/releases/download/${mise_version}/${archive}"
        printf '%s  %s\n' "$pinned_sha256" "$dir/$archive" > "$dir/SHA256SUMS"
        sha256sum --check --strict "$dir/SHA256SUMS"
        tar -xzf "$dir/$archive" -C "$dir"
        mkdir -p "$HOME/.local/bin"
        install -m 0755 "$dir/mise/bin/mise" "$HOME/.local/bin/mise"
        rm -rf "$dir"
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        "$HOME/.local/bin/mise" --version

    - name: Install the worker image's jj
      shell: bash
      env:
        MISE_GITHUB_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        dockerfile=packages/daemon/docker/worker.Dockerfile
        jj_tool=$(sed -n 's/^ARG JJ_TOOL=//p' "$dockerfile")
        if [ -z "$jj_tool" ]; then
          echo "$dockerfile names no ARG JJ_TOOL" >&2
          exit 1
        fi
        install -m 0755 "$("$HOME/.local/bin/mise" x "$jj_tool" -- sh -c 'command -v jj')" "$HOME/.local/bin/jj"
        echo "$jj_tool: $HOME/.local/bin/jj"
        "$HOME/.local/bin/jj" --version
