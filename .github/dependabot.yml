version: 2
updates:
  # Every pin this repository carries is a commit SHA with a `# vX.Y.Z` comment
  # (.github/scripts/check-action-pins.sh enforces the form); Dependabot rewrites both the SHA and
  # the comment when it bumps an action, so the pins stay current instead of freezing at the
  # commit this PR pinned them to. `/.github/actions/*` reaches every composite action's own
  # `uses:` (oven-sh/setup-bun in .github/actions/setup-bun/action.yml included); `/` reaches every
  # workflow under .github/workflows.
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "weekly"
    commit-message:
      # pr-title.yaml requires a conventional-commit title; "ci" is this repository's prefix for
      # CI-only changes.
      prefix: "ci"
    groups:
      github-actions:
        patterns:
          - "*"
