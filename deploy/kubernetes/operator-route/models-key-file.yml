# The key-file alternative to models.yml, for an operator with no model gateway: anthropic is
# Anthropic's own endpoint, keyed directly by ANTHROPIC_API_KEY — a `provider_keys` entry
# (`runtime.kubernetes.provider_keys: [ANTHROPIC_API_KEY]`) the shim exports straight into Oh My
# Pi's environment, which this file's apiKey and header commands read back out. `auth: apiKey`
# keeps these models plain API-key callers, as models.yml's does.
#
# The model ids and their metadata are kept identical to models.yml's so this file needs no
# overlay.yml of its own: a deployment's real key-file overlay would instead name Anthropic's own
# model ids directly (Sami's ruling of 2026-10-08 on dispatch://LEGION-578 names anthropic/
# claude-opus-5 for default/review/oracle/deep in the live GKE route), but the live harnesses
# reuse overlay.yml's existing fourteen roles and -legion-suffixed ids unchanged so every role the
# image-probe checks already cover (oracle included) keeps working under either model route.
#
# Pair with pod-key-file.yml, which carries no gateway token volume. The live harnesses run on
# this file under LEGION_E2E_MODEL_ROUTE=key-file.
providers:
  anthropic:
    baseUrl: https://api.anthropic.com
    auth: apiKey
    api: anthropic-messages
    apiKey: "!printf %s \"$ANTHROPIC_API_KEY\""
    headers:
      X-Api-Key: "!printf %s \"$ANTHROPIC_API_KEY\""
    models:
      - id: claude-fable-5-1-legion
        name: Claude Fable 5.1 (Legion gateway)
        reasoning: true
        input: [text, image]
        contextWindow: 1000000
        maxTokens: 128000
        cost: {input: 10, output: 50, cacheRead: 0.25, cacheWrite: 12.5}
      - id: claude-fable-5-legion
        name: Claude Fable 5 (Legion gateway)
        reasoning: true
        input: [text, image]
        contextWindow: 1000000
        maxTokens: 128000
        cost: {input: 10, output: 50, cacheRead: 1, cacheWrite: 12.5}
      - id: claude-opus-5-legion
        name: Claude Opus 5 (Legion gateway)
        reasoning: true
        input: [text, image]
        contextWindow: 1000000
        maxTokens: 128000
        cost: {input: 5, output: 25, cacheRead: 0.5, cacheWrite: 6.25}
      - id: claude-opus-4-8-legion
        name: Claude Opus 4.8 (Legion gateway)
        reasoning: true
        input: [text, image]
        contextWindow: 1000000
        maxTokens: 128000
        cost: {input: 5, output: 25, cacheRead: 0.5, cacheWrite: 6.25}
      - id: claude-sonnet-5-legion
        name: Claude Sonnet 5 (Legion gateway)
        reasoning: true
        input: [text, image]
        contextWindow: 1000000
        maxTokens: 128000
        cost: {input: 2, output: 10, cacheRead: 0.2, cacheWrite: 2.5}
