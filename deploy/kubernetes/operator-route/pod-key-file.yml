# The key-file alternative to pod.yml, for an operator with no model gateway in front of
# Anthropic: ANTHROPIC_API_KEY (and, where OpenAI is routed too, OPENAI_API_KEY) reaches the agent
# as a `provider_keys` entry — a providers-Secret key the shim exports straight into Oh My Pi's
# environment — rather than through a projected ServiceAccount token a gateway verifies. There is
# no token to audience here, so this fixture carries no `operator-token` volume at all; everything
# else (the models.yml/overlay.yml ConfigMap mount, the ServiceAccount, the Foundry override) is
# pod.yml's. Pair it with models-key-file.yml, which names Anthropic's own endpoint instead of a
# gateway's. The Go live harnesses run on this file under LEGION_E2E_MODEL_ROUTE=key-file.
env:
  PI_CONFIG_FILES: /etc/legion-operator/overlay.yml
  CLAUDE_CODE_USE_FOUNDRY: "0"
# The ServiceAccount the pods run as is the operator's own, and each live harness run's own, so the
# repository holds none.
service_account: ${POD_SERVICE_ACCOUNT}
volumes:
  - name: operator-route
    config_map:
      name: legion-operator-route
      items: [{key: models.yml, path: models.yml}, {key: overlay.yml, path: overlay.yml}]
volume_mounts:
  - {volume: operator-route, mount_path: /home/legion/.omp/profiles/legion/agent/models.yml, sub_path: models.yml}
  - {volume: operator-route, mount_path: /etc/legion-operator/overlay.yml, sub_path: overlay.yml}
