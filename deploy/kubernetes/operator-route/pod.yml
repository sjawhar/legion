# The operator's `runtime.kubernetes.pod`: the model configuration files every Legion pod's Oh My
# Pi reads. The daemon-held `runtime.kubernetes.model_login` supplies the short-lived Cognito access
# token to worker shims; this pod block deliberately carries neither a password nor a refresh token.
# The Go live harnesses run on these route files.
#
# The ConfigMap named here, legion-operator-route, holds the operator's models.yml and overlay.yml;
# apply.sh writes it from the operator's directory. A live harness run creates its own copy
# instead, legion-operator-route-<run>, points its pods at that name, and deletes it after, so a run
# sharing the namespace never touches it.
env:
  # The operator's settings overlay (overlay.yml), named after Legion's pod baseline, so it
  # outranks the baseline and every repository's .omp/config.yml.
  PI_CONFIG_FILES: /etc/legion-operator/overlay.yml
  # Anthropic Foundry puts FOUNDRY_BASE_URL ahead of a model's own baseUrl; a repository's .env
  # could turn it on, and the pod's own value outranks .env.
  CLAUDE_CODE_USE_FOUNDRY: "0"
service_account: legion-worker
volumes:
  - name: operator-route
    config_map:
      name: legion-operator-route
      items: [{key: models.yml, path: models.yml}, {key: overlay.yml, path: overlay.yml}]
volume_mounts:
  # models.yml where the image's Oh My Pi profile (OMP_PROFILE=legion, HOME=/home/legion) reads it.
  - {volume: operator-route, mount_path: /home/legion/.omp/profiles/legion/agent/models.yml, sub_path: models.yml}
  - {volume: operator-route, mount_path: /etc/legion-operator/overlay.yml, sub_path: overlay.yml}
