# An example of the operator's Oh My Pi settings, which pod.yml names in PI_CONFIG_FILES after
# Legion's pod baseline. The operator copies it into their own directory with models.yml and
# applies both with apply.sh; to change the model a role uses, edit its line under modelRoles and
# run apply.sh again (README.md beside this file).
#
# Every model turn runs on the anthropic provider models.yml routes through the gateway, with
# nothing to fall back to. Oh My Pi falls back from a failing provider without a word, so
# enabledModels holds every session's own model to anthropic, and each provider a pod could reach
# without the gateway is disabled: Bedrock twice (a node's instance role is its key), Google and the
# local servers Oh My Pi uses with no key, as scripts/e2e/lib/install-model-gateway.sh does for the
# tmux proofs, and OpenAI. Records merge key by key across settings layers, so every role
# Legion's prompts reach is named: the shipped review, oracle and deep-worker agents' @review,
# @oracle and @deep (the planner's plan-reviewer and plan-gap-analyst run on @review and @oracle),
# and the bundled scout's @smol and reviewer's @slow.
enabledModels:
  - anthropic/*-legion
disabledProviders:
  - amazon-bedrock
  - bedrock-mantle
  - google
  - ollama
  - llama.cpp
  - lm-studio
  - openai
modelRoles:
  default: anthropic/claude-fable-5-1-legion:xhigh
  plan: anthropic/claude-fable-5-1-legion:max
  slow: anthropic/claude-opus-5-legion:xhigh
  smol: anthropic/claude-sonnet-5-legion
  task: anthropic/claude-sonnet-5-legion
  vision: anthropic/claude-sonnet-5-legion
  commit: anthropic/claude-sonnet-5-legion
  tiny: anthropic/claude-sonnet-5-legion
  advisor: anthropic/claude-sonnet-5-legion:medium
  review: anthropic/claude-opus-5-legion:high
  oracle: anthropic/claude-opus-5-legion:high
  deep: anthropic/claude-fable-5-1-legion:xhigh
retry:
  # A failed turn does not move to another model: a repository can add retry.fallbackChains keys
  # (a record), and with fallback off a failure is the role's own.
  modelFallback: false
