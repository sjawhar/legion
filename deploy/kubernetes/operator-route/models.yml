# An example of the operator's models.yml, the Oh My Pi provider file every Legion pod reads
# (pod.yml mounts it into the image's Oh My Pi profile). The operator copies it into their own
# directory with overlay.yml, puts the model endpoint's base URL in place of the baseUrl
# placeholder, and applies both with apply.sh (README.md beside this file).
#
# anthropic through the Hawk model gateway (middleman), keyed by the daemon-delivered Cognito
# access token. The worker shim writes that token to the memory-backed state volume; Oh My Pi
# caches the command's value for the process and runs it again on a 401, so the token refreshed by
# the daemon is read on the first refusal. `auth: apiKey` makes these models plain API-key callers:
# without it Oh My Pi sends an anthropic-messages custom model in its Claude Code OAuth shape.
#
# The models carry the gateway's current names. Each entry gives Oh My Pi the metadata for the
# model the gateway serves; overlay.yml chooses each role's.
#
# The live harnesses run on this file, each putting LEGION_E2E_MODEL_GATEWAY_URL in place of the
# placeholder in its own copy.
providers:
  anthropic:
    baseUrl: ${MODEL_BASE_URL}
    auth: apiKey
    api: anthropic-messages
    apiKey: "!cat /var/run/legion/state/model-token"
    headers:
      X-Api-Key: "!cat /var/run/legion/state/model-token"
    models:
      - id: claude-fable-5-1-legion
        name: Claude Fable 5.1 (Legion gateway)
        reasoning: true
        input: [text, image]
        contextWindow: 1000000
        maxTokens: 128000
        cost: {input: 10, output: 50, cacheRead: 0.25, cacheWrite: 12.5}
      - id: claude-fable-5-legion
        name: Claude Fable 5 (Legion gateway)
        reasoning: true
        input: [text, image]
        contextWindow: 1000000
        maxTokens: 128000
        cost: {input: 10, output: 50, cacheRead: 1, cacheWrite: 12.5}
      - id: claude-opus-5-legion
        name: Claude Opus 5 (Legion gateway)
        reasoning: true
        input: [text, image]
        contextWindow: 1000000
        maxTokens: 128000
        cost: {input: 5, output: 25, cacheRead: 0.5, cacheWrite: 6.25}
      - id: claude-opus-4-8-legion
        name: Claude Opus 4.8 (Legion gateway)
        reasoning: true
        input: [text, image]
        contextWindow: 1000000
        maxTokens: 128000
        cost: {input: 5, output: 25, cacheRead: 0.5, cacheWrite: 6.25}
      - id: claude-sonnet-5-legion
        name: Claude Sonnet 5 (Legion gateway)
        reasoning: true
        input: [text, image]
        contextWindow: 1000000
        maxTokens: 128000
        cost: {input: 2, output: 10, cacheRead: 0.2, cacheWrite: 2.5}
