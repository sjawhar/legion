kind: Fixed
body: |-
  The role file at `${CLAUDE_PLUGIN_DATA}/roles/<session-id>.json` now carries the writing
  process's client instance beside the session id and the role, since two `claude` processes of
  one user read one state directory and a record keyed by session id alone names no writer. A
  record another process wrote is pressed only while this process holds no role; one written
  before the field is pressed as it always was.

  A refusal that names this session under another process keeps the role and its record and asks
  again on each heartbeat, so a relaunched role is no longer stranded by a stale claim, and the
  record's mtime is refreshed as it is on a confirmed holder, so the age sweep never expires a
  record a process is still claiming for. Only a refusal naming a different session ends the
  role. The heartbeat's re-assertion confirms the role only when the lookup names this session
  *and* this process and reports no hand-back, and every claim and every topic hand-back states
  this process's instance, so a release frees only the role claims this process holds.

  A lookup that answers `handed_back` is a role this process does not hold: a client built
  before a release stated its process can hand this session's role lane back without freeing
  the claim, and the listener marks the claim rather than freeing it, after which no
  registration renews it. The re-assertion claims the role again on that heartbeat and the
  grant writes a fresh record with no mark, so the role is back before the listener's role
  claim reaper could free it. Each registration renews every claim of this process the listener
  has not marked, whatever topics that registration carries: this process gives a role up by
  deregistering the session rather than by releasing the lane, so it leaves no mark of its own.
