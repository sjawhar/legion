body: 'The MCP server registers for consumer delivery and keeps no core receive path: it holds its session''s relay subject and nothing else, publishes no lane receipt, and a registration the listener refuses leaves the session running with one notice naming the reason, asked again at each heartbeat. A topic no stream subject captures is followed and left out of every registration (registrationTopics), wherever it came from — a subscription, the stored interest row, the remembered topics a restore reads — since the listener refuses the whole registration naming one. channel-forwarder.ts is channel-topics.ts, holding the followed set and the one connection. Listeners deploy first: this plugin needs a listener carrying #2446 and the session-consumer grant, since one that answers no delivery leaves the session deaf. The replay sweep is deleted with POST /v1/replay.'
