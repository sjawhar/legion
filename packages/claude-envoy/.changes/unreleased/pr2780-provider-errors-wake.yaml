kind: Added
body: |-
  Its copies of the Legion skills name the controller's new `provider-errors` wake, which the daemon
  publishes once six turns of one role in a row have ended in an error the model's provider
  returned. Nothing is held and nothing is stopped by that count: the daemon keeps the task and
  prompts the same session with it again, at most ten minutes apart, so the controller names the run
  and its model in the day's report and sends it to the issue's architect, and re-admits and parks
  nothing. No worker posts a turn's outcome over a route of its own: the daemon decides a failed
  turn from that prompt's own result, and for a Claude Code worker the result is the bridge's own
  result line, the provider's HTTP status among it.
