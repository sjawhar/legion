kind: Added
body: 'The plugin ships `claude-envoy:following-best-practices`: before a design is chosen, the agent lists the best practices for the problem and finds the world-class answer, and before each approval request two fresh subagents review the proposal, one against best practice and one for compromises. The Legion architect''s design gate runs those two reviews before an approval request, and `plan-reviewer` checks that the spec records both verdicts.'
