kind: Changed
body: |-
  The plugin declares daemon API contract 52 in `package.json`'s `legion.daemonApiVersion`:
  `GET /legion/v1/state` carries `questionsForController`, the questions to stopped agents the
  daemon's answer loop passed to the controller in the last seven days, always emitted, so the
  MCP server's state reader admits the field and nothing this plugin reads or writes moved; a
  session of it registers with a daemon at 52.
time: 2026-11-06T22:00:00.000000000Z
