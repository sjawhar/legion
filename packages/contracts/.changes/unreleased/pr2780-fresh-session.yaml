kind: Added
body: |-
  `LegionClaimRequest`, the body of the daemon's new `POST /legion/v1/claims/fresh-session`:
  a controller grant, an issue and a role. The claim on that role of that issue leaves the session
  it recorded behind and starts again in a new one, which is the effect
  `legion claims retry --fresh-session` runs for an operator. It reaches every claim of the project
  that is not in a turn: one idle between the provider-error ladder's sends, a suspended one, one an
  operator stopped, a failed one, and a root architect. The daemon refuses a claim in a turn
  (`CLAIM_IN_A_TURN`), a claim whose launch is in flight (`CLAIM_UNSETTLED`) and the project's own
  controller, which is no role the request may name (`INVALID_ROLE`).
  `LegionOperatorClaimResponse` gains an optional `phaseNotRestarted`, which the operator's
  `retry` carries when it asked for a fresh session: the claim is back in a new session owing no
  task, and the workflow refused the restart of its phase that would have handed it one. The
  claim started either way, so that refusal rides a successful answer rather than replacing it.
