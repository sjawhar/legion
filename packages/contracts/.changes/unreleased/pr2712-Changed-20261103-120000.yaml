kind: Changed
body: |-
    Every Dispatch event payload is written once. A payload type is now `z.output` of the
    `z.strictObject` schema that carries its name, and the reading a consumer of the bus applies
    to it sits beside that schema as `InboundXSchema`: the same schema with only the keys that
    reading keeps, the optionality a retained frame needs, unknown fields kept where it kept
    them, and an open string where a 72-hour-old frame may name a value this release does not
    know. `IssueEventPayloadSchema` declared nine of the type's twenty-five fields; it now
    declares all of them, and `InboundIssueEventPayloadSchema` keeps the nine. `dispatch-api.ts`
    is now the entry alone, one `export *` per area module beside it, none longer than 1,000
    lines; `@legion/contracts` exports everything it did.
time: 2026-11-03T12:00:00.000000000Z
