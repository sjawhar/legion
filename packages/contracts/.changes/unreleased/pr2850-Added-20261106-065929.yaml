kind: Added
body: Dispatch's shared rules name the content types a browser draws where it is read - PNG, JPEG, GIF, WebP, MP4 and WebM - and which of them are videos, so the server and the dashboard decide alike what is drawn in the page and what is handed over as a download. An artifact version carries the width and height of the picture it stores, and a reference summary's documents carry their latest version's content type and size.
