kind: Changed
body: 'The `Actor` of a person carries `act`, the agent that made the act for them: the session a broker-issued token proved or the caller named, else the personal token''s id and name, with the scopes that credential held, a snapshot taken at the act. `AskAnswer` carries it too, `AgentToken` carries its `scopes`, `WhoamiResponse` carries the caller''s, and the mint and the new scope edit have input shapes of their own. A 28th tool spec, `dispatch_inbox`, lists what the person''s Dispatch Inbox shows - Needs you, Waiting on agents, Later and Credential requests, each with its count and rows - read with the caller''s own credential; it is not the Envoy tool `envoy_inbox`.'
