kind: Fixed
body: The schemas that read the Legion daemon's answers now ignore a key they do not name, at every depth, so a plugin one contract behind its daemon reads the state instead of refusing the whole body for one field the daemon added. They still refuse a body that lacks a field they require or carries one of a type they do not describe, a refusal still arrives with its stable code, and every body the plugin sends is still refused for a key its schema does not name. The gate that holds the reader to the daemon's Go wire shape is now an equality between each golden's parse and the file, which names the path of the first key the parse dropped.
