kind: Changed
body: |-
    `dispatch_request_approval`'s description says that a later version whose text is exactly the
    approved version's again, such as an accidental edit undone exactly, carries the approval, so
    nothing is requested for it. `WriteAdvice.superseded_approval`, `ArtifactReview` and
    `ArtifactApproval` describe that carry and its reason (`Carried forward from the approval of
    version <N>: this version's text is that version's, unchanged.`).
