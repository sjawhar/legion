kind: Changed
body: 'Daemon API contract 50: the state''s `check` object carries `role`, the role that works the production check, and its `nextWakeAt` is when the next look is due — the time the checking agent named, the retry of a look nobody reported, or the check''s bound where neither stands. `handoff_complete` takes `wakeAt`. The settings body no longer reports a project''s `deploys`.'
