kind: Changed
body: |-
    The role prompts now tell a role how to work with background work, and no longer that a
    takeover cancels its turn. The worker part says that a CI red takes the phase back without the
    role's completion and starts the implementer at once, that one message on the role's own topic
    tells it, naming the phase that ended, the phase the issue is in now and the red, and that the
    message stops nothing: the role keeps its turn, its jobs, its process and its session, must
    stop writing the workspace at once and leave what it has uncommitted, and is read-only in every
    turn after that; a retro completion that arrives after the move is refused
    `HANDOFF_STALE_ASSIGNMENT`, in flight when the red landed or started later alike. The
    architect's `checks-red` paragraph says the same from its seat. The implementer runs a long
    local check as the background job Oh My Pi makes of it and reads its exit with `wait`; the
    implementer and the planner wait for each subagent's result, which `blocking: true` used to
    enforce; the headless fragment says the phase reminder keeps still while a role waits on
    background work of its own; and the Claude Code part maps `wait` onto that runtime's `Agent`
    result and `BashOutput`, with Claude Code's 30 minutes for a background command and 2 hours at
    the most. A new test over both embedded prompt trees holds every retired sentence out and every
    part that dispatches a task subagent to naming `wait`.
