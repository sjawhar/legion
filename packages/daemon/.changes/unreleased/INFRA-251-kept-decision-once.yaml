kind: Added
body: |-
    A person's decision on a parked tree reaches once the architect of the tree it is owed to
    (INFRA-251). The daemon keeps it under the issue it was decided on, never under a root
    (migration 0065), so the tree that owes the person an answer is the tree that issue stands in
    now: a child a linger hands to Legion, a parked child a person's todo orphans, a grandchild
    handed over beside its parent and a queued root admission adopts into a live tree each take
    what was decided on them with them, in any order, with nothing to move. A start or catch-up
    claims what it names; a start whose task the architect's claim queues leaves it to that
    delivery, which holds it until the turn that takes the task starts, and that confirmation is
    what tells it (migration 0066, `claims.delivered_rows` and
    `pending_task_deliveries.kept_decisions`). A claim or a hold counts only while it stands in the
    row's own tree, and a telling deletes a row only while its issue still stands in the teller's
    tree; a start or catch-up that reached no architect, and a held task narrowed of what has left
    its tree, hand what they release to a fresh catch-up of each tree owed. So a retried start
    never tells it twice, a root architect's task waits while its tree is parked, lingering or
    waiting for its slot, and a decision is never lost when its issue changes trees.
