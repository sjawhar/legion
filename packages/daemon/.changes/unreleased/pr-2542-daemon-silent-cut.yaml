kind: Fixed
body: |-
    The daemon now declares its NATS connection lost two to three seconds after the server stops
    answering it, where nats.go's default left it reading connected for four to six minutes while
    nothing reached it. The pings are set inside the daemon's own `Connect`, its one NATS entry
    point, so every connection it opens carries them. A loaded server whose answer takes more than
    two seconds is taken for a cut one, which costs a redial and never a closed connection, since
    the daemon reconnects for ever.
