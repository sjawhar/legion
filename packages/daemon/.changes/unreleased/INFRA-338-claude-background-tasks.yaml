kind: Changed
body: |-
    A Legion role on Claude Code may now leave a background task running past the end of a turn.
    Neither runtime sets `CLAUDE_CODE_DISABLE_BACKGROUND_TASKS` any more, so the name is the
    operator's to set like Claude Code's other variables, and `CLAUDE_CODE_DISABLE_CRON=1` stays.
    When a task finishes, Claude Code starts a turn of its own, which the bridge reports to the
    daemon as a turn (`agent_start` on the `system` `init` line that begins it, `agent_end` on its
    result), so the result is read in a turn the daemon sees; a task that finishes while a turn
    runs ends nothing, and a prompt that arrives during a turn Claude Code started is refused busy
    and sent again at its end. The daemon API contract is 43.
time: 2026-10-30T10:30:00Z
