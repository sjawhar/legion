kind: Added
body: |-
    When CI goes red the daemon now tells the role whose phase that ended, on that role's own Envoy
    topic, that its phase is over, which phase the issue is in now and the reason its architect's
    checks-red notice carries: the tester in testing, the reviewer in reviewing whether or not it
    completed its round, the merger in merging, and the implementer in retro, which is told besides
    that its implementing task follows. Without the start takeover nothing else told them, since the
    implementer starts at once and a role's next task waits for that role's turn to end. The message
    stops nothing — the role keeps its turn, its jobs, its process and its session — and asks it to
    stop writing the workspace the new phase owns. It is a new outbox kind, `phase_ended`, on a lane
    of its own (`role_message`), so it waits behind no architect notice; a role topic with no live
    holder ends the row with a log line, since the role's next task names its phase anyway.
    Migration 0066 adds the kind to the outbox's constraint.
