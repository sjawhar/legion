# Written by the Go `legion` (packages/daemon/internal/podsafety) when Oh My Pi starts in a Legion
# pod, and named first among Oh My Pi's settings overlays (PI_CONFIG_FILES). Oh My Pi ranks every
# overlay above the settings of the repository the agent works in, and a later overlay above an
# earlier one, so a repository cannot turn these back on and the operator's own overlay, named after
# this one, can. It names no model, provider, or route: those are the operator's.
#
# Two classes of setting live here, both ones a repository could not be trusted to leave alone.
# Each of compaction, memory, images and dev is one that sends a pod's conversation somewhere Oh My
# Pi posts to on its own: remote compaction, first in Oh My Pi's default method order, posts the
# conversation to remoteEndpoint with the session model's key; with it off, compaction falls
# through to the methods that run on the session's own model. A memory backend other than off sends
# the conversation to its own servers (hindsight.apiUrl, mnemopi's embedding and LLM URLs);
# images.urls publishes images to a backend; dev.autoqa pushes tool-issue reports to
# dev.autoqaPush.endpoint. Session storage is left to OMP_SESSION_STORAGE, which outranks the
# setting: the baseline sets it to file, where a pod keeps its sessions on the tree volume, unless
# the Sandbox runtime keeps them in its session database and sets it to sql itself, and the runtime
# refuses an operator's own store (podsafety.go).
#
# bash.autoBackground.enabled and async.enabled are the other class, the two turn-scoping keys
# every Legion role's Oh My Pi also gets through turnscope.yml (packages/daemon/internal/podsafety,
# its own comment holds the full account): on by default under `--mode rpc` (every Legion role),
# each lets some running or dispatched work move to a background job a takeover's abort no longer
# reaches once it has moved — only the turn asking it to finish does
# (supervise.Machine.Quiesce's own promise, "the worker never writes the shared workspace beside
# the role the start hands it to", depends on both). Off, that work stays the turn's own, so the
# same abort that ends the turn ends it too (LEGION-462 found the bash case live, legion-smoke
# LEGSMOKE-463, at commit 80d0c82b: the proof's own long `/usr/bin/sleep` outlived the interrupt
# once it had been running about a minute).
compaction:
  remoteEndpoint: ""
memory:
  backend: "off"
images:
  urls:
    enabled: false
dev:
  autoqa: false
bash:
  autoBackground:
    enabled: false
async:
  enabled: false
