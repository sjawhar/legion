# The roles of the devbox's `legion` Oh My Pi profile, the one the TypeScript daemon's panes run, each
# on its gateway alias; the two it gives to models the gateway does not serve Legion (slow, vision)
# run the nearest alias. DefaultModel (modelroute.go) names the default role's model.
modelRoles:
  default: anthropic/claude-fable-5-1-legion:xhigh
  plan: anthropic/claude-fable-5-1-legion:max
  slow: anthropic/claude-opus-5-legion:xhigh
  smol: anthropic/claude-sonnet-5-legion
  task: anthropic/claude-sonnet-5-legion
  vision: anthropic/claude-sonnet-5-legion
  commit: anthropic/claude-sonnet-5-legion
  tiny: anthropic/claude-sonnet-5-legion
  advisor: anthropic/claude-sonnet-5-legion:medium
retry:
  # A failed turn does not fall back to another model: a repository's .omp/config.yml can add
  # retry.fallbackChains keys (a record, merged key by key across settings layers, unlike these
  # lists). The pinned Oh My Pi resolves a candidate only among enabled providers, so a chain could
  # at most move a turn to another alias; with fallback off a failure is the default alias's own.
  # modelFallback is one value, so this overlay's wins.
  modelFallback: false
