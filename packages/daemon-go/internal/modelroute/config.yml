# Written by the Go `legion` (packages/daemon-go/internal/modelroute) when Oh My Pi starts in a Legion
# pod: the worker shim and `legion probe-image` write it beside models.yml, from which every model
# named here is served, through the model gateway. They also name this file as Oh My Pi's last
# settings overlay (PI_CONFIG_FILES), which Oh My Pi ranks above the settings of the repository the
# agent works in. For a single value or a list, the overlay's replaces the repository's: without it,
# a repository's .omp/config.yml that emptied disabledProviders brought Amazon Bedrock back
# (omp_test.go reproduces it). A record (retry.fallbackChains, modelRoles) merges key by key, so a
# repository can add keys this file does not set; that is why fallback is off below.
#
# The gateway is the one model route, and Oh My Pi falls back from a failing provider without a word:
# with the gateway key failing and nothing pinned, a turn answers from Amazon Bedrock on the host's
# instance role (amazon-bedrock/us.anthropic.claude-opus-4-8, exit 0; omp_test.go reproduces it).
# enabledModels holds every session's own model to the gateway's aliases, so a process without the
# key exits naming the provider it has no key for (No API key found for anthropic), having sent
# nothing. Every other provider Oh My Pi knows is disabled, so no key a pod could come by (ambient
# cloud credentials, a repository's .env, a local server) puts one in reach: the set is closed. The
# pinned Oh My Pi resolves no model of a disabled provider and gives it no key however a setting
# names it: a subagent override, an agent's model frontmatter, a custom role, a fallback chain
# (omp_test.go runs each).
#
# Two ids name more than a model provider, and disabling them is intended. `cursor` is also Oh My
# Pi's Cursor capability source, so a pod loads no repository's .cursor/ rules or MCP servers (a
# repository's .env can carry CURSOR_API_KEY; its AGENTS.md still loads). `web` holds the web
# search backends, several of them models of other providers (Perplexity, Z.ai, Kimi), so a pod's
# web_search tool has no backend.
#
# disabledProviders is every provider id in Oh My Pi's bundled catalog and provider auth rules at
# the pinned fork, less anthropic, derived with
#   git show <tag>:packages/catalog/src/models.json | jq -r 'keys[]'
#   git show <tag>:packages/catalog/src/compat/rules/auth/*.kdl | grep -o '^auth "[^"]*"'
# derived at: github:sjawhar/oh-my-pi@18.2.9-sami.20260924-172934
# modelroute_test.go fails when packages/daemon/src/daemon/omp-pin.ts names another fork release,
# so a pin bump re-derives it.
enabledModels:
  - anthropic/*-legion
disabledProviders:
