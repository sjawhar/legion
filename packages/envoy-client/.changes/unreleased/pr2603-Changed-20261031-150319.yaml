kind: Changed
body: 'A registration must be given a session consumer: SubscribeInput.delivery is required and parseSubscribeAnswer throws on an answer that is absent, says core or cannot be read, carrying the listener''s own reason; a serving-port registration goes through subscribeServingPort, which the listener may answer with no consumer. One registration is one call, registerWithRelay in consumer-delivery.ts: it carries the topics the listener will store for the session (registrationTopics: the session''s own agent subject, and every followed topic but one reaching another session''s private stream subject and one no stream subject captures, which would be refused with the whole registration), stamps them on the relay, tells the session once per outage, and hands the answer''s consumer back. Listeners deploy first: a plugin of this release needs a listener carrying #2446 and the session-consumer grant, since one that answers no delivery leaves the session deaf. The POST /v1/replay sweep is deleted with the route; replay.ts is now delivery-ledger.ts, keeping the dedupe ledger, the failure and gap notices and closeReplayedRemoval, with the subject rules (rememberedTopics, replayFollowedSubjects, reachesPrivateStreamSubject, streamDeliversNothing, registrationTopics) in stream-topics.ts. Team topics are stored topics.'
