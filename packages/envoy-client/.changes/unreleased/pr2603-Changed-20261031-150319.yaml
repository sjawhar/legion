body: 'A registration must be given a session consumer: SubscribeInput.delivery is required and parseSubscribeAnswer throws on an answer that is absent, says core or cannot be read, carrying the listener''s own reason; a serving-port registration goes through subscribeServingPort, which the listener may answer with no consumer. Listeners deploy first: a plugin of this release needs a listener carrying #2446 and the session-consumer grant, since one that answers no delivery leaves the session deaf. The POST /v1/replay sweep is deleted with the route; replay.ts is now delivery-ledger.ts, keeping the dedupe ledger, the failure and gap notices and closeReplayedRemoval, with the subject rules (rememberedTopics, replayFollowedSubjects, reachesPrivateStreamSubject, streamDeliversNothing) in stream-topics.ts. Team topics are stored topics.'
