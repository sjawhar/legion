kind: Removed
body: |-
  `PublishResult.unresponsive` and the `unresponsive` key of the publish answer and of the error
  wire are gone with the listener field no build writes any more: a publish to a topic the stream
  captures is stored once and read by each subscribed session's own consumer, so no recipient is
  reported. `publishConfirmationText` takes no recipients and says what the publish did; a send
  addressed to one session still carries `recipientState` and `lastSeen`.
custom:
