kind: Fixed
body: |-
    A session in an agent box reports the machine the box runs on (`AGENTBOX_HOST`), not the
    container's hostname (`agentbox-<hash>`), as its Envoy registration's `host`, in
    `envoy_whoami` and as a Dispatch write's origin machine. `ENVOY_MACHINE_ID` still wins.
