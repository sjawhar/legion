kind: Changed
body: |-
    `DispatchClient` sends a request that a Dispatch process answered `404 NOT_FOUND` "no route for
    …" again, with the same body, after 1, 2 and 4 seconds, each wait jittered by a quarter
    (`NO_ROUTE_RETRY_DELAYS_MS`): during a release the older build has no route for what only the
    newer one serves. After the last attempt it throws `DispatchNoRouteError`, whose message
    (`NO_ROUTE_ROLLING_RELEASE_MESSAGE`) says the action is not offered yet because a release is in
    progress, and to try again in one minute. The architecture-source fallbacks to an older server's
    singular routes run once the retries are spent. An abort of the client's signal, or its
    deadline, during a wait rejects the request at once with the abort's reason, and the request is
    not sent again. The client and `executeDispatchTool` take a `sleep`, so a test does not wait. A
    client built with `retryNoRoute: false` sends each request once instead and throws that answer
    as it came, for a caller that has an answer of its own to a missing route: the per-request read
    of people's answers, whose own five-minute back-off keeps a model request from waiting on a
    Dispatch older than the answers route.
