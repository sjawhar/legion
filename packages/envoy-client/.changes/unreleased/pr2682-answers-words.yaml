kind: Added
body: |-
    `sessionAnswersWords(items, now)` in `@legion/envoy-client/session-answers` keys what the people
    wrote in each item inside the 72 hours (kind, id, author, times, options chosen, words), and
    `readSessionAnswers` returns it as `words` on a `fresh` or `cache` read, so a host can tell a new
    item or a changed answer from a list that only lost items or changed its titles or header.
