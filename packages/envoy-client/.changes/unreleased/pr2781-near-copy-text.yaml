kind: Changed
body: |-
  `dispatch issue` refused as a near copy names each issue the refusal found, points to the
  duplicate rule of `skill://dispatch-first`, and asks a filer who forces to write in the new
  issue's spec why it is not each named issue. After a create below the refusal, the output names
  the likely duplicate and points to the same rule. `dispatch related`'s `--exclude-issue` is now
  repeatable.
