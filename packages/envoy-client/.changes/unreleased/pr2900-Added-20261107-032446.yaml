kind: Added
body: "A session in a tmux pane now reads its place there — the socket, the tmux server's process id, the tmux session name, the window id, index and name, the pane id and index, the window's layout string and whether the window is zoomed — with one bounded `tmux display-message` call, and carries it on its registration as `tmux_place`. `readTmuxPlace` tells a refusal from a timeout: a tmux that refuses reports no place, which clears the place the listener holds for a session that has left its pane, while one that does not answer inside the bound leaves the caller's last place standing. A session with neither `TMUX` nor `TMUX_PANE` runs no call at all. `@legion/envoy-client/tmux-place-cache` holds the reading between registrations, so a registration is built from what it holds and waits on no tmux call: `createTmuxPlaceCache` starts a reading when the held one has outlived `ENVOY_TMUX_PLACE_CACHE_MS` (30 seconds by default), never runs two at once, and, once told the session is shutting down, lets no reading write a place or start another. Between registrations it keeps itself current on an unreferenced timer of its own at that lifetime, armed by the first registration and stopped at shutdown, so a registration carries a place one lifetime old rather than one heartbeat old."
