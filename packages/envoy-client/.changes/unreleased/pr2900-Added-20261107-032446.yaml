kind: Added
body: "A session in a tmux pane now reads its place there — the socket, the tmux server's process id, the tmux session name, the window id, index and name, the pane id and index, the window's layout string and whether the window is zoomed — with one bounded `tmux display-message` call, and carries it on its registration as `tmux_place`. `readTmuxPlace` tells a refusal from a timeout: a tmux that refuses reports no place, which clears the place the listener holds for a session that has left its pane, while one that does not answer inside the bound leaves the caller's last place standing. A session with neither `TMUX` nor `TMUX_PANE` runs no call at all. `ENVOY_TMUX_PLACE_CACHE_MS` names how long one reading stands, 30 seconds by default."
