kind: Changed
body: |-
  `DispatchClient` waits out Dispatch's `Retry-After` and asks again, at most twice and only when
  the wait (`Retry-After`, whole seconds or an HTTP date; 1 s when it is missing, unreadable, or
  asks for no wait at all, `0` or a date already past; plus up to 250 ms of jitter) ends before its
  60 s deadline: any method answered `429 OVERLOADED` or `429 EDIT_QUEUE_FULL`, which Dispatch
  sends before the request runs, and a read (GET, HEAD) answered `503 DATABASE_BUSY` or `503
  REQUEST_TIMEOUT`. A write answered with either 503 is not waited out, since it may have
  committed; a POST or PATCH is asked again under its idempotency key instead (the keyed retry,
  against a Dispatch this process has seen run the keyed layer), so Dispatch runs the one write and
  replays its answer, while a PUT or DELETE carries no key and comes back to its caller as it
  stands. When it gives up, the refusal's message adds how many attempts Dispatch refused and the
  wait it asks for, e.g. `the server has no room for another write request (wait_exceeded); nothing
  ran, retry after Retry-After; Dispatch refused 3 attempts with 429 OVERLOADED, waiting out its
  Retry-After between them, so wait 1 s (Retry-After) and try again`, or that the wait would pass
  the deadline. Every other answer comes back as before. A write sent again carries the one key of
  its call, the caller's own where it named one (`projectArtifact`, `docEdit`) and otherwise the
  one the call minted, so Dispatch runs it once: neither refusal is answered after its keyed layer
  claimed the key, and an attempt of that write still running under it answers the repeat
  `409 KEY_IN_FLIGHT`, which the keyed retry collects. The wait is taken on the clock and timer the
  constructor's `writeRetry` already carries (`now`, `pause`), which a test replaces.
