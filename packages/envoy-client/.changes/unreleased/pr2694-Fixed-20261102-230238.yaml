kind: Fixed
body: A session row's `topics`, `roles` and `capabilities` read a `null` or an absent key as an empty list, so `listSessions` no longer refuses the whole list for one session that has no interest record. `SessionInfo` now always carries the three lists. A wrong element type is still refused.
