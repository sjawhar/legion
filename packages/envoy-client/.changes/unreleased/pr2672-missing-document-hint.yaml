kind: Fixed
body: 'A `dispatch` command whose `--artifact` names none of an issue''s or a project''s documents, on an owner with more than eight, says how many documents the owner holds, lists the documents whose slug or filename is closest to the reference first (letter case ignored), then the newest, and names `dispatch read --issue <KEY>` or `dispatch read --project <KEY>` as the read that lists them all. `dispatch read --issue` now lists every document, picture and file of the issue under `Documents:`, and `dispatch read --project <KEY>` with no `--artifact` lists the project''s documents on no issue rather than refusing.'
