kind: Changed
body: 'The delivery card reads `expects_reply` from the shared contract instead of re-declaring it, and prints one spelling: an envelope carrying `false` and one carrying the old `none` both render `expects_reply: false`. A stored frame is replayed in that same lenient vocabulary, so one an older build left on the stream is still shown. The `envoy_send` and `envoy_publish` argument is built from the contract''s own vocabulary.'
