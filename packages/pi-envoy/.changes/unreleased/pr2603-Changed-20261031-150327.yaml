kind: Changed
body: 'The plugin keeps no core NATS subscription: after a registration it holds exactly the session''s relay subject and its agent-stream control subject, and a topic is followed through the session''s own consumer rather than subscribed. A session holding a Legion controller role registers that project''s notice lane and its Slack mention topics, which leave the registry when the role ends. A topic no stream subject captures is followed and left out of every registration (registrationTopics), wherever it came from — the stored interest row, the transcript — since the listener stores none: it leaves such a topic out of the row and warns about it. envoy_subscribe refuses such a topic by name, in the listener''s own words, when a caller names it. A registration the listener refuses leaves the session running, with one transcript notice naming the reason, and is asked again at each heartbeat. Listeners deploy first: this plugin needs a listener carrying #2446 and the session-consumer grant, since one that answers no delivery leaves the session deaf. The replay sweep and scripts/smoke-replay.sh are deleted.'
