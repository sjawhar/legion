body: 'The plugin keeps no core NATS subscription: after a registration it holds exactly the session''s relay subject and its agent-stream control subject, and a topic is followed through the session''s own consumer rather than subscribed. A registration the listener refuses leaves the session running, with one transcript notice naming the reason, and is asked again at each heartbeat. The replay sweep and scripts/smoke-replay.sh are deleted.'
