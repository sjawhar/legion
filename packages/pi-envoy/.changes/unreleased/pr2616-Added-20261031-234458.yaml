kind: Added
body: '`following-best-practices`, a skill every session with Dispatch ships with. Before an agent chooses a design or writes options, it researches and writes down every best practice for the problem (what people who build such things know they should do and often skip, each with a source), the world-class answer and the criteria that make it best, and which fact of the case rules either out. Best practice is the floor: the agent follows each one unless a fact rules it out, and a cost is never such a fact. World-class is the target: the agent falls short of it only for a fact of the case, and names each shortfall. World-class is not over-engineering and not built for a scale the work does not have. Before each approval request, two fresh subagents answer from the problem alone and then compare the proposal, one against best practice and one for compromises against a world-class answer. `dispatch-writing-specs` sends a session to it, in its opening section, before a design is chosen or options are written and before each approval request. To stay under the 2,000-word guard, "Propose an answer to each point, numbers included, with a reason" is cut from "Questions": the ask-block template, "Name the concrete case first" and the Decisions entry carry it.'
