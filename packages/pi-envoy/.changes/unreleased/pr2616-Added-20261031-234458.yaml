kind: Added
body: |-
  `following-best-practices`, a skill every session with Dispatch ships with. Its description loads it before choosing a design, writing options, a spec or plan, or requesting approval. Before an agent chooses a design or writes options, a fresh subagent given only the problem researches every applicable best practice with a source and why it applies, the world-class answer and which fact of the case rules either out; the agent waits for those answers in the same turn, because a headless session stops a subagent still running when its turn ends, and writes a practice table (practice, source link, why it applies to this case) with one row for each practice the answers name, every row complete, before any action that states or leans to a design, an issue title in a dry run included; a research subagent fills any missing cell, never the agent's own words. Best practice is the floor and world-class is the target: a cost in time, money or effort is never a fact of the case. Before each approval request, two fresh subagents review the proposal against best-practice and world-class answers they formed from the problem alone, and are then sent the proposal's text. The spec's best-practice entry gives each practice's source and reason, and for each reviewer its final verdict, its model and the clock time (UTC) its answer arrived, taken from the harness rather than from text. `dispatch-writing-specs` sends a session to it in its opening section. To stay under the 2,000-word guard, two of its sentences are shorter: a line number "goes stale" (no longer "at the next edit"), and "Never narrate an edit" drops "or what used to be here".
