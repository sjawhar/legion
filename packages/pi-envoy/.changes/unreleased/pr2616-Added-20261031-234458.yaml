kind: Added
body: |-
  `following-best-practices`, a skill every session with Dispatch ships with. Its description loads it before choosing a design, writing options, a spec or plan, or requesting approval. Before an agent chooses a design or writes options, a fresh subagent given only the problem researches every applicable best practice with a source and why it applies, the world-class answer and which fact of the case rules either out; the agent waits for those answers in the same turn, because a headless session stops a subagent still running when its turn ends, returns its answer as one numbered list (every practice, world-class action and ruled-out practice its own item); the agent saves it, writes a table with one row per item number (number, practice, source link, why it applies to this case) before any action that states or leans to a design, an issue title in a dry run included, and a short script in the skill refuses to print OK until every item has exactly one complete row; a research subagent fills any missing part, never the agent's own words. Best practice is the floor and world-class is the target: a cost in time, money or effort is never a fact of the case. Before each approval request, two fresh subagents review the proposal against best-practice and world-class answers they formed from the problem alone, and are then sent the proposal's text, pasted by code from its file; before anything about the proposal goes to a person, one more fresh subagent confirms each paste was the whole proposal and both final comparisons arrived. The spec's best-practice entry gives each practice's source and reason, and for each reviewer its final verdict, its model, the id of its run (two reviewers, two runs) and the clock time (UTC) its final answer arrived, written down from `date -u` the moment the answer arrives rather than from text or later. `dispatch-writing-specs` sends a session to it in its opening section. To stay under the 2,000-word guard, two of its sentences are shorter: a line number "goes stale" (no longer "at the next edit"), and "Never narrate an edit" drops "or what used to be here".
