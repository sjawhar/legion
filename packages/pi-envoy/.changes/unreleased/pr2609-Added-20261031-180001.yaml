kind: Added
body: |-
  Every model request shows each Envoy card with `delivered:`, the time the session got it, after its send time (`at:` on a card, `published_at:` on the notice that names a message the session could not be shown), and with `waited:` in words once the two are 15 minutes or more apart, so a session reading its inbox late does not take a card's send time for the present time. Each time is kept per session, so a session the host moves to that is shown the same message reads when it got it there. The card stored in the transcript is unchanged.
time: 2026-10-31T18:00:01.000000000Z
