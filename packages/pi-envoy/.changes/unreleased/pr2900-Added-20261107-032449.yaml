kind: Added
body: "Every registration carries where the session sits in tmux, so Dispatch can draw a machine's tmux layout and say which pane runs which session. The place is whatever the session's cache holds when the registration is built, so no registration waits on a tmux call: one reading serves every registration for `ENVOY_TMUX_PLACE_CACHE_MS` and runs between them, since a tmux server driving a wall of panes answers slowly under load, and a reading that fails never reaches the heartbeat. A session shutting down lets no reading in flight report anything. A session outside tmux, which is every session in a Kubernetes pod, makes no tmux call."
