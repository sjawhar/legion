kind: Fixed
body: |-
  AskGate no longer refuses every Dispatch write of a session that has neither the `askgate` nor
  the `default` model role, such as one started without the settings that name them: it reviews
  with the session's own model, and each such call's result says so, names that model, and names
  `modelRoles.askgate` as the setting that gives the gate a separate model. Only a session with no
  model at all is still refused.
