kind: Added
body: 'Every Envoy card the plugin hands the host now carries the host state at the hand-over in the message the host persists (`handOver`: `startup`, `run-active`, `prompt-setup`, `idle`, `inert` or `unknown`), so a later reading of the stored transcripts says which state held a card that waited.'
