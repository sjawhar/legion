kind: Fixed
body: A `dispatch comment --reply-to-ask` that hands the turn to the human but lands on an approval request a newer version moved now says why the request still waits on the agent. It names the version the request is for and the document's current version, and gives the `dispatch request-approval` call that hands it back. The `dispatch` skill says that such a request needs `request-approval` again.
