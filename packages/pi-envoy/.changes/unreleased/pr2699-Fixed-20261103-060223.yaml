kind: Fixed
body: 'The round trip that confirms a subscription before the session is registered on it (pr2625) no longer holds the session''s registration or its role claim while NATS is away, and no longer leaves a subject open that nothing confirms. A connection that is reconnecting answers no round trip and is never closed, so waiting for one held the registration and the claim, which go over HTTP, for the length of the outage, and a pass that opens the agent subject, the relay, the control subject and every recovered topic held it for that bound times the subjects it opened. The bound is now paid once per connection rather than once per open: the first open that goes unanswered marks the connection, every later open on it goes on at once, the subjects stay open (the client sends every live subscription again on each connect), the session registers and claims as it did before, and the answer is asked for in the background. The mark is cleared on a reconnect, and whenever that asking ends: on the answer, on a connection closed for good, when the session shuts down, or after ten minutes of asking, so the next open is confirmed again rather than going on unconfirmed for the life of a connection that never answers. An open is all or nothing: it gives up, closing every subject it opened, only on a connection closed for good or a session shutting down, so a caller that reads a throw as "nothing opened" reads it truly, and a role-bound notice subject never outlives its role. The relay''s delivery subject and the agent stream control subject take the same round trip, on the same terms.'
