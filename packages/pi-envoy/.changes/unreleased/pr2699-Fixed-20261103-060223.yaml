kind: Fixed
body: 'A subscription is confirmed by the NATS server before the session is registered on it. Opening a subject only wrote SUB into the connection''s out buffer, so a message published between that write and the connection''s next flush was dropped by core NATS while the listener and the daemon already routed to the session: a Legion notice on the controller topic, a card on a session''s agent subject, or a viewer''s first ping could be lost with nothing reported. Every open now ends with the connection''s round trip, bounded at 10 seconds, and an open is all or nothing: a subject whose round trip the connection did not answer - which every pending flush of a connection that drops is - is closed again, so the caller''s retry opens it afresh and no subject is ever registered that the server did not take. The relay''s delivery subject and the agent stream control subject take the same round trip, on the same terms.'
