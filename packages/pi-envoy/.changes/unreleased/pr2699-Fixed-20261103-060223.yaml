kind: Fixed
body: 'A subscription is confirmed by the NATS server before the session is registered on it. Opening a subject only wrote SUB into the connection''s out buffer, so a message published between that write and the connection''s next flush was dropped by core NATS while the listener and the daemon already routed to the session: a Legion notice on the controller topic, a card on a session''s agent subject, or a viewer''s first ping could be lost with nothing reported. Every open now ends with the connection''s round trip, and the registration that tells the listener about the subject waits for it - for one bound, and no longer. A connection that is reconnecting answers no round trip and is never closed, so an open that waited for one would hold the session''s registration and its role claim, which go over HTTP, for the length of the outage; instead the subjects stay open (the client sends every live subscription again on each connect), the session registers and claims as it did before, and the confirmation is asked for again in the background. An open gives up, closing what it opened, only on a connection closed for good or a session shutting down. The relay''s delivery subject and the agent stream control subject take the same round trip, on the same terms.'
