kind: Fixed
body: 'A subscription is confirmed by the NATS server before the session is registered on it. Opening a subject only wrote SUB into the connection''s out buffer, so a message published between that write and the connection''s next flush was dropped by core NATS while the listener and the daemon already routed to the session: a Legion notice on the controller topic, a card on a session''s agent subject, or a viewer''s first ping could be lost with nothing reported. Every open now ends with the connection''s round trip, and the registration that tells the listener about the subject waits for it. A round trip the connection cannot answer - a disconnect rejects every pending one, and a reconnecting connection answers none - is waited out and asked again rather than failing the open, since the client sends every live subscription again on each connect: an open made during an outage still succeeds, and its registration follows once the server has answered. The relay''s delivery subject and the agent stream control subject take the same round trip, on the same terms.'
