kind: Fixed
body: 'A subscription is confirmed by the NATS server before the session is registered on it. Opening a subject only wrote SUB into the connection''s out buffer, so a message published between that write and the connection''s next flush was dropped by core NATS while the listener and the daemon already routed to the session: a Legion notice on the controller topic, a card on a session''s agent subject, or a viewer''s first ping could be lost with nothing reported. Every open now ends with the connection''s round trip, and the registration that tells the listener about the subject waits for it - for one bound per connection, and no longer. A connection that is reconnecting answers no round trip and is never closed, so waiting for one would hold the session''s registration and its role claim, which go over HTTP, for the length of the outage; instead the connection is marked unanswered, the subjects stay open (the client sends every live subscription again on each connect), the session registers and claims as it did before, and the answer is asked for in the background. A pass therefore waits once however many subjects it opens - the agent subject, the relay, the control subject and every recovered topic - and the mark is cleared whenever that asking ends: on the answer, on a reconnect, on a connection closed for good, when the session shuts down, or after ten minutes of asking, so the next open is confirmed again rather than going on unconfirmed for the life of a connection that never answers. An open gives up, closing what it opened, only on a connection closed for good or a session shutting down. The relay''s delivery subject and the agent stream control subject take the same round trip, on the same terms.'
