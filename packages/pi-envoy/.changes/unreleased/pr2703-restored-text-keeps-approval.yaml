kind: Changed
body: |-
    An exact undo of an edit to an approved document restores its approval, and the plugin says so:
    the `dispatch-writing-specs` skill's "Approval" ends "An exact undo restores approval.", the
    `dispatch request-approval` help says that such a version needs no request, and the line a
    write prints when it superseded an approval says that a later write storing the approved text
    again exactly brings it back. The three Dispatch skills stay under their 2,000-word budget.
