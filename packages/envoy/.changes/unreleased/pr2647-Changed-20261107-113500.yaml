kind: Changed
body: 'Every file-version download now carries `Content-Security-Policy: sandbox; default-src ''none''`, and a stored type a browser draws as a document (`text/html`, `application/xhtml+xml`, `image/svg+xml`, `text/xml`, `application/xml`) is answered `application/octet-stream`. `Content-Disposition: attachment` is advice an engine may decline, and an engine that drew such a file in a tab ran it on Dispatch''s own origin, where its script held the reader''s session. A picture is unaffected: an image is only ever sniffed `image/png`, `image/jpeg`, `image/gif` or `image/webp`, so no type an `<img>` asks for is rewritten.'
time: 2026-11-07T11:35:00.000000000Z
