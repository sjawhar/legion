kind: Fixed
body: 'A machine''s session renews only while the launcher credential its Google identity token minted is still live — not revoked, not past the hour''s expiry that token gave it, and its account still listed for its service — so a copy of a session''s key and enrollment id taken off the box renews nothing once that box''s login has ended; a person''s session and a pod''s renew as before. A machine''s credential is now keyed by the key its DPoP proof presented as well as by the machine, on every path rather than only where the token carries no Compute Engine claims, so a copy of a machine''s identity token presented with another key mints a credential beside the machine''s instead of moving the machine''s onto the copier''s key and letting it end that machine''s sessions. Beside them: Dispatch reads the broker''s device-grant metadata once per wave of callers rather than once per caller behind a lock; an identity-mode helper no longer warns every hour that its one-hour credential lapses soon; `agent-secrets login` keeps its sign-ins under $XDG_STATE_HOME/agent-secrets/signins, which a reboot keeps, rather than under the key directory it empties; and the Google token verifier, the two VM pins and the renewal token the VM login left behind are each named and placed where they are used.'
