kind: Fixed
body: '`envoy-dispatch census` no longer refuses a young lock holder of its own role as one whose transaction age Postgres hides, naming `pg_read_all_stats` as the fix. Postgres serves a transaction''s first read of `pg_stat_activity` until the transaction ends, and the census reads every pending migration in one transaction, so a later migration''s holders were joined to activity read at an earlier one: a session idle then showed no transaction start. The census now clears that copy before each read of lock holders and long transactions, measures ages with `clock_timestamp()`, and names `pg_read_all_stats` only for a holder that Postgres hides from the census''s role: a session of another role, or an autovacuum worker.'
time: 2026-10-28T10:53:56.885693739Z
custom:
    Issue: census-catalog-only-exemption
