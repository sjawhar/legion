kind: Fixed
body: 'A one-word edit of a document at the 1 MiB cap allocates about a third less: the splice cuts the text it keeps out of the text itself rather than encoding the whole textblock to UTF-16 and decoding the cut back, the quote finder allocates its index of the document once, at the size the document measures, rather than growing it, and the two checks of each document-level block a replace or an accepted suggestion changed share one rendering and parse of that block. What an edit stores, and every refusal it answers, are unchanged.'
