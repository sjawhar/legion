kind: Added
body: |-
    The load test samples `pg_stat_activity` every 10 ms (`-xact-interval`, `0` turns it off) and
    reports, per step, how long each Dispatch transaction held a transaction id, its duration, and
    its idle-in-transaction time with and without an id, in a "Transaction-id holds" table and
    `summary.json`'s `xid_holds` (INFRA-636).
