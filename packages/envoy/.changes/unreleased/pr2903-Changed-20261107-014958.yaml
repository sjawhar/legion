kind: Changed
body: 'A Dispatch delivery that wants nothing back says so. An answered ask and an approved artifact carry `expects_reply: false`, and so does a comment mention whose comment joins no ask thread and answers no comment; a `btw` still carries `required`. The listener reads the field as the literal `false` and still reads the old string `none`, and it answers a request that wrote `none` in that same spelling, so a session on an un-rolled plugin build keeps its messages and reads its sends as confirmed. Every envelope the listener puts on the bus carries the one new vocabulary.'
