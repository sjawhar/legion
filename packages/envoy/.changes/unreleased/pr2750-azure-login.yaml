kind: Added
body: >-
  Add the azure-login broker secret kind: store only an Entra tenant and client id,
  then release the broker pod's current projected ServiceAccount token with its
  expiry. Only the secret named by BROKER_AZURE_LOGIN_SECRET may release it, and it
  must be human tier with a person's approval for that name, never an automatic
  grant; unset, Azure releases are disabled. Other secrets retagged to azure-login,
  or the configured secret retagged to agent tier, release no token.
  BROKER_AZURE_TOKEN_FILE selects the token file, read anew on each release;
  unreadable, malformed or expired tokens are refused without logging their bytes.
  agent-secrets secret create and retag accept the kind and list it in their help.
