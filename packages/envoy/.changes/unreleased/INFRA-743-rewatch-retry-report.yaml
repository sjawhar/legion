kind: Fixed
body: |-
  The Envoy listener no longer logs an error for a key-value watch rebuild it repairs by itself: a
  rebuild that fails after a NATS reconnect is run again within seconds, and is a warning until it
  succeeds. One that has not succeeded within a minute is an error, and `/healthz` now reports it
  as a degraded answer naming the KV watch rebuild and how long it has gone without succeeding;
  before, a listener answered `healthy` while its caches followed key-value buckets it no longer
  watched. The answer stays a 200 because the container health check and the readiness probe read
  `/healthz` themselves, so refusing would take out the one listener still serving the caches it
  holds and replace it with one that rebuilds into the same failure with caches that warm up empty;
  on AWS the state pages through an alarm of its own, `<N>-reconnect-hooks-stalled`, on that error.
  Both halves of such an outage - the bus's rebuild and a watcher that stopped without one - now
  report at the same minute.
