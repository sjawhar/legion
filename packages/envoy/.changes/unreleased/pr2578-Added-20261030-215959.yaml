kind: Added
body: 'A machine session''s enrollment can name the agent session it belongs to: `agent-secrets register --session-id <id>`, the launcher saying which session the process it registers is. agent-secrets-helper records it, keeps it in `sessions.json` across a restart, lists it in `sessions` and in the register reply (each as a new last field), and sends it as the enrollment''s `session_id`, so a credential request from that session names it on Dispatch''s approval page (`session.enrollment`) instead of showing no session at all. Before this, every enrollment the helper made sent no session id. The id is the launcher''s statement: nothing inside the session can set or change it, and the helper never reads it from the pinned process''s environment, which that process can rewrite. It is not verified against any session registry, so it says which session the launcher says asked, never that the session was entitled to ask. `register` says so on stderr when the helper recorded another id or none, without stopping the launch. An id over 128 runes or holding whitespace or a control character is refused BAD_REQUEST and registers nothing. A launcher that names none sends no field at all, so an older helper sees the request it always saw, and a `sessions.json` written before the field loads unchanged: those sessions keep working and re-enroll with no id.'
