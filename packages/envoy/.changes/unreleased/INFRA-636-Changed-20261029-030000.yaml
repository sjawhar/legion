kind: Changed
body: |-
    A live update is published as soon as Postgres can prove nothing below it is still open, with
    no fixed wait in the common case. The event horizon's observation that first sees an event
    used to need a second one to prove it, and the live stream's relay, the delivery hub and a
    stream's start waited 10 ms, doubling to 250 ms, before taking it. Now an observation proves
    itself whenever its own snapshot already shows that nothing below the observer's transaction
    id was running - it lists nothing in progress and its xmax is the observer's own id - so on a
    quiet instance the read that sees an event publishes it. An observation its snapshot cannot
    prove is observed again at once while it is the only one unproven, which proves it whenever
    no older transaction id is still running; a gap an older transaction holds is read again on
    that transaction's commit notification, without the relay's 25 ms window, and the 10-250 ms
    re-read remains only as the fallback for a holder that ends without notifying, running only
    while such a gap is open, so an idle process still observes nothing (INFRA-636).
