kind: Fixed
body: |-
    An agent's options edit of a Dispatch decision keeps what a person wrote under an option.
    Each sent option is paired with the list item already holding it, by label, so an option the
    edit does not change keeps its own node — its block id, its marks and the sub-list, second
    paragraph or link under it — and one whose description it changes keeps every block under its
    line. An edit that would drop an option holding more than its plain line is refused whole,
    with that item's markdown quoted and `dispatch doc-edit` named, since the ask row shows an
    option's label and description alone. A decision whose question a person emptied is repaired
    by an ask edit carrying a question, which keeps every option list in place; an edit of it
    carrying no question is refused with that step named, where before every edit of it was
    refused with a sentence that named none. A refusal that names blocks to delete names a nested
    decision the content rule leaves nothing of by its own block id, where it used to claim no
    document edit works, and says that an open ask on a decision it names is answered or resolved
    before the delete.
