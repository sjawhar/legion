kind: Changed
body: |-
    `envoy-listener` runs as an active pod and standbys for any machine id: any number of
    listeners may run with one `ENVOY_MACHINE_ID`, and only the holder of the machine's delivery
    lease, the key `lease.listener-<machine id>` in the new KV bucket `envoy_listener` (created at
    `ENVOY_NATS_REPLICAS`, 10 minute `MaxAge`), receives its durable consumer. The holder renews the
    lease every second by compare-and-set and subscribes to the durable's deliver subject with a core
    subscription of its own, never `nats.Bind`, handling a message only while it holds the lease; a
    standby polls every 500 ms and takes an unreleased lease once it has not changed for 5 s, a
    released one at once. Every pod serves `/v1`, the webhooks and the role lane; the interest and
    role-claim reapers, the interest marker collector and the CI summary loop run on the holder
    alone. A standby waits for as long as the active pod runs and never exits for it. A graceful
    stop now ends receiving first and then stops HTTP: the holder-only loops stop, the handler
    takes no more messages, the message in hand gets 3 s before its prompt is cancelled, every
    message not handled is NAKed with a 2 s delay in stream order, and the lease is marked released
    and `unsettled`, so a standby takes it at its next poll and settles (below), delivering about 2
    to 3 s after the stop and keeping each session's order. The stopping pod keeps its subscription
    until the lease record says the next holder is `receiving` (3 s at most, 1 s when no other pod
    takes the lease), handing back what still reaches it, since nats-server loses a message whose
    first delivery is still queued when a push consumer's last subscriber goes. A pod that takes
    the lease over a holder that was killed or lost its node subscribes at once and holds what it
    receives until every message the durable has outstanding is in its hands (its `NumAckPending`
    no more than what it holds, read every 250 ms, capped at one ack wait and a second, 7 s, after
    it subscribed), then delivers it in stream order, so a session's events stay in order there
    too: messages arrive about 5 to 6 s after the dead holder's last renewal when nothing was
    outstanding and about 12 to 13 s after it otherwise; a NAK-delayed retry stays outstanding,
    holds the hold to its cap and arrives after it. After a graceful stop the cap is the 2 s
    hand-back delay and a second, 3 s. The lease record carries `stale_binding` (its holder
    subscribed beside a lingering push binding, or stopped during a hold that waits out an ack
    wait), `unsettled` (its term's hold had not ended, kept by a release, or its holder handed
    messages back on a graceful stop) and `receiving` (its holder's subscription is up), and a pod
    that takes a released record carrying either of the first two settles the same way, capped at
    7 s when it carries `stale_binding` and at 3 s when it carries `unsettled` alone. A holder that
    takes an absent record, or a released one with neither flag, and finds the durable push-bound
    by a listener build from before the lease waits for that binding to end and subscribes within
    a second of it; past 135 s it logs `lease holder cannot deliver from the durable` at ERROR,
    again every 5 minutes, and never exits for it.
    `packages/envoy/cmd/listener/README.md` describes the run model.
