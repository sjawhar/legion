kind: Fixed
body: |-
    A Dispatch document version whose stored text is byte for byte the text of the version the
    document's newest review approved keeps that approval: an accidental edit undone exactly, or a
    version a route wrote over a document that changed nothing. The version write records an
    `approved` review at the new version in the approver's name, with the reason `Carried forward
    from the approval of version <N>: this version's text is that version's, unchanged.`, appends
    `artifact.approved` before the version's own `artifact.version`, and answers an open approval
    request `Approve`. The write supersedes no approval, so its advice has no
    `superseded_approval`. Before, every later version left the approval stale, and the person had
    to approve the same text again. A version whose decision blocks changed is judged by the answer
    carry alone, as before.
