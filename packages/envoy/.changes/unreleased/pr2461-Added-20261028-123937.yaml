kind: Added
body: |-
    A page's document socket is writable by the numbers of every live server process, not by an
    exact match of its schema version with the answering process's. Each process records, in four new
    `server_processes` columns (migration `0138_server_processes_schema`, constant defaults, nothing
    rewritten), the schema version it reads and the highest `since` it creates, its embedder's
    identity and whether it stores files in a bucket. A page presenting `schema_version` V and
    `schema_creatable` R is writable on an open issue when R is at most every live process's version
    and V is at least every live process's creatable version and the highest `since` the document
    holds; a page without `schema_creatable` counts V as R, and a process before this release is left
    out. The dashboard uses the manifest it was built with instead of fetching it and presents both
    numbers. Every 15 s each process closes with `1012` each writable document socket the fleet no
    longer admits, and the provider reconnects.
