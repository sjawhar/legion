kind: Added
body: |-
    A page's document socket is writable by the numbers of every live server process, not by an
    exact match of its schema version with the answering process's. Each process records, in four new
    `server_processes` columns (migration `0151_server_processes_schema`, constant defaults, nothing
    rewritten), the schema version it reads and the highest `since` it creates, its embedder's
    identity and whether it stores files in a bucket. A page presenting `schema_version` V and
    `schema_creatable` R is writable on an open issue when R is at most every live process's version
    and at most the highest creatable version among the live processes, and V is at least every live
    process's creatable version and the highest `since` the document holds. The bound on the highest
    creatable version makes a page of a newer build read-only after a rollback. A page without
    `schema_creatable` counts its R as 1, and a process before this release is left out. The
    dashboard uses the manifest it was built with instead of fetching it and presents both
    numbers. Each socket's token is answered from that socket's own admission, through ygo's
    `OnTokenAuthContext` (sjawhar/ygo v1.54.1-sami.3, which Dispatch already pins), so two sockets of
    one room that present the same schema version are told apart. Every 15 s each process closes
    with `4412` (`DOC_ADMISSION_REVOKED`) each writable document socket the fleet no longer admits,
    once the message in flight on it is out, and the provider reconnects.
