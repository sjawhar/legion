kind: Changed
body: Dispatch's database does no more work than each answer needs. An issue read and an ask read count backlinks through the arms of the reference graph that can point at that kind of node, each through its own index, instead of planning a twenty-three-part view on every call. The issue list and the project list resolve each page with set-based joins rather than a lookup and two parent walks per row, and the issue list cuts its page and counts its total in the database. Search, the related-item check and the related-terms probe find a document through a table that holds its latest version's vector under a GIN index, rather than reading every version. The related-terms refresh applies the items that changed, from a queue triggers fill, instead of rebuilding every project's word counts every ten minutes. The anchored-comment reads, an issue's asks and an issue's root messages use indexes, two of which are new, and the unused partial index on open asks by artifact is dropped. The reference closure probes a block's document through its index, the agents page reads each session's last event through the session index, and an issue's children are counted from the walk that already read them. Every result is unchanged.
