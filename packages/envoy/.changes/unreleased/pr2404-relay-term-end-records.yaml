kind: Fixed
body: |-
    A message a relay had at a session's port when its receive term ended is no longer pushed a
    second time by the pod that takes the lease over. The term's end cancelled the push, so
    nothing was recorded for it, and the successor took the former holder's attempt over at once:
    the port answered the first push 204 a moment later and the session was prompted twice. A
    relay stopped with a push in hand now lets that push, and the delivery record of it, finish
    within 750 ms (`relaySettleGrace`), writing the pair delivered or giving its attempt up when
    the port refused it, so the successor reads an answer rather than a record nobody will settle.
    And a former holder that released the lease is alive: the ledger defers its unresolved
    attempt until it has had 1 s to settle (`leaseFormerSettle`), where only one taken over by
    force -- killed, its node lost, its record left to expire -- is taken over at once.
    A push the grace cuts with the port's answer still out is marked in doubt on the record
    (`in_doubt`, logged as `session relay left a push in doubt`), since no pod can know whether
    the session took it: the successor pushes that one message again as soon as it reads the
    mark. So a repeat with the same event id is possible after a hard take-over and after a push
    whose answer had not come back when its pod lost the receive term, and nowhere else. A hard
    take-over is bounded as before at 15 s, and a message in flight at a receive-lost cut now
    reaches its session about 7 s after the cut, against 9.9 s before.
