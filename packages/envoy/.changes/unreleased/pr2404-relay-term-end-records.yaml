kind: Fixed
body: |-
    A message a session's relay had no `done` for when its receive term ended is no longer sent a
    second time by the pod that takes the lease over. The term's end cancelled the relay, so the
    frame was dropped unacknowledged and the successor, restarting the session's consumer at its
    ack floor, was given the message again: the session took it twice. A relay stopped with a
    frame in hand now goes on hearing the session for 750 ms (`relaySettleGrace`) and
    acknowledges the message on its `done`, so the successor's restart passes over it; and the
    pod taking a released holder's lease over waits `relayFormerSettle` (the grace and a 250 ms
    margin) before it restarts a session's consumer, so the grace always ends first. A holder
    taken over by force -- killed, its node lost, its record left to expire -- settles nothing
    and is not waited for.
    A frame the grace ends without a `done` is in doubt, its session's `received` notwithstanding:
    `received` says the client decoded the frame, not that its host wrote the message, so only
    `done` says the session took it. The stopping pod logs `session relay left a frame in doubt:
    its settle bound ended with the session's reply still out` and the successor sends that one
    message again; the session's client answers that copy and writes it once, since it joins a
    copy of a frame it still holds and drops one it has already written. Every restart of a
    session's consumer sends again every frame above its ack floor, so a repeat with the same
    event id is possible wherever a restart happens: a term's end, a lost session-consumer link,
    a hard take-over, a pause that probes a silent session again, a retry, a new epoch, and a
    session that leaves this pod's relay set and rejoins it. A frame the session answered `done`
    out of order above one it still holds is sent again too, since the floor cannot move past
    the held frame.
    The grace is sized on a frame's round trip, measured on the test host over
    200 frames: p50 2.44 ms, p99 11.8 ms, slowest 37.2 ms on a quiet box, 111 ms under load.
    A hard take-over is bounded as before at 15 s, and a message published in the gap a
    receive-lost cut leaves between one pod's term and the next reaches its session 1.257 s after
    the cut at worst, measured over 20 runs.
