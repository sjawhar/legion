kind: Fixed
body: |-
    A blank line inside a typed block in a list item now reads as the browser editor's parser reads it, wherever it stands in the block: after its opening fence, between two of its blocks, or above its closing fence. That parser counts such a line toward the item's spread, and the reader read only the lines ending the block, refusing them, so a document holding one elsewhere was stored with an item drawn spread in the editor and tight in the tree. The lines ending such a block are read as that parser reads them too: one of them is enough where a quote, a list or a footnote definition opens on the line after it; an item inside an unclosed typed block in a quote ends where any other item does; a quoted line holding the markers and a tab alone is the block's own only where the innermost marker's column leaves no column of that tab; and, outside a quote, a whitespace-only line wider than the block's own indentation is the block's content where a paragraph after it continues that content lazily. One shape is refused by name instead of read: a blank line inside a typed block a footnote definition in a list item holds.
    The renderer writes a tight item's typed block with the item's tight lines, as it already writes a footnote definition's, so a rendering no longer spaces an item its tree reads tight, and a document whose typed block holds a fenced code block and a paragraph side by side is stored where it was refused. Where writing the next block on the line after the one before it would make the two one block, the renderer keeps them apart with the one blank line that line needs: a paragraph a lazy line continues, a list that interrupts no paragraph, an empty item's marker read as a setext underline, a quote after a quote the one marker opens, and a table after anything but a plain paragraph, whose rows a container before it takes as its own text. A spread list item whose only written block is a typed block writes the line that spreads it above that block's closing fence, so such a document is stored rather than refused.
