kind: Fixed
body: |-
  A serving-port session gets one push per upstream event, and loses none stored before its first
  consumer. The relay of a session's consumer judges a message on a topic the session follows by
  the durable path's own rules (one predicate both apply): a copy under a dedupe key the session
  already took or is already being sent is acked unpushed, and the key is recorded once the port
  answers 204, so one GitHub comment published on a pull request's mention topic and the
  repository's reaches the port once rather than once per topic. A session consumer's start
  sequence is recorded on the session's entry, and the durable path skips only the stored messages
  at or after it: a message stored below that start -- a push NAKed back to the durable, or one
  deferred as unplaceable, before the session's first consumer was created -- is in no consumer, so
  the durable still pushes it to the port instead of acknowledging it as delivered (INFRA-594).
