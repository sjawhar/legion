kind: Changed
body: |-
    The live paths of a Dispatch process with no open live socket and no open Delivery view read
    nothing from the event log and hold no `LISTEN` connection for it: the event stream relay and the
    delivery hub run only while something subscribes. While anything does, one read per commit serves
    every events subscription and every Delivery view, and each event's frame is encoded once.
