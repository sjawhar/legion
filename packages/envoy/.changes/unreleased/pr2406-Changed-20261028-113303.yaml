kind: Changed
body: |-
    A Dispatch process with no open live socket and no open Delivery view reads nothing from the
    event log and holds no `LISTEN` connection for it. While anything subscribes, one read per commit
    serves every events subscription and every Delivery view, and each event's frame is encoded once.
