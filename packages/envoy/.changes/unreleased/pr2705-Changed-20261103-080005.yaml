kind: Changed
body: |-
    The broker now refuses `BROKER_LEASE_SECONDS` that is too short for `BROKER_SWEEP_SECONDS` by walking each of its two renewers' own retry schedules, counting one renewal that the outage holds to its 30-second client timeout, in place of the old rule that counted only two thirds of a lease. The refusal names the shortest lease that survives both renewers at that sweep: 91 s at a one-second and at the default five-second sweep, 97 s at ten seconds, 203 s at thirty and 351 s at sixty. The default 900-second lease passes at every sweep.

    This refuses pairs that boot today. The old rule refused only `2 × lease ≤ 9 × sweep`, so every lease between four and a half times the sweep and the new floor starts a broker now and will not after this change: a 60-second lease at the default five-second sweep, for example, or anything from 271 s to 350 s at a sixty-second sweep. Each new pod of the roll exits at boot instead of serving. Read the floor for your sweep above, raise `BROKER_LEASE_SECONDS` to at least that, and roll that first.
