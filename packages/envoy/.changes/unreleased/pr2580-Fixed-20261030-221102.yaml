kind: Fixed
body: 'Dispatch''s `ENVOY_NATS_REPLICAS` and `ENVOY_STREAM_MAX_BYTES` descriptions now state the real bound between the warning `envoy nats reconnect hook failed; it is retried` and the error `envoy nats reconnect hooks have not succeeded`: the minute runs from the connection event whose stream reconcile has not succeeded, not from the first retry, and `stall_ms` on both lines is how long that reconcile has been due.'
