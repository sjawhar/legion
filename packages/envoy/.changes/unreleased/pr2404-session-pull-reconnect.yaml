kind: Fixed
body: |-
    A session consumer's relay no longer stalls for 30 s after its connection reconnects. The
    server drops a pull request with the connection it was sent on, and nothing sent another
    until the pull had heard nothing for twice its idle heartbeat, so a 2 s outage cost every
    message of that machine's relayed sessions about 30 s. Every pull in progress now ends at the
    connection event that drops its request -- the reconnect, the close or the replacement
    connection the session-consumer client reports (`ErrSessionPullReconnected`,
    `bus.Client.ConnectionChanged`), and a stopped pull waits for the server to confirm its
    unsubscribe, so no message goes to the dropped request -- and
    its relay restarts at the session's ack floor at once, waiting out no retry backoff: a pull
    request lost with its connection is no failure of the session's, so the wait a run's earlier
    failures had raised, up to 30 s, is not spent, and it starts again from one second.
time: 2026-11-02T02:30:00.000000000Z
