kind: Fixed
body: |-
  An upload that moves an open anchor's quote where that anchor cannot stand is answered
  `400 INVALID_MARKDOWN`, naming the anchor, its quote and where the text landed, so the uploader
  can move the text or resolve the anchor first. That is an ask's quote moved into a code block, or
  the quote of any open ask, comment or suggestion moved into the front matter. Before, it was
  answered `500 DOC_SCHEMA` and logged as the server's error. A comment's or suggestion's quote in a
  code block is still re-anchored there, as before.
