kind: Changed
body: 'No Envoy session receives from a plain NATS subscription: the listener refuses by name a registration it cannot give a session consumer (503 consumer_error or no_grant, 409 not_requested or invalid_session_id) and writes nothing for it, the core delivery answer and POST /v1/replay are gone, every role forward is stored-only (a 200 means the stream stored it for the holder''s consumer, and no receipt is waited for), notifications.team.> and its exception lane are stored while every other uncaptured notifications. topic is refused by name at publish and left out of an interest registration with a warning naming it, GET /v1/sessions and /v1/registry/<id> report each session''s delivery, and a controller session registers its own project''s notice lane and receives it from its consumer. Listeners deploy first: a plugin of this release throws on a listener that answers a registration without a delivery object, so every listener must carry this build and a NATS user holding the session-consumer calls before the plugins reach sessions.'
