kind: Added
body: |-
    `github.com/sjawhar/envoy/sessiontiming` is the one public door onto the generated Envoy
    session-registration timings — `Heartbeat`, `RecordLifetime`, `ClaimStale`, `CallTimeout`,
    `CallRetryDelay` and `CallAttempts` — for a caller in another Go module, which Go's internal
    rule bars from `internal/contracts`. The listener's own uses read `internal/contracts`
    directly: `OpenSessionRegistry`'s default record lifetime, `session.ClaimStaleAfter` and the
    window `roles.NewBuckets` falls back to each read the declaration rather than a literal of
    their own. No value changed.
