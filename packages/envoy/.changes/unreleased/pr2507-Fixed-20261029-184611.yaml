kind: Fixed
body: 'A Dispatch document and a comment of the same text now read alike where they did not: a table forms only where its header row holds as many cells as its delimiter row, with no delimiter row on a lazy line and no row four columns or more past its container, as the browser editor''s parser reads one, and a table that parser starts after a failed header and delimiter pair keeps that pair as the paragraph before it; a line holding only an HTML tag that continues a quote, list item or footnote definition without its prefix keeps that container and its text in every browser view, and the renderer writes such a line of a code span behind its containers'' prefix; an empty list item in a quote that opened a line earlier opens the list the browser opens; a whitespace-only line narrower than its fence''s indentation is an empty line of code; a list in a quote in a typed block is spread as the browser spreads it; a NUL reads as U+FFFD, as CommonMark requires, so the live tree and the stored bytes agree, and a block''s source offset still counts the bytes its author wrote; and a line a tab makes block HTML to the browser and paragraph text to goldmark is refused by name instead of being stored and read back otherwise, while a line both read alike - one whole tag and nothing else, a block of kind 7, before a blank line or its container''s end - is stored as before, and a textblock''s inline markdown, which opens no block, keeps such a line. The blank lines that end a typed block in a list item, above its closing fence or with the block itself, which the browser reads as blank lines of the item where this reader leaves it tight, are refused by name as well; a fenced code block no fence closed takes such lines as its own, and in a quote so does a list the block ends with, and those documents are stored and read as the browser reads them.'
