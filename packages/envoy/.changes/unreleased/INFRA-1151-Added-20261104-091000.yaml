kind: Added
body: Agent interpretation nodes point to decision or ask blocks in the same document. Named interpretation routes use the existing document edit/version path and read authors from server audit events. The Decisions tab lists interpretations beneath their decision in document order, labels recorded session authors, and uses Interpretation for handmade blocks with no recorded author. Interpretation-only additions and edits preserve spec approval; the write reports superseded-approval advice for other live changes and whether the live document kept its insert. Interpretation blocks use schema v5, so a v4 editor can read but cannot write them.
