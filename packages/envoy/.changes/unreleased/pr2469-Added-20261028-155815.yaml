kind: Added
body: 'GET /api/v1/issues/{key}/references takes `versions=latest`: each member''s document then carries only its latest version, under an ETag of its own (If-None-Match still answers 304). Without the parameter, or with `versions=all`, the answer, its headers and its ETag are unchanged; any other value is `400 INVALID_QUERY`. The answer is one statement that joins each document to its highest-numbered version.'
