kind: Changed
body: |-
  Rebuild, settlement resumption and the conditional-edit queue hold across processes. A rebuild
  answers `409 DOCUMENT_LIVE` when this process holds a room of the document, or when another
  member that answers within 500 ms holds one. Of two rebuilds of one document at once, one
  answers `409 DOCUMENT_LIVE`. The settlement resumption runs once per minute across the
  processes, under the lease `settlement-resumption`, not once per process. The cap of 32 queued
  conditional edits of one document counts the queue of every member
  (`doc_conditional_edit_queue`, migration `0152`), so the 33rd answers `429 EDIT_QUEUE_FULL`
  whichever process takes it. Each process first queues a document's conditional edits in memory
  and admits them one at a time, and the admitted edits take turns. On each process, at most
  three of a document's conditional edits hold a database connection at once: the edit being
  admitted, for its short admission transaction, the edit whose turn it is, for its write
  transaction, and the edit that has just left, which writes this process's count after it hands
  the turn on. An edit that waits for its admission, or for its turn, holds none. An agent's
  write to a document that no room holds on its process loads no room there. The write's
  settlement loads one a settle delay later. One case remains: a room that retires between the
  write's check for a room and its publish is loaded again by the publish, from a store that
  holds the write.
