kind: Added
body: 'An issue''s decision records: `GET /api/v1/issues/{key}/decisions` reads each `##` section of its `decisions.md` over the block graph, with the spec blocks each decision shaped and which of them are out of date (the decision''s own text changed after it linked that block, and the block has not changed since); `POST /api/v1/artifacts/{id}/blocks/{block_id}/keep` `{text_sha256}` records a person''s agreement with the text they read, refusing a decision that changed since (`409 DECISION_CHANGED`); and `GET` and `PUT /api/v1/me/documents/{id}/read` keep each person''s last read version of a document.'
