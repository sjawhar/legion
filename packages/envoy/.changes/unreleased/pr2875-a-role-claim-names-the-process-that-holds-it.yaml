kind: Fixed
body: |-
  A role claim now names the process that holds it and the moment that process last answered for
  it (`client_instance_id` and `renewed_at`, both optional, so a claim an earlier build wrote is
  read at its `claimed_at` and is never unreadable), so a second process that resumed a live
  session's id can no longer take, release or outlast the role that session holds.

  `POST /v1/roles/set` takes `client_instance_id`, and where the role is already held under the
  claimant's own session id it decides on the standing claim rather than on the session record:
  granted where the claim names that very process, granted where nobody renewed the claim inside
  the listener's live window and the role claim view can answer, and otherwise refused `409`
  naming the holder. That renewal arm is read only while the view answers, because nothing but a
  registration renews a claim and a registration renews through that very view: while a listener
  restart leaves the view refilling, the arm answers the bus-unavailable `503` with
  `Retry-After: 1` naming it and claims nothing, so a refill longer than the live window hands
  no live holder's role to a second process; a claim from the process the standing claim names
  rests on no renewal and is granted through the refill. A hard claim is
  unchanged, and the predecessor rule is unchanged, still reading the claimant's stored instance
  where the request states none. `POST /v1/interests/subscribe` renews every claim the
  registering session holds that names the registering process, and the first such registration
  adopts a claim that names none; a renewal that cannot run never fails the registration, and the
  cost is one role-bucket write per heartbeat per role held. `POST /v1/interests/unsubscribe`
  takes `client_instance_id` and frees only the claims naming that process, a release naming none
  freeing none, while `DELETE /v1/interests/<session_id>` keeps its force and is the one caller
  that forces. The role claim reaper frees no claim renewed inside the live window, whatever the
  holder's session record says, and reports that outcome as its own. `GET /v1/roles/<role>`
  answers the holder's `client_instance_id` on the 200 and on a lapsed holder's 404.

  A soft claim is written against the very claim record the route decided on, so two processes of
  one session id claiming one unheld role in the same moment are no longer both granted it: the
  route decided on one read of that record while the write weighed a second read of its own, and
  each loser of that write read the winning claim as its own session's and answered 200. A record
  replaced under such a claim is read again, the whole decision is made again on what stands, and
  the claim is tried once more; a second mismatch is the same `409` naming the role, its holder and
  `claim_revision` that a stated `if_claim_revision` gets. A claim that states its own
  `if_claim_revision` keeps that meaning and is never decided again, and a hard claim that states
  none carries no precondition at all, last-claim-wins.
