kind: Added
body: |
  The secret kind `google-service-account` mints a Google access token for the one service account
  its stored value names, `{"service_account": "<id>@<project>.iam.gserviceaccount.com"}`. The
  broker impersonates that account with its own Google credential through the IAM Service Account
  Credentials API, at the `cloud-platform` scope and a lifetime of one hour, and answers the bare
  access token as the `google-login` kind does, so the existing gcloud wrappers read it unchanged;
  no service-account key is stored anywhere. Such a secret names exactly one person in its
  `requesters`, and that person must be its owner, so a secret owned by `shared` or by a service
  can carry no such kind. The broker's own Google principal needs
  `roles/iam.serviceAccountTokenCreator` on each named account and outbound HTTPS to
  `iamcredentials.googleapis.com`. The kind takes no new broker setting.
