kind: Removed
body: |-
    The unplaceable agent delivery's `push_failed` reason and its
    `envoy_messages_delivered_total{delivery_status="unplaceable_push_failed"}` label are gone, and
    with them the one-deferral bound that reason carried: a push to a serving-port session is now
    its worker's, which repeats it until the port answers 204, and a failed push on the live and
    core lanes comes back through the interest path, which reports it `delivery_failed`. What
    little still reaches the unplaceable branch with a failed push is counted and logged under
    `no_push_target` and `unplaceable_no_push_target`, as an answer carrying no reason already was.
time: 2026-11-01T23:40:00.000000000Z
