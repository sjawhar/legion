kind: Fixed
body: 'A document edit whose quote opens with a list marker, such as `5. A fresh reviewer checks` or `- bullet two`, and matches no text as written, now selects the list item of that kind whose text starts with the rest, as a quote''s `# ` selects a heading; it matched nothing unless it also carried bold or code. The item''s number is not matched, a task box after the marker (`- [ ] deploy`) selects only a task item in that state, and a `with` that opens with the same kind of marker replaces the item''s text under its own number. A miss says the marker is no text the item holds and quotes the text without it. An out-of-range occurrence that matched one place now says "1 place".'
