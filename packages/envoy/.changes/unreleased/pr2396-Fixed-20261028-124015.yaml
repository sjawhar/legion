kind: Fixed
body: A leased periodic loop (webhook redelivery, suggestion outcomes, document compaction, reference excerpts, the block index, edit notices, the issue-ask repair, the architecture import and the delivery reconcile) counts each tick in the period it was due in, so a lone process no longer loses a period when a tick's lease or its period query is late. The webhook redelivery, suggestion-outcome, compaction and issue-ask repair loops now wait their interval after each pass ends, as the others already did, rather than ticking on a fixed schedule.
