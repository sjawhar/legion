kind: Added
body: 'A thread stays in the Inbox, read or not, until it is dismissed: `POST /api/v1/me/inbox/dismiss` takes the row ids `reply:<thread id>` and `agent:<message id>`, or the list''s filters with a `dismiss_through`, and `restore` to put them back, answering how many threads it changed; `GET /api/v1/me/replies` takes `state=inbox` (the undismissed rows, read or not) and `state=dismissed` (newest dismissal first, 200 at a time from a cursor) in place of `state=all`. A later message by somebody else brings a dismissed thread back unread, and the person''s own reply does not.'
