kind: Added
body: '`GET /v1/roles/<role>` reports `claim_revision`, the `envoy_roles` revision of the role''s claim record as the lookup leaves it, on the 200 and the 404 alike: the revision the live holder''s claim was read at, the revision of a lapsed claim the lookup kept, and 0 for a role no record claims. `POST /v1/roles/set` takes it back as the optional `if_claim_revision` and lands the claim only while the bucket still holds that revision, where 0 names a role with no claim record at all. Any other revision, a record where the claim names none, or none where it names one is answered `409 {error, role, holder, claim_revision}` carrying the revision the bucket does hold, and nothing is written, the claimant''s interest record included. A claim with no `if_claim_revision` is weighed by the soft and last-claim-wins rules exactly as before. It is how a scheduler makes a claim conditional on the lookup it decided from.'
