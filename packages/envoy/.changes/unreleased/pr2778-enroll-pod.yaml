kind: Added
body: |-
  `agent-secrets enroll --pod` enrols a Kubernetes pod with the secrets broker, with no launcher and no helper: the pod proves who it is with the projected service-account token its own kubelet mounts. It reads `/var/run/legion/agent-secrets-token/token` unless `--pod-token-file` names another file, takes the pod's UID from that token's own claim as the enrollment's runtime id, and writes `key.pem` and `enrollment` into `AGENT_SECRETS_KEY_DIR` (`--out` names another directory). It prints the enrollment id, alone, on stdout.
  `--service` names the broker-side service the pod's ServiceAccount is bound to. The account must be one the broker's service logins name, and the token must be the pod's own projection: a token `kubectl create token` mints is bound to no pod and enrols nothing, which is refused before anything is asked of the broker.
  Re-running it on one directory keeps that key, gets that key's live enrollment back and renews its lease; two runs on one directory take turns on `<out>/enroll.lock`. On a platform with no flock it is a usage error.
  A pod keeps no credential helper, so the run names the renewer it needs on stderr: `AGENT_SECRETS_KEY_DIR=<dir> agent-secrets renew --pod-token-file <file>`, both words shell-quoted. The key directory is in that command because `renew` finds its identity through `AGENT_SECRETS_KEY_DIR`, or else the `$XDG_RUNTIME_DIR` default, and never through `--out`.
  An enrolment the broker refuses keeps the key, because a new key while the old enrollment is live is refused `ALREADY_ENROLLED`, and records what the broker said in `<out>/enrollment.error`. Every later `agent-secrets` call in that directory reads that out, so a refused enrolment says what the broker said rather than naming a missing file; a run that succeeds removes it.
  `--pod` and `--helper` are mutually exclusive: each is a whole, different way of proving the caller may enrol. `--pod` also refuses `--runtime-id`, `--thumbprint` and `--session-id` by name, which are `--helper`'s: a pod's runtime id is the pod UID of the token it presents, its thumbprint is the key this writes, and it registers no agent session.
