kind: Added
body: 'An API answer is gzipped for a caller whose `Accept-Encoding` says it takes gzip, and is the bytes it was for every other caller: a request that sends no header, names other encodings, or refuses gzip with `q=0` is answered exactly as before. A compressed answer carries `Content-Encoding: gzip` and no `Content-Length`, and every answer now says `Vary: Accept-Encoding` beside `Vary: Dispatch-Trees`, so no cache between a browser and Dispatch hands one caller the other''s answer. Only Dispatch''s own JSON is compressed, and only from 1 KiB up: a download is the stored bytes under the type they were stored as, and a refusal or a small read costs less on the wire than a compressor costs in time. The two websockets are untouched, their upgrades hijacking the connection through this layer as they did. Compression runs at gzip''s fastest level rather than its default: one comment list of 103,113 bytes goes out as 7,698, which takes about 0.28 ms, where the default level would spend about 0.86 ms to send 6,882 (BenchmarkCompressingAnAnswer, a 2.20 GHz Xeon).'
