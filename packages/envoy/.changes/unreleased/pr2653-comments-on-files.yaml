kind: Added
body: |-
  A person or an agent can comment on an uploaded file that is not a Markdown document, such as a picture, a PDF or a CSV file, and on a box drawn over part of a picture. A comment's anchor takes a file form: `kind: "file"`, the file, the version the comment is about (the file's latest unless the request names one), and on a picture a `box` of four fractions of its width and height (`left`, `top`, `width`, `height`). Dispatch refuses a box that leaves the picture or has no size, a box on a file that is not a picture (`NOT_PICTURE`), a version the file does not have, and a file anchor on a Markdown document, an ask or a suggestion. The file's page shows a Comment box under the file, the open boxes of the version shown numbered over the picture, and the threads in the margin and on the issue's Conversation tab. The agent that uploaded a file now receives a person's new comment on it, and replies in its threads, as the writer of a document does. No migration: the anchor column already holds the new fields.
