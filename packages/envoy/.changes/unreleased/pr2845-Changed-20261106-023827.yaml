kind: Changed
body: 'The pre-apply census no longer refuses a migration for the size of a table it names when every statement of that migration is a catalog-only drop: `drop trigger` and `drop function` with RESTRICT now join `create function`, `create trigger` and `set` as kinds whose lock window does not grow with the table. A drop with `cascade`, and a drop of anything else, is still size-dependent, and an enabled DDL event trigger on `sql_drop` or tagged `DROP FUNCTION` or `DROP TRIGGER` still takes the exemption away.'
time: 2026-11-06T02:38:27.608962187Z
