kind: Changed
body: |-
    `POST /api/v1/issues/{key}/comments` and `POST /api/v1/artifacts/{id}/comments` with `mentions` answer
    once the comment commits, with every mention's delivery attempt `pending`; the sends run after
    the response, per recipient in the order the comments were accepted, and settle each attempt and
    write its `comment.delivery` event then. Each listener lookup the comment makes is bounded at
    250 ms, so a listener that does not answer delays the comment by one 250 ms timeout per 8
    mentions. Every process resends attempts left pending a minute or more by a process that stopped
    or was killed, at start and every 30 s. A session the comment's route or an author route reaches
    and that a mention names hears the comment once, from the mention; when that mention's send
    fails, the route or author copy skipped for it is published to it then. When the send was in
    flight at a kill, the outbox records the copy it skipped (migration `0138`,
    `comment_fallback_copies`) and publishes it to that one destination only once the resend fails;
    the comment's own event is never published again, so a route, claimant or follower that changed
    since gets nothing of it. A client that read a mention's delivery state from the create response
    reads it from the comment, or from its `comment.delivery` event, afterwards.
