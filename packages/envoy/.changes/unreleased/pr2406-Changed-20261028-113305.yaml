kind: Changed
body: |-
    `POST /api/v1/issues/{key}/comments` and `POST /api/v1/artifacts/{id}/comments` with `mentions` answer
    once the comment commits, with every mention's delivery attempt `pending`; the sends run after
    the response, per recipient in the order the comments were accepted, and settle each attempt and
    write its `comment.delivery` event then. A recipient keeps that order however long its first
    send takes: each attempt is claimed from the moment its comment commits, and the process holds
    that claim while the send waits its turn, so nothing else sends it past the comments before it.
    Each listener lookup the comment makes is bounded at 250 ms, so a listener that does not answer
    delays the comment by one 250 ms timeout per 8 mentions. An attempt a process that stopped or
    was killed left behind - its claim given back when that process refused the send, or lapsed a
    minute after it last wrote that claim - is resent by the delivery sweep, which runs once a
    minute in one process. A session the comment's route or an author route reaches and that a
    mention names hears the comment once, from the mention; when that mention's send fails, the
    route or author copy skipped for it is published to it then. The comment's own event waits on a
    mention for at most a minute after the comment committed, however long the recipient's lane is
    held and whether or not a Retry overtook the attempt: past that the outbox records the copy it
    skipped (migration `0161`,
    `comment_fallback_copies`), publishes the event to every other destination, and publishes that
    copy to its one destination only if every send of that mention - the sweep's resend, the
    queued send the lane comes to, a Retry that overtook it - failed; a copy whose publish fails is
    retried on the outbox's event backoff, never given up, and logged at Error when it reaches the
    ten attempts at which the outbox reports an event dead-lettered. A Retry of a mention from its
    card while its first attempt is still waiting on a lane opens an attempt of its own, and the
    recipient is handed one copy: the Retry that is delivered takes the mention over, and the
    attempt it overtook is settled `failed`, "not sent: a later attempt of this mention superseded
    it", by whichever of the two comes second, or by the delivery sweep when neither did; a Retry
    recorded `failed` may still have reached the session - a receipt timeout says so itself - so
    the attempt it overtook stands, and the lane sends it when it reaches it, or the delivery
    sweep does once that lane's claim has lapsed. Every send of one mention now goes under one
    idempotency key, `<comment>:<target>:<the mention's mode>` - the mode the comment recorded on
    the mention, where it was the mode of the attempt being sent: whichever copy reaches the
    session second repeats the key of the one that landed, and its host drops it, so that resend
    cannot deliver the comment twice. A mention's first attempt is made in that mode, so an
    automatic send, the delivery sweep's resend and a Retry all go under the one key, and a
    mention delivered before a deploy is dropped as a repeat after it. The same key is why a
    Retry in ANY mode of a mention whose earlier attempt reached the session is recorded
    `duplicate` and delivers nothing, where a mode change used to be a second delivery.
    The comment's own event is never published again, so a route, claimant or follower that
    changed since gets nothing of it.
    A client that read a mention's delivery state from the create response reads it from the
    comment, or from its `comment.delivery` event, afterwards.
