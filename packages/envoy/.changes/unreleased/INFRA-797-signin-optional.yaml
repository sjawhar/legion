kind: Changed
body: |-
    `envoy-dispatch` boots with no `DISPATCH_SIGNIN_*` setting at all: it runs no browser sign-in,
    nobody signs in, and it serves its agent-token API as it always does, answering
    `GET /auth/start` `503 SIGNIN_UNCONFIGURED`. A deployment that sets some of the sign-in
    settings and not the rest still refuses the boot, naming every setting it misses, so a
    production deployment that loses one of them is refused as before.
time: 2026-10-30T12:00:00.000000000Z
custom:
    Issue: INFRA-797
