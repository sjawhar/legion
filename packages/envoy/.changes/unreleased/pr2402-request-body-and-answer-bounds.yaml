kind: Changed
body: |-
  A request's body, and a read's answer, are now bounded on the silence between their bytes and on
  the rate those bytes keep, never on how long the whole transfer takes: 20 seconds without a byte
  ends either, and so does an average below 32 KB/s once it has had a minute's grace. An upload
  over a slow uplink is therefore taken however long it needs - a 26 MiB file at 1 Mbit/s takes
  about three and a half minutes - and a large answer read over a slow downlink is written in full.
  An answer's writes are given the time the kernel's send buffer takes to drain at that floor
  besides the 20 seconds, because a write blocks until the kernel drains what it already holds
  rather than until the client's next read: a client that stops reading is cut within 20 seconds
  and 4 MiB at 32 KB/s, about two and a half minutes, while one that keeps reading at or above the
  floor is never cut by a blocked write, where a 4 MiB answer written in one call was cut at 15 to
  17 seconds for every reader below about 200 KB/s.
  A write whose client is already sending now reads its whole body off the connection before it
  asks admission for room, where the server has none for it: it waits for room holding no unit,
  with nothing of its request left on the wire, so the time its body takes is none of its wait
  and a client that hangs up while the write is queued is noticed at once - the write leaves the
  queue there and then and is recorded as `status=499`, where it held its place for its whole
  wait and was then answered a `429 OVERLOADED` nobody read. A write admitted before its body -
  one the server had room for, and one whose client asked to be told to continue
  (`Expect: 100-continue`) and has therefore sent nothing, which the layers that refuse such a
  request early still ask no body of - gives its admission units back while the body arrives and
  takes them again once it has arrived, at the place in the queue where it arrived. Either way,
  clients trickling bodies, which are unauthenticated at that point because every layer reads the
  body before a handler resolves its caller, can no longer hold every write unit of a process and
  have every other write answered `429 OVERLOADED`. A body that arrives to find no room left is
  itself answered `429 OVERLOADED`, with the body already read, and nothing of that write runs or
  commits: the refusal cancels its handler where it stands, so a client that obeys `Retry-After`
  and sends the write again stores it once. An upload refused that way stored its file, committed
  its artifact row and had only its `201` replaced by the 429, so such a client uploaded the file
  twice. Before, a body had 60 seconds in
  all from the first read of it and an answer the read's own deadline from its first byte, which
  refused an honest 25 MiB upload on a 1 Mbit/s uplink with `400 REQUEST_BODY_UNREADABLE` and cut
  off a large answer at 20 seconds, while 24 trickling clients still held every write unit for a
  minute at a time. A body that stops arriving, or whose framing the server cannot read, is still
  answered `400 REQUEST_BODY_UNREADABLE` (or the answer its layer had already written, such as a
  refused upload's `409 ISSUE_CLOSED`) with the connection closed after it, and a client that went
  away mid-body is now answered nothing and recorded as `status=499` rather than written a 400
  nobody reads, a keyed write's client as well as an unkeyed one's. Every route still bounds its
  body in bytes as it did: 1 MiB for a JSON route, 26 MiB for an upload. The document and delivery
  websockets are mounted outside the routes and neither bound touches them.
