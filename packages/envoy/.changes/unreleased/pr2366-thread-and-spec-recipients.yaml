kind: Fixed
body: |-
  A person's reply in a Dispatch comment thread now reaches the agents in that thread (#2366).
  A reply stores its thread root as `reply_to`, so the outbox sent it to the root's author and the
  direct parent's author, which were both the person when a person started the thread, and the
  agent that answered in the thread never heard the person's next reply. The outbox now sends a
  person's reply, and its edit, to every session that wrote a comment in the thread and to every
  session that wrote the document the thread is on. It reads these sessions for a whole batch in
  one query (`outbox/recipients.go`). On an issue with no route and no session claim (unclaimed,
  or a person holds the claim), a person's comment, and its edit, now reach every session that
  wrote the issue's primary document (its creator and every version's authors), in an ask's thread
  too, so a session that wrote the spec without a claim still hears comments on the issue. The
  outbox reads these sessions for a whole batch in one query too. The claimant's copy is the
  claimant route of #2225, which these copies join: a session reached more than one way gets one
  copy. A thread session or a spec session the comment's mentions resolved to (its `mentions`, as
  the claimant and follower routes read them) hears it once, from the mention, once the mention was
  delivered; one whose mention failed still gets the outbox's copy. A
  resolve or a reopen reaches none of the thread, document or spec sessions this change adds; it
  reaches the route, the claimant and the thread root's author as before, so the reopen that a
  reply makes in the same transaction tells no new session twice. When a batch's recipient query fails, the
  comment's owner topic, route and claimant are still sent, and the event is retried for the rest,
  or released when the process is stopping.
