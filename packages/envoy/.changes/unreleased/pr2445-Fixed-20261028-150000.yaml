kind: Fixed
body: |-
  Typing in a document no longer costs Dispatch a request connection per keystroke. Each browser
  update was stored in a transaction of its own on the pool every API request reads through, about
  ten round trips under the document's lock. A room's queued updates now go to the store together:
  one transaction per batch of up to 256 updates and 1 MiB, still one row per update, in about three
  round trips, on a pool of eight connections of the rooms' own
  (`application_name=dispatch-room-appends`; document loads' connections are `dispatch-rooms`). A
  keystroke waits at most 50 ms after the room took it for the keystrokes after it, and a
  settlement or a shutdown waiting on the room waits out none of those 50 ms. The lease pool now
  holds one connection for each of its fifteen leased callers, the CI reconcile pass the count had
  missed included, so no leased pass waits for a connection. A server holds up to
  104 connections to Postgres, from 95: 64 + 15 + 8 + 4 + 2 + 1 + 2 + 2 + 1 + 5
  (`store.ConnectionsPerProcess`).

  Settlement waits wake when the room's appends land rather than polling every millisecond, and
  opening a document socket reads the issue and the caller once, walks no list of rooms, and
  reserves its room and connection slots before it loads, so sockets opening together stay within
  the caps and a socket over a cap is refused with 503.
  `DISPATCH_MAX_LIVE_ROOMS` and `DISPATCH_MAX_DOC_CONNECTIONS` (1,000 each) set those caps, the
  cold reads' cache takes a sixteenth of the Go memory limit (at least 64 MiB, at most 1 GiB, and
  256 MiB with none), and the profiler port (`DISPATCH_PPROF_PORT`) serves `/debug/vars`, the
  rooms' figures among them as `dispatch_rooms` (`cmd/dispatch/README.md`, "Profiling").
