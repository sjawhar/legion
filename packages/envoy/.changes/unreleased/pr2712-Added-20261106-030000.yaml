kind: Added
body: |-
  An issue's comment list, a document's comment list and an issue's activity feed each answer an `ETag`, and `304 Not Modified` with no body to a request whose `If-None-Match` names it, so a reader that has the list already is sent none of it again.
  Each one reads its validator, answers the 304 and looks up the answer it kept before it reads a single row, and the server keeps each list's whole encoded and compressed response under its `ETag` in a 64 MiB least-recently-used cache, one entry per content coding, so a second read of an unchanged list costs no query, no encode and no compression.
  The feed's validator is the issue's event sequence with the paging query; a comment list's is a counter per list that every write to its comments, their mentions and their delivery rows raises, because a delivery's claim and its resolution rewrite rows the answer shows without appending an event, and an answer over the event sequence alone would have told a reader nothing had changed.
