kind: Changed
body: |-
  Dispatch keeps at most 256 MiB of rooms resident for documents no browser is connected to, as
  many as its cold reads' cache holds. A room still stays resident for a minute after its last peer
  leaves or its last write returns, but when those rooms together hold more than the budget - each
  weighed by the bytes its load decoded, since a document's heap is about forty times its stored
  size - the least recently used go first, however recent their minute is, and a room a browser is
  in is never one of them. The next write or read of such a document reloads it, and the settlement
  it owed runs on its own timer, as it does for a room the idle timeout evicted, so nothing is lost
  by the close. Before this, a burst of agent writes left every room it touched resident for its
  whole minute, each holding its document and a second decoded copy for its update observer: the
  load test's recovery step held 391 to 447 MB of documents and 327 to 398 MB of those copies at
  its peak, a live heap of 1.7 to 2.0 GiB, and 1.2 to 1.4 GiB a minute after the burst, where each
  garbage collection's marking cost the whole process seconds of latency and requests answered at a
  1.0 to 2.1 second p99 a minute after the load had dropped. Four new series say what the budget
  holds: `dispatch_doc_rooms_resident`, `dispatch_doc_rooms_peerless`,
  `dispatch_doc_rooms_peerless_bytes` and `dispatch_doc_rooms_budget_closed_total`.
