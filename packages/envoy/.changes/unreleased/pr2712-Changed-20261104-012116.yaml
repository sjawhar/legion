kind: Changed
body: 'A display tree carries the block ids its text names and no others, and leaves out every attribute the browser''s schema supplies by itself. `pmdoc.ReadForDisplay` mints nothing: only a typed block''s markdown writes an id, so an id minted for a paragraph matched no ask row, anchor or margin card, cost about a tenth of a tree''s bytes, and, being random, made the tree different on every read - which defeated compression and left the kept encoding, keyed by the SHA-256 of the text and the mode, holding a tree no second read would produce. The browser stamps what it needs itself. The wire encoding then drops every attribute standing at the default the dashboard''s schema declares for it, which `NodeType.create` writes back unasked: a bullet item''s marker and list type, a table cell''s span, a heading at level one, and each server-owned attribute of a typed block read in its latest mode. On an issue of two hundred comments the list falls from 3.04 to 2.10 times the bytes the same answer costs without the trees, and from 7.78 to 1.57 times gzipped; the activity feed from 3.87 to 2.56 and from 7.36 to 1.50.'
