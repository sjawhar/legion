kind: Changed
body: |-
  A session's JetStream consumer dies with its session, on both paths that end one: a clean stop
  (`DELETE /v1/sessions/<session_id>`, which every plugin's deregister and the Legion daemon's stop
  of a role make) deletes the consumer where it removed the registration, and the session reaper
  deletes the consumer of every record it reaps. So the stream holds a consumer for each session a
  deployment has rather than for each it has ever relayed. A session that stays keeps its consumer
  and the position it holds: one inside the gone horizon, live or stalled, and one whose
  conditional stop was refused. A registration that races a delete is answered with a consumer
  either way, the delete and the registration holding the session's own lock, and a delete that
  lost the race recreates the consumer at the start that registration was answered with. The
  consumers' 72-hour inactive threshold stays the backstop for a consumer no delete names, and a
  delete that failed is logged and left to it.
