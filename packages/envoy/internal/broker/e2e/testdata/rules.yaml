# rules.yaml is a v9-shaped rules file: `secrets:` policy only, each approval naming its approver
# as `approver: operator` or `approver: login:<name>` (AGENTC-393). TestRulesTestdataFixturesParse
# (../e2e_test.go) loads this file to prove the shape below parses cleanly, with no
# `issue_assignee` reference and no `approvers:` section left (both are refused).
version: 1
secrets:
  DEEL_API_KEY:
    source: example/agent-secrets/DEEL_API_KEY
    owner: sjawhar
    delivery: inject
    max_lifetime_seconds: 43200
    requesters:
      - kind: box
        operator: sjawhar
        decision: approval
        approver: operator
      - kind: pod
        decision: approval
        approver: login:sjawhar
  AUTO_TOKEN:
    source: example/agent-secrets/AUTO_TOKEN
    owner: sjawhar
    delivery: inject
    max_lifetime_seconds: 43200
    requesters:
      - kind: box
        operator: sjawhar
        decision: automatic
  DENIED_KEY:
    source: example/agent-secrets/DENIED_KEY
    owner: sjawhar
    delivery: inject
    max_lifetime_seconds: 43200
    requesters: []
