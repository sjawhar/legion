version: 1
secrets:
  DEEL_API_KEY:
    source: dev1/agent-secrets/DEEL_API_KEY
    owner: sjawhar
    delivery: inject
    max_lifetime_seconds: 43200
    requesters:
      - kind: box
        operator: sjawhar
        decision: approval
        approver: operator
      - kind: box
        operator: sjawhar
        decision: automatic
      - kind: pod
        decision: approval
        approver: issue_assignee
  AUTO_TOKEN:
    source: dev1/agent-secrets/AUTO_TOKEN
    owner: sjawhar
    delivery: inject
    max_lifetime_seconds: 43200
    requesters:
      - kind: box
        operator: sjawhar
        decision: automatic
  DENIED_KEY:
    source: dev1/agent-secrets/DENIED_KEY
    owner: sjawhar
    delivery: inject
    max_lifetime_seconds: 43200
    requesters: []
