services:
  dispatch:
    image: ghcr.io/sjawhar/legion/envoy:${ENVOY_IMAGE_TAG:?set ENVOY_IMAGE_TAG (see deploy/README.md)}
    build:
      context: ../../../..
      dockerfile: packages/envoy/docker/Dockerfile
    network_mode: host
    entrypoint: ["/usr/local/bin/envoy-dispatch"]
    restart: unless-stopped
    # A SIGTERM runs Dispatch's ordered shutdown: up to 5 s for HTTP, then up to 10 s for the
    # document service to settle what is owed. Docker's 10 s default would SIGKILL it partway.
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "curl", "-f", "http://${DISPATCH_LISTEN_HOST:-127.0.0.1}:${DISPATCH_PORT:-8766}/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    environment:
      HOME: /home/envoy
      # The Dispatch database is external, and the production deployment backs it up with its own
      # scheduled task; this compose runs no Postgres and no backup worker of its own.
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL (the external Dispatch Postgres URL)}
      DISPATCH_LISTEN_HOST: ${DISPATCH_LISTEN_HOST:-127.0.0.1}
      DISPATCH_PORT: ${DISPATCH_PORT:-8766}
      DISPATCH_APP_CLIENT_ID: ${DISPATCH_APP_CLIENT_ID:-}
      DISPATCH_APP_CLIENT_SECRET: ${DISPATCH_APP_CLIENT_SECRET:-}
      DISPATCH_AGENT_TOKEN: ${DISPATCH_AGENT_TOKEN:?set DISPATCH_AGENT_TOKEN}
      DISPATCH_SERVER_URL: ${DISPATCH_SERVER_URL:?set DISPATCH_SERVER_URL (the browser origin)}
      NATS_URLS: ${NATS_URLS:?set NATS_URLS}
      # This server owns ENVOY_NOTIFICATIONS on the NATS above, which is the shared server rather
      # than this host's. Every connect refuses a NATS that is not the machine's own without this
      # (packages/envoy/internal/bus/reach.go).
      ENVOY_ALLOW_REMOTE_NATS: "1"
      DISPATCH_ALLOWED_LOGINS: ${DISPATCH_ALLOWED_LOGINS:?set DISPATCH_ALLOWED_LOGINS}
      DISPATCH_IDENTITY: ${DISPATCH_IDENTITY:-cookie}
      DISPATCH_IDENTITY_HEADER_TRUSTED: ${DISPATCH_IDENTITY_HEADER_TRUSTED:-}
      DISPATCH_NATS_DISABLED: ${DISPATCH_NATS_DISABLED:-}
      ENVOY_URL: ${ENVOY_URL:-http://127.0.0.1:9020}
      ENVOY_TOKEN: ${ENVOY_TOKEN:-}
      # Optional boot seed for mappings absent from the dashboard. Stored
      # repository mappings are authoritative; DISPATCH_DEFAULT_PROJECT catches
      # external repositories with no stored mapping.
      DISPATCH_REPO_PROJECTS: ${DISPATCH_REPO_PROJECTS:-}
      DISPATCH_DEFAULT_PROJECT: ${DISPATCH_DEFAULT_PROJECT:-}
      # Session cookies are Secure by default; set this when serving the
      # OAuth dashboard over plain HTTP (local/tailnet use).
      DISPATCH_INSECURE_COOKIE: ${DISPATCH_INSECURE_COOKIE:-}
    volumes:
      # Signing key and optional app.json credentials.
      - dispatch-data:/home/envoy/.local/share/dispatch

volumes:
  dispatch-data:
