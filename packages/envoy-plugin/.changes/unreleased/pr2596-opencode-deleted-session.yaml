kind: Fixed
body: |-
    A session OpenCode has deleted is deregistered again. OpenCode hands a plugin's `event` hook
    the plain bus alone — `session.status`, `session.idle`, `session.diff`,
    `message.part.delta` — and never the session aggregate's own `session.created`,
    `session.updated` or `session.deleted`, so a serve that waited for `session.deleted` went on
    heartbeating a deleted session's id, which peers read as live for the live window and as
    unresponsive for the gone horizon after it. The heartbeat now asks the serve for each session
    it tracks and forgets the ones it answers 404 for, taking the registration out of the registry
    behind that session's own registration; the `session.deleted` handler stays for a host that
    does hand the event over.
