kind: Changed
body: 'A deployment chooses whether Legion checks production after a merge, and who works the check: `projects.<KEY>.production_check` takes `off` or `tester` and is `tester` by default. The `legion` tool''s `handoff_complete` takes `wake_at`, an RFC 3339 time a `pending` report on any look but the check''s last must carry: the daemon suspends the role until then, keeps its session and releases the issue''s pod. It refuses a report from a role that is not the check''s (`CHECK_ROLE_MISMATCH`), a `pending` with no time (`CHECK_WAKE_REQUIRED`) and a time where no look follows (`CHECK_WAKE_UNEXPECTED`). Which of the two a call is, the daemon reads from the session''s own live assignment: a session working a look of the check reports on that look, and a completion of a `done` issue from a session that works none is refused `CHECK_LOOK_NOT_SERVED`, with nothing recorded and the look''s own task named as the turn that report belongs to. The daemon reads no deployment''s production workflows any more, and the daemon, this plugin and @sjawhar/claude-envoy move to one new daemon API contract together, the number this release carries. One operator step at this release: the daemon no longer creates the durable consumer of `notifications.dispatch.server.started` and cannot delete the one already on the stream, so remove it with `nats consumer rm <stream> legion-go-<project>-dispatch-server`. Its store migration is one way: after it a daemon of the earlier release fails every `production_checks` read and write, so going back needs the database restored from a backup, and because several projects'' daemons can share one database, those daemons move to this release together.'
