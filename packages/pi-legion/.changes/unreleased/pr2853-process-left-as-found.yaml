kind: Fixed
body: |-
  `extensions/legion.test.ts` puts back the twenty-nine environment names it clears, so a later file of the same run sees the process the first file saw, and an `afterAll` probe reads `/proc/self/environ` and fails when any name has moved. The skill-scenario rigs take a home of their own instead of the developer's, and the rows that need `docker`, `go` or `jj` skip with a line naming them. `bun run test` is one process.
