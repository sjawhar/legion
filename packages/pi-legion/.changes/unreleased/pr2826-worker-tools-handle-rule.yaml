body: |-
  The legion-worker tools reference now prescribes opening each path component with
  `O_PATH|O_NOFOLLOW` and reading its kind from `fstat` of that handle, where gVisor does not
  honour `O_NOFOLLOW` on a directory component, in place of comparing `st_dev` and `st_ino`
  across two readings of the name.
