kind: Added
body: |-
  Every turn a Legion pane's claim ends is reported to the daemon, refused or not: an `agent_end`
  hook posts `POST /legion/v1/claims/turn-outcome` with the turn's outcome and, for a turn the
  provider refused, the provider's own words for it, under a sequence this plugin counts itself,
  monotonic from 1 within the claim's launch generation. The daemon keys each outcome by
  `(generation, sequence)`, so a report that arrives late lands in its own place and a repeat
  writes the same cell, and it fails the claim once the trailing run of refusals reaches
  `launch_failure_limit`, which is what moves the work to a session the provider can answer.
  `legion.daemonApiVersion` is 46, the contract that adds the route.
