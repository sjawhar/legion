kind: Changed
body: The worker guide says the pod test server serves a database the role's own login owns, so a test may create a schema or a trusted extension in it, and gives the command that runs Go's race detector in a pod (`CGO_ENABLED=1 go test -race`), which the image's `CGO_ENABLED=0` otherwise refuses.
