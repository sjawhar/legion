kind: Changed
body: |-
    `legion-worker`'s tools reference opens with the database a role's tests use: never the one
    `OMP_SESSION_SQL_DSN_FILE` names, whose login drops databases on the instance every pod's
    sessions live in, but `LEGION_TEST_PG_DSN`, the pod's own PostgreSQL, which the worker image
    now carries and the pod's setup step starts before the agent. A role on a digest that predates
    the variable is told how to start one for itself, and the Dispatch browser suite's entry names
    the pod's server instead of a Debian unpack.
time: 2026-10-30T22:45:00.000000000Z
