kind: Changed
body: |-
    The architect's design-gate reference names a second version that keeps the approval: one
    whose text is exactly the text of the version a person approved, such as an accidental edit
    undone exactly. Dispatch records the approval at that version and emits `artifact.approved`, so
    the daemon reopens the gate. The reference tells the architect to undo an accidental edit of an
    approved root spec exactly and to request nothing for it.
