<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content"
    />
    <meta
      name="description"
      content="Dispatch coordinates specs, comments, and asks for a team's issues."
    />
    <meta name="theme-color" content="#0f172a" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Dispatch</title>
    <!--
      A script, module preload or stylesheet of this build that fails to download (the entry
      chunk, one it imports, the main stylesheet linked after this script, or a lazy chunk's
      preload) reloads the page: a rolling deploy can serve this page from one server and its
      assets from another that never built them, and before the entry runs no app code can
      recover. A file of another origin (a browser extension's) is never this build's, whatever
      its path. The budget is the lazy-chunk recovery's, kept by the same rule on the same
      sessionStorage key as spendChunkReload in src/features/shell/DeploymentResilience.tsx: a
      JSON array of the times of this tab's recovery reloads, and a failure reloads only while
      fewer than 3 of them fall in the last 5 minutes (a value that does not parse reads as none).
      It keeps that file's offline rule, and skips a page being left, from beforeunload or
      pagehide until pageshow. iOS Safari fires no beforeunload, and once the app runs a lazy
      chunk's preload can be cancelled by a link the reader follows before pagehide, so a
      navigation to another document that is not a download marks the page as left too. This
      script never clears that before pageshow, unlike the bundle's finer rule: a failure of a
      preload or stylesheet Vite inserted also reaches the bundle's own handler, which judges it.
      A reload fires beforeunload itself, so that handler does not spend the budget again for the
      same failure. Storage that cannot be read or written reloads nothing, since nothing would
      bound the reloads.
      Dispatch sends no Content-Security-Policy; one would have to allow this script by its hash.
    -->
    <script>
      (() => {
        var leaving = false;
        function markLeaving() {
          leaving = true;
        }
        window.addEventListener("beforeunload", markLeaving);
        window.addEventListener("pagehide", markLeaving);
        window.addEventListener("pageshow", () => {
          leaving = false;
        });
        if (window.navigation) {
          window.navigation.addEventListener("navigate", (event) => {
            if (!event.destination.sameDocument && event.downloadRequest === null) {
              leaving = true;
            }
          });
        }
        window.addEventListener(
          "error",
          (event) => {
            var element = event.target;
            var url;
            if (element instanceof HTMLScriptElement) {
              url = element.src;
            } else if (
              element instanceof HTMLLinkElement &&
              (element.rel === "stylesheet" || element.rel === "modulepreload")
            ) {
              url = element.href;
            } else {
              return;
            }
            if (url.indexOf(`${window.location.origin}/assets/`) !== 0) {
              return;
            }
            if (leaving || !navigator.onLine) {
              return;
            }
            var now = Date.now();
            var stored;
            try {
              stored = JSON.parse(window.sessionStorage.getItem("dispatch.chunk-reloads") || "[]");
            } catch {
              stored = [];
            }
            var recent = (Array.isArray(stored) ? stored : []).filter(
              (time) => typeof time === "number" && now - time < 5 * 60 * 1000
            );
            if (recent.length >= 3) {
              return;
            }
            recent.push(now);
            try {
              window.sessionStorage.setItem("dispatch.chunk-reloads", JSON.stringify(recent));
            } catch {
              return;
            }
            window.location.reload();
          },
          true
        );
      })();
    </script>
    <!--
      The document's own text, asked for while this page is still being parsed.

      A reader who opens /issues/<KEY>/artifacts/<slug> is waiting for that document's bytes, and
      the address alone names them: Dispatch answers them at
      /api/v1/issues/<KEY>/artifacts/<slug>/text, the route the page's own client reads them by.
      The page asks for them in the entry module's body (src/features/doc/open-document-early.ts),
      which is the earliest any module can and still about 1.4 s into the load on a phone at 4x
      CPU throttling, because every static import of the entry has to evaluate first - one task of
      about a second on its own. Here there is nothing to evaluate: the request goes out before
      the entry chunk has finished downloading (dispatch://INFRA-341, R11).

      The page's client takes this request in place of the one it would have made
      (src/api/early-document-read.ts), so it is that client's read in every other way - its
      deadline on Dispatch's silence, its abort, its refusals. The only header this carries is
      the client's own `credentials: "same-origin"`; a Dispatch GET carries no other, so the
      server answers this exactly as it answers that one. Until the page takes it, nothing bounds
      it but the timer below, which stops once the answer's headers arrive.

      The address rule here is deliberately narrower than the router's (`parseIssuePath` in
      src/features/refs/routes.ts): the same issue key, a slug of the plain form Dispatch mints,
      no trailing segment, and a `?v=` only in the form the router reads. An address this does not
      recognise - the Spec tab's, which names no slug and whose text is read by the id the issue
      answers with, and every address that opens no document at all - asks for nothing here, and
      the page reads exactly as it does today. A failure costs the same nothing.

      This is a classic inline script and not a module one because Vite's build folds every
      module script of this page into the one chunk it generates for it - an inline module
      script and a second entry's `src` alike, both rewritten to imports of that chunk - so
      either shape would run only once all 813 kB of the entry had downloaded, which is the wait
      this is here to skip. A second entry kept outside the bundle, under `web/public/`, would be
      another file to download first and another untyped file to keep. A classic inline script
      survives the build exactly as it is written, as the recovery script above does, and costs
      no request at all.
    -->
    <script>
      (() => {
        var opened =
          /^\/issues\/([A-Z][A-Z0-9]{1,9}-[1-9][0-9]*)\/artifacts?\/([a-z0-9]+(?:-[a-z0-9]+)*)$/.exec(
            window.location.pathname
          );
        if (opened === null) {
          return;
        }
        var pinned = new URLSearchParams(window.location.search).get("v");
        if (pinned !== null && pinned !== "" && !/^[1-9][0-9]*$/.test(pinned)) {
          return;
        }
        var path = `/api/v1/issues/${opened[1]}/artifacts/${opened[2]}/text`;
        var early = new AbortController();
        // How long this waits for the answer's headers, matching REQUEST_DEADLINE_MS in
        // src/api/client.ts: Dispatch silent that long cannot be reached. The body is the
        // client's to bound, as every read's body is, and the client's own deadline covers this
        // read from the moment it takes it.
        var silence = setTimeout(() => early.abort(), 30000);
        window.__dispatchEarlyDocumentRead = {
          abort: (reason) => {
            clearTimeout(silence);
            early.abort(reason);
          },
          path: path,
          response: fetch(path, { credentials: "same-origin", signal: early.signal }).then(
            (response) => {
              clearTimeout(silence);
              return response;
            }
          ),
        };
        // Nothing waits on it until the page takes it, so its refusal is answered here rather
        // than left to the window as an unhandled rejection.
        window.__dispatchEarlyDocumentRead.response.catch(() => undefined);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!--
      Where the server puts the opening blocks of the document this address names.

      A reader who opens /issues/<KEY> or /issues/<KEY>/artifacts/<slug> with a session that may
      read that document is sent its first blocks as HTML, drawn by the Go server from the tree
      it already holds (internal/dispatch/pmdoc/first_screen.go). So the document is on the
      screen as soon as the page is parsed, rather than after 813 kB of entry chunk has
      downloaded, evaluated, read the document's text and parsed it - on a phone at 4x CPU
      throttling, seconds (dispatch://INFRA-341, R11).

      It sits after #root, not inside it, because createRoot clears the element it mounts into.
      The page's own preview takes these blocks as its first draw rather than drawing them again
      (src/features/doc/first-screen.ts, DocumentPreview), and the element goes with them.

      Its classes are the preview's own (markdownClassName in src/features/refs/markdown-engine.ts,
      which first-screen.test.ts holds this attribute to), so the blocks read the same before the
      page runs as after it. The server replaces the comment inside it and nothing else; a page
      carrying no document is the build's own bytes, and this element is empty, unlabelled and
      silent.
    -->
    <div
      id="first-screen"
      class="dispatch-markdown prose prose-sm prose-slate break-words dark:prose-invert max-w-none"
    ><!--first-screen--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
